# =============================================================================
#  docker-compose.yml — Trading Model Microservices
#  Usage:
#    docker compose up -d
#    docker compose logs -f
#    docker compose down -v
# =============================================================================

# mem_limit of each long-running service = resources.limits.memory of its K8s manifest (deploy/k8s); no K8s limit (spiffe-helper-*, docker-socket-proxy): none here.
# Shared environment templates — reduces duplications across service blocks
x-core-env: &core-env
  NODE_ENV: ${NODE_ENV:-production}
  PORT: '3000'
  REDIS_URL: redis://redis:6379
  # mTLS via SPIFFE SVIDs (ADR-0011) — mandatory. The spiffe-helper sidecars
  # write the SVID (key, cert, trust bundle) into /run/spire/svid before the
  # service binds, so no manual ./certs bundle is required.
  TLS_KEY_PATH: /run/spire/svid/svid_key.pem
  TLS_CERT_PATH: /run/spire/svid/svid.pem
  TLS_CA_PATH: /run/spire/svid/bundle.pem
  LOG_LEVEL: ${LOG_LEVEL:-info}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

# Rotated json-file logs: without a cap a looping service fills the Docker
# Desktop disk image, which freezes every container on the host.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-message-env: &message-env
  <<: *core-env
  CACHE_TTL_MS: '30000'
  SERVICE_PING_TIMEOUT_MS: '2000'
  TOKEN_REFRESH_INTERVAL_MS: '60000'
  TTL_REFRESH_INTERVAL_MS: '15000'
  ADDRESS_MANAGER_URL: https://discovery-server:3000
  MESSAGE_CALLBACK_PATH: message

services:
  # ---------------------------------------------------------------------------
  #  MongoDB — audit-logger (audit trail) and dlq-service (dead letters)
  # ---------------------------------------------------------------------------
  mongo:
    logging: *default-logging
    image: mongo:7.0.45@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
    container_name: trading-mongo
    stop_grace_period: 2m
    restart: unless-stopped
    mem_limit: 2g
    # Authentication on (issue #669, ADR-0067): the image creates `root` on an
    # empty volume, `mongo-users` the other users. A volume created before
    # needs `docker compose down -v`, or the localhost exception:
    # docker exec trading-mongo mongosh admin --eval 'db.createUser({user: "root", pwd: process.env.MONGO_INITDB_ROOT_PASSWORD, roles: ["root"]})'
    command: mongod --auth
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set (MongoDB user, ADR-0067)}
      MONGO_BACKUP_PASSWORD: ${MONGO_BACKUP_PASSWORD:?MONGO_BACKUP_PASSWORD must be set (MongoDB user, ADR-0067)}
    volumes:
      - mongo-data:/data/db
    networks:
      - data-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # One user per client, from deploy/mongo/users.js (same script as the K8s
  # Jobs mongo-*-users). Idempotent: runs at every `up`.
  mongo-users:
    logging: *default-logging
    image: mongo:7.0.45@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
    container_name: trading-mongo-users
    restart: "no"
    command: mongosh --quiet mongo:27017/admin --file /scripts/users.js
    environment:
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set (MongoDB user, ADR-0067)}
      MONGO_EXPORTER_PASSWORD: ${MONGO_EXPORTER_PASSWORD:?MONGO_EXPORTER_PASSWORD must be set (MongoDB user, ADR-0067)}
      MONGO_BACKUP_PASSWORD: ${MONGO_BACKUP_PASSWORD:?MONGO_BACKUP_PASSWORD must be set (MongoDB user, ADR-0067)}
      MONGO_AUDIT_PASSWORD: ${MONGO_AUDIT_PASSWORD:?MONGO_AUDIT_PASSWORD must be set (MongoDB user, ADR-0067)}
      MONGO_AUDIT_DB: audit-logger
      MONGO_DLQ_PASSWORD: ${MONGO_DLQ_PASSWORD:?MONGO_DLQ_PASSWORD must be set (MongoDB user, ADR-0067)}
      MONGO_DLQ_DB: dlq
    volumes:
      - ./deploy/mongo/users.js:/scripts/users.js:ro
    networks:
      - data-net
    depends_on:
      mongo:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  Redis — discovery registry, message-manager subscriptions, dlq-service
  #  queues (single node for dev/E2E)
  # ---------------------------------------------------------------------------
  redis:
    logging: *default-logging
    image: redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    container_name: trading-redis
    restart: unless-stopped
    mem_limit: 512m
    # Snapshots (RDB) always; the append-only file is per environment:
    # dev leaves it off, a compose host running staging/production sets
    # REDIS_APPENDONLY=yes like the K8s StatefulSet (deploy/k8s/infra/redis.yaml).
    command:
      - redis-server
      - --appendonly
      - ${REDIS_APPENDONLY:-no}
      # A full Redis refuses writes (a publish fails visibly) instead of evicting journal entries (ADR-0073).
      # 384mb = 75 % of mem_limit: room for the AOF rewrite fork, so Redis refuses writes before an OOM kill.
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - noeviction
      - --save
      - 900 1 300 10
    volumes:
      - redis-data:/data
    networks:
      - backend-net
      - data-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  #  MySQL — Financial Scraper persistence
  # ---------------------------------------------------------------------------
  mysql:
    logging: *default-logging
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    container_name: trading-mysql
    stop_grace_period: 2m
    restart: unless-stopped
    mem_limit: 2g
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-financial_scraper}
      # Application user: all privileges on MYSQL_DATABASE only (created at first init)
      MYSQL_USER: ${MYSQL_USER:-scraper}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - data-net
    healthcheck:
      # TCP, not the socket: the entrypoint's temporary init server listens on
      # the socket only (port 0) and stops before the real server starts.
      test: mysqladmin ping -h 127.0.0.1 -u root
      interval: 10s
      timeout: 5s
      retries: 5
      # First start on an empty volume initializes the data directory (over a
      # minute on Docker Desktop, 130s measured 2026-10-31): failures during
      # that time do not count.
      start_period: 180s

  # ---------------------------------------------------------------------------
  #  Migration — apply pending SQL migrations (single source of truth for schema)
  # ---------------------------------------------------------------------------
  migrate:
    logging: *default-logging
    # Same image as the K8s Jobs (deploy/migrate): mysql2 locked, nothing installed at run time.
    image: ${IMAGE_REGISTRY:-ghcr.io/trading-model}/db-migrate:${IMAGE_TAG:-latest}
    container_name: trading-migrate
    restart: "no"
    command: ["up"]
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      # root assumed: the migrator may need privileges beyond one database
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      DB_NAME: ${MYSQL_DATABASE:-financial_scraper}
    networks:
      - data-net
    depends_on:
      mysql:
        condition: service_healthy

  # Paged read indexes (ADR-0088): built apart from `migrate`, nothing waits for it.
  index-build:
    logging: *default-logging
    build:
      context: .
      dockerfile: deploy/migrate/Dockerfile
    container_name: trading-index-build
    restart: "no"
    command: ["index-build"]
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-financial_scraper}
    networks:
      - data-net
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  #  Discovery Server — Service registry & lease management
  # ---------------------------------------------------------------------------
  discovery-server:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io/trading-model}/discovery-server:${IMAGE_TAG:-latest}
    container_name: trading-discovery
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - '127.0.0.1:${DISCOVERY_PORT:-8443}:3000'
    environment:
      <<: *core-env
      SERVICE_NAME: discovery-server
      CLEANUP_SERVICE_INTERVAL_MS: '600000'
      # Signs the instance tokens kept in Redis: stable across restarts.
      # Required with NODE_ENV=production (discovery refuses to start).
      SIGNING_SECRET: ${SIGNING_SECRET:-}
    volumes:
      - svid-discovery:/run/spire/svid
    networks:
      - backend-net
    depends_on:
      spiffe-helper-discovery:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: curl -skf --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/health/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  #  SPIRE Server — workload identity issuance (ADR-0011)
  # ---------------------------------------------------------------------------
  spire-server:
    logging: *default-logging
    image: ghcr.io/spiffe/spire-server:1.16.0@sha256:ff546f4c62dafc479a0cd79eae9a7b6df2975754d75efd31706098e0d7548837
    container_name: trading-spire-server
    restart: unless-stopped
    mem_limit: 512m
    # Named volumes are created root-owned: the image user (1000) could not write them.
    user: "0:0"
    command: ["-config", "/etc/spire/server.conf"]
    volumes:
      - ./deploy/compose/spire/server.conf:/etc/spire/server.conf:ro
      - spire-server-data:/run/spire/data
      - spire-server-sockets:/run/spire/sockets
    networks:
      - backend-net
    # The SPIRE images ship no shell: exec-form healthchecks only.
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/run/spire/sockets/api.sock"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  #  SPIRE Bootstrap — registers the workload entries, exports the trust
  #  bundle and mints the agent join token (idempotent, runs to completion)
  # ---------------------------------------------------------------------------
  spire-bootstrap:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io/trading-model}/spire-tools:${IMAGE_TAG:-latest}
    container_name: trading-spire-bootstrap
    restart: "no"
    environment:
      SPIFFE_TD: trading-model.local
      SPIFFE_NS: trading-model
    volumes:
      - spire-server-sockets:/run/spire/sockets
      - spire-bootstrap:/run/spire/bootstrap
    depends_on:
      spire-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  SPIRE Agent — attests workload containers through their Docker labels
  # ---------------------------------------------------------------------------
  spire-agent:
    logging: *default-logging
    image: trading-model/spire-agent:${IMAGE_TAG:-latest}
    container_name: trading-spire-agent
    restart: unless-stopped
    mem_limit: 256m
    # The Docker workload attestor maps the caller PID to its container.
    pid: host
    volumes:
      - ./deploy/compose/spire/agent.conf:/etc/spire/agent.conf:ro
      - spire-bootstrap:/run/spire/bootstrap:ro
      - spire-agent-data:/run/spire/agent-data
      - spire-agent-sockets:/run/spire/agent-sockets
    networks:
      - backend-net
      - docker-api-net
    # Root but without capability: the agent reads /proc of host PIDs
    # (pid: host) and talks TCP; add a capability only with its reason.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      spire-bootstrap:
        condition: service_completed_successfully
      docker-socket-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/run/spire/agent-sockets/public/api.sock"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  #  Message Manager — Event bus / message broker
  # ---------------------------------------------------------------------------
  message-manager:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io/trading-model}/message-manager:${IMAGE_TAG:-latest}
    container_name: trading-message
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - '127.0.0.1:${MESSAGE_PORT:-8444}:3000'
    environment:
      <<: *message-env
      APP_NAME: message-manager
      APP_VERSION: ${APP_VERSION:-1.3.0}
      SERVICE_NAME: message-manager
      INSTANCE_ID: message-manager-1
    # Leaves discovery, waits CACHE_TTL_MS (30 s), then lets in-flight
    # publishes (PUBLISH_ACCEPT_TIMEOUT_MS) and deliveries finish: see
    # application/index.ts. Undelivered messages stay in the Redis journal.
    stop_grace_period: 2m
    volumes:
      - svid-message:/run/spire/svid
    networks:
      - backend-net
      - data-net
    healthcheck:
      test: curl -skf --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/health/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      spiffe-helper-message:
        condition: service_started
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  Financial Scraper — Real-time market data ingestion
  # ---------------------------------------------------------------------------
  financial-scraper:
    # Waits for its publishes in flight on stop (PUBLISH_ACCEPT_TIMEOUT_MS + 5s).
    stop_grace_period: 1m
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io/trading-model}/financial-scraper:${IMAGE_TAG:-latest}
    container_name: trading-scraper
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - '127.0.0.1:${SCRAPER_PORT:-8445}:3000'
    environment:
      <<: *message-env
      APP_NAME: financial-scraper
      # Registered for release N-1 gateways only (/v2/financial-scraper); the
      # major now lives in the service routes and PUBLIC_ROUTES (ADR-0072).
      APP_VERSION: 2.0.0
      SERVICE_NAME: financial-scraper
      INSTANCE_ID: financial-scraper-1
      # Same symbols as TRAINER_SYMBOLS: the trainer consumes what the scraper publishes.
      SYMBOLS_TO_TRACK: ${SYMBOLS_TO_TRACK:-BTCUSDT,ETHUSDT}
      SCRAPE_INTERVAL: ${SCRAPE_INTERVAL:-*/1 * * * *}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-https://api.binance.com}
      # Contact e-mail in the User-Agent of the signal sources (ADR-0036): SEC
      # EDGAR answers 403 without one. From .env only: the repository is public.
      SIGNAL_CONTACT_EMAIL: ${SIGNAL_CONTACT_EMAIL:-}
      SIGNAL_KEY_EIA: ${SIGNAL_KEY_EIA:-}
      ERROR_URL_WEBHOOK: ${ERROR_URL_WEBHOOK:-}
      SIGNAL_KEY_FRED: ${SIGNAL_KEY_FRED:-}
      SIGNAL_KEY_TWELVEDATA: ${SIGNAL_KEY_TWELVEDATA:-}
      # Same file as the K8s ConfigMap financial-scraper-signal-registry (issue #1308).
      SIGNAL_REGISTRY_FILE: /etc/signal-registry/signal-registry.json
      SIGNAL_NON_COMMERCIAL_ACCEPTED: ${SIGNAL_NON_COMMERCIAL_ACCEPTED:-}
      DB_USER: ${MYSQL_USER:-scraper}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      DB_NAME: ${MYSQL_DATABASE:-financial_scraper}
      DB_HOST: mysql
      DB_PORT: '3306'
    volumes:
      - svid-scraper:/run/spire/svid
      - ./services/financial-scraper/src/config/signal-registry.json:/etc/signal-registry/signal-registry.json:ro
    networks:
      - backend-net
      - data-net
    depends_on:
      spiffe-helper-scraper:
        condition: service_started
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      discovery-server:
        condition: service_healthy
      message-manager:
        condition: service_healthy
    healthcheck:
      test: curl -skf --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/health/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  #  Trader Trainer — GA + DQN agent evolution
  # ---------------------------------------------------------------------------
  trader-trainer:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io/trading-model}/trader-trainer:${IMAGE_TAG:-latest}
    container_name: trading-trainer
    stop_grace_period: 2m
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - '127.0.0.1:${TRAINER_PORT:-8446}:3000'
    environment:
      <<: *message-env
      APP_NAME: trader-trainer
      APP_VERSION: ${APP_VERSION:-1.3.0}
      SERVICE_NAME: trader-trainer
      BUS_TRANSPORT: library
      INSTANCE_ID: trader-trainer-1
      TRAINER_SYMBOLS: ${TRAINER_SYMBOLS:-BTCUSDT,ETHUSDT}
      TRAINER_SYMBOL_ASSETS: ${TRAINER_SYMBOL_ASSETS:-}
      TRAINER_ASSETS: ${TRAINER_ASSETS:-}
      TRAINER_ASSET_COSTS: ${TRAINER_ASSET_COSTS:-{}}
      TRAINER_SIGNAL_FEATURES: ${TRAINER_SIGNAL_FEATURES:-}
      FEATURE_SIGNAL_INPUTS: ${FEATURE_SIGNAL_INPUTS:-false}
      FEATURE_INPUT_MASK_GENE: ${FEATURE_INPUT_MASK_GENE:-false}
      FEATURE_SHARED_TRUNK: ${FEATURE_SHARED_TRUNK:-false}
      TRAINER_SHARED_TRUNK_SYMBOLS_PER_GENERATION: ${TRAINER_SHARED_TRUNK_SYMBOLS_PER_GENERATION:-0}
      TRAINER_INPUT_MASK_PROTECT_CANDLE: ${TRAINER_INPUT_MASK_PROTECT_CANDLE:-false}
      TRAINER_DATA_WINDOW: ${TRAINER_DATA_WINDOW:-500}
      TRAINER_VALIDATION_SPLIT: ${TRAINER_VALIDATION_SPLIT:-0.15}
      TRAINER_TEST_SPLIT: ${TRAINER_TEST_SPLIT:-0.15}
      TRAINER_GENERATIONS: ${TRAINER_GENERATIONS:-50}
      TRAINER_POPULATION_SIZE: ${TRAINER_POPULATION_SIZE:-20}
      TRAINER_TIME_BUDGET_MS: ${TRAINER_TIME_BUDGET_MS:-300000}
      TRAINER_INTERVAL_MS: ${TRAINER_INTERVAL_MS:-14400000}
      TRAINER_MAX_DATA_AGE_MS: ${TRAINER_MAX_DATA_AGE_MS:-900000}
      TRAINER_EPISODES_PER_INDIVIDUAL: ${TRAINER_EPISODES_PER_INDIVIDUAL:-10}
      TRAINER_FITNESS_TYPE: ${TRAINER_FITNESS_TYPE:-total_pnl}
      FEATURE_RISK_ADJUSTED_FITNESS: ${FEATURE_RISK_ADJUSTED_FITNESS:-true}
      FEATURE_ACTION_SPACE_GENE: ${FEATURE_ACTION_SPACE_GENE:-false}
      TRAINER_OBSERVE_POSITION: ${TRAINER_OBSERVE_POSITION:-true}
      TRAINER_SEED_OFFSET: ${TRAINER_SEED_OFFSET:-0}
      # Model artifacts (ADR-0022)
      TRAINER_MODEL_DIR: /data/checkpoints/models
      MODEL_DOWNLOAD_CALLERS: ${MODEL_DOWNLOAD_CALLERS:-model-evaluator,decision-consumer}
    volumes:
      - svid-trainer:/run/spire/svid
      - trainer-checkpoints:/data/checkpoints
    networks:
      - backend-net
    healthcheck:
      test: curl -skf --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/health/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      spiffe-helper-trainer:
        condition: service_started
      discovery-server:
        condition: service_healthy
      message-manager:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  API Gateway — External single entry point
  # ---------------------------------------------------------------------------
  api-gateway:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io/trading-model}/api-gateway:${IMAGE_TAG:-latest}
    container_name: trading-gateway
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 256m
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-8448}:3000'
    environment:
      <<: *core-env
      SERVICE_NAME: api-gateway
      RATE_LIMIT_WINDOW_MS: '60000'
      RATE_LIMIT_MAX: '100'
      CACHE_TTL_MS: '30000'
      AUTH_TOKEN_HEADER: x-api-key
      # Required: in production the gateway refuses to start without API keys.
      AUTH_TOKENS: ${GATEWAY_AUTH_TOKENS:-}
      PROXY_TIMEOUT_MS: '10000'
      PROXY_MAX_RESPONSE_BYTES: '8388608'
    volumes:
      - svid-gateway:/run/spire/svid
    networks:
      - backend-net
    healthcheck:
      test: curl -skf --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/health/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      spiffe-helper-gateway:
        condition: service_started

  # ---------------------------------------------------------------------------
  #  Audit Logger — Immutable event audit trail
  # ---------------------------------------------------------------------------
  audit-logger:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io/trading-model}/audit-logger:${IMAGE_TAG:-latest}
    container_name: trading-audit
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 256m
    ports:
      - '127.0.0.1:${AUDIT_PORT:-8450}:3000'
    environment:
      <<: *message-env
      APP_NAME: audit-logger
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SERVICE_NAME: audit-logger
      BUS_TRANSPORT: library
      INSTANCE_ID: audit-logger-1
      MONGODB_URI: mongodb://mongo:27017/audit-logger?authSource=admin
      MONGO_USERNAME: audit-logger
      MONGO_PASSWORD: ${MONGO_AUDIT_PASSWORD:?MONGO_AUDIT_PASSWORD must be set (MongoDB user, ADR-0067)}
    volumes:
      - svid-audit:/run/spire/svid
    networks:
      - backend-net
      - data-net
    healthcheck:
      test: curl -skf --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/health/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      spiffe-helper-audit:
        condition: service_started
      mongo-users:
        condition: service_completed_successfully
      discovery-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  Model Evaluator — offline evaluation of published models (ADR-0049, no order flow)
  # ---------------------------------------------------------------------------
  model-evaluator:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io/trading-model}/model-evaluator:${IMAGE_TAG:-latest}
    container_name: trading-model-evaluator
    restart: unless-stopped
    stop_grace_period: 2m
    mem_limit: 256m
    ports:
      - '127.0.0.1:${MODEL_EVALUATOR_PORT:-8453}:3000'
    environment:
      <<: *message-env
      APP_NAME: model-evaluator
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SERVICE_NAME: model-evaluator
      BUS_TRANSPORT: library
      INSTANCE_ID: model-evaluator-1
      EVALUATIONS_DIR: /data/evaluations
      TRAINER_MODEL_DIR: /data/checkpoints/models
    volumes:
      - svid-evaluator:/run/spire/svid
      - model-evaluations:/data/evaluations
      - trainer-checkpoints:/data/checkpoints:ro
    networks:
      - backend-net
    healthcheck:
      test: curl -skf --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/health/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      spiffe-helper-evaluator:
        condition: service_started
      discovery-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  Risk/Execution — order flow owner of ADR-0064 (simulated broker, paper only)
  # ---------------------------------------------------------------------------
  risk-execution:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io/trading-model}/risk-execution:${IMAGE_TAG:-latest}
    container_name: trading-risk-execution
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 256m
    ports:
      - '127.0.0.1:${RISK_EXECUTION_PORT:-8454}:3000'
    environment:
      <<: *message-env
      APP_NAME: risk-execution
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SERVICE_NAME: risk-execution
      INSTANCE_ID: risk-execution-1
      EXECUTION_MODE: paper
      DEPLOYMENT_ENV: development
      RISK_STATE_DIR: /data/risk-execution
      TRAINER_MODEL_DIR: /data/checkpoints/models
    volumes:
      - svid-risk:/run/spire/svid
      - risk-execution-data:/data/risk-execution
      - trainer-checkpoints:/data/checkpoints:ro
    networks:
      - backend-net
    healthcheck:
      test: curl -skf --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/health/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      spiffe-helper-risk:
        condition: service_started
      discovery-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  Decision Consumer — paper decisions of the promoted models, intents to risk-execution (ADR-0049 option C, ADR-0088)
  # ---------------------------------------------------------------------------
  decision-consumer:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io/trading-model}/decision-consumer:${IMAGE_TAG:-latest}
    container_name: trading-decision-consumer
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 256m
    environment:
      <<: *message-env
      APP_NAME: decision-consumer
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SERVICE_NAME: decision-consumer
      INSTANCE_ID: decision-consumer-1
      PROMOTED_MODELS: ${PROMOTED_MODELS:-}
    volumes:
      - svid-decision:/run/spire/svid
    networks:
      - backend-net
    healthcheck:
      test: curl -skf --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/health/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      spiffe-helper-decision:
        condition: service_started
      discovery-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  DLQ Service - Dead Letter Queue management
  # ---------------------------------------------------------------------------
  dlq-service:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io/trading-model}/dlq-service:${IMAGE_TAG:-latest}
    container_name: trading-dlq
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 256m
    ports:
      - '127.0.0.1:${DLQ_PORT:-8452}:3000'
    environment:
      <<: *message-env
      APP_NAME: dlq-service
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SERVICE_NAME: dlq-service
      INSTANCE_ID: dlq-service-1
      MONGO_URI: mongodb://mongo:27017/?authSource=admin
      MONGO_USERNAME: dlq-service
      MONGO_PASSWORD: ${MONGO_DLQ_PASSWORD:?MONGO_DLQ_PASSWORD must be set (MongoDB user, ADR-0067)}
      MONGO_DB: dlq
      MONGO_COLLECTION: dlq_entries
      MAX_ENTRIES: '100000'
      DLQ_AUTH_HMAC_SECRET: ${DLQ_AUTH_HMAC_SECRET:?DLQ_AUTH_HMAC_SECRET must be set (min 32 chars, shared by message-manager and dlq-service)}
      DLQ_ALLOWED_SERVICES: ${DLQ_ALLOWED_SERVICES:-message-manager,admin}
    volumes:
      - svid-dlq:/run/spire/svid
    networks:
      - backend-net
      - data-net
    healthcheck:
      test: curl -skf --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/health/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      spiffe-helper-dlq:
        condition: service_started
      mongo-users:
        condition: service_completed_successfully
      discovery-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  SPIFFE Helpers — spiffe-helper sidecars (ADR-0011)
  #  Each writes the service SVID into a shared svid-<svc> volume consumed by
  #  the main service (TLS_*_PATH point at /run/spire/svid). Mandatory.
  #  The SPIRE agent identifies a helper by its compose service name
  #  (spiffe-helper-<suffix>, registered by spire-bootstrap). Helpers only talk
  #  to the agent socket: no network, so a service restart cannot strand them.
  # ---------------------------------------------------------------------------
  spiffe-helper-discovery:
    logging: *default-logging
    image: ghcr.io/spiffe/spiffe-helper:0.12.3@sha256:58f28329f6be32ab5a80248931845157d858f0aebdf7e462217a43f019e3452f
    container_name: trading-helper-discovery
    restart: unless-stopped
    network_mode: none
    command: ["-config", "/etc/spiffe-helper/helper.conf"]
    volumes:
      - ./deploy/compose/spire/helper.conf:/etc/spiffe-helper/helper.conf:ro
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-discovery:/run/spire/svid
    depends_on:
      spire-agent:
        condition: service_healthy

  spiffe-helper-message:
    logging: *default-logging
    image: ghcr.io/spiffe/spiffe-helper:0.12.3@sha256:58f28329f6be32ab5a80248931845157d858f0aebdf7e462217a43f019e3452f
    container_name: trading-helper-message
    restart: unless-stopped
    network_mode: none
    command: ["-config", "/etc/spiffe-helper/helper.conf"]
    volumes:
