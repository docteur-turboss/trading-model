# =============================================================================
#  docker-compose.yml — Trading Model Microservices
#  Usage:
#    docker compose up -d
#    docker compose logs -f
#    docker compose down -v
# =============================================================================

# Shared environment templates — reduces duplications across service blocks
x-core-env: &core-env
  NODE_ENV: ${NODE_ENV:-production}
  PORT: '3000'
  # mTLS via SPIFFE SVIDs (ADR-0011) — mandatory. The spiffe-helper sidecars
  # write the SVID (key, cert, trust bundle) into /run/spire/svid before the
  # service binds, so no manual ./certs bundle is required.
  TLS_KEY_PATH: /run/spire/svid/svid_key.pem
  TLS_CERT_PATH: /run/spire/svid/svid.pem
  TLS_CA_PATH: /run/spire/svid/bundle.pem
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-message-env: &message-env
  <<: *core-env
  CACHE_TTL_MS: '30000'
  SERVICE_PING_TIMEOUT_MS: '2000'
  TOKEN_REFRESH_INTERVAL_MS: '60000'
  TTL_REFRESH_INTERVAL_MS: '15000'
  ADDRESS_MANAGER_URL: https://discovery-server:3000
  MESSAGE_BUS_INIT_TIMEOUT_MS: '5000'
  MESSAGE_BUS_SHUTDOWN_TIMEOUT_MS: '5000'
  MESSAGE_CALLBACK_PATH: message

services:
  # ---------------------------------------------------------------------------
  #  MongoDB — Message Manager persistence
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: trading-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - data-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  #  MySQL — Financial Scraper persistence
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8
    container_name: trading-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-financial_scraper}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - data-net
    healthcheck:
      test: mysqladmin ping -h localhost -u root
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  #  Migration — apply pending SQL migrations (single source of truth for schema)
  # ---------------------------------------------------------------------------
  migrate:
    image: oven/bun:1-alpine
    container_name: trading-migrate
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        bun add mysql2 >/dev/null 2>&1
        bun /migrations/migrate.mjs up
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-financial_scraper}
    volumes:
      - ./scripts/migrate.mjs:/migrations/migrate.mjs:ro
      - ./scripts/migrations:/migrations/migrations:ro
    networks:
      - data-net
    depends_on:
      mysql:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  Discovery Server — Service registry & lease management
  # ---------------------------------------------------------------------------
  discovery-server:
    build:
      context: .
      dockerfile: services/discovery-server/Dockerfile
    container_name: trading-discovery
    restart: unless-stopped
    ports:
      - '${DISCOVERY_PORT:-8443}:3000'
    environment:
      <<: *core-env
      ERROR_URL_WEBHOOK: ${ERROR_URL_WEBHOOK:-}
      CLEANUP_SERVICE_INTERVAL_MS: '600000'
    volumes:
      - svid-discovery:/run/spire/svid
    networks:
      - backend-net
    healthcheck:
      test: curl -sk --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/ping || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  #  SPIRE Server — workload identity issuance (ADR-0011)
  # ---------------------------------------------------------------------------
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.11.3
    container_name: trading-spire-server
    restart: unless-stopped
    user: "1000:1000"
    command: ["/opt/spire/bin/spire-server", "run", "-config", "/etc/spire/server.conf"]
    volumes:
      - ./deploy/compose/spire/server.conf:/etc/spire/server.conf:ro
      - spire-data:/run/spire/data
      - spire-server-sockets:/run/spire/sockets
    networks:
      - backend-net
    healthcheck:
      test: /opt/spire/bin/spire-server healthcheck -registrationUDSPath /run/spire/sockets/public/api.sock || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  #  SPIRE Agent — attests workload containers via the Docker socket
  # ---------------------------------------------------------------------------
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.11.3
    container_name: trading-spire-agent
    restart: unless-stopped
    user: "0:0"
    command: ["/opt/spire/bin/spire-agent", "run", "-config", "/etc/spire/agent.conf"]
    volumes:
      - ./deploy/compose/spire/agent.conf:/etc/spire/agent.conf:ro
      - /var/run/docker.sock:/run/docker.sock
      - spire-agent-sockets:/run/spire/agent-sockets
      - spire-data:/run/spire/data
    networks:
      - backend-net
    depends_on:
      spire-server:
        condition: service_healthy
    healthcheck:
      test: /opt/spire/bin/spire-agent healthcheck -socketPath /run/spire/agent-sockets/public/api.sock || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  #  SPIRE Entries — idempotent registration of node + workload entries
  # ---------------------------------------------------------------------------
  spire-entries:
    image: ghcr.io/spiffe/spire-server:1.11.3
    container_name: trading-spire-entries
    restart: "no"
    user: "1000:1000"
    volumes:
      - spire-server-sockets:/run/spire/sockets
    networks:
      - backend-net
    environment:
      SPIFFE_TD: trading-model.local
      SPIFFE_NS: trading-model
    depends_on:
      spire-server:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        set -eu
        SOCK=/run/spire/sockets/admin.sock
        REG=/opt/spire/bin/spire-server
        for i in $$(seq 1 30); do
          [ -S "$$SOCK" ] && break
          echo "Waiting for admin socket... ($$i/30)"
          sleep 2
        done
        [ -S "$$SOCK" ] || { echo "admin socket not found"; exit 1; }

        AGENT_ID="spiffe://$${SPIFFE_TD}/ns/$${SPIFFE_NS}/sa/spire-agent"
        if "$$REG" entry show -registrationUDSPath "$$SOCK" -spiffeID "$$AGENT_ID" | grep -q "Entry found"; then
          echo "agent entry exists: $$AGENT_ID"
        else
          "$$REG" entry create -registrationUDSPath "$$SOCK" \
            -node -spiffeID "$$AGENT_ID" \
            -selector "docker:label:com.docker.compose.service:spire-agent"
        fi

        for helper in \
          api-gateway audit-logger discovery-server \
          dlq-service financial-scraper message-manager trader-trainer; do
          id="spiffe://$${SPIFFE_TD}/ns/$${SPIFFE_NS}/sa/$${helper}"
          if "$$REG" entry show -registrationUDSPath "$$SOCK" -spiffeID "$$id" | grep -q "Entry found"; then
            echo "entry exists: $$id"
          else
            "$$REG" entry create -registrationUDSPath "$$SOCK" \
              -spiffeID "$$id" \
              -parentID "$$AGENT_ID" \
              -selector "docker:label:com.docker.compose.service:spiffe-helper-$${helper}" \
              -ttl 3600 -x509SVIDTTL 3600
          fi
        done
        echo "SPIRE entries reconciled."

  # ---------------------------------------------------------------------------
  #  Message Manager — Event bus / message broker
  # ---------------------------------------------------------------------------
  message-manager:
    build:
      context: .
      dockerfile: services/message-manager/Dockerfile
    container_name: trading-message
    restart: unless-stopped
    ports:
      - '${MESSAGE_PORT:-8444}:3000'
    environment:
      <<: *message-env
      APP_NAME: message-manager
      APP_VERSION: ${APP_VERSION:-1.3.0}
      SERVICE_NAME: message-delivery-service
      INSTANCE_ID: ${INSTANCE_ID:-message-manager-1}
      ERROR_URL_WEBHOOK: ${ERROR_URL_WEBHOOK:-}
      MONGODB_URI: mongodb://mongo:27017/message-manager
    volumes:
      - svid-message:/run/spire/svid
    networks:
      - backend-net
      - data-net
    healthcheck:
      test: curl -sk --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/ping || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      mongo:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  Financial Scraper — Real-time market data ingestion
  # ---------------------------------------------------------------------------
  financial-scraper:
    build:
      context: .
      dockerfile: services/financial-scraper/Dockerfile
    container_name: trading-scraper
    restart: unless-stopped
    ports:
      - '${SCRAPER_PORT:-8445}:3000'
    environment:
      <<: *message-env
      APP_NAME: financial-scraper
      APP_VERSION: ${APP_VERSION:-1.3.0}
      SERVICE_NAME: financial-scrapper-service
      INSTANCE_ID: ${INSTANCE_ID:-financial-scraper-1}
      ERROR_URL_WEBHOOK: ${ERROR_URL_WEBHOOK:-}
      DB_USER: ${MYSQL_USER:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-financial_scraper}
      DB_HOST: mysql
      DB_PORT: '3306'
    volumes:
      - svid-scraper:/run/spire/svid
    networks:
      - backend-net
      - data-net
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      discovery-server:
        condition: service_healthy
      message-manager:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  Trader Trainer — GA + DQN agent evolution
  # ---------------------------------------------------------------------------
  trader-trainer:
    build:
      context: .
      dockerfile: services/trader-trainer/Dockerfile
    container_name: trading-trainer
    restart: unless-stopped
    ports:
      - '${TRAINER_PORT:-8446}:3000'
    environment:
      <<: *message-env
      APP_NAME: trader-trainer
      APP_VERSION: ${APP_VERSION:-1.3.0}
      SERVICE_NAME: trader-training-service
      INSTANCE_ID: ${INSTANCE_ID:-trader-trainer-1}
      TRAINER_SYMBOLS: ${TRAINER_SYMBOLS:-BTCUSDT,ETHUSDT}
      TRAINER_DATA_WINDOW: ${TRAINER_DATA_WINDOW:-500}
      TRAINER_VALIDATION_SPLIT: ${TRAINER_VALIDATION_SPLIT:-0.2}
      TRAINER_GENERATIONS: ${TRAINER_GENERATIONS:-50}
      TRAINER_POPULATION_SIZE: ${TRAINER_POPULATION_SIZE:-20}
      TRAINER_TIME_BUDGET_MS: ${TRAINER_TIME_BUDGET_MS:-300000}
      TRAINER_EPISODES_PER_INDIVIDUAL: ${TRAINER_EPISODES_PER_INDIVIDUAL:-3}
    volumes:
      - svid-trainer:/run/spire/svid
    networks:
      - backend-net
    healthcheck:
      test: curl -sk --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/ping || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      discovery-server:
        condition: service_healthy
      message-manager:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  API Gateway — External single entry point
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: trading-gateway
    restart: unless-stopped
    ports:
      - '${GATEWAY_PORT:-8448}:3000'
    environment:
      <<: *core-env
      DISCOVERY_SERVICE_URL: https://discovery-server:3000
      RATE_LIMIT_WINDOW_MS: '60000'
      RATE_LIMIT_MAX: '100'
      CACHE_TTL_MS: '30000'
      AUTH_TOKEN_HEADER: x-api-key
      AUTH_TOKENS: ''
      PROXY_TIMEOUT_MS: '10000'
    volumes:
      - svid-gateway:/run/spire/svid
    networks:
      - backend-net
    healthcheck:
      test: curl -sk --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/ping || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      discovery-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  Audit Logger — Immutable event audit trail
  # ---------------------------------------------------------------------------
  audit-logger:
    build:
      context: .
      dockerfile: services/audit-logger/Dockerfile
    container_name: trading-audit
    restart: unless-stopped
    ports:
      - '${AUDIT_PORT:-8450}:3000'
    environment:
      <<: *message-env
      APP_NAME: audit-logger
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SERVICE_NAME: audit-logger-service
      INSTANCE_ID: ${INSTANCE_ID:-audit-logger-1}
      ERROR_URL_WEBHOOK: ${ERROR_URL_WEBHOOK:-}
      MONGODB_URI: mongodb://mongo:27017/audit-logger
    volumes:
      - svid-audit:/run/spire/svid
    networks:
      - backend-net
      - data-net
    healthcheck:
      test: curl -sk --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/ping || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      mongo:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  DLQ Service - Dead Letter Queue management
  # ---------------------------------------------------------------------------
  dlq-service:
    build:
      context: .
      dockerfile: services/dlq-service/Dockerfile
    container_name: trading-dlq
    restart: unless-stopped
    ports:
      - '${DLQ_PORT:-8452}:3000'
    environment:
      <<: *message-env
      APP_NAME: dlq-service
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SERVICE_NAME: dlq-service
      INSTANCE_ID: ${INSTANCE_ID:-dlq-service-1}
      ERROR_URL_WEBHOOK: ${ERROR_URL_WEBHOOK:-}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: dlq
      MONGO_COLLECTION: dlq_entries
      MAX_ENTRIES: '100000'
    volumes:
      - svid-dlq:/run/spire/svid
    networks:
      - backend-net
      - data-net
    healthcheck:
      test: curl -sk --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/ping || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      mongo:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  SPIFFE Helpers — spiffe-helper sidecars (ADR-0011)
  #  Each writes the service SVID into a shared svid-<svc> volume consumed by
  #  the main service (TLS_*_PATH point at /run/spire/svid). Mandatory.
  # ---------------------------------------------------------------------------
  spiffe-helper-discovery:
    image: ghcr.io/spiffe/spiffe-helper:0.6.0
    container_name: trading-helper-discovery
    restart: unless-stopped
    network_mode: "service:discovery-server"
    volumes:
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-discovery:/run/spire/svid
    command:
      - -socketPath=/run/spire/agent-sockets/public/api.sock
      - -certDir=/run/spire/svid
      - -svidFileName=svid.pem
      - -svidKeyFileName=svid_key.pem
      - -svidBundleFileName=bundle.pem
      - -renewSignal=SIGHUP
    depends_on:
      spire-agent:
        condition: service_healthy
      discovery-server:
        condition: service_started

  spiffe-helper-message:
    image: ghcr.io/spiffe/spiffe-helper:0.6.0
    container_name: trading-helper-message
    restart: unless-stopped
    network_mode: "service:message-manager"
    volumes:
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-message:/run/spire/svid
    command:
      - -socketPath=/run/spire/agent-sockets/public/api.sock
      - -certDir=/run/spire/svid
      - -svidFileName=svid.pem
      - -svidKeyFileName=svid_key.pem
      - -svidBundleFileName=bundle.pem
      - -renewSignal=SIGHUP
    depends_on:
      spire-agent:
        condition: service_healthy
      message-manager:
        condition: service_started

  spiffe-helper-scraper:
    image: ghcr.io/spiffe/spiffe-helper:0.6.0
    container_name: trading-helper-scraper
    restart: unless-stopped
    network_mode: "service:financial-scraper"
    volumes:
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-scraper:/run/spire/svid
    command:
      - -socketPath=/run/spire/agent-sockets/public/api.sock
      - -certDir=/run/spire/svid
      - -svidFileName=svid.pem
      - -svidKeyFileName=svid_key.pem
      - -svidBundleFileName=bundle.pem
      - -renewSignal=SIGHUP
    depends_on:
      spire-agent:
        condition: service_healthy
      financial-scraper:
        condition: service_started

  spiffe-helper-trainer:
    image: ghcr.io/spiffe/spiffe-helper:0.6.0
    container_name: trading-helper-trainer
    restart: unless-stopped
    network_mode: "service:trader-trainer"
    volumes:
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-trainer:/run/spire/svid
    command:
      - -socketPath=/run/spire/agent-sockets/public/api.sock
      - -certDir=/run/spire/svid
      - -svidFileName=svid.pem
      - -svidKeyFileName=svid_key.pem
      - -svidBundleFileName=bundle.pem
      - -renewSignal=SIGHUP
    depends_on:
      spire-agent:
        condition: service_healthy
      trader-trainer:
        condition: service_started

  spiffe-helper-gateway:
    image: ghcr.io/spiffe/spiffe-helper:0.6.0
    container_name: trading-helper-gateway
    restart: unless-stopped
    network_mode: "service:api-gateway"
    volumes:
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-gateway:/run/spire/svid
    command:
      - -socketPath=/run/spire/agent-sockets/public/api.sock
      - -certDir=/run/spire/svid
      - -svidFileName=svid.pem
      - -svidKeyFileName=svid_key.pem
      - -svidBundleFileName=bundle.pem
      - -renewSignal=SIGHUP
    depends_on:
      spire-agent:
        condition: service_healthy
      api-gateway:
        condition: service_started

  spiffe-helper-audit:
    image: ghcr.io/spiffe/spiffe-helper:0.6.0
    container_name: trading-helper-audit
    restart: unless-stopped
    network_mode: "service:audit-logger"
    volumes:
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-audit:/run/spire/svid
    command:
      - -socketPath=/run/spire/agent-sockets/public/api.sock
      - -certDir=/run/spire/svid
      - -svidFileName=svid.pem
      - -svidKeyFileName=svid_key.pem
      - -svidBundleFileName=bundle.pem
      - -renewSignal=SIGHUP
    depends_on:
      spire-agent:
        condition: service_healthy
      audit-logger:
        condition: service_started

  spiffe-helper-dlq:
    image: ghcr.io/spiffe/spiffe-helper:0.6.0
    container_name: trading-helper-dlq
    restart: unless-stopped
    network_mode: "service:dlq-service"
    volumes:
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-dlq:/run/spire/svid
    command:
      - -socketPath=/run/spire/agent-sockets/public/api.sock
      - -certDir=/run/spire/svid
      - -svidFileName=svid.pem
      - -svidKeyFileName=svid_key.pem
      - -svidBundleFileName=bundle.pem
      - -renewSignal=SIGHUP
    depends_on:
      spire-agent:
        condition: service_healthy
      dlq-service:
        condition: service_started

  # ---------------------------------------------------------------------------
  #  Admin Interface — React SPA served by nginx
  # ---------------------------------------------------------------------------
  admin-interface:
    build:
      context: .
      dockerfile: services/admin-interface/Dockerfile
    container_name: trading-admin
    restart: unless-stopped
    ports:
      - '${ADMIN_PORT:-8449}:80'
    networks:
      - backend-net
    environment:
      VITE_API_GATEWAY_URL: https://api-gateway:3000/v1
      VITE_ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on:
      api-gateway:
        condition: service_healthy

networks:
  data-net:
    name: trading-data-network
    driver: bridge
    internal: true
  backend-net:
    name: trading-backend-network
    driver: bridge

volumes:
  mongo-data:
  mysql-data:
  spire-data:
  spire-server-sockets:
  spire-agent-sockets:
  svid-discovery:
  svid-message:
  svid-scraper:
  svid-trainer:
  svid-gateway:
  svid-audit:
  svid-dlq:
