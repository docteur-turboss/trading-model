    volumes:
      - ./deploy/compose/spire/helper.conf:/etc/spiffe-helper/helper.conf:ro
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-edge:/run/spire/svid
    depends_on:
      spire-agent:
        condition: service_healthy

  spiffe-helper-prometheus:
    logging: *default-logging
    image: ghcr.io/spiffe/spiffe-helper:0.12.3@sha256:58f28329f6be32ab5a80248931845157d858f0aebdf7e462217a43f019e3452f
    container_name: trading-helper-prometheus
    restart: unless-stopped
    network_mode: none
    command: ["-config", "/etc/spiffe-helper/helper.conf"]
    volumes:
      - ./deploy/compose/spire/helper.conf:/etc/spiffe-helper/helper.conf:ro
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-prometheus:/run/spire/svid
    depends_on:
      spire-agent:
        condition: service_healthy

  spiffe-helper-blackbox:
    logging: *default-logging
    image: ghcr.io/spiffe/spiffe-helper:0.12.3@sha256:58f28329f6be32ab5a80248931845157d858f0aebdf7e462217a43f019e3452f
    container_name: trading-helper-blackbox
    restart: unless-stopped
    network_mode: none
    command: ["-config", "/etc/spiffe-helper/helper.conf"]
    volumes:
      - ./deploy/compose/spire/helper.conf:/etc/spiffe-helper/helper.conf:ro
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-blackbox:/run/spire/svid
    depends_on:
      spire-agent:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  Edge proxy — external entry point to the api-gateway (ADR-0018)
  #  Plain HTTP from the host, /v1 forwarded to the gateway with the edge-proxy
  #  SVID (the gateway only accepts SPIFFE mTLS clients).
  # ---------------------------------------------------------------------------
  edge-proxy:
    logging: *default-logging
    image: nginx:1.31.8-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72  # nginx 1.31.8-alpine
    container_name: trading-edge
    restart: unless-stopped
    mem_limit: 128m
    user: '101:101'
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /tmp:mode=1777
    ports:
      - '127.0.0.1:${EDGE_PORT:-8449}:8080'
    volumes:
      - ./deploy/edge-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/edge-proxy/gateway.compose.inc:/etc/nginx/conf.d/gateway.inc:ro
      - ./deploy/edge-proxy/realip.compose.inc:/etc/nginx/conf.d/realip.inc:ro
      - ${EDGE_LIMIT_KEY_INC:-./deploy/edge-proxy/edge-limit-key.inc}:/etc/nginx/conf.d/edge-limit-key.inc:ro
      - svid-edge:/run/spire/svid:ro
    networks:
      - backend-net
    depends_on:
      spiffe-helper-edge:
        condition: service_started
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: wget -q -O /dev/null http://127.0.0.1:8080/health/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  #  Observability Stack — Prometheus, Grafana, Loki
  # ---------------------------------------------------------------------------
  prometheus:
    logging: *default-logging
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    container_name: trading-prometheus
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/k8s/infra/config/alerting.yml:/etc/prometheus/alerting.yml:ro
      - prometheus-data:/prometheus
      - svid-prometheus:/run/spire/svid:ro
    networks:
      - backend-net
    depends_on:
      spiffe-helper-prometheus:
        condition: service_started
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--enable-feature=exemplar-storage'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # ---------------------------------------------------------------------------
  #  Infrastructure exporters (issue #601, ADR-0056): databases and the host.
  #  On Docker Desktop node-exporter sees the Windows drives (C: holds the
  #  Docker disk image, which filled it up on 2026-10-28).
  # ---------------------------------------------------------------------------
  # Read-only MySQL user of mysqld-exporter, as the K8s Job db-migrate-user
  # creates it. Idempotent: runs at every `up`.
  mysql-exporter-user:
    logging: *default-logging
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    container_name: trading-mysql-exporter-user
    restart: "no"
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD must be set (MySQL exporter user)}
    entrypoint:
      - sh
      - -c
      - |
        case "$$EXPORTER_PASSWORD" in
          *[!A-Za-z0-9_.@%+=-]*) echo "MYSQL_EXPORTER_PASSWORD must match [A-Za-z0-9_.@%+=-]" >&2; exit 1 ;;
        esac
        mysql -h mysql -u root -e "CREATE USER IF NOT EXISTS 'exporter'@'%' IDENTIFIED BY '$$EXPORTER_PASSWORD' WITH MAX_USER_CONNECTIONS 3; ALTER USER 'exporter'@'%' IDENTIFIED BY '$$EXPORTER_PASSWORD' WITH MAX_USER_CONNECTIONS 3; GRANT PROCESS, REPLICATION CLIENT ON *.* TO 'exporter'@'%'; GRANT SELECT ON performance_schema.* TO 'exporter'@'%';"
    networks:
      - data-net
    depends_on:
      mysql:
        condition: service_healthy

  mysqld-exporter:
    logging: *default-logging
    image: quay.io/prometheus/mysqld-exporter:v0.21.0@sha256:afad0c59a154fea24ca5ea0e6f95f2b0b168601b111266963dc8a347715b5318
    container_name: trading-mysqld-exporter
    restart: unless-stopped
    mem_limit: 128m
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD must be set (MySQL exporter user)}
    networks:
      - data-net
      - backend-net
    depends_on:
      mysql-exporter-user:
        condition: service_completed_successfully

  # One mongod serves audit-logger and dlq-service in compose; standalone, so
  # no replica set collector.
  mongodb-exporter:
    logging: *default-logging
    image: percona/mongodb_exporter:0.54.0@sha256:934e9db87e85e0fa63654e73c3504845993a254e898783ca905e65a68848b5a4
    container_name: trading-mongodb-exporter
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MONGODB_URI: mongodb://exporter:${MONGO_EXPORTER_PASSWORD:?MONGO_EXPORTER_PASSWORD must be set (MongoDB user, ADR-0067)}@mongo:27017/admin?directConnection=true
    networks:
      - data-net
      - backend-net
    depends_on:
      mongo-users:
        condition: service_completed_successfully

  # Compose Redis has no ACL (single dev node): no exporter user.
  redis-exporter:
    logging: *default-logging
    image: oliver006/redis_exporter:v1.97.0@sha256:f5f903fbe77571d455ede0453b084d6840bc62fc105efac001034421cab83b99
    container_name: trading-redis-exporter
    restart: unless-stopped
    mem_limit: 128m
    environment:
      REDIS_ADDR: redis://redis:6379
    networks:
      - backend-net
    depends_on:
      redis:
        condition: service_healthy

  node-exporter:
    logging: *default-logging
    image: quay.io/prometheus/node-exporter:v1.13.1@sha256:011e2d12c5bff759b90804bda642664775d7b4b127bf5148539bb82d3f590bb7
    container_name: trading-node-exporter
    restart: unless-stopped
    mem_limit: 128m
    pid: host
    command:
      - --path.rootfs=/host
    # Read-only. No `rslave`: Docker Desktop refuses it on `/`. On Docker
    # Desktop the host drives show up as /mnt/host/<letter> (9p).
    volumes:
      - /:/host:ro
    networks:
      - backend-net

  alertmanager:
    logging: *default-logging
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    container_name: trading-alertmanager
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - '127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093'
    volumes:
      - ./deploy/k8s/infra/config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # One file per key (SLACK_WEBHOOK_URL, PUSHOVER_USER_KEY, PUSHOVER_TOKEN, DEADMAN_URL),
      # see deploy/k8s/infra/config/alertmanager.yml. Missing files: notifications fail.
      - ${ALERTMANAGER_CREDENTIALS_DIR:-./observability/alertmanager-credentials}:/etc/alertmanager-credentials:ro
      - alertmanager-data:/alertmanager
    networks:
      - backend-net
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      prometheus:
        condition: service_started

  grafana:
    logging: *default-logging
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    container_name: trading-grafana
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3001}:3000'
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana-dashboards-provisioning.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./deploy/k8s/infra/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - backend-net
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set (Grafana admin password)}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/services.json
      # Per-person access (ADR-0063): OIDC only when GRAFANA_OIDC_ENABLED=true (off in dev).
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_AUTH_GENERIC_OAUTH_NAME: OIDC
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: 'true'
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: 'true'
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GRAFANA_OIDC_ENABLED:-false}
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OIDC_CLIENT_ID:-}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${GRAFANA_OIDC_AUTH_URL:-}
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${GRAFANA_OIDC_TOKEN_URL:-}
      GF_AUTH_GENERIC_OAUTH_API_URL: ${GRAFANA_OIDC_API_URL:-}
      GF_AUTH_GENERIC_OAUTH_ALLOWED_DOMAINS: ${GRAFANA_OIDC_ALLOWED_DOMAINS:-}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
      GF_LOG_FILTERS: context:info

  loki:
    logging: *default-logging
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    container_name: trading-loki
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - '127.0.0.1:${LOKI_PORT:-3100}:3100'
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - backend-net
    command: -config.file=/etc/loki/local-config.yaml

  # Probes /ping of every service with its own SVID (CertificateExpiry).
  blackbox-exporter:
    logging: *default-logging
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    container_name: trading-blackbox
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - ./observability/blackbox.yml:/etc/blackbox-exporter/config.yml:ro
      - svid-blackbox:/run/spire/svid:ro
    networks:
      - backend-net
    depends_on:
      spiffe-helper-blackbox:
        condition: service_started
    command: ['--config.file=/etc/blackbox-exporter/config.yml']

  # Traces: services export OTLP/HTTP straight to Jaeger (no collector in compose).
  jaeger:
    logging: *default-logging
    image: jaegertracing/all-in-one:1.76.0@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    container_name: trading-jaeger
    restart: unless-stopped
    ports:
      - '127.0.0.1:${JAEGER_PORT:-16686}:16686'
    # In-memory storage keeps every trace by default: it reached 11.5 GiB in
    # 22 h and starved the kind staging cluster sharing the Docker VM (issue
    # #760). Oldest traces go first past MEMORY_MAX_TRACES; mem_limit is the
    # K8s limit (deploy/k8s/infra/jaeger.yaml). Unbounded, the store sat at
    # 1 GiB and restarted in a loop, timing out every OTLP export (issue #962);
    # with 5000 traces it levels off at 204 MiB (20 %) under market collection.
    mem_limit: 1g
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
      MEMORY_MAX_TRACES: '5000'
    networks:
      - backend-net

  # Only holder of the Docker socket (ADR-0011 amendment), mounted read-only.
  # nginx + njs (deploy/docker-socket-proxy/, issue #2409): GET only on ping, version,
  # networks, the container list (always filtered on this compose project's label),
  # inspect (SPIRE Docker attestor, promtail) and logs (promtail tailing). Inspect and
  # logs answer 403 for a container of another project, inspect never returns
  # Config.Env, and every other path or method answers 403 (logged on stdout).
  # Remaining limit: /networks lists every network of the daemon (names only).
  docker-socket-proxy:
    logging: *default-logging
    image: nginx:1.31.8-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72  # nginx 1.31.8-alpine
    container_name: trading-docker-socket-proxy
    restart: unless-stopped
    # Root to read the root-owned socket; SETGID only for nginx's worker initgroups.
    user: "0"
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /tmp:mode=1777
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ./deploy/docker-socket-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/docker-socket-proxy/docker-api.js:/etc/nginx/docker-api.js:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api-net
    cap_drop: [ALL]
    cap_add: [SETGID]
    security_opt:
      - no-new-privileges:true

  # Logs: reads the container logs through the Docker API of docker-socket-proxy.
  promtail:
    logging: *default-logging
    image: grafana/promtail:3.6.8@sha256:6cfa64ec432b24a912d640e2edb940eeae2666f61861a66c121d763dd7241381
    container_name: trading-promtail
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - ./observability/promtail.yml:/etc/promtail/promtail.yml:ro
      - promtail-positions:/run/promtail
    networks:
      - backend-net
      - docker-api-net
    # Root (positions volume), no capability needed.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      loki:
        condition: service_started
      docker-socket-proxy:
        condition: service_started
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    command: -config.file=/etc/promtail/promtail.yml -config.expand-env=true

networks:
  docker-api-net:
    name: trading-docker-api-network
    driver: bridge
    internal: true
  data-net:
    name: trading-data-network
    driver: bridge
    internal: true
  backend-net:
    name: trading-backend-network
    driver: bridge

