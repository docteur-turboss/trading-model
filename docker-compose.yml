# =============================================================================
#  docker-compose.yml — Trading Model Microservices
#  Usage:
#    docker compose up -d
#    docker compose logs -f
#    docker compose down -v
# =============================================================================

# Shared environment templates — reduces duplications across service blocks
x-core-env: &core-env
  NODE_ENV: ${NODE_ENV:-production}
  PORT: '3000'
  REDIS_URL: redis://redis:6379
  # mTLS via SPIFFE SVIDs (ADR-0011) — mandatory. The spiffe-helper sidecars
  # write the SVID (key, cert, trust bundle) into /run/spire/svid before the
  # service binds, so no manual ./certs bundle is required.
  TLS_KEY_PATH: /run/spire/svid/svid_key.pem
  TLS_CERT_PATH: /run/spire/svid/svid.pem
  TLS_CA_PATH: /run/spire/svid/bundle.pem
  # Enforce the service-to-service ACL using attested SVID identities (ADR-0011).
  ENFORCE_MTLS_STRICT: ${ENFORCE_MTLS_STRICT:-true}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

# Rotated json-file logs: without a cap a looping service fills the Docker
# Desktop disk image, which freezes every container on the host.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-message-env: &message-env
  <<: *core-env
  CACHE_TTL_MS: '30000'
  SERVICE_PING_TIMEOUT_MS: '2000'
  TOKEN_REFRESH_INTERVAL_MS: '60000'
  TTL_REFRESH_INTERVAL_MS: '15000'
  ADDRESS_MANAGER_URL: https://discovery-server:3000
  MESSAGE_BUS_INIT_TIMEOUT_MS: '5000'
  MESSAGE_BUS_SHUTDOWN_TIMEOUT_MS: '5000'
  MESSAGE_CALLBACK_PATH: message

services:
  # ---------------------------------------------------------------------------
  #  MongoDB — audit-logger (audit trail) and dlq-service (dead letters)
  # ---------------------------------------------------------------------------
  mongo:
    logging: *default-logging
    image: mongo@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
    container_name: trading-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - data-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  #  Redis — discovery registry, message-manager subscriptions, dlq-service
  #  queues (single node for dev/E2E)
  # ---------------------------------------------------------------------------
  redis:
    logging: *default-logging
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: trading-redis
    restart: unless-stopped
    # Snapshots (RDB) always; the append-only file is per environment:
    # dev leaves it off, a compose host running staging/production sets
    # REDIS_APPENDONLY=yes like the K8s StatefulSet (deploy/k8s/infra/redis.yaml).
    command:
      - redis-server
      - --appendonly
      - ${REDIS_APPENDONLY:-no}
      - --save
      - 900 1 300 10
    volumes:
      - redis-data:/data
    networks:
      - backend-net
      - data-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  #  MySQL — Financial Scraper persistence
  # ---------------------------------------------------------------------------
  mysql:
    logging: *default-logging
    image: mysql@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
    container_name: trading-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-financial_scraper}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - data-net
    healthcheck:
      # TCP, not the socket: the entrypoint's temporary init server listens on
      # the socket only (port 0) and stops before the real server starts.
      test: mysqladmin ping -h 127.0.0.1 -u root
      interval: 10s
      timeout: 5s
      retries: 5
      # First start on an empty volume initializes the data directory (over a
      # minute on Docker Desktop, 130s measured 2026-10-31): failures during
      # that time do not count.
      start_period: 180s

  # ---------------------------------------------------------------------------
  #  Migration — apply pending SQL migrations (single source of truth for schema)
  # ---------------------------------------------------------------------------
  migrate:
    logging: *default-logging
    # Same image as the K8s Jobs (deploy/migrate): mysql2 locked, nothing installed at run time.
    build:
      context: .
      dockerfile: deploy/migrate/Dockerfile
    container_name: trading-migrate
    restart: "no"
    command: ["up"]
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-financial_scraper}
    networks:
      - data-net
    depends_on:
      mysql:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  Discovery Server — Service registry & lease management
  # ---------------------------------------------------------------------------
  discovery-server:
    logging: *default-logging
    build:
      context: .
      dockerfile: services/discovery-server/Dockerfile
    container_name: trading-discovery
    restart: unless-stopped
    ports:
      - '${DISCOVERY_PORT:-8443}:3000'
    environment:
      <<: *core-env
      SERVICE_NAME: discovery-server
      ERROR_URL_WEBHOOK: ${ERROR_URL_WEBHOOK:-}
      CLEANUP_SERVICE_INTERVAL_MS: '600000'
      # Signs the instance tokens kept in Redis: stable across restarts.
      # Required with NODE_ENV=production (discovery refuses to start).
      SIGNING_SECRET: ${SIGNING_SECRET:-}
    volumes:
      - svid-discovery:/run/spire/svid
    networks:
      - backend-net
    depends_on:
      spiffe-helper-discovery:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: curl -skf --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/health/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  #  SPIRE Server — workload identity issuance (ADR-0011)
  # ---------------------------------------------------------------------------
  spire-server:
    logging: *default-logging
    image: ghcr.io/spiffe/spire-server:1.15.5@sha256:584a9c5cc95b9457f5033e7e4488d603fffe5ec48a80c4dba14b05c5e1c2c384
    container_name: trading-spire-server
    restart: unless-stopped
    # Named volumes are created root-owned: the image user (1000) could not write them.
    user: "0:0"
    command: ["-config", "/etc/spire/server.conf"]
    volumes:
      - ./deploy/compose/spire/server.conf:/etc/spire/server.conf:ro
      - spire-server-data:/run/spire/data
      - spire-server-sockets:/run/spire/sockets
    networks:
      - backend-net
    # The SPIRE images ship no shell: exec-form healthchecks only.
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/run/spire/sockets/api.sock"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  #  SPIRE Bootstrap — registers the workload entries, exports the trust
  #  bundle and mints the agent join token (idempotent, runs to completion)
  # ---------------------------------------------------------------------------
  spire-bootstrap:
    logging: *default-logging
    build:
      context: deploy/spire
      target: bootstrap
    container_name: trading-spire-bootstrap
    restart: "no"
    environment:
      SPIFFE_TD: trading-model.local
      SPIFFE_NS: trading-model
    volumes:
      - spire-server-sockets:/run/spire/sockets
      - spire-bootstrap:/run/spire/bootstrap
    depends_on:
      spire-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  SPIRE Agent — attests workload containers through their Docker labels
  # ---------------------------------------------------------------------------
  spire-agent:
    logging: *default-logging
    build:
      context: deploy/spire
      target: agent
    container_name: trading-spire-agent
    restart: unless-stopped
    # The Docker workload attestor maps the caller PID to its container.
    pid: host
    volumes:
      - ./deploy/compose/spire/agent.conf:/etc/spire/agent.conf:ro
      - /var/run/docker.sock:/run/docker.sock
      - spire-bootstrap:/run/spire/bootstrap:ro
      - spire-agent-data:/run/spire/agent-data
      - spire-agent-sockets:/run/spire/agent-sockets
    networks:
      - backend-net
    depends_on:
      spire-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/run/spire/agent-sockets/public/api.sock"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  #  Message Manager — Event bus / message broker
  # ---------------------------------------------------------------------------
  message-manager:
    logging: *default-logging
    build:
      context: .
      dockerfile: services/message-manager/Dockerfile
    container_name: trading-message
    restart: unless-stopped
    ports:
      - '${MESSAGE_PORT:-8444}:3000'
    environment:
      <<: *message-env
      APP_NAME: message-manager
      APP_VERSION: ${APP_VERSION:-1.3.0}
      SERVICE_NAME: message-manager
      INSTANCE_ID: message-manager-1
      ERROR_URL_WEBHOOK: ${ERROR_URL_WEBHOOK:-}
      # Signs the dead letters sent to dlq-service: same key as dlq-service.
      DLQ_AUTH_HMAC_SECRET: ${DLQ_AUTH_HMAC_SECRET:-test-hmac-secret}
    # Leaves discovery, waits CACHE_TTL_MS (30 s), then lets in-flight
    # publishes (PUBLISH_ACCEPT_TIMEOUT_MS) and deliveries finish: see
    # application/index.ts. Undelivered messages stay in the Redis journal.
    stop_grace_period: 2m
    volumes:
      - svid-message:/run/spire/svid
    networks:
      - backend-net
      - data-net
    healthcheck:
      test: curl -skf --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/health/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      spiffe-helper-message:
        condition: service_started
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  Financial Scraper — Real-time market data ingestion
  # ---------------------------------------------------------------------------
  financial-scraper:
    # Waits for its publishes in flight on stop (PUBLISH_ACCEPT_TIMEOUT_MS + 5s).
    stop_grace_period: 1m
    logging: *default-logging
    build:
      context: .
      dockerfile: services/financial-scraper/Dockerfile
    container_name: trading-scraper
    restart: unless-stopped
    ports:
      - '${SCRAPER_PORT:-8445}:3000'
    environment:
      <<: *message-env
      APP_NAME: financial-scraper
      # Major 2 = gateway prefix /v2/financial-scraper (v3.0.0 breaking API change):
      # not the shared APP_VERSION, whose major stays 1.
      APP_VERSION: 2.0.0
      SERVICE_NAME: financial-scraper
      INSTANCE_ID: financial-scraper-1
      # Same symbols as TRAINER_SYMBOLS: the trainer consumes what the scraper publishes.
      SYMBOLS_TO_TRACK: ${SYMBOLS_TO_TRACK:-BTCUSDT,ETHUSDT}
      SCRAPE_INTERVAL: ${SCRAPE_INTERVAL:-*/1 * * * *}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-https://api.binance.com}
      # Contact e-mail in the User-Agent of the signal sources (ADR-0036): SEC
      # EDGAR answers 403 without one. From .env only: the repository is public.
      SIGNAL_CONTACT_EMAIL: ${SIGNAL_CONTACT_EMAIL:-}
      ERROR_URL_WEBHOOK: ${ERROR_URL_WEBHOOK:-}
      DB_USER: ${MYSQL_USER:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-financial_scraper}
      DB_HOST: mysql
      DB_PORT: '3306'
    volumes:
      - svid-scraper:/run/spire/svid
    networks:
      - backend-net
      - data-net
    depends_on:
      spiffe-helper-scraper:
        condition: service_started
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      discovery-server:
        condition: service_healthy
      message-manager:
        condition: service_healthy
    healthcheck:
      test: curl -skf --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/health/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  #  Trader Trainer — GA + DQN agent evolution
  # ---------------------------------------------------------------------------
  trader-trainer:
    logging: *default-logging
    build:
      context: .
      dockerfile: services/trader-trainer/Dockerfile
    container_name: trading-trainer
    restart: unless-stopped
    ports:
      - '${TRAINER_PORT:-8446}:3000'
    environment:
      <<: *message-env
      APP_NAME: trader-trainer
      APP_VERSION: ${APP_VERSION:-1.3.0}
      SERVICE_NAME: trader-trainer
      INSTANCE_ID: trader-trainer-1
      TRAINER_SYMBOLS: ${TRAINER_SYMBOLS:-BTCUSDT,ETHUSDT}
      TRAINER_DATA_WINDOW: ${TRAINER_DATA_WINDOW:-500}
      TRAINER_VALIDATION_SPLIT: ${TRAINER_VALIDATION_SPLIT:-0.2}
      TRAINER_GENERATIONS: ${TRAINER_GENERATIONS:-50}
      TRAINER_POPULATION_SIZE: ${TRAINER_POPULATION_SIZE:-20}
      TRAINER_TIME_BUDGET_MS: ${TRAINER_TIME_BUDGET_MS:-300000}
      TRAINER_MAX_DATA_AGE_MS: ${TRAINER_MAX_DATA_AGE_MS:-900000}
      TRAINER_EPISODES_PER_INDIVIDUAL: ${TRAINER_EPISODES_PER_INDIVIDUAL:-10}
      TRAINER_FITNESS_TYPE: ${TRAINER_FITNESS_TYPE:-total_pnl}
      FEATURE_RISK_ADJUSTED_FITNESS: ${FEATURE_RISK_ADJUSTED_FITNESS:-true}
      TRAINER_OBSERVE_POSITION: ${TRAINER_OBSERVE_POSITION:-true}
      # Model artifacts (ADR-0022), backed up by scripts/backup.sh (checkpoints)
      TRAINER_MODEL_DIR: /data/checkpoints/models
      MODEL_DOWNLOAD_CALLERS: ${MODEL_DOWNLOAD_CALLERS:-}
    volumes:
      - svid-trainer:/run/spire/svid
      - trainer-checkpoints:/data/checkpoints
    networks:
      - backend-net
    healthcheck:
      test: curl -skf --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/health/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      spiffe-helper-trainer:
        condition: service_started
      discovery-server:
        condition: service_healthy
      message-manager:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  API Gateway — External single entry point
  # ---------------------------------------------------------------------------
  api-gateway:
    logging: *default-logging
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: trading-gateway
    restart: unless-stopped
    ports:
      - '${GATEWAY_PORT:-8448}:3000'
    environment:
      <<: *core-env
      SERVICE_NAME: api-gateway
      DISCOVERY_SERVICE_URL: https://discovery-server:3000
      RATE_LIMIT_WINDOW_MS: '60000'
      RATE_LIMIT_MAX: '100'
      CACHE_TTL_MS: '30000'
      AUTH_TOKEN_HEADER: x-api-key
      AUTH_STRICT: 'true'
      # Required: in production the gateway refuses to start without API keys.
      AUTH_TOKENS: ${GATEWAY_AUTH_TOKENS:-}
      PROXY_TIMEOUT_MS: '10000'
      PROXY_MAX_RESPONSE_BYTES: '8388608'
    volumes:
      - svid-gateway:/run/spire/svid
    networks:
      - backend-net
    healthcheck:
      test: curl -skf --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/health/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      spiffe-helper-gateway:
        condition: service_started
      discovery-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  Audit Logger — Immutable event audit trail
  # ---------------------------------------------------------------------------
  audit-logger:
    logging: *default-logging
    build:
      context: .
      dockerfile: services/audit-logger/Dockerfile
    container_name: trading-audit
    restart: unless-stopped
    ports:
      - '${AUDIT_PORT:-8450}:3000'
    environment:
      <<: *message-env
      APP_NAME: audit-logger
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SERVICE_NAME: audit-logger
      INSTANCE_ID: audit-logger-1
      ERROR_URL_WEBHOOK: ${ERROR_URL_WEBHOOK:-}
      MONGODB_URI: mongodb://mongo:27017/audit-logger
    volumes:
      - svid-audit:/run/spire/svid
    networks:
      - backend-net
      - data-net
    healthcheck:
      test: curl -skf --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/health/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      spiffe-helper-audit:
        condition: service_started
      mongo:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  DLQ Service - Dead Letter Queue management
  # ---------------------------------------------------------------------------
  dlq-service:
    logging: *default-logging
    build:
      context: .
      dockerfile: services/dlq-service/Dockerfile
    container_name: trading-dlq
    restart: unless-stopped
    ports:
      - '${DLQ_PORT:-8452}:3000'
    environment:
      <<: *message-env
      APP_NAME: dlq-service
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SERVICE_NAME: dlq-service
      INSTANCE_ID: dlq-service-1
      ERROR_URL_WEBHOOK: ${ERROR_URL_WEBHOOK:-}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: dlq
      MONGO_COLLECTION: dlq_entries
      MAX_ENTRIES: '100000'
      DLQ_AUTH_HMAC_SECRET: ${DLQ_AUTH_HMAC_SECRET:-test-hmac-secret}
      DLQ_ALLOWED_SERVICES: ${DLQ_ALLOWED_SERVICES:-message-manager,admin}
      # Replays eligible dead letters through message-manager (ADR-0029).
      DLQ_AUTO_RETRY_ENABLED: ${DLQ_AUTO_RETRY_ENABLED:-true}
    volumes:
      - svid-dlq:/run/spire/svid
    networks:
      - backend-net
      - data-net
    healthcheck:
      test: curl -skf --cert /run/spire/svid/svid.pem --key /run/spire/svid/svid_key.pem https://localhost:3000/health/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      spiffe-helper-dlq:
        condition: service_started
      mongo:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  SPIFFE Helpers — spiffe-helper sidecars (ADR-0011)
  #  Each writes the service SVID into a shared svid-<svc> volume consumed by
  #  the main service (TLS_*_PATH point at /run/spire/svid). Mandatory.
  #  The SPIRE agent identifies a helper by its compose service name
  #  (spiffe-helper-<suffix>, registered by spire-bootstrap). Helpers only talk
  #  to the agent socket: no network, so a service restart cannot strand them.
  # ---------------------------------------------------------------------------
  spiffe-helper-discovery:
    logging: *default-logging
    image: ghcr.io/spiffe/spiffe-helper:0.10.1@sha256:2402c34d83794aa24c127baa46e9732d653463f3bfcd39cda1313003ed60f8c9
    container_name: trading-helper-discovery
    restart: unless-stopped
    network_mode: none
    command: ["-config", "/etc/spiffe-helper/helper.conf"]
    volumes:
      - ./deploy/compose/spire/helper.conf:/etc/spiffe-helper/helper.conf:ro
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-discovery:/run/spire/svid
    depends_on:
      spire-agent:
        condition: service_healthy

  spiffe-helper-message:
    logging: *default-logging
    image: ghcr.io/spiffe/spiffe-helper:0.10.1@sha256:2402c34d83794aa24c127baa46e9732d653463f3bfcd39cda1313003ed60f8c9
    container_name: trading-helper-message
    restart: unless-stopped
    network_mode: none
    command: ["-config", "/etc/spiffe-helper/helper.conf"]
    volumes:
      - ./deploy/compose/spire/helper.conf:/etc/spiffe-helper/helper.conf:ro
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-message:/run/spire/svid
    depends_on:
      spire-agent:
        condition: service_healthy

  spiffe-helper-scraper:
    logging: *default-logging
    image: ghcr.io/spiffe/spiffe-helper:0.10.1@sha256:2402c34d83794aa24c127baa46e9732d653463f3bfcd39cda1313003ed60f8c9
    container_name: trading-helper-scraper
    restart: unless-stopped
    network_mode: none
    command: ["-config", "/etc/spiffe-helper/helper.conf"]
    volumes:
      - ./deploy/compose/spire/helper.conf:/etc/spiffe-helper/helper.conf:ro
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-scraper:/run/spire/svid
    depends_on:
      spire-agent:
        condition: service_healthy

  spiffe-helper-trainer:
    logging: *default-logging
    image: ghcr.io/spiffe/spiffe-helper:0.10.1@sha256:2402c34d83794aa24c127baa46e9732d653463f3bfcd39cda1313003ed60f8c9
    container_name: trading-helper-trainer
    restart: unless-stopped
    network_mode: none
    command: ["-config", "/etc/spiffe-helper/helper.conf"]
    volumes:
      - ./deploy/compose/spire/helper.conf:/etc/spiffe-helper/helper.conf:ro
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-trainer:/run/spire/svid
    depends_on:
      spire-agent:
        condition: service_healthy

  spiffe-helper-gateway:
    logging: *default-logging
    image: ghcr.io/spiffe/spiffe-helper:0.10.1@sha256:2402c34d83794aa24c127baa46e9732d653463f3bfcd39cda1313003ed60f8c9
    container_name: trading-helper-gateway
    restart: unless-stopped
    network_mode: none
    command: ["-config", "/etc/spiffe-helper/helper.conf"]
    volumes:
      - ./deploy/compose/spire/helper.conf:/etc/spiffe-helper/helper.conf:ro
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-gateway:/run/spire/svid
    depends_on:
      spire-agent:
        condition: service_healthy

  spiffe-helper-audit:
    logging: *default-logging
    image: ghcr.io/spiffe/spiffe-helper:0.10.1@sha256:2402c34d83794aa24c127baa46e9732d653463f3bfcd39cda1313003ed60f8c9
    container_name: trading-helper-audit
    restart: unless-stopped
    network_mode: none
    command: ["-config", "/etc/spiffe-helper/helper.conf"]
    volumes:
      - ./deploy/compose/spire/helper.conf:/etc/spiffe-helper/helper.conf:ro
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-audit:/run/spire/svid
    depends_on:
      spire-agent:
        condition: service_healthy

  spiffe-helper-dlq:
    logging: *default-logging
    image: ghcr.io/spiffe/spiffe-helper:0.10.1@sha256:2402c34d83794aa24c127baa46e9732d653463f3bfcd39cda1313003ed60f8c9
    container_name: trading-helper-dlq
    restart: unless-stopped
    network_mode: none
    command: ["-config", "/etc/spiffe-helper/helper.conf"]
    volumes:
      - ./deploy/compose/spire/helper.conf:/etc/spiffe-helper/helper.conf:ro
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-dlq:/run/spire/svid
    depends_on:
      spire-agent:
        condition: service_healthy

  spiffe-helper-edge:
    logging: *default-logging
    image: ghcr.io/spiffe/spiffe-helper:0.10.1@sha256:2402c34d83794aa24c127baa46e9732d653463f3bfcd39cda1313003ed60f8c9
    container_name: trading-helper-edge
    restart: unless-stopped
    network_mode: none
    command: ["-config", "/etc/spiffe-helper/helper.conf"]
    volumes:
      - ./deploy/compose/spire/helper.conf:/etc/spiffe-helper/helper.conf:ro
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-edge:/run/spire/svid
    depends_on:
      spire-agent:
        condition: service_healthy

  spiffe-helper-prometheus:
    logging: *default-logging
    image: ghcr.io/spiffe/spiffe-helper:0.10.1@sha256:2402c34d83794aa24c127baa46e9732d653463f3bfcd39cda1313003ed60f8c9
    container_name: trading-helper-prometheus
    restart: unless-stopped
    network_mode: none
    command: ["-config", "/etc/spiffe-helper/helper.conf"]
    volumes:
      - ./deploy/compose/spire/helper.conf:/etc/spiffe-helper/helper.conf:ro
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-prometheus:/run/spire/svid
    depends_on:
      spire-agent:
        condition: service_healthy

  spiffe-helper-blackbox:
    logging: *default-logging
    image: ghcr.io/spiffe/spiffe-helper:0.10.1@sha256:2402c34d83794aa24c127baa46e9732d653463f3bfcd39cda1313003ed60f8c9
    container_name: trading-helper-blackbox
    restart: unless-stopped
    network_mode: none
    command: ["-config", "/etc/spiffe-helper/helper.conf"]
    volumes:
      - ./deploy/compose/spire/helper.conf:/etc/spiffe-helper/helper.conf:ro
      - spire-agent-sockets:/run/spire/agent-sockets:ro
      - svid-blackbox:/run/spire/svid
    depends_on:
      spire-agent:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  Edge proxy — external entry point to the api-gateway (ADR-0018)
  #  Plain HTTP from the host, /v1 forwarded to the gateway with the edge-proxy
  #  SVID (the gateway only accepts SPIFFE mTLS clients).
  # ---------------------------------------------------------------------------
  edge-proxy:
    logging: *default-logging
    image: nginx@sha256:814a8e88df978ade80e584cc5b333144b9372a8e3c98872d07137dbf3b44d0e4  # nginx 1.27.3-alpine
    container_name: trading-edge
    restart: unless-stopped
    user: '101:101'
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /tmp:mode=1777
    ports:
      - '${EDGE_PORT:-8449}:8080'
    volumes:
      - ./deploy/edge-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/edge-proxy/gateway.compose.inc:/etc/nginx/conf.d/gateway.inc:ro
      - ./deploy/edge-proxy/realip.compose.inc:/etc/nginx/conf.d/realip.inc:ro
      - svid-edge:/run/spire/svid:ro
    networks:
      - backend-net
    depends_on:
      spiffe-helper-edge:
        condition: service_started
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: wget -q -O /dev/null http://127.0.0.1:8080/health/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  #  Observability Stack — Prometheus, Grafana, Loki
  # ---------------------------------------------------------------------------
  prometheus:
    logging: *default-logging
    image: prom/prometheus@sha256:378f4e03703557d1c6419e6caccf922f96e6d88a530f7431d66a4c4f4b1000fe
    container_name: trading-prometheus
    restart: unless-stopped
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerting.yml:/etc/prometheus/alerting.yml:ro
      - prometheus-data:/prometheus
      - svid-prometheus:/run/spire/svid:ro
    networks:
      - backend-net
    depends_on:
      spiffe-helper-prometheus:
        condition: service_started
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Serves what scripts/backup.sh writes to ${BACKUP_DIR}/metrics (run it with
  # METRICS_FILE=${BACKUP_DIR}/metrics/backup.prom), as the K8s
  # backup-metrics-exporter does. Docker has no scheduler: the host runs backup.sh.
  backup-metrics-exporter:
    logging: *default-logging
    image: busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    container_name: trading-backup-metrics
    restart: unless-stopped
    user: '65534:65534'
    command:
      - sh
      - -c
      - |
        mkdir -p /tmp/metrics
        echo '# No backup metrics yet' > /tmp/metrics/metrics
        httpd -f -p 9118 -h /tmp/metrics &
        while true; do
          if ls /metrics/*.prom >/dev/null 2>&1; then
            cat /metrics/*.prom > /tmp/metrics/metrics.tmp
            mv /tmp/metrics/metrics.tmp /tmp/metrics/metrics
          fi
          sleep 5
        done
    volumes:
      - ${BACKUP_DIR:-./backups}/metrics:/metrics:ro
    networks:
      - backend-net

  # ---------------------------------------------------------------------------
  #  Infrastructure exporters (issue #601, ADR-0056): databases and the host.
  #  On Docker Desktop node-exporter sees the Windows drives (C: holds the
  #  Docker disk image, which filled it up on 2026-10-28).
  # ---------------------------------------------------------------------------
  # Read-only MySQL user of mysqld-exporter, as the K8s Job db-migrate-user
  # creates it. Idempotent: runs at every `up`.
  mysql-exporter-user:
    logging: *default-logging
    image: mysql@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
    container_name: trading-mysql-exporter-user
    restart: "no"
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD must be set (MySQL exporter user)}
    entrypoint:
      - sh
      - -c
      - |
        case "$$EXPORTER_PASSWORD" in
          *[!A-Za-z0-9_.@%+=-]*) echo "MYSQL_EXPORTER_PASSWORD must match [A-Za-z0-9_.@%+=-]" >&2; exit 1 ;;
        esac
        mysql -h mysql -u root -e "CREATE USER IF NOT EXISTS 'exporter'@'%' IDENTIFIED BY '$$EXPORTER_PASSWORD' WITH MAX_USER_CONNECTIONS 3; ALTER USER 'exporter'@'%' IDENTIFIED BY '$$EXPORTER_PASSWORD' WITH MAX_USER_CONNECTIONS 3; GRANT PROCESS, REPLICATION CLIENT ON *.* TO 'exporter'@'%'; GRANT SELECT ON performance_schema.* TO 'exporter'@'%';"
    networks:
      - data-net
    depends_on:
      mysql:
        condition: service_healthy

  mysqld-exporter:
    logging: *default-logging
    image: quay.io/prometheus/mysqld-exporter:v0.18.0@sha256:2598c0571f383708e19016d119bb45c06128a9ebc962c9f49483278ac5a94c41
    container_name: trading-mysqld-exporter
    restart: unless-stopped
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD must be set (MySQL exporter user)}
    networks:
      - data-net
      - backend-net
    depends_on:
      mysql-exporter-user:
        condition: service_completed_successfully

  # One mongod serves audit-logger and dlq-service in compose; standalone, so
  # no replica set collector.
  mongodb-exporter:
    logging: *default-logging
    image: percona/mongodb_exporter:0.47.1@sha256:8ba5d6e25fe7e30912f10b01a9e16e14c6c3af05f36dcaed0659690d70dc1670
    container_name: trading-mongodb-exporter
    restart: unless-stopped
    command:
      - --mongodb.uri=mongodb://mongo:27017/?directConnection=true
    networks:
      - data-net
      - backend-net
    depends_on:
      mongo:
        condition: service_healthy

  # Compose Redis has no ACL (single dev node): no exporter user.
  redis-exporter:
    logging: *default-logging
    image: oliver006/redis_exporter:v1.80.0@sha256:cd5fad1591e585db5b58beec7fca427027c61a4349f50109af67cf2f07964d02
    container_name: trading-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    networks:
      - backend-net
    depends_on:
      redis:
        condition: service_healthy

  node-exporter:
    logging: *default-logging
    image: quay.io/prometheus/node-exporter:v1.10.2@sha256:337ff1d356b68d39cef853e8c6345de11ce7556bb34cda8bd205bcf2ed30b565
    container_name: trading-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
    # Read-only. No `rslave`: Docker Desktop refuses it on `/`. On Docker
    # Desktop the host drives show up as /mnt/host/<letter> (9p).
    volumes:
      - /:/host:ro
    networks:
      - backend-net

  alertmanager:
    logging: *default-logging
    image: prom/alertmanager@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    container_name: trading-alertmanager
    restart: unless-stopped
    ports:
      - '${ALERTMANAGER_PORT:-9093}:9093'
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # One file per key (SLACK_WEBHOOK_URL, PUSHOVER_USER_KEY, PUSHOVER_TOKEN, DEADMAN_URL),
      # see observability/alertmanager.yml. Missing files: notifications fail.
      - ${ALERTMANAGER_CREDENTIALS_DIR:-./observability/alertmanager-credentials}:/etc/alertmanager-credentials:ro
    networks:
      - backend-net
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      prometheus:
        condition: service_started

  grafana:
    logging: *default-logging
    image: grafana/grafana@sha256:a0f881232a6fb71a0554a47d0fe2203b6888fe77f4cefb7ea62bed7eb54e13c3
    container_name: trading-grafana
    restart: unless-stopped
    ports:
      - '${GRAFANA_PORT:-3001}:3000'
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana-dashboards-provisioning.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - backend-net
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set (Grafana admin password)}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/services.json

  loki:
    logging: *default-logging
    image: grafana/loki@sha256:d947e68a84d9e44915dfa08c3bec27e2124efd5ba6c83443eb53578101ec69e3
    container_name: trading-loki
    restart: unless-stopped
    ports:
      - '${LOKI_PORT:-3100}:3100'
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - backend-net
    command: -config.file=/etc/loki/local-config.yaml

  # Probes /ping of every service with its own SVID (CertificateExpiry).
  blackbox-exporter:
    logging: *default-logging
    image: prom/blackbox-exporter@sha256:b04a9fef4fa086a02fc7fcd8dcdbc4b7b35cc30cdee860fdc6a19dd8b208d63e
    container_name: trading-blackbox
    restart: unless-stopped
    volumes:
      - ./observability/blackbox.yml:/etc/blackbox-exporter/config.yml:ro
      - svid-blackbox:/run/spire/svid:ro
    networks:
      - backend-net
    depends_on:
      spiffe-helper-blackbox:
        condition: service_started
    command: ['--config.file=/etc/blackbox-exporter/config.yml']

  # Traces: services export OTLP/HTTP straight to Jaeger (no collector in compose).
  jaeger:
    logging: *default-logging
    image: jaegertracing/all-in-one@sha256:7e9591218e7ddd51e568ef892e3ea190ae420ecf97c4d718910a3f57e076c216
    container_name: trading-jaeger
    restart: unless-stopped
    ports:
      - '${JAEGER_PORT:-16686}:16686'
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    networks:
      - backend-net

  # Logs: reads the container logs through the Docker API (needs the socket).
  promtail:
    logging: *default-logging
    image: grafana/promtail@sha256:b3db8e7b1cba0e8c45ce2ae72ebddfd88ebdcae86383f1680edf0074e9010ff6
    container_name: trading-promtail
    restart: unless-stopped
    volumes:
      - ./observability/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/run/promtail
    networks:
      - backend-net
    depends_on:
      - loki
    command: -config.file=/etc/promtail/promtail.yml

networks:
  data-net:
    name: trading-data-network
    driver: bridge
    internal: true
  backend-net:
    name: trading-backend-network
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  trainer-checkpoints:
  mysql-data:
  spire-server-data:
  spire-agent-data:
  spire-bootstrap:
  spire-server-sockets:
  spire-agent-sockets:
  svid-discovery:
  svid-message:
  svid-scraper:
  svid-trainer:
  svid-gateway:
  svid-audit:
  svid-dlq:
  svid-edge:
  svid-prometheus:
  svid-blackbox:
  promtail-positions:
  prometheus-data:
  grafana-data:
  loki-data:
