# =============================================================================
#  docker-compose.yml — Trading Model Microservices
#  Usage:
#    docker compose up -d
#    docker compose logs -f
#    docker compose down -v
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  #  MongoDB — Message Manager persistence
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: trading-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - trading-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  #  MySQL — Financial Scraper persistence
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8
    container_name: trading-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-financial_scraper}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - trading-net
    healthcheck:
      test: mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  #  Discovery Server — Service registry & lease management
  # ---------------------------------------------------------------------------
  discovery-server:
    build:
      context: .
      dockerfile: services/discovery-server/Dockerfile
    container_name: trading-discovery
    restart: unless-stopped
    ports:
      - '${DISCOVERY_PORT:-8443}:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: '3000'
      TLS_KEY_PATH: /certs/server-key.pem
      TLS_CERT_PATH: /certs/server.crt
      TLS_CA_PATH: /certs/ca.crt
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ERROR_URL_WEBHOOK: ${ERROR_URL_WEBHOOK:-}
      CLEANUP_SERVICE_INTERVAL_MS: '600000'
    volumes:
      - ${TLS_CERTS_DIR:-./certs}:/certs:ro
    networks:
      - trading-net
    healthcheck:
      test: curl -sk --cert /certs/server.crt --key /certs/server-key.pem https://localhost:3000/ping || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  #  Message Manager — Event bus / message broker
  # ---------------------------------------------------------------------------
  message-manager:
    build:
      context: .
      dockerfile: services/message-manager/Dockerfile
    container_name: trading-message
    restart: unless-stopped
    ports:
      - '${MESSAGE_PORT:-8444}:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: '3000'
      TLS_KEY_PATH: /certs/server-key.pem
      TLS_CERT_PATH: /certs/server.crt
      TLS_CA_PATH: /certs/ca.crt
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_NAME: message-manager
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SERVICE_NAME: message-delivery-service
      INSTANCE_ID: ${INSTANCE_ID:-message-manager-1}
      CACHE_TTL_MS: '30000'
      SERVICE_PING_TIMEOUT_MS: '2000'
      TOKEN_REFRESH_INTERVAL_MS: '60000'
      TTL_REFRESH_INTERVAL_MS: '15000'
      ADDRESS_MANAGER_URL: https://discovery-server:3000
      ERROR_URL_WEBHOOK: ${ERROR_URL_WEBHOOK:-}
      MESSAGE_BUS_INIT_TIMEOUT_MS: '5000'
      MESSAGE_BUS_SHUTDOWN_TIMEOUT_MS: '5000'
      MESSAGE_CALLBACK_PATH: message
      MONGODB_URI: mongodb://mongo:27017/message-manager
    volumes:
      - ${TLS_CERTS_DIR:-./certs}:/certs:ro
    networks:
      - trading-net
    healthcheck:
      test: curl -sk --cert /certs/server.crt --key /certs/server-key.pem https://localhost:3000/ping || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      mongo:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  Financial Scraper — Real-time market data ingestion
  # ---------------------------------------------------------------------------
  financial-scraper:
    build:
      context: .
      dockerfile: services/financial-scraper/Dockerfile
    container_name: trading-scraper
    restart: unless-stopped
    ports:
      - '${SCRAPER_PORT:-8445}:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: '3000'
      TLS_KEY_PATH: /certs/server-key.pem
      TLS_CERT_PATH: /certs/server.crt
      TLS_CA_PATH: /certs/ca.crt
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_NAME: financial-scraper
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SERVICE_NAME: financial-scrapper-service
      INSTANCE_ID: ${INSTANCE_ID:-financial-scraper-1}
      CACHE_TTL_MS: '30000'
      SERVICE_PING_TIMEOUT_MS: '2000'
      TOKEN_REFRESH_INTERVAL_MS: '60000'
      TTL_REFRESH_INTERVAL_MS: '15000'
      ADDRESS_MANAGER_URL: https://discovery-server:3000
      ERROR_URL_WEBHOOK: ${ERROR_URL_WEBHOOK:-}
      MESSAGE_BUS_INIT_TIMEOUT_MS: '5000'
      MESSAGE_BUS_SHUTDOWN_TIMEOUT_MS: '5000'
      MESSAGE_CALLBACK_PATH: message
      DB_USER: ${MYSQL_USER:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-financial_scraper}
      DB_HOST: mysql
      DB_PORT: '3306'
    volumes:
      - ${TLS_CERTS_DIR:-./certs}:/certs:ro
    networks:
      - trading-net
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      message-manager:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  Trader Trainer — GA + DQN agent evolution
  # ---------------------------------------------------------------------------
  trader-trainer:
    build:
      context: .
      dockerfile: services/trader-trainer/Dockerfile
    container_name: trading-trainer
    restart: unless-stopped
    ports:
      - '${TRAINER_PORT:-8446}:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: '3000'
      TLS_KEY_PATH: /certs/server-key.pem
      TLS_CERT_PATH: /certs/server.crt
      TLS_CA_PATH: /certs/ca.crt
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_NAME: trader-trainer
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SERVICE_NAME: trader-training-service
      INSTANCE_ID: ${INSTANCE_ID:-trader-trainer-1}
      CACHE_TTL_MS: '30000'
      SERVICE_PING_TIMEOUT_MS: '2000'
      TOKEN_REFRESH_INTERVAL_MS: '60000'
      TTL_REFRESH_INTERVAL_MS: '15000'
      ADDRESS_MANAGER_URL: https://discovery-server:3000
      ERROR_URL_WEBHOOK: ${ERROR_URL_WEBHOOK:-}
      MESSAGE_BUS_INIT_TIMEOUT_MS: '5000'
      MESSAGE_BUS_SHUTDOWN_TIMEOUT_MS: '5000'
      MESSAGE_CALLBACK_PATH: message
      TRAINER_SYMBOLS: ${TRAINER_SYMBOLS:-BTCUSDT,ETHUSDT}
      TRAINER_DATA_WINDOW: ${TRAINER_DATA_WINDOW:-500}
      TRAINER_VALIDATION_SPLIT: ${TRAINER_VALIDATION_SPLIT:-0.2}
      TRAINER_GENERATIONS: ${TRAINER_GENERATIONS:-50}
      TRAINER_POPULATION_SIZE: ${TRAINER_POPULATION_SIZE:-20}
      TRAINER_TIME_BUDGET_MS: ${TRAINER_TIME_BUDGET_MS:-300000}
      TRAINER_EPISODES_PER_INDIVIDUAL: ${TRAINER_EPISODES_PER_INDIVIDUAL:-3}
    volumes:
      - ${TLS_CERTS_DIR:-./certs}:/certs:ro
    networks:
      - trading-net
    healthcheck:
      test: curl -sk --cert /certs/server.crt --key /certs/server-key.pem https://localhost:3000/ping || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      discovery-server:
        condition: service_healthy
      message-manager:
        condition: service_healthy

networks:
  trading-net:
    name: trading-network
    driver: bridge

volumes:
  mongo-data:
  mysql-data:
