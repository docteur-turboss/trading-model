global:
  resolve_timeout: 5m
  slack_api_url: "https://hooks.slack.com/services/CHANGE_ME"

route:
  group_by: ['alertname', 'severity', 'job']
  group_wait: 30s
  group_interval: 2m
  repeat_interval: 4h
  receiver: default-receiver
  routes:
    - match:
        severity: critical
      receiver: critical-receiver
      continue: true
    - match:
        severity: warning
      receiver: warning-receiver

receivers:
  - name: default-receiver
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: |
          *Alert*: {{ .CommonAnnotations.summary }}
          *Description*: {{ .CommonAnnotations.description }}
          *Severity*: {{ .CommonLabels.severity }}
          *Service*: {{ .CommonLabels.job }}
          {{ range .Alerts }}
          - {{ .Annotations.description }}
          {{ end }}

  - name: critical-receiver
    pagerduty_configs:
      - routing_key: 'CHANGE_ME_PAGERDUTY_ROUTING_KEY'
        severity: critical
        description: '{{ .CommonAnnotations.description }}'

  - name: warning-receiver
    slack_configs:
      - channel: '#alerts-warning'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname']