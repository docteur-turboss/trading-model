global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alerting.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Prometheus authenticates to each service's /metrics with its own SPIRE SVID
# (spiffe-helper-prometheus writes it into /run/spire/svid, ADR-0011). The
# `prometheus` identity may only GET /metrics (MTLSAuthorizationMiddleware).

scrape_configs:
  - job_name: 'message-manager'
    scheme: https
    tls_config: &svid
      ca_file: /run/spire/svid/bundle.pem
      cert_file: /run/spire/svid/svid.pem
      key_file: /run/spire/svid/svid_key.pem
    static_configs:
      - targets: ['message-manager:3000']

  - job_name: 'discovery-server'
    scheme: https
    tls_config: *svid
    static_configs:
      - targets: ['discovery-server:3000']

  - job_name: 'dlq-service'
    scheme: https
    tls_config: *svid
    static_configs:
      - targets: ['dlq-service:3000']

  - job_name: 'api-gateway'
    scheme: https
    tls_config: *svid
    static_configs:
      - targets: ['api-gateway:3000']

  - job_name: 'audit-logger'
    scheme: https
    tls_config: *svid
    static_configs:
      - targets: ['audit-logger:3000']

  - job_name: 'financial-scraper'
    scheme: https
    tls_config: *svid
    static_configs:
      - targets: ['financial-scraper:3000']

  - job_name: 'trader-trainer'
    scheme: https
    tls_config: *svid
    static_configs:
      - targets: ['trader-trainer:3000']

  # SVID expiry of every service: GET /ping with the blackbox-exporter SVID
  # (spiffe-helper-blackbox). /ping answers before the ACL: any valid SVID passes.
  - job_name: 'blackbox-exporter'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['https://discovery-server:3000/ping']
        labels:
          service: discovery-server
      - targets: ['https://message-manager:3000/ping']
        labels:
          service: message-manager
      - targets: ['https://financial-scraper:3000/ping']
        labels:
          service: financial-scraper
      - targets: ['https://trader-trainer:3000/ping']
        labels:
          service: trader-trainer
      - targets: ['https://api-gateway:3000/ping']
        labels:
          service: api-gateway
      - targets: ['https://audit-logger:3000/ping']
        labels:
          service: audit-logger
      - targets: ['https://dlq-service:3000/ping']
        labels:
          service: dlq-service
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Self-monitoring of the alerting path (AlertmanagerNotificationsFailing,
  # PrometheusRuleEvaluationFailures).
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # scripts/backup.sh metrics (METRICS_FILE), served by backup-metrics-exporter.
  - job_name: 'backup-metrics'
    static_configs:
      - targets: ['backup-metrics-exporter:9118']
    scrape_interval: 60s
