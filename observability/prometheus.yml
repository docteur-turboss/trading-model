global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alerting.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Prometheus authenticates to each service's /metrics with its own SPIRE SVID
# (spiffe-helper-prometheus writes it into /run/spire/svid, ADR-0011). The
# `prometheus` identity may only GET /metrics (MTLSAuthorizationMiddleware).

scrape_configs:
  - job_name: 'api-gateway'
    scheme: https
    tls_config: &svid
      ca_file: /run/spire/svid/bundle.pem
      cert_file: /run/spire/svid/svid.pem
      key_file: /run/spire/svid/svid_key.pem
    static_configs:
      - targets: ['api-gateway:3000']

  - job_name: 'audit-logger'
    scheme: https
    tls_config: *svid
    static_configs:
      - targets: ['audit-logger:3000']

  - job_name: 'model-evaluator'
    scheme: https
    tls_config: *svid
    static_configs:
      - targets: ['model-evaluator:3000']

  - job_name: 'decision-consumer'
    scheme: https
    tls_config: *svid
    static_configs:
      - targets: ['decision-consumer:3000']

  - job_name: 'risk-execution'
    scheme: https
    tls_config: *svid
    static_configs:
      - targets: ['risk-execution:3000']

  - job_name: 'financial-scraper'
    scheme: https
    tls_config: *svid
    static_configs:
      - targets: ['financial-scraper:3000']

  - job_name: 'trader-trainer'
    scheme: https
    tls_config: *svid
    static_configs:
      - targets: ['trader-trainer:3000']

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
  # SVID expiry of every service: GET /ping with the blackbox-exporter SVID
  # (spiffe-helper-blackbox). /ping answers before the ACL: any valid SVID passes.
  - job_name: 'blackbox-exporter'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['https://financial-scraper:3000/ping']
        labels:
          service: financial-scraper
      - targets: ['https://trader-trainer:3000/ping']
        labels:
          service: trader-trainer
      - targets: ['https://api-gateway:3000/ping']
        labels:
          service: api-gateway
      - targets: ['https://audit-logger:3000/ping']
        labels:
          service: audit-logger
      - targets: ['https://model-evaluator:3000/ping']
        labels:
          service: model-evaluator
      - targets: ['https://risk-execution:3000/ping']
        labels:
          service: risk-execution
      - targets: ['https://decision-consumer:3000/ping']
        labels:
          service: decision-consumer
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Self-monitoring of the alerting path (AlertmanagerNotificationsFailing,
  # PrometheusRuleEvaluationFailures).
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # Infrastructure exporters (issue #601, ADR-0056).
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysqld-exporter:9104']

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
