# Promtail Configuration — log scraping for trading-model
# Scrapes Docker container logs and forwards to Loki.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: trading-model
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '^/trading-(.+)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_name']
        regex: '^/trading-(.+)'
        target_label: 'service'
        replacement: '$1'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            correlationId: correlationId
            service: service
            url: url
            sessionId: sessionId
            userId: userId
      - labels:
          level: ''
          service: ''
          stream: ''
      - timestamp:
          source: time
          format: RFC3339Nano
