groups:
  - name: trading-model
    interval: 30s
    rules:

      # ── Burn Rate Alerts (SLO-based) ─────────────────────────────
      - alert: SLOAvailabilityFastBurn
        expr: rate(http_requests_duration_seconds_count{status=~"5.."}[5m]) / rate(http_requests_duration_seconds_count[5m]) > 0.02
        for: 2m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: 'Availability SLO fast burn rate exceeded'
          description: 'Error rate > 2% over 5m — burning through 99.9% error budget rapidly.'

      - alert: SLOAvailabilitySlowBurn
        expr: rate(http_requests_duration_seconds_count{status=~"5.."}[1h]) / rate(http_requests_duration_seconds_count[1h]) > 0.005
        for: 10m
        labels:
          severity: warning
          slo: availability
        annotations:
          summary: 'Availability SLO slow burn rate exceeded'
          description: 'Error rate > 0.5% over 1h — burning through 99.9% error budget.'

      - alert: SLOLatencyFastBurn
        expr: histogram_quantile(0.95, rate(http_requests_duration_seconds_bucket[5m])) > 5
        for: 2m
        labels:
          severity: critical
          slo: latency
        annotations:
          summary: 'Latency SLO fast burn rate exceeded'
          description: 'P95 latency > 5s over 5m — exceeding 2s SLO target.'

      - alert: SLOLatencySlowBurn
        expr: histogram_quantile(0.95, rate(http_requests_duration_seconds_bucket[1h])) > 3
        for: 10m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: 'Latency SLO slow burn rate exceeded'
          description: 'P95 latency > 3s over 1h — approaching 2s SLO target breach.'

      - alert: SLOErrorRateFastBurn
        expr: rate(http_requests_duration_seconds_count{status=~"5.."}[5m]) / rate(http_requests_duration_seconds_count[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          slo: error_rate
        annotations:
          summary: 'Error rate SLO fast burn rate exceeded'
          description: 'Error rate > 5% over 5m — exceeding 1% SLO target.'

      - alert: SLOErrorRateSlowBurn
        expr: rate(http_requests_duration_seconds_count{status=~"5.."}[1h]) / rate(http_requests_duration_seconds_count[1h]) > 0.02
        for: 10m
        labels:
          severity: warning
          slo: error_rate
        annotations:
          summary: 'Error rate SLO slow burn rate exceeded'
          description: 'Error rate > 2% over 1h — approaching 1% SLO target breach.'

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.job }} is down'
          description: 'Service {{ $labels.job }} has been unreachable for over 1 minute.'

      - alert: HighErrorRate
        expr: rate(http_requests_duration_seconds_count{status=~"5.."}[5m]) / rate(http_requests_duration_seconds_count[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'High error rate on {{ $labels.job }}'
          description: 'Error rate is {{ $value | humanizePercentage }} for the last 5 minutes.'

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_requests_duration_seconds_bucket[5m])) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'High latency on {{ $labels.job }}'
          description: 'P95 latency is {{ $value }}s for the last 5 minutes.'

      - alert: CertificateExpiry
        expr: time() - ca_certificate_last_renewed > 604800
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'Certificate renewal overdue'
          description: 'CA certificate has not been renewed in over 7 days.'

      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Circuit breaker open on {{ $labels.job }}'
          description: 'Circuit breaker for {{ $labels.service }} is in OPEN state.'

      - alert: BackpressureHigh
        expr: message_manager_backpressure_ratio > 0.8
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Backpressure high on message-manager'
          description: 'Backpressure ratio is {{ $value | humanizePercentage }}. Consider scaling message-manager.'

      - alert: DLQSizeGrowing
        expr: rate(dlq_entries_added_total[15m]) > rate(dlq_entries_replayed_total[15m])
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'DLQ is growing faster than it is drained'
          description: 'Messages are being added to the DLQ faster than they are replayed.'

      - alert: InstanceCountLow
        expr: count(discovery_registered_instances) < 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Low instance count for service {{ $labels.service_name }}'
          description: 'Service {{ $labels.service_name }} has fewer than 2 registered instances.'

      - alert: HighMemoryUsage
        expr: nodejs_heap_size_used_bytes / nodejs_heap_size_total_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High memory usage on {{ $labels.job }}'
          description: 'Heap usage is {{ $value | humanizePercentage }}.'

      - alert: HeartbeatStopped
        expr: rate(discovery_heartbeats_total[5m]) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Heartbeats have stopped on discovery-server'
          description: 'No heartbeats received in the last 5 minutes.'

      - alert: BackupFailed
        expr: time() - backup_last_success_timestamp > 90000
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: 'Database backup failed or too old'
          description: 'Last successful backup was more than 25 hours ago — check backup job.'

      - alert: BackupNotRunning
        expr: backup_last_success_timestamp == 0
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: 'Database backup has never succeeded'
          description: 'No successful backup has ever been recorded for {{ $labels.component }}.'
