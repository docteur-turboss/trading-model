# Loki Configuration — log aggregation for trading-model
# Single-binary mode (no microservices) for Docker Compose. Loki 3.x: TSDB
# index (schema v13), as in deploy/k8s/infra/loki.yaml; boltdb-shipper's
# shared_store and the table manager no longer exist.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_series: 500
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  retention_period: 744h
