apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app.kubernetes.io/component: grafana
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  labels:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/part-of: trading-model
spec:
  serviceName: grafana
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/component: grafana
        app.kubernetes.io/part-of: trading-model
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana@sha256:a0f881232a6fb71a0554a47d0fe2203b6888fe77f4cefb7ea62bed7eb54e13c3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: GRAFANA_PASSWORD
            - name: GF_INSTALL_PLUGINS
              value: ""
            # Per-person access (ADR-0063): no anonymous access, no local
            # sign-up, Viewer by default. OIDC is on only when the optional
            # Secret key GRAFANA_OIDC_ENABLED is "true" (an unset or empty
            # variable leaves the Grafana default: off).
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_USERS_AUTO_ASSIGN_ORG_ROLE
              value: Viewer
            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: OIDC
            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: openid email profile
            - name: GF_AUTH_GENERIC_OAUTH_USE_PKCE
              value: "true"
            # Creates the Viewer account on first OIDC login (distinct from users.allow_sign_up).
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
              value: "true"
            - name: GF_LOG_FILTERS
              value: context:info
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: GRAFANA_OIDC_ENABLED
                  optional: true
            # Same key as OIDC: with OIDC on, the public Ingress no longer offers
            # the local password form (break-glass: port-forward, ADR-0063).
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: GRAFANA_OIDC_ENABLED
                  optional: true
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: GRAFANA_OIDC_CLIENT_ID
                  optional: true
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: GRAFANA_OIDC_CLIENT_SECRET
                  optional: true
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: GRAFANA_OIDC_AUTH_URL
                  optional: true
            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: GRAFANA_OIDC_TOKEN_URL
                  optional: true
            - name: GF_AUTH_GENERIC_OAUTH_API_URL
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: GRAFANA_OIDC_API_URL
                  optional: true
            - name: GF_AUTH_GENERIC_OAUTH_ALLOWED_DOMAINS
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: GRAFANA_OIDC_ALLOWED_DOMAINS
                  optional: true
            - name: GF_SERVER_ROOT_URL
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: GRAFANA_ROOT_URL
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: grafana-dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
            - name: grafana-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
  volumeClaimTemplates:
    - metadata:
        name: grafana-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/part-of: trading-model
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Jaeger
        type: jaeger
        access: proxy
        uid: jaeger
        url: http://jaeger:16686
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        jsonData:
          derivedFields:
            - name: trace_id
              matcherType: regex
              matcherRegex: '"trace_id":"([0-9a-f]+)"'
              datasourceUid: jaeger
              url: "$${__value.raw}"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grafana-pdb
  labels:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/part-of: trading-model
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: grafana
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-network-policy
  labels:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 3000
          protocol: TCP
