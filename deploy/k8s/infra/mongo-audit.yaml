apiVersion: v1
kind: Service
metadata:
  name: mongo-audit-headless
  labels:
    app.kubernetes.io/component: mongodb-audit
    app.kubernetes.io/part-of: trading-model
spec:
  clusterIP: None
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
  selector:
    app.kubernetes.io/component: mongodb-audit
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-audit
  labels:
    app.kubernetes.io/component: mongodb-audit
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
  selector:
    app.kubernetes.io/component: mongodb-audit
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-audit
  labels:
    app.kubernetes.io/component: mongodb-audit
    app.kubernetes.io/part-of: trading-model
spec:
  serviceName: mongo-audit-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: mongodb-audit
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mongodb-audit
        app.kubernetes.io/part-of: trading-model
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: mongodb-audit
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          image: mongo@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
          command:
            - mongod
          args:
            - "--replSet"
            - "rs0-audit"
            - "--port"
            - "27017"
            - "--bind_ip"
            - "0.0.0.0"
            - "--enableEncryption"
            - "--encryptionKeyFile"
            - "/etc/mongo-encryption/key"
          ports:
            - containerPort: 27017
              name: mongodb
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: mongo-audit-data
              mountPath: /data/db
            - name: mongo-encryption-key
              mountPath: /etc/mongo-encryption
              readOnly: true
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "try { rs.status().ok } catch { 0 }"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: mongo-encryption-key
          secret:
            secretName: mongodb-encryption-key
            optional: false
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: mongo-audit-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-audit-init
  labels:
    app.kubernetes.io/component: mongodb-audit
    app.kubernetes.io/part-of: trading-model
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb-init
          image: mongo@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
          command:
            - mongosh
            - --host
            - mongo-audit-0.mongo-audit-headless:27017
            - --eval
            - |
              rs.initiate({
                _id: "rs0-audit",
                members: [
                  { _id: 0, host: "mongo-audit-0.mongo-audit-headless:27017" },
                  { _id: 1, host: "mongo-audit-1.mongo-audit-headless:27017" },
                  { _id: 2, host: "mongo-audit-2.mongo-audit-headless:27017" }
                ]
              })
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mongo-audit-pdb
  labels:
    app.kubernetes.io/component: mongodb-audit
    app.kubernetes.io/part-of: trading-model
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: mongodb-audit
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-audit-network-policy
  labels:
    app.kubernetes.io/component: mongodb-audit
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mongodb-audit
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading-model
      ports:
        - port: 27017
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading-model
      ports:
        - port: 27017
          protocol: TCP
