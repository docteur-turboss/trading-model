apiVersion: v1
kind: Service
metadata:
  name: mongo-audit-headless
  labels:
    app.kubernetes.io/component: mongodb-audit
    app.kubernetes.io/part-of: trading-model
spec:
  clusterIP: None
  # A restarted member must resolve its own name before it is Ready, or it
  # never finds itself in the replica set config ("not a member of it").
  publishNotReadyAddresses: true
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
  selector:
    app.kubernetes.io/component: mongodb-audit
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-audit
  labels:
    app.kubernetes.io/component: mongodb-audit
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
  selector:
    app.kubernetes.io/component: mongodb-audit
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-audit
  labels:
    app.kubernetes.io/component: mongodb-audit
    app.kubernetes.io/part-of: trading-model
spec:
  serviceName: mongo-audit-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: mongodb-audit
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mongodb-audit
        app.kubernetes.io/part-of: trading-model
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: mongodb-audit
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      # Replica set internal authentication (issue #669, ADR-0067). mongod
      # refuses a keyFile readable by its group, and the data volume's fsGroup
      # adds group read to a mounted Secret file: the key is copied to a 0400
      # file of the mongod user instead.
      initContainers:
        - name: keyfile
          image: mongo:7.0.48@sha256:41e8195b2791692695e1dc9bd21cd51d0a3af05fff8ace9304a5c1acf94f1ae1
          command:
            - sh
            - -c
            - umask 077 && printf '%s' "$KEYFILE" > /keyfile/keyfile && chmod 400 /keyfile/keyfile && cat /tls/tls.crt /tls/tls.key > /keyfile/server.pem && cp /tls/ca.crt /keyfile/ca.crt
          env:
            - name: KEYFILE
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MONGO_AUDIT_KEYFILE
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: keyfile
              mountPath: /keyfile
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: keyfile
          emptyDir:
            medium: Memory
        - name: tls
          secret:
            secretName: mongo-audit-tls
        - name: mongo-ca
          secret:
            secretName: mongo-ca
            items:
              - key: ca.crt
                path: ca.crt
      containers:
        - name: mongodb
          image: mongo:7.0.48@sha256:41e8195b2791692695e1dc9bd21cd51d0a3af05fff8ace9304a5c1acf94f1ae1
          # Encryption at rest (--enableEncryption) is MongoDB Enterprise only:
          # this Community image refuses the flag and never starts with it.
          command:
            - mongod
          args:
            - "--replSet"
            - "rs0-audit"
            - "--port"
            - "27017"
            - "--bind_ip"
            - "0.0.0.0"
            - "--keyFile"
            - "/keyfile/keyfile"
            # Clear text and anonymous clients refused (ADR-0060, ADR-0067).
            - "--tlsMode"
            - "requireTLS"
            - "--tlsCertificateKeyFile"
            - "/keyfile/server.pem"
            - "--tlsCAFile"
            - "/keyfile/ca.crt"
            - "--tlsAllowConnectionsWithoutCertificates"
          ports:
            - containerPort: 27017
              name: mongodb
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # The scripts of deploy/ and backup run inside the pod with these.
          env:
            - name: MONGO_BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MONGO_BACKUP_PASSWORD
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MONGO_ROOT_PASSWORD
          volumeMounts:
            - name: mongo-audit-data
              mountPath: /data/db
            - name: keyfile
              mountPath: /keyfile
              readOnly: true
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --tls
                - --tlsCAFile
                - /keyfile/ca.crt
                - --eval
                # Fails only when the member left its own config ("not a member":
                # its name did not resolve at start, mongod never retries), so the
                # container restarts; a not yet initiated set stays alive.
                - "try { rs.status().ok } catch (e) { if (e.codeName === 'InvalidReplicaSetConfig') quit(1) }"
            initialDelaySeconds: 30
            periodSeconds: 15
            # mongosh starts slowly under the 1 CPU limit: a timeout is not a dead mongod.
            timeoutSeconds: 15
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --tls
                - --tlsCAFile
                - /keyfile/ca.crt
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
        # Bootstrap of this member: replica set and root user through the localhost
        # exception (only a loopback connection of this pod gets it; a Job over the
        # network is refused: "no replset config", run 43340429996). Idempotent.
        # The other members add themselves through the primary at each start, as
        # root (rs.add needs clusterAdmin): the members are the pods that exist,
        # whatever their start order (issue #2197). Same script in both manifests.
        - name: mongodb-bootstrap
          image: mongo:7.0.48@sha256:41e8195b2791692695e1dc9bd21cd51d0a3af05fff8ace9304a5c1acf94f1ae1
          env:
            - name: REPLICA_SET
              value: rs0-audit
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MONGO_ROOT_PASSWORD
          command:
            - sh
            - -c
            - |
              M="mongosh --quiet --tls --tlsCAFile /keyfile/ca.crt --host 127.0.0.1 --port 27017"
              until $M --eval 'db.hello().ok' >/dev/null 2>&1; do sleep 2; done
              SET="${HOSTNAME%-*}"
              export SELF="$HOSTNAME.$SET-headless:27017"
              # Pod 0 joins too when pod 1 already holds the set (pod 0 rebuilt): never a second set.
              if [ "${HOSTNAME##*-}" = 0 ] && ! mongosh --quiet "mongodb://$SET-1.$SET-headless:27017/?directConnection=true&serverSelectionTimeoutMS=3000" --eval 'db.hello().setName' 2>/dev/null | grep -q .; then
                $M --eval 'if (!db.hello().setName) rs.initiate({ _id: process.env.REPLICA_SET, members: [{ _id: 0, host: process.env.SELF }] })' || exit 1
                until $M --eval 'db.hello().isWritablePrimary' | grep -qx true; do sleep 2; done
                # The localhost exception allows createUser and nothing else (reading
                # system.users is refused, run 43364583932); once a user exists it
                # refuses createUser too: Unauthorized then means root is already there.
                $M --eval '
                  try {
                    db.getSiblingDB("admin").createUser({ user: "root", pwd: process.env.MONGO_ROOT_PASSWORD, roles: [{ role: "root", db: "admin" }] });
                  } catch (e) {
                    if (e.codeName !== "Unauthorized" && e.codeName !== "Location51003" && e.code !== 51003) throw e;
                  }' || exit 1
              else
                until mongosh --quiet "mongodb://$SET-0.$SET-headless:27017,$SELF/admin?replicaSet=$REPLICA_SET" --eval '
                  db.auth("root", process.env.MONGO_ROOT_PASSWORD);
                  if (!rs.conf().members.some((m) => m.host === process.env.SELF)) rs.add(process.env.SELF);'; do sleep 5; done
              fi
              exec sleep infinity
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
        # Exporter of this member (issue #601, ADR-0056): server status and
        # replica set state through localhost, as the `exporter` user
        # (clusterMonitor only, ADR-0067).
        - name: mongodb-exporter
          image: percona/mongodb_exporter:0.54.0@sha256:934e9db87e85e0fa63654e73c3504845993a254e898783ca905e65a68848b5a4
          env:
            - name: MONGO_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MONGO_EXPORTER_PASSWORD
            - name: MONGODB_URI
              value: mongodb://exporter:$(MONGO_EXPORTER_PASSWORD)@127.0.0.1:27017/admin?directConnection=true&tls=true&tlsCAFile=/etc/mongo-tls/ca.crt
          args:
            - --collector.replicasetstatus
            - --web.listen-address=:9216
          ports:
            - containerPort: 9216
              name: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: mongo-ca
              mountPath: /etc/mongo-tls
              readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: mongo-audit-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
# Users of the replica set (issue #669, ADR-0067): root, exporter, backup and the
# client of this database, from deploy/mongo/users.js. Idempotent, so it runs
# again on every release (ttl: the finished Job is removed, a later apply
# creates it again) and applies a rotated password. Needs a primary, which
# the mongodb-bootstrap sidecar elects; every pod joins the replica set (staging:
# 1 pod, so 1 member).
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-audit-users
  labels:
    app.kubernetes.io/component: mongodb-audit
    app.kubernetes.io/part-of: trading-model
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      # Allowed in by the database NetworkPolicy (label of the init Job).
      labels:
        app.kubernetes.io/component: mongodb-audit-init
        app.kubernetes.io/part-of: trading-model
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb-users
          image: mongo:7.0.48@sha256:41e8195b2791692695e1dc9bd21cd51d0a3af05fff8ace9304a5c1acf94f1ae1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - mongosh
            - --quiet
            - --tls
            - --tlsCAFile
            - /etc/mongo-tls/ca.crt
            - "mongodb://mongo-audit-0.mongo-audit-headless:27017,mongo-audit-1.mongo-audit-headless:27017,mongo-audit-2.mongo-audit-headless:27017/admin?replicaSet=rs0-audit"
            - --file
            - /scripts/users.js
          env:
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MONGO_ROOT_PASSWORD
            - name: MONGO_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MONGO_EXPORTER_PASSWORD
            - name: MONGO_BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MONGO_BACKUP_PASSWORD
            - name: MONGO_AUDIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MONGO_AUDIT_PASSWORD
            - name: MONGO_AUDIT_DB
              value: audit
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: mongo-ca
              mountPath: /etc/mongo-tls
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: mongo-users-script
        - name: mongo-ca
          secret:
            secretName: mongo-ca
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mongo-audit-pdb
  labels:
    app.kubernetes.io/component: mongodb-audit
    app.kubernetes.io/part-of: trading-model
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: mongodb-audit
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-audit-network-policy
  labels:
    app.kubernetes.io/component: mongodb-audit
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mongodb-audit
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Clients of 27017 (issue #727): the owner service, the replica set peers
    # and the init Job. Backups and restores go through `kubectl exec`, not
    # the network. A new client must be added here.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["audit-logger", "mongodb-audit", "mongodb-audit-init"]
      ports:
        - port: 27017
          protocol: TCP
    # The exporter sidecar: Prometheus only.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: prometheus
      ports:
        - port: 9216
          protocol: TCP
  egress:
    # Replica set peers only (DNS comes from allow-dns-and-telemetry-egress).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: mongodb-audit
      ports:
        - port: 27017
          protocol: TCP
