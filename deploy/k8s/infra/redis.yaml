apiVersion: v1
kind: Service
metadata:
  name: redis-cert
  labels:
    app.kubernetes.io/component: redis-cert-cache
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/component: redis-cert-cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cert-cache
  labels:
    app.kubernetes.io/component: redis-cert-cache
    app.kubernetes.io/part-of: trading-model
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: redis-cert-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis-cert-cache
        app.kubernetes.io/part-of: trading-model
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
---
# Redis HA: one master and two replicas, failed over by three sentinels.
# Clients connect through the sentinels (REDIS_SENTINELS), never to a pod
# directly: any pod can be the master, and no Service follows it.
# Both StatefulSets start through redis-ha.sh (ConfigMap redis-ha-scripts).
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  labels:
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: trading-model
spec:
  clusterIP: None
  # Starting pods look each other up before any of them is ready.
  publishNotReadyAddresses: true
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/component: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: trading-model
spec:
  serviceName: redis-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis
        app.kubernetes.io/part-of: trading-model
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: redis
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
          command:
            - sh
            - /scripts/redis-ha.sh
            - server
          args:
            - "--appendonly"
            - "yes"
            - "--save"
            - "900"
            - "1"
            - "--save"
            - "300"
            - "10"
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: REDIS_HOSTS
              value: "redis-0.redis-headless redis-1.redis-headless redis-2.redis-headless"
            - name: REDIS_INTERNAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_INTERNAL_PASSWORD
            - name: REDIS_DISCOVERY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_DISCOVERY_PASSWORD
            - name: REDIS_MESSAGE_MANAGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_MESSAGE_MANAGER_PASSWORD
            - name: REDIS_DLQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_DLQ_PASSWORD
            # ACL user of the exporter sidecar (redis-ha.sh exporter_user).
            - name: REDIS_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_EXPORTER_PASSWORD
                  optional: true
            # Expand step of 3.0.0 (redis-ha.sh): the 2.x clients, which use no
            # ACL user, keep working during the upgrade. Remove in the next release.
            - name: REDIS_ALLOW_LEGACY_CLIENTS
              value: "true"
            - name: SENTINEL_HOSTS
              value: "redis-sentinel-0.redis-sentinel-headless redis-sentinel-1.redis-sentinel-headless redis-sentinel-2.redis-sentinel-headless"
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-ha-scripts
              mountPath: /scripts
              readOnly: true
          # The start script waits up to 120s for a master to answer.
          startupProbe:
            exec:
              command:
                - sh
                - /scripts/redis-ha.sh
                - probe
                - server
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - sh
                - /scripts/redis-ha.sh
                - probe
                - server
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - sh
                - /scripts/redis-ha.sh
                - probe
                - server
            periodSeconds: 5
            timeoutSeconds: 2
        # Exporter of this node (issue #601, ADR-0056), as ACL user `exporter`:
        # INFO and read-only commands, no key, no CONFIG GET (masterauth).
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.80.0@sha256:cd5fad1591e585db5b58beec7fca427027c61a4349f50109af67cf2f07964d02
          env:
            - name: REDIS_ADDR
              value: redis://127.0.0.1:6379
            - name: REDIS_USER
              value: exporter
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_EXPORTER_PASSWORD
                  optional: true
            - name: REDIS_EXPORTER_CONFIG_COMMAND
              value: "-"
          ports:
            - containerPort: 9121
              name: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: redis-ha-scripts
          configMap:
            name: redis-ha-scripts
            defaultMode: 0444
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  labels:
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: trading-model
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel-headless
  labels:
    app.kubernetes.io/component: redis-sentinel
    app.kubernetes.io/part-of: trading-model
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: 26379
      targetPort: 26379
      name: sentinel
  selector:
    app.kubernetes.io/component: redis-sentinel
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel
  labels:
    app.kubernetes.io/component: redis-sentinel
    app.kubernetes.io/part-of: trading-model
spec:
  serviceName: redis-sentinel-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: redis-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis-sentinel
        app.kubernetes.io/part-of: trading-model
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: redis-sentinel
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sentinel
          image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
          command:
            - sh
            - /scripts/redis-ha.sh
            - sentinel
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: REDIS_HOSTS
              value: "redis-0.redis-headless redis-1.redis-headless redis-2.redis-headless"
            - name: REDIS_INTERNAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_INTERNAL_PASSWORD
            # Expand step of 3.0.0 (redis-ha.sh): the 2.x clients, which use no
            # ACL user, keep working during the upgrade. Remove in the next release.
            - name: REDIS_ALLOW_LEGACY_CLIENTS
              value: "true"
            - name: SENTINEL_HOSTS
              value: "redis-sentinel-0.redis-sentinel-headless redis-sentinel-1.redis-sentinel-headless redis-sentinel-2.redis-sentinel-headless"
            - name: SENTINEL_CONF
              value: /sentinel/sentinel.conf
            # ACL user of the exporter sidecar (user exporter of sentinel.conf, redis-ha.sh).
            - name: REDIS_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_EXPORTER_PASSWORD
                  optional: true
          ports:
            - containerPort: 26379
              name: sentinel
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # Sentinel rewrites its config at runtime and exits on a read-only one.
            - name: sentinel-config
              mountPath: /sentinel
            - name: redis-ha-scripts
              mountPath: /scripts
              readOnly: true
          startupProbe:
            exec:
              command:
                - sh
                - /scripts/redis-ha.sh
                - probe
                - sentinel
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - sh
                - /scripts/redis-ha.sh
                - probe
                - sentinel
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - sh
                - /scripts/redis-ha.sh
                - probe
                - sentinel
            periodSeconds: 5
            timeoutSeconds: 2
        # Exporter of this sentinel (issue #601, ADR-0056), as ACL user `exporter`:
        # INFO and read-only commands, no key, no CONFIG GET (masterauth).
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.80.0@sha256:cd5fad1591e585db5b58beec7fca427027c61a4349f50109af67cf2f07964d02
          env:
            - name: REDIS_ADDR
              value: redis://127.0.0.1:26379
            - name: REDIS_USER
              value: exporter
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_EXPORTER_PASSWORD
                  optional: true
            - name: REDIS_EXPORTER_CONFIG_COMMAND
              value: "-"
          ports:
            - containerPort: 9121
              name: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: sentinel-config
          emptyDir: {}
        - name: redis-ha-scripts
          configMap:
            name: redis-ha-scripts
            defaultMode: 0444
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-sentinel-pdb
  labels:
    app.kubernetes.io/component: redis-sentinel
    app.kubernetes.io/part-of: trading-model
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redis-sentinel
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-network-policy
  labels:
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: trading-model
spec:
  # The Redis pods only (part-of would select every pod of the namespace).
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["redis", "redis-sentinel", "redis-cert-cache"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Same namespace as the policy, whatever the overlay's namespace.
        - podSelector: {}
      ports:
        - port: 6379
          protocol: TCP
        - port: 26379
          protocol: TCP
    # The exporter sidecars: Prometheus only.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: prometheus
      ports:
        - port: 9121
          protocol: TCP
