# Redis HA: one master and two replicas, failed over by three sentinels.
# Clients connect through the sentinels (REDIS_SENTINELS), never to a pod
# directly: any pod can be the master, and no Service follows it.
# Both StatefulSets start through redis-ha.sh (ConfigMap redis-ha-scripts).
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  labels:
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: trading-model
spec:
  clusterIP: None
  # Starting pods look each other up before any of them is ready.
  publishNotReadyAddresses: true
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/component: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: trading-model
spec:
  serviceName: redis-headless
  replicas: 3
  # Parallel: after an outage every node must be up to compare the master markers
  # (redis-ha.sh cold start); OrderedReady would start redis-0 alone.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis
        app.kubernetes.io/part-of: trading-model
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: redis
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
          command:
            - sh
            - /scripts/redis-ha.sh
            - server
          args:
            - "--appendonly"
            - "yes"
            # 384 MiB = 75 % of the 512Mi limit, so a full Redis refuses writes (noeviction) instead of
            # being OOMKilled. maxmemory does not count the replication buffer (shared by the replicas
            # since Redis 7): capped at 64 MiB below (default 256 MiB would exceed the limit), which
            # leaves 64 MiB for the AOF rewrite fork copy-on-write and process overhead.
            - "--maxmemory"
            - "384mb"
            - "--client-output-buffer-limit"
            - "replica"
            - "64mb"
            - "32mb"
            - "60"
            - "--maxmemory-policy"
            - "noeviction"
            - "--save"
            - "900"
            - "1"
            - "--save"
            - "300"
            - "10"
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: REDIS_HOSTS
              value: "redis-0.redis-headless redis-1.redis-headless redis-2.redis-headless"
            - name: REDIS_INTERNAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_INTERNAL_PASSWORD
            - name: REDIS_DISCOVERY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_DISCOVERY_PASSWORD
            - name: REDIS_MESSAGE_MANAGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_MESSAGE_MANAGER_PASSWORD
            - name: REDIS_DLQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_DLQ_PASSWORD
            # Bus users (redis-ha.sh bus_user, ADR-0073): absent key = user not created.
            - name: REDIS_AUDIT_LOGGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_AUDIT_LOGGER_PASSWORD
                  optional: true
            - name: REDIS_TRADER_TRAINER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_TRADER_TRAINER_PASSWORD
                  optional: true
            - name: REDIS_MODEL_EVALUATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_MODEL_EVALUATOR_PASSWORD
                  optional: true
            # ACL user of the exporter sidecar (redis-ha.sh exporter_user).
            - name: REDIS_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_EXPORTER_PASSWORD
                  optional: true
            # TLS step of the expand/contract (redis-ha.sh, ADR-0047): optional =
            # clear text and TLS (release N); required = TLS only (release N+1).
            - name: REDIS_TLS_MODE
              value: optional
            - name: SENTINEL_HOSTS
              value: "redis-sentinel-0.redis-sentinel-headless redis-sentinel-1.redis-sentinel-headless redis-sentinel-2.redis-sentinel-headless"
          ports:
            - containerPort: 6379
              name: redis
            - containerPort: 6380
              name: redis-tls
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-ha-scripts
              mountPath: /scripts
              readOnly: true
            - name: redis-tls
              mountPath: /etc/redis-tls
              readOnly: true
          # The start script waits up to 120s for a master to answer.
          startupProbe:
            exec:
              command:
                - sh
                - /scripts/redis-ha.sh
                - probe
                - server
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - sh
                - /scripts/redis-ha.sh
                - probe
                - server
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - sh
                - /scripts/redis-ha.sh
                - probe
                - server
            periodSeconds: 5
            timeoutSeconds: 2
        # Exporter of this node (issue #601, ADR-0056), as ACL user `exporter`:
        # INFO and read-only commands, no key, no CONFIG GET (masterauth).
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.97.0@sha256:f5f903fbe77571d455ede0453b084d6840bc62fc105efac001034421cab83b99
          env:
            - name: REDIS_ADDR
              value: redis://127.0.0.1:6379
            - name: REDIS_USER
              value: exporter
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_EXPORTER_PASSWORD
                  optional: true
            - name: REDIS_EXPORTER_CONFIG_COMMAND
              value: "-"
            # Needed from the required step (REDIS_ADDR=rediss://127.0.0.1:6380 /
            # 26380); the certificate carries 127.0.0.1.
            - name: REDIS_EXPORTER_TLS_CA_CERT_FILE
              value: /etc/redis-tls/ca.crt
          ports:
            - containerPort: 9121
              name: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: redis-ca
              mountPath: /etc/redis-tls
              readOnly: true
      volumes:
        - name: redis-tls
          secret:
            secretName: redis-tls
        # The exporter sidecars read the CA only, never the private key.
        - name: redis-ca
          secret:
            secretName: redis-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: redis-ha-scripts
          configMap:
            name: redis-ha-scripts
            defaultMode: 0444
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  labels:
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: trading-model
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel-headless
  labels:
    app.kubernetes.io/component: redis-sentinel
    app.kubernetes.io/part-of: trading-model
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: 26379
      targetPort: 26379
      name: sentinel
  selector:
    app.kubernetes.io/component: redis-sentinel
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel
  labels:
    app.kubernetes.io/component: redis-sentinel
    app.kubernetes.io/part-of: trading-model
spec:
  serviceName: redis-sentinel-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: redis-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis-sentinel
        app.kubernetes.io/part-of: trading-model
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: redis-sentinel
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sentinel
          image: redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
          command:
            - sh
            - /scripts/redis-ha.sh
            - sentinel
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: REDIS_HOSTS
              value: "redis-0.redis-headless redis-1.redis-headless redis-2.redis-headless"
            - name: REDIS_INTERNAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_INTERNAL_PASSWORD
            # TLS step of the expand/contract (redis-ha.sh, ADR-0047): optional =
            # clear text and TLS (release N); required = TLS only (release N+1).
            - name: REDIS_TLS_MODE
              value: optional
            - name: SENTINEL_HOSTS
              value: "redis-sentinel-0.redis-sentinel-headless redis-sentinel-1.redis-sentinel-headless redis-sentinel-2.redis-sentinel-headless"
            - name: SENTINEL_CONF
              value: /sentinel/sentinel.conf
            # ACL user of the exporter sidecar (user exporter of sentinel.conf, redis-ha.sh).
            - name: REDIS_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_EXPORTER_PASSWORD
                  optional: true
          ports:
            - containerPort: 26379
              name: sentinel
            - containerPort: 26380
              name: sentinel-tls
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # Sentinel rewrites its config at runtime and exits on a read-only one.
            - name: sentinel-config
              mountPath: /sentinel
            - name: redis-ha-scripts
              mountPath: /scripts
              readOnly: true
            - name: redis-tls
              mountPath: /etc/redis-tls
              readOnly: true
          startupProbe:
            exec:
              command:
                - sh
                - /scripts/redis-ha.sh
                - probe
                - sentinel
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - sh
                - /scripts/redis-ha.sh
                - probe
                - sentinel
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - sh
                - /scripts/redis-ha.sh
                - probe
                - sentinel
            periodSeconds: 5
            timeoutSeconds: 2
        # Exporter of this sentinel (issue #601, ADR-0056), as ACL user `exporter`:
        # INFO and read-only commands, no key, no CONFIG GET (masterauth).
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.97.0@sha256:f5f903fbe77571d455ede0453b084d6840bc62fc105efac001034421cab83b99
          env:
            - name: REDIS_ADDR
              value: redis://127.0.0.1:26379
            - name: REDIS_USER
              value: exporter
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_EXPORTER_PASSWORD
                  optional: true
            - name: REDIS_EXPORTER_CONFIG_COMMAND
              value: "-"
            # Needed from the required step (REDIS_ADDR=rediss://127.0.0.1:6380 /
            # 26380); the certificate carries 127.0.0.1.
            - name: REDIS_EXPORTER_TLS_CA_CERT_FILE
              value: /etc/redis-tls/ca.crt
          ports:
            - containerPort: 9121
              name: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: redis-ca
              mountPath: /etc/redis-tls
              readOnly: true
      volumes:
        - name: redis-tls
          secret:
            secretName: redis-tls
        # The exporter sidecars read the CA only, never the private key.
        - name: redis-ca
          secret:
            secretName: redis-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: sentinel-config
          emptyDir: {}
        - name: redis-ha-scripts
          configMap:
            name: redis-ha-scripts
            defaultMode: 0444
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-sentinel-pdb
  labels:
    app.kubernetes.io/component: redis-sentinel
    app.kubernetes.io/part-of: trading-model
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redis-sentinel
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-network-policy
  labels:
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: trading-model
spec:
  # The Redis pods only (part-of would select every pod of the namespace).
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["redis", "redis-sentinel"]
  policyTypes:
    - Ingress
  ingress:
    # Clients of 6379 / 26379 (issue #747): the services that use Redis, the
    # ones that only read it while a rollback to N-1 is possible (expand/
    # contract, ADR-0040) and the Redis pods themselves.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - discovery-server
                  - message-manager
                  - dlq-service
                  - audit-logger
                  - trader-trainer
                  - model-evaluator
                  - redis
                  - redis-sentinel
      ports:
        - port: 6379
          protocol: TCP
        - port: 26379
          protocol: TCP
        # TLS listeners (REDIS_TLS_MODE, ADR-0047).
        - port: 6380
          protocol: TCP
        - port: 26380
          protocol: TCP
    # The exporter sidecars: Prometheus only.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: prometheus
      ports:
        - port: 9121
          protocol: TCP
