apiVersion: v1
kind: Service
metadata:
  name: redis-cert
  labels:
    app.kubernetes.io/component: redis-cert-cache
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/component: redis-cert-cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cert-cache
  labels:
    app.kubernetes.io/component: redis-cert-cache
    app.kubernetes.io/part-of: trading-model
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: redis-cert-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis-cert-cache
        app.kubernetes.io/part-of: trading-model
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: redis-primary
  labels:
    app.kubernetes.io/component: redis-primary
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/component: redis-primary
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-primary
  labels:
    app.kubernetes.io/component: redis-primary
    app.kubernetes.io/part-of: trading-model
spec:
  serviceName: redis-primary
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redis-primary
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis-primary
        app.kubernetes.io/part-of: trading-model
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
          args:
            - "--appendonly"
            - "yes"
            - "--save"
            - "900"
            - "1"
            - "--save"
            - "300"
            - "10"
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel-headless
  labels:
    app.kubernetes.io/component: redis-sentinel
    app.kubernetes.io/part-of: trading-model
spec:
  clusterIP: None
  ports:
    - port: 26379
      targetPort: 26379
      name: sentinel
  selector:
    app.kubernetes.io/component: redis-sentinel
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel
  labels:
    app.kubernetes.io/component: redis-sentinel
    app.kubernetes.io/part-of: trading-model
spec:
  serviceName: redis-sentinel-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: redis-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis-sentinel
        app.kubernetes.io/part-of: trading-model
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: redis-sentinel
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      containers:
        - name: sentinel
          image: redis:7-alpine
          command:
            - redis-sentinel
          args:
            - /etc/redis/sentinel.conf
          ports:
            - containerPort: 26379
              name: sentinel
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: sentinel-config
              mountPath: /etc/redis
              readOnly: true
      volumes:
        - name: sentinel-config
          configMap:
            name: redis-sentinel-config
            defaultMode: 0444
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-sentinel-config
  labels:
    app.kubernetes.io/component: redis-sentinel
    app.kubernetes.io/part-of: trading-model
data:
  sentinel.conf: |
    port 26379
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel monitor mymaster redis-primary 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel failover-timeout mymaster 30000
    sentinel parallel-syncs mymaster 1
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-network-policy
  labels:
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: trading-model
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading-model
      ports:
        - port: 6379
          protocol: TCP
        - port: 26379
          protocol: TCP
