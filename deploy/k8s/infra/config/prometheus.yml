global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Pod name (expanded by default since Prometheus 3): the two production replicas differ by
  # it. Dropped before sending (alert_relabel_configs), so both replicas'
  # copy of an alert is one alert for Alertmanager (issue #809, ADR-0062).
  external_labels:
    replica: '${HOSTNAME}'

rule_files:
  - /etc/prometheus/alerting.yml

alerting:
  alert_relabel_configs:
    - action: labeldrop
      regex: replica
  alertmanagers:
    # Every Alertmanager pod, not the Service (which picks one): each
    # instance gets every alert, the cluster deduplicates the notification.
    - dns_sd_configs:
        - names: ['alertmanager-ready']
          type: A
          port: 9093

scrape_config_files:
  - /etc/prometheus/kubelet-scrape.yml

scrape_configs:
  - job_name: 'message-manager'
    scheme: https
    tls_config:
      ca_file: /run/spire/svid/bundle.pem
      cert_file: /run/spire/svid/svid.pem
      key_file: /run/spire/svid/svid_key.pem
      server_name: message-manager
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: message-manager
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: '3000'
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: 'dlq-service'
    scheme: https
    tls_config:
      ca_file: /run/spire/svid/bundle.pem
      cert_file: /run/spire/svid/svid.pem
      key_file: /run/spire/svid/svid_key.pem
      server_name: dlq-service
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: dlq-service
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: '3000'
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: 'api-gateway'
    scheme: https
    tls_config:
      ca_file: /run/spire/svid/bundle.pem
      cert_file: /run/spire/svid/svid.pem
      key_file: /run/spire/svid/svid_key.pem
      server_name: api-gateway
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: api-gateway
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: '3000'
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: 'audit-logger'
    scheme: https
    tls_config:
      ca_file: /run/spire/svid/bundle.pem
      cert_file: /run/spire/svid/svid.pem
      key_file: /run/spire/svid/svid_key.pem
      server_name: audit-logger
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: audit-logger
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: '3000'
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: 'model-evaluator'
    scheme: https
    tls_config:
      ca_file: /run/spire/svid/bundle.pem
      cert_file: /run/spire/svid/svid.pem
      key_file: /run/spire/svid/svid_key.pem
      server_name: model-evaluator
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: model-evaluator
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: '3000'
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod


  - job_name: 'risk-execution'
    scheme: https
    tls_config:
      ca_file: /run/spire/svid/bundle.pem
      cert_file: /run/spire/svid/svid.pem
      key_file: /run/spire/svid/svid_key.pem
      server_name: risk-execution
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: risk-execution
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: '3000'
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: 'decision-consumer'
    scheme: https
    tls_config:
      ca_file: /run/spire/svid/bundle.pem
      cert_file: /run/spire/svid/svid.pem
      key_file: /run/spire/svid/svid_key.pem
      server_name: decision-consumer
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: decision-consumer
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: '3000'
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: 'financial-scraper'
    scheme: https
    tls_config:
      ca_file: /run/spire/svid/bundle.pem
      cert_file: /run/spire/svid/svid.pem
      key_file: /run/spire/svid/svid_key.pem
      server_name: financial-scraper
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: financial-scraper
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: '3000'
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # The scrape cron (fs_scrape_*) runs only here.
  - job_name: 'financial-scraper-collector'
    scheme: https
    tls_config:
      ca_file: /run/spire/svid/bundle.pem
      cert_file: /run/spire/svid/svid.pem
      key_file: /run/spire/svid/svid_key.pem
      # The SVID carries the ServiceAccount DNS name, shared with financial-scraper.
      server_name: financial-scraper
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: financial-scraper-collector
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: '3000'
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: 'trader-trainer'
    scheme: https
    tls_config:
      ca_file: /run/spire/svid/bundle.pem
      cert_file: /run/spire/svid/svid.pem
      key_file: /run/spire/svid/svid_key.pem
      server_name: trader-trainer
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: trader-trainer
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: '3000'
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  - job_name: 'otel-collector'
    scheme: http
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'blackbox-exporter'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['https://message-manager:3000/ping']
        labels:
          service: message-manager
      - targets: ['https://financial-scraper:3000/ping']
        labels:
          service: financial-scraper
      - targets: ['https://trader-trainer:3000/ping']
        labels:
          service: trader-trainer
      - targets: ['https://api-gateway:3000/ping']
        labels:
          service: api-gateway
      - targets: ['https://audit-logger:3000/ping']
        labels:
          service: audit-logger
      - targets: ['https://dlq-service:3000/ping']
        labels:
          service: dlq-service
      - targets: ['https://model-evaluator:3000/ping']
        labels:
          service: model-evaluator
      - targets: ['https://risk-execution:3000/ping']
        labels:
          service: risk-execution
      - targets: ['https://decision-consumer:3000/ping']
        labels:
          service: decision-consumer
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'backup-metrics'
    # busybox httpd types by extension: Prometheus 3 refuses its octet-stream /metrics.
    metrics_path: /metrics.txt
    static_configs:
      - targets: ['backup-metrics-exporter:9118']
    scrape_interval: 60s

  # Self-monitoring of the alerting path (AlertmanagerNotificationsFailing,
  # PrometheusRuleEvaluationFailures).
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    dns_sd_configs:
      - names: ['alertmanager-ready']
        type: A
        port: 9093

  # ── Infrastructure (issue #601, ADR-0056) ──────────────────────
  # DaemonSet node-exporter (trading-model-node), on the host network.
  - job_name: 'node-exporter'
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_address_InternalIP]
        target_label: __address__
        replacement: '$1:9100'
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node

  - job_name: 'kube-state-metrics'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: kube-state-metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep

  # Database exporters: a sidecar in each pod of the StatefulSet (port
  # `metrics`), so every member is seen, master or replica.
  - job_name: 'mysql'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: mysql
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: 'mongo-dlq'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: mongodb
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: 'mongo-audit'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: mongodb-audit
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: 'redis'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: redis
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: 'redis-sentinel'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: redis-sentinel
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
