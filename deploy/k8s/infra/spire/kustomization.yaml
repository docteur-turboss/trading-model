apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The SPIRE agent and the SPIFFE CSI driver need host access: they are
# deployed apart, in trading-model-node (deploy/k8s/node-agents).
resources:
  - spire-server.yaml

# Hash suffix: a changed server.conf rolls the Deployment. Rendered with
# -expandEnv: ${MYSQL_SPIRE_PASSWORD} (Secret).
configMapGenerator:
  - name: spire-server-config
    files: [server.conf]
    options:
      labels: {app.kubernetes.io/component: spire-server, app.kubernetes.io/part-of: trading-model}
