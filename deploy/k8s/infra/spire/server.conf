server {
  trust_domain = "trading-model.local"
  data_dir = "/run/spire/data"
  log_level = "INFO"
  ca_key_type = "ec-p256"
  ca_ttl = "168h"
  default_x509_svid_ttl = "1h"
  ca_subject = {
    country = ["FR"]
    organization = ["Trading Model"]
    common_name = "trading-model.local"
  }
  socket_path = "/run/spire/server-sockets/api.sock"
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "mysql"
      connection_string = "spire:${MYSQL_SPIRE_PASSWORD}@tcp(mysql-primary:3306)/spire?parseTime=true"
      max_open_conns = 10
      # Server certificate of the MySQL (ADR-0060); host name checked against mysql-primary.
      root_ca_path = "/etc/mysql-tls/ca.crt"
      # Client certificate (Secret mysql-client-root); unused by user spire, which has no REQUIRE.
      client_cert_path = "/etc/mysql-tls/tls.crt"
      client_key_path = "/etc/mysql-tls/tls.key"
    }
  }
  KeyManager "disk" {
    plugin_data {
      keys_path = "/run/spire/data/keys.json"
    }
  }
  NodeAttestor "k8s_psat" {
    plugin_data {
      clusters = {
        "trading-model" = {
          service_account_allow_list = ["trading-model-node:spire-agent"]
        }
      }
    }
  }
  Notifier "k8sbundle" {
    plugin_data {
      namespace = "trading-model-node"
      config_map = "spire-bundle"
    }
  }
}
