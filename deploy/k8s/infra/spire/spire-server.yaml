# SPIRE Server — workload identity issuance (ADR-0011).
# Datastore: MySQL (existing trading-model MySQL, database `spire`).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server
  labels:
    app.kubernetes.io/component: spire-server
    app.kubernetes.io/part-of: trading-model
---
apiVersion: v1
kind: Service
metadata:
  name: spire-server
  labels:
    app.kubernetes.io/component: spire-server
    app.kubernetes.io/part-of: trading-model
spec:
  selector:
    app.kubernetes.io/component: spire-server
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server-config
  labels:
    app.kubernetes.io/component: spire-server
    app.kubernetes.io/part-of: trading-model
data:
  server.conf.tmpl: |
    server {
      trust_domain = "trading-model.local"
      data_dir = "/run/spire/data"
      log_level = "INFO"
      ca_key_type = "ec-p256"
      ca_ttl = "168h"
      default_svid_ttl = "1h"
      ca_subject = {
        country = "FR"
        organization = "Trading Model"
        common_name = "trading-model.local"
      }
      socket_path = "/run/spire/server-sockets/public/api.sock"
    }

    plugins {
      KeyManager "disk" {
        plugin_data {
          keys_path = "/run/spire/data/keys.json"
        }
      }
      DataStore "sql" {
        plugin_data {
          database_type = "mysql"
          connection_string = "root:__SPIRE_DB_PASSWORD__@tcp(mysql-primary:3306)/spire?parseTime=true"
          max_open_conns = 10
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spire-server
  labels:
    app.kubernetes.io/component: spire-server
    app.kubernetes.io/part-of: trading-model
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: spire-server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: spire-server
        app.kubernetes.io/part-of: trading-model
    spec:
      serviceAccountName: spire-server
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: spire-db-init
          image: mysql:8
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for i in $(seq 1 30); do
                if mysqladmin ping -h mysql-primary -u root -p"$MYSQL_ROOT_PASSWORD" 2>/dev/null; then
                  break
                fi
                echo "Waiting for MySQL... ($i/30)"
                sleep 5
              done
              mysql -h mysql-primary -u root -p"$MYSQL_ROOT_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS spire;"
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MYSQL_ROOT_PASSWORD
      containers:
        - name: spire-server
          image: ghcr.io/spiffe/spire-server:1.11.3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              sed "s|__SPIRE_DB_PASSWORD__|${MYSQL_ROOT_PASSWORD}|g" \
                /etc/spire/server.conf.tmpl > /run/spire/server.conf
              exec /opt/spire/bin/spire-server run -config /run/spire/server.conf
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - name: grpc
              containerPort: 8081
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: spire-config
              mountPath: /etc/spire
              readOnly: true
            - name: spire-data
              mountPath: /run/spire/data
            - name: spire-server-sockets
              mountPath: /run/spire/server-sockets
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          livenessProbe:
            exec:
              command: ["/opt/spire/bin/spire-server", "healthcheck", "-registrationUDSPath", "/run/spire/server-sockets/public/api.sock"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/opt/spire/bin/spire-server", "healthcheck", "-registrationUDSPath", "/run/spire/server-sockets/public/api.sock"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
      volumes:
        - name: spire-config
          configMap:
            name: spire-server-config
        - name: spire-data
          emptyDir: {}
        - name: spire-server-sockets
          hostPath:
            path: /run/spire/server-sockets
            type: DirectoryOrCreate
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: spire-server-pdb
  labels:
    app.kubernetes.io/component: spire-server
    app.kubernetes.io/part-of: trading-model
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: spire-server
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spire-server-network-policy
  labels:
    app.kubernetes.io/component: spire-server
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: spire-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading-model
      ports:
        - port: 8081
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading-model
      ports:
        - port: 3306
          protocol: TCP
        - port: 8081
          protocol: TCP