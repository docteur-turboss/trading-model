# SPIRE Server — workload identity issuance (ADR-0011).
# Datastore: SQLite on the server's own PVC (ADR-0062): losing mysql-0 no
# longer stops SVID issuance. keys-sqlite.json holds the CA keys of that
# datastore; keys.json and the MySQL `spire` database belong to the releases
# before ADR-0062 and are left untouched, so a rollback finds them (ADR-0040).
# Agents (namespace trading-model-node, deploy/k8s/node-agents) attest with k8s_psat;
# the server publishes its trust bundle into the `spire-bundle` ConfigMap of
# trading-model-node (k8sbundle notifier) that the agents mount.
# Registration entries are reconciled by the `spire-entries` sidecar
# (ghcr.io/trading-model/spire-tools, deploy/spire/k8s-entries.sh): the
# official SPIRE images ship no shell.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server
  labels:
    app.kubernetes.io/component: spire-server
    app.kubernetes.io/part-of: trading-model
---
apiVersion: v1
kind: Service
metadata:
  name: spire-server
  labels:
    app.kubernetes.io/component: spire-server
    app.kubernetes.io/part-of: trading-model
spec:
  selector:
    app.kubernetes.io/component: spire-server
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server-config
  labels:
    app.kubernetes.io/component: spire-server
    app.kubernetes.io/part-of: trading-model
data:
  # Rendered with -expandEnv (no variable today). The agents and the bundle
  # ConfigMap live in trading-model-node (deploy/k8s/node-agents).
  server.conf: |
    server {
      trust_domain = "trading-model.local"
      data_dir = "/run/spire/data"
      log_level = "INFO"
      ca_key_type = "ec-p256"
      ca_ttl = "168h"
      # 4 h (ADR-0062): renewed at half-life, so a stopped server leaves
      # about 2 h before the first SVID expires.
      default_x509_svid_ttl = "4h"
      ca_subject = {
        country = ["FR"]
        organization = ["Trading Model"]
        common_name = "trading-model.local"
      }
      socket_path = "/run/spire/server-sockets/api.sock"
    }

    plugins {
      DataStore "sql" {
        plugin_data {
          database_type = "sqlite3"
          connection_string = "/run/spire/data/datastore.sqlite3"
        }
      }
      KeyManager "disk" {
        plugin_data {
          keys_path = "/run/spire/data/keys-sqlite.json"
        }
      }
      NodeAttestor "k8s_psat" {
        plugin_data {
          clusters = {
            "trading-model" = {
              service_account_allow_list = ["trading-model-node:spire-agent"]
            }
          }
        }
      }
      Notifier "k8sbundle" {
        plugin_data {
          namespace = "trading-model-node"
          config_map = "spire-bundle"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spire-server
  labels:
    app.kubernetes.io/component: spire-server
    app.kubernetes.io/part-of: trading-model
spec:
  replicas: 1
  # One server per datastore and per server-socket: no surge.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: spire-server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: spire-server
        app.kubernetes.io/part-of: trading-model
    spec:
      serviceAccountName: spire-server
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spire-server
          image: ghcr.io/spiffe/spire-server:1.15.5@sha256:584a9c5cc95b9457f5033e7e4488d603fffe5ec48a80c4dba14b05c5e1c2c384
          imagePullPolicy: IfNotPresent
          # The image entrypoint is `spire-server run`.
          args: ["-config", "/etc/spire/server.conf", "-expandEnv"]
          ports:
            - name: grpc
              containerPort: 8081
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: spire-config
              mountPath: /etc/spire
              readOnly: true
            - name: spire-data
              mountPath: /run/spire/data
            - name: spire-server-sockets
              mountPath: /run/spire/server-sockets
            # SQLite temporary files (large sorts): the root filesystem is read-only.
            - name: spire-server-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            exec:
              command: ["/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/run/spire/server-sockets/api.sock"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/run/spire/server-sockets/api.sock"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
        # Reconciles the registration entries through the shared server socket.
        - name: spire-entries
          image: ghcr.io/trading-model/spire-tools:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/spire-k8s-entries"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SPIRE_CLUSTER_NAME
              value: trading-model
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              # The backup snapshot in /tmp (memory) counts here.
              memory: 128Mi
          volumeMounts:
            - name: spire-server-sockets
              mountPath: /run/spire/server-sockets
            # The backup job snapshots the datastore (sqlite3 .backup) and
            # reads the CA keys through this container: the spire-server image
            # has no shell. Writable: a reader of a WAL-mode SQLite file needs
            # its -shm file and locks.
            - name: spire-data
              mountPath: /run/spire/data
            - name: spire-backup-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: spire-config
          configMap:
            name: spire-server-config
        - name: spire-data
          persistentVolumeClaim:
            claimName: spire-server-data
        - name: spire-server-sockets
          emptyDir: {}
        - name: spire-server-tmp
          emptyDir:
            sizeLimit: 64Mi
        # Datastore snapshot of the backup job, deleted once streamed.
        - name: spire-backup-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spire-server-data
  labels:
    app.kubernetes.io/component: spire-server
    app.kubernetes.io/part-of: trading-model
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# k8s_psat: validate agent tokens (TokenReview) and read their pod and node.
# The bundle ConfigMap write access is granted in trading-model-node (node-agents).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-server
  labels:
    app.kubernetes.io/component: spire-server
    app.kubernetes.io/part-of: trading-model
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-server
  labels:
    app.kubernetes.io/component: spire-server
    app.kubernetes.io/part-of: trading-model
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spire-server
subjects:
  # `default` is rewritten to the overlay namespace by kustomize; any other
  # value would be kept as is.
  - kind: ServiceAccount
    name: spire-server
    namespace: default
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: spire-server-pdb
  labels:
    app.kubernetes.io/component: spire-server
    app.kubernetes.io/part-of: trading-model
spec:
  # A single replica: an eviction must not be blocked forever.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: spire-server
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spire-server-network-policy
  labels:
    app.kubernetes.io/component: spire-server
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: spire-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Agents run on the host network: allow 8081 from anywhere in the cluster.
    - ports:
        - port: 8081
          protocol: TCP
  egress:
    # MySQL: only for a rollback to a release before ADR-0062 (datastore in
    # MySQL). Contract step: drop it, with the spire-server client of
    # mysql-network-policy, in a later release (ADR-0040).
    - to:
        - podSelector: {}
      ports:
        - port: 3306
          protocol: TCP
    # Cluster DNS.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Kubernetes API: TokenReview (k8s_psat) and the spire-bundle ConfigMap.
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
