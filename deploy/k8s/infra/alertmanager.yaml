apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  labels:
    app.kubernetes.io/component: alertmanager
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 9093
      targetPort: 9093
      name: http
  selector:
    app.kubernetes.io/component: alertmanager
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alertmanager
  labels:
    app.kubernetes.io/component: alertmanager
    app.kubernetes.io/part-of: trading-model
spec:
  serviceName: alertmanager
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/component: alertmanager
        app.kubernetes.io/part-of: trading-model
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
          ports:
            - containerPort: 9093
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: storage
              mountPath: /alertmanager
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  labels:
    app.kubernetes.io/component: alertmanager
    app.kubernetes.io/part-of: trading-model
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      # Configure these in your environment
      # slack_api_url: "https://hooks.slack.com/services/CHANGE_ME"
      # pagerduty_url: "https://events.pagerduty.com/v2/enqueue"

    route:
      group_by: ['alertname', 'severity', 'job']
      group_wait: 30s
      group_interval: 2m
      repeat_interval: 4h
      receiver: default-receiver
      routes:
        - match:
            severity: critical
          receiver: critical-receiver
          continue: true
        - match:
            severity: warning
          receiver: warning-receiver

    receivers:
      - name: default-receiver
        # In production, configure a real receiver:
        # slack_configs:
        #   - channel: '#alerts'
        #     send_resolved: true
        #     title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        #     text: |
        #       *Alert*: {{ .CommonAnnotations.summary }}
        #       *Description*: {{ .CommonAnnotations.description }}
        #       *Severity*: {{ .CommonLabels.severity }}
        #       *Service*: {{ .CommonLabels.job }}
        #       {{ range .Alerts }}
        #       - {{ .Annotations.description }}
        #       {{ end }}

      - name: critical-receiver
        # PagerDuty integration (uncomment and configure):
        # pagerduty_configs:
        #   - routing_key: 'CHANGE_ME_PAGERDUTY_ROUTING_KEY'
        #     severity: critical
        #     description: '{{ .CommonAnnotations.description }}'

      - name: warning-receiver
        # Slack integration for warnings (uncomment and configure):
        # slack_configs:
        #   - channel: '#alerts-warning'

    inhibit_rules:
      - source_match:
          severity: critical
        target_match:
          severity: warning
        equal: ['alertname']
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alertmanager-pdb
  labels:
    app.kubernetes.io/component: alertmanager
    app.kubernetes.io/part-of: trading-model
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: alertmanager
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-network-policy
  labels:
    app.kubernetes.io/component: alertmanager
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: alertmanager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading-model
      ports:
        - port: 9093
          protocol: TCP
