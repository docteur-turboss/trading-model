apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  labels:
    app.kubernetes.io/component: alertmanager
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 9093
      targetPort: 9093
      name: http
  selector:
    app.kubernetes.io/component: alertmanager
---
# Pod addresses of the gossip peers (production cluster, ADR-0062). Not-ready
# pods are published so the peers find each other at start.
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-headless
  labels:
    app.kubernetes.io/component: alertmanager
    app.kubernetes.io/part-of: trading-model
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: 9093
      name: http
    - port: 9094
      name: cluster
  selector:
    app.kubernetes.io/component: alertmanager
---
# Ready pods only: Prometheus sends alerts to and scrapes these, so a starting
# or draining pod is no failed target (ServiceDown on up == 0, ADR-0062).
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-ready
  labels:
    app.kubernetes.io/component: alertmanager
    app.kubernetes.io/part-of: trading-model
spec:
  clusterIP: None
  ports:
    - port: 9093
      name: http
  selector:
    app.kubernetes.io/component: alertmanager
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alertmanager
  labels:
    app.kubernetes.io/component: alertmanager
    app.kubernetes.io/part-of: trading-model
spec:
  serviceName: alertmanager
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/component: alertmanager
        app.kubernetes.io/part-of: trading-model
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: prom/alertmanager@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
          ports:
            - containerPort: 9093
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: credentials
              mountPath: /etc/alertmanager-credentials
              readOnly: true
            - name: storage
              mountPath: /alertmanager
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        # Written by deploy.yml from the GitHub environment (see
        # observability/alertmanager.yml for the keys). Optional: Alertmanager
        # starts without it, notifications then fail (and deploy.yml refuses
        # a production deploy without it).
        - name: credentials
          secret:
            secretName: alertmanager-credentials
            optional: true
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alertmanager-pdb
  labels:
    app.kubernetes.io/component: alertmanager
    app.kubernetes.io/part-of: trading-model
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: alertmanager
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-network-policy
  labels:
    app.kubernetes.io/component: alertmanager
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: alertmanager
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Same namespace as the policy, whatever the overlay's namespace.
        - podSelector: {}
      ports:
        - port: 9093
          protocol: TCP
        # Gossip between the production replicas.
        - port: 9094
          protocol: TCP
        - port: 9094
          protocol: UDP
