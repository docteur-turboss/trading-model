apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  labels:
    app.kubernetes.io/component: blackbox-exporter
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 9115
      targetPort: 9115
      name: http
  selector:
    app.kubernetes.io/component: blackbox-exporter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  labels:
    app.kubernetes.io/component: blackbox-exporter
    app.kubernetes.io/part-of: trading-model
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: blackbox-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/component: blackbox-exporter
        app.kubernetes.io/part-of: trading-model
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.25.0
          args:
            - "--config.file=/etc/blackbox-exporter/config.yml"
          ports:
            - containerPort: 9115
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox-exporter
              readOnly: true
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9115
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9115
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: blackbox-exporter-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  labels:
    app.kubernetes.io/component: blackbox-exporter
    app.kubernetes.io/part-of: trading-model
data:
  config.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 10s
        http:
          valid_status_codes: [200]
          method: GET
          fail_if_not_ssl: true
          tls_config:
            insecure_skip_verify: false
      http_2xx_no_tls:
        prober: http
        timeout: 5s
        http:
          valid_status_codes: [200]
          method: GET
      tcp_connect:
        prober: tcp
        timeout: 5s
      icmp:
        prober: icmp
        timeout: 5s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blackbox-exporter-network-policy
  labels:
    app.kubernetes.io/component: blackbox-exporter
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: blackbox-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading-model
      ports:
        - port: 9115
          protocol: TCP
