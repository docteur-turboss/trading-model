apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/component: jaeger
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
    - port: 16686
      targetPort: 16686
      name: ui
  selector:
    app.kubernetes.io/component: jaeger
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaeger-data
  labels:
    app.kubernetes.io/component: jaeger
    app.kubernetes.io/part-of: trading-model
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/component: jaeger
    app.kubernetes.io/part-of: trading-model
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/component: jaeger
        app.kubernetes.io/part-of: trading-model
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.76.0@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 4317
              name: otlp-grpc
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            # Traces survive a restart (Badger on the PVC below); 72 h keeps
            # the volume bounded.
            - name: SPAN_STORAGE_TYPE
              value: badger
            - name: BADGER_EPHEMERAL
              value: "false"
            - name: BADGER_DIRECTORY_VALUE
              value: /badger/data
            - name: BADGER_DIRECTORY_KEY
              value: /badger/key
            - name: BADGER_SPAN_STORE_TTL
              value: 72h
            # Badger opens every table at start: 1 Gi was OOMKilled (#1278).
            # The Go GC works under this soft limit before the kernel kills.
            - name: GOMEMLIMIT
              value: 1536MiB
          volumeMounts:
            - name: badger
              mountPath: /badger
          resources:
            requests:
              cpu: 100m
              memory: 1536Mi
            limits:
              cpu: 500m
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /
              port: 16686
            periodSeconds: 10
            # Badger opens 3+ GiB on the slow staging disk in over 5 min (#2329).
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 10
            periodSeconds: 15
            # 1 s default is too short on a saturated disk (#1773).
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: badger
          persistentVolumeClaim:
            claimName: jaeger-data
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger-network-policy
  labels:
    app.kubernetes.io/component: jaeger
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: jaeger
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Same namespace as the policy, whatever the overlay's namespace.
        - podSelector: {}
      ports:
        - port: 4317
          protocol: TCP
        - port: 16686
          protocol: TCP
