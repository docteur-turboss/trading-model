apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app.kubernetes.io/component: prometheus
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/component: prometheus
        app.kubernetes.io/part-of: trading-model
    spec:
      serviceAccountName: prometheus
      terminationGracePeriodSeconds: 120
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=30d"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
            - name: svid
              mountPath: /run/spire/svid
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.6.0
          imagePullPolicy: IfNotPresent
          args:
            - -socketPath=/run/spire/agent-sockets/public/api.sock
            - -certDir=/run/spire/svid
            - -svidFileName=svid.pem
            - -svidKeyFileName=svid_key.pem
            - -svidBundleFileName=bundle.pem
            - -renewSignal=SIGHUP
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/agent-sockets
            - name: svid
              mountPath: /run/spire/svid
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/agent-sockets
            type: DirectoryOrCreate
        - name: svid
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: prometheus-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerting.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    scrape_configs:
      - job_name: 'message-manager'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
        static_configs:
          - targets: ['message-manager:3000']

      - job_name: 'discovery-server'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
        static_configs:
          - targets: ['discovery-server:3000']

      - job_name: 'dlq-service'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
        static_configs:
          - targets: ['dlq-service:3000']

      - job_name: 'api-gateway'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
        static_configs:
          - targets: ['api-gateway:3000']

      - job_name: 'audit-logger'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
        static_configs:
          - targets: ['audit-logger:3000']

      - job_name: 'financial-scraper'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
        static_configs:
          - targets: ['financial-scraper:3000']

      - job_name: 'trader-trainer'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
        static_configs:
          - targets: ['trader-trainer:3000']

      - job_name: 'otel-collector'
        scheme: http
        static_configs:
          - targets: ['otel-collector:8888']

      - job_name: 'blackbox-exporter'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - https://api-gateway:3000/ping
            labels:
              check: 'gateway-health'
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115
