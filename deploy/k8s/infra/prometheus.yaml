apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
---
# Pod discovery of the scrape jobs: read-only, own namespace only (issue #559).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
---
# Kubelet metrics (cAdvisor containers, PVC usage) and the node list of the
# node-exporter and kubelet jobs (issue #601, ADR-0056). `nodes/metrics` lets
# the kubelet serve /metrics only, unlike `nodes/proxy` (exec in any pod).
# Cluster-scope RBAC: applied by an admin with scripts/deploy-identity.sh
# cluster (ADR-0041), never by the deploy identities.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-nodes
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-nodes
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-nodes
subjects:
  # `default` is rewritten to the overlay namespace by kustomize; any other
  # value would be kept as is.
  - kind: ServiceAccount
    name: prometheus
    namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app.kubernetes.io/component: prometheus
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/component: prometheus
        app.kubernetes.io/part-of: trading-model
    spec:
      serviceAccountName: prometheus
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus@sha256:378f4e03703557d1c6419e6caccf922f96e6d88a530f7431d66a4c4f4b1000fe
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # Wait for the SVID files written by the spiffe-helper sidecar: a scrape pool
          # whose tls_config file is missing at startup is never created again, so every
          # mTLS job would silently stay unscraped (issue #425).
          command: ["/bin/sh", "-c"]
          args:
            - |
              for f in bundle.pem svid.pem svid_key.pem; do
                until [ -s "/run/spire/svid/$f" ]; do echo "waiting for /run/spire/svid/$f"; sleep 2; done
              done
              # The ConfigMap is not hash-suffixed and Prometheus does not reread a changed
              # config by itself: SIGHUP it (no lifecycle API, issue #850), or an upgrade keeps scraping the old targets.
              confsum() { cat /etc/prometheus/* 2>/dev/null | cksum; }
              (last="$(confsum)"; while sleep 20; do
                cur="$(confsum)"
                if [ "$cur" != "$last" ] && kill -HUP 1; then last="$cur"; fi
              done) &
              exec /bin/prometheus \
                --config.file=/etc/prometheus/prometheus.yml \
                --storage.tsdb.path=/prometheus \
                --storage.tsdb.retention.time=30d \
                --enable-feature=expand-external-labels
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
            - name: svid
              mountPath: /run/spire/svid
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.10.1@sha256:2402c34d83794aa24c127baa46e9732d653463f3bfcd39cda1313003ed60f8c9
          imagePullPolicy: IfNotPresent
          args:
            - -config
            - /etc/spiffe-helper/helper.conf
          volumeMounts:
            - name: spiffe-helper-config
              mountPath: /etc/spiffe-helper
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/agent-sockets
            - name: svid
              mountPath: /run/spire/svid
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: spiffe-helper-config
          configMap:
            name: spiffe-helper-config
        - name: config
          configMap:
            name: prometheus-config
        # Workload API socket from the SPIFFE CSI driver (node-agents): the
        # restricted Pod Security profile forbids a hostPath.
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: svid
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: prometheus-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      # Pod name (expand-external-labels): the two production replicas differ by
      # it. Dropped before sending (alert_relabel_configs), so both replicas'
      # copy of an alert is one alert for Alertmanager (issue #809, ADR-0062).
      external_labels:
        replica: '${HOSTNAME}'

    rule_files:
      - /etc/prometheus/alerting.yml

    alerting:
      alert_relabel_configs:
        - action: labeldrop
          regex: replica
      alertmanagers:
        # Every Alertmanager pod, not the Service (which picks one): each
        # instance gets every alert, the cluster deduplicates the notification.
        - dns_sd_configs:
            - names: ['alertmanager-ready']
              type: A
              port: 9093

    scrape_config_files:
      - /etc/prometheus/kubelet-scrape.yml

    scrape_configs:
      - job_name: 'message-manager'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
          server_name: message-manager
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: message-manager
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '3000'
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'discovery-server'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
          server_name: discovery-server
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: discovery-server
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '3000'
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'dlq-service'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
          server_name: dlq-service
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: dlq-service
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '3000'
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'api-gateway'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
          server_name: api-gateway
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: api-gateway
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '3000'
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'audit-logger'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
          server_name: audit-logger
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: audit-logger
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '3000'
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'model-evaluator'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
          server_name: model-evaluator
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: model-evaluator
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '3000'
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'financial-scraper'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
          server_name: financial-scraper
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: financial-scraper
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '3000'
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # The scrape cron (fs_events_published_total, fs_scrape_*) runs only here.
      - job_name: 'financial-scraper-collector'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
          # The SVID carries the ServiceAccount DNS name, shared with financial-scraper.
          server_name: financial-scraper
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: financial-scraper-collector
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '3000'
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'trader-trainer'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
          server_name: trader-trainer
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: trader-trainer
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '3000'
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'loki'
        static_configs:
          - targets: ['loki:3100']

      - job_name: 'otel-collector'
        scheme: http
        static_configs:
          - targets: ['otel-collector:8888']

      - job_name: 'blackbox-exporter'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets: ['https://discovery-server:3000/ping']
            labels:
              service: discovery-server
          - targets: ['https://message-manager:3000/ping']
            labels:
              service: message-manager
          - targets: ['https://financial-scraper:3000/ping']
            labels:
              service: financial-scraper
          - targets: ['https://trader-trainer:3000/ping']
            labels:
              service: trader-trainer
          - targets: ['https://api-gateway:3000/ping']
            labels:
              service: api-gateway
          - targets: ['https://audit-logger:3000/ping']
            labels:
              service: audit-logger
          - targets: ['https://dlq-service:3000/ping']
            labels:
              service: dlq-service
          - targets: ['https://model-evaluator:3000/ping']
            labels:
              service: model-evaluator
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115

      - job_name: 'backup-metrics'
        static_configs:
          - targets: ['backup-metrics-exporter:9118']
        scrape_interval: 60s

      # Self-monitoring of the alerting path (AlertmanagerNotificationsFailing,
      # PrometheusRuleEvaluationFailures).
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'alertmanager'
        dns_sd_configs:
          - names: ['alertmanager-ready']
            type: A
            port: 9093

      # ── Infrastructure (issue #601, ADR-0056) ──────────────────────
      # DaemonSet node-exporter (trading-model-node), on the host network.
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: '$1:9100'
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node

      - job_name: 'kube-state-metrics'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: kube-state-metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep

      # Database exporters: a sidecar in each pod of the StatefulSet (port
      # `metrics`), so every member is seen, master or replica.
      - job_name: 'mysql'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: mysql
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'mongo-dlq'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: mongodb
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'mongo-audit'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: mongodb-audit
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'redis'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: redis
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'redis-sentinel'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: redis-sentinel
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

  kubelet-scrape.yml: |
    scrape_configs:
      # Kubelet of every node, with this pod's ServiceAccount token and
      # nodes/metrics (ClusterRole prometheus-nodes). The serving certificate is
      # verified against the cluster CA: the nodes need serverTLSBootstrap and
      # approved CSRs (docs/deployment/KUBERNETES.md). Staging overlays replace
      # this key to skip verification (kubelet certificates self-signed on kind).
      # Only the series the alerts and dashboards read are kept.
      - job_name: 'kubelet'
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'kubelet_volume_stats_(used|capacity|available)_bytes'
            action: keep

      - job_name: 'cadvisor'
        scheme: https
        metrics_path: /metrics/cadvisor
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'container_(cpu_usage_seconds_total|memory_working_set_bytes|spec_memory_limit_bytes|oom_events_total)'
            action: keep

  alerting.yml: |
    groups:
      - name: trading-model
        interval: 30s
        rules:

          # ── Burn Rate Alerts (SLO-based) ─────────────────────────────
          - alert: SLOAvailabilityFastBurn
            expr: slo:sli_error:ratio_rate1h > 0.0144 and slo:sli_error:ratio_rate5m > 0.0144
            for: 2m
            labels:
              severity: critical
              slo: availability
            annotations:
              summary: 'Availability SLO fast burn rate exceeded'
              description: '5xx ratio > 1.44% over both 1h and 5m (14.4x the 0.1% budget of the 99.9% SLO). Probes (/ping, /health/ready, /metrics) are not counted.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-latency-and-errors.md#higherrorrate'

          - alert: SLOAvailabilitySlowBurn
            expr: slo:sli_error:ratio_rate6h > 0.006 and slo:sli_error:ratio_rate30m > 0.006
            for: 15m
            labels:
              severity: warning
              slo: availability
            annotations:
              summary: 'Availability SLO slow burn rate exceeded'
              description: '5xx ratio > 0.6% over both 6h and 30m (6x the 0.1% budget of the 99.9% SLO). Probes are not counted.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-latency-and-errors.md#higherrorrate'

          - alert: SLOLatencyFastBurn
            expr: histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[5m]))) > 5
            for: 2m
            labels:
              severity: critical
              slo: latency
            annotations:
              summary: 'Latency SLO fast burn rate exceeded'
              description: 'P95 latency > 5s over 5m — exceeding 2s SLO target.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-latency-and-errors.md#slolatencyfastburn'

          - alert: SLOLatencySlowBurn
            expr: histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[1h]))) > 3
            for: 10m
            labels:
              severity: warning
              slo: latency
            annotations:
              summary: 'Latency SLO slow burn rate exceeded'
              description: 'P95 latency > 3s over 1h — approaching 2s SLO target breach.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-latency-and-errors.md#slolatencyfastburn'

          - alert: SLOErrorRateFastBurn
            expr: slo:sli_error:ratio_rate1h > 0.144 and slo:sli_error:ratio_rate5m > 0.144
            for: 2m
            labels:
              severity: critical
              slo: error_rate
            annotations:
              summary: 'Error rate SLO fast burn rate exceeded'
              description: '5xx ratio > 14.4% over both 1h and 5m (14.4x the 1% budget of the error rate SLO). Probes are not counted.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-latency-and-errors.md#higherrorrate'

          - alert: SLOErrorRateSlowBurn
            expr: slo:sli_error:ratio_rate6h > 0.06 and slo:sli_error:ratio_rate30m > 0.06
            for: 15m
            labels:
              severity: warning
              slo: error_rate
            annotations:
              summary: 'Error rate SLO slow burn rate exceeded'
              description: '5xx ratio > 6% over both 6h and 30m (6x the 1% budget of the error rate SLO). Probes are not counted.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-latency-and-errors.md#higherrorrate'

          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: '{{ $labels.job }} is down'
              description: 'Service {{ $labels.job }} has been unreachable for over 1 minute.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-service-down.md'

          - alert: ServiceTargetsMissing
            expr: absent(up{job="message-manager"}) or absent(up{job="discovery-server"}) or absent(up{job="dlq-service"}) or absent(up{job="api-gateway"}) or absent(up{job="audit-logger"}) or absent(up{job="financial-scraper"}) or absent(up{job="trader-trainer"})
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: '{{ $labels.job }} has no scrape target'
              description: 'Prometheus has had no up series for {{ $labels.job }} for 5 minutes: no pod or container is registered (0 replicas, Pending pods, broken scrape config). ServiceDown cannot fire without a series.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-service-down.md#no-scrape-target'

          - alert: HighErrorRate
            expr: sum by (job) (rate(http_requests_total{status=~"5.."}[5m])) / sum by (job) (rate(http_requests_total[5m])) > 0.05
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: 'High error rate on {{ $labels.job }}'
              description: 'Error rate is {{ $value | humanizePercentage }} for the last 5 minutes.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-latency-and-errors.md#higherrorrate'

          - alert: CertificateExpiry
            expr: probe_ssl_earliest_cert_expiry - time() < 3600
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'SVID close to expiry on {{ $labels.service }}'
              description: 'The served X.509-SVID expires in less than 1 hour (TTL 4h, renewed at half-life): SPIRE rotation has been stalled for over 1 hour.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-certificate-expiry.md'

          - alert: CircuitBreakerOpen
            expr: address_manager_circuit_breaker_state == 1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: 'Circuit breaker open on {{ $labels.job }}'
              description: 'The circuit breaker of {{ $labels.job }} for instance {{ $labels.instanceId }} is in OPEN state: calls to that instance are refused.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-circuit-breaker-open.md'

          - alert: HttpCircuitBreakerRejecting
            expr: sum by (job, target, kind) (rate(http_circuit_breaker_rejections_total[5m])) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: '{{ $labels.job }} refuses calls to {{ $labels.target }}'
              description: '{{ $labels.job }} has had its outbound calls to {{ $labels.kind }} {{ $labels.target }} refused by the open HTTP circuit breaker for 10 minutes.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-circuit-breaker-open.md#symptom'

          - alert: DLQSizeGrowing
            expr: sum by (job) (rate(dlq_entries_added_total[15m])) > sum by (job) (rate(dlq_entries_replayed_total[15m]))
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'DLQ is growing faster than it is drained'
              description: 'Messages are being added to the DLQ faster than they are replayed.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-dlq-backlog.md'

          - alert: InstanceCountLow
            expr: max by (service) (discovery_registered_instances_per_service) < 2 and max_over_time(min_over_time(max by (service) (discovery_registered_instances_per_service)[15m:1m])[1d:5m]) >= 2
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: 'Low instance count for service {{ $labels.service }}'
              description: 'Service {{ $labels.service }} had 2+ instances for 15 min in the last day and now has fewer than 2: redundancy is lost (single-replica environments never fire, nor does the surge pod of a rolling update).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-discovery.md#instancecountlow'

          - alert: HighMemoryUsage
            expr: nodejs_heap_size_used_bytes / nodejs_heap_size_limit_bytes > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'High memory usage on {{ $labels.job }}'
              description: 'Heap usage is {{ $value | humanizePercentage }} of the V8 heap limit: out of memory is close.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-service-down.md#1-oomkilled-out-of-memory'

          - alert: HeartbeatStopped
            expr: sum by (service) (rate(discovery_heartbeats_total[5m])) == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: 'Heartbeats have stopped for {{ $labels.service }}'
              description: 'discovery-server received no heartbeat from {{ $labels.service }} in the last 5 minutes.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-discovery.md#heartbeatstopped'

          - alert: BackupFailed
            expr: time() - backup_last_success_timestamp > 90000
            for: 1h
            labels:
              severity: critical
            annotations:
              summary: 'Database backup failed or too old'
              description: 'Last successful backup was more than 25 hours ago — check backup job.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          - alert: BackupNotRunning
            expr: backup_last_success_timestamp == 0
            for: 24h
            labels:
              severity: warning
            annotations:
              summary: 'Database backup has never succeeded'
              description: 'No successful backup has ever been recorded for {{ $labels.component }}.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          - alert: BackupJobStale
            expr: 'time() - backup_last_run_timestamp > 93600'
            for: 1h
            labels:
              severity: critical
            annotations:
              summary: 'Backup job has not run for more than 26 hours'
              description: 'The db-backup CronJob stopped running (suspended, failing to start or stuck): no new backup is being taken.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          # Point-in-time archives (ADR-0031): hourly, so 2 h = two missed runs.
          - alert: BackupIncrementalStale
            expr: 'time() - backup_last_success_timestamp{run="incremental"} > 7200'
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'Point-in-time archive stale: {{ $labels.component }}'
              description: 'No {{ $labels.component }} archive for more than 2 hours (db-backup-incremental runs hourly): the 1 h RPO is no longer met.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          # Not on compose: scripts/backup.sh reports backup_pitr_supported 0 (no
          # incremental job, standalone mongod).
          - alert: BackupIncrementalMissing
            expr: '(absent(backup_last_success_timestamp{component="mysql-binlog",run="incremental"}) or absent(backup_last_success_timestamp{component="mongodb-oplog",run="incremental"}) or absent(backup_last_success_timestamp{component="mongodb-audit-oplog",run="incremental"})) unless on() (backup_pitr_supported == 0)'
            for: 2h
            labels:
              severity: critical
            annotations:
              summary: 'A binlog or oplog is no longer archived: {{ $labels.component }}'
              description: 'db-backup-incremental reported nothing for {{ $labels.component }} (job never ran, component removed, or backup-metrics-exporter down): no point-in-time recovery.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          # A run of a flux failed (S3, pod, oplog read). The next run retries it,
          # so the alert resolves by itself once the archive is written.
          - alert: BackupIncrementalFailed
            expr: 'backup_last_status{run="incremental",component=~"mysql-binlog|mongodb-oplog|mongodb-audit-oplog"} == 0'
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Point-in-time archive run failed: {{ $labels.component }}'
              description: 'The last db-backup-incremental run could not archive {{ $labels.component }}: see the job logs. A gap (binlog purged, oplog overwritten) also raises BackupPitrGap.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          # The chain lost entries after the newest daily dump: computed from the
          # archive names at every run, it stays at 1 until the next daily dump,
          # even though the runs after the break succeed again.
          - alert: BackupPitrGap
            expr: 'backup_pitr_gap{run="incremental"} == 1'
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'Point-in-time recovery broken: {{ $labels.component }}'
              description: 'The {{ $labels.component }} archives have a gap after the newest daily dump (binlog purged or oplog overwritten before being archived): no restore --until past the gap until the next daily dump succeeds. Take a dump now (BACKUP_DR.md, "Point-in-time chain broken").'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#point-in-time-chain-broken'

          - alert: BackupMetricsAbsent
            expr: 'absent(backup_last_run_timestamp{run=""})'
            for: 26h
            labels:
              severity: critical
            annotations:
              summary: 'No backup has ever reported'
              description: 'Prometheus has no metric of the daily backup job: db-backup never ran or backup-metrics-exporter is down (the series of db-backup-incremental do not count).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          - alert: BackupComponentMissing
            expr: 'absent(backup_last_success_timestamp{component="mongodb"}) or absent(backup_last_success_timestamp{component="mongodb-audit"}) or absent(backup_last_success_timestamp{component="mysql"}) or absent(backup_last_success_timestamp{component="spire"}) or absent(backup_last_success_timestamp{component="checkpoints"})'
            for: 26h
            labels:
              severity: critical
            annotations:
              summary: 'A database is no longer backed up: {{ $labels.component }}'
              description: 'The last backup runs reported nothing for {{ $labels.component }} (component removed from the job, or skipped).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          - alert: BackupUnencrypted
            expr: backup_last_status{component="encryption"} == 0 or backup_encrypted == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'Backups are not encrypted'
              description: 'No age recipient configured (BACKUP_AGE_RECIPIENTS; ConfigMap backup-encryption in K8s), or fewer distinct recipients than BACKUP_MIN_RECIPIENTS (2 in production): backups are refused or written in clear.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          - alert: BackupOffsiteCopyFailed
            expr: backup_last_status{component="offsite"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'Off-site backup copy failed'
              description: 'The encrypted backups were not copied off-site: check the S3 credentials (Secret trading-model-backup-s3 in K8s).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          - alert: BackupVolumeFilling
            expr: 'max by (job) (backup_volume_used_ratio) > 0.8'
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: 'backup-data volume is over 80% full'
              description: 'The backup-data PVC (100Gi) is filling up: dumps grow with the market data. Check the retention (RETENTION_DAYS) or grow the volume before a night of backups fails.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          # Retention job (ADR-0051): daily at 03:30 UTC, so 36 h = one missed run.
          - alert: RetentionFailed
            expr: 'retention_last_status == 0'
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'MySQL retention job failed'
              description: 'The last db-retention run failed on at least one table: market data and signals older than the retention period are not being purged.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#retention-job'

          - alert: RetentionStale
            expr: 'time() - retention_last_success_timestamp > 129600'
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: 'MySQL retention job has not succeeded for 36 hours'
              description: 'No successful db-retention run for more than 36 hours (it runs daily): suspended, failing to start or failing.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#retention-job'

          # -- Authentication failures and ACL denials -------------------

          - alert: ApiAuthFailuresHigh
            expr: 'sum by (job) (rate(gw_auth_failures_total[5m])) > 0.1'
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'API key authentication failures above 6 per minute'
              description: 'The gateway rejected more than 6 requests per minute for 5 minutes (bad or missing API key): key brute force, a leaked or rotated key still in use, or a misconfigured client (runbook-auth-failures).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-auth-failures.md#apiauthfailureshigh'

          - alert: MtlsAclDenials
            expr: 'sum by (job) (increase(http_mtls_denials_total[5m])) > 0'
            labels:
              severity: warning
            annotations:
              summary: 'A service denied an mTLS or ACL request'
              description: 'A service refused a caller (no client certificate, unresolved identity, or caller missing from the ACL). Service-to-service traffic should never be denied: probe from inside the network, or an ACL out of step with a new route (runbook-auth-failures).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-auth-failures.md#mtlsacldenials'

          # ── Audit trail integrity (ADR-0027) ──────────────────────────

          - alert: AuditChainBroken
            expr: 'max by (job) (audit_chain_broken) == 1'
            labels:
              severity: critical
            annotations:
              summary: 'Audit trail integrity check failed'
              description: 'The audit chain verification found a fault (event missing, changed or removed, or a chain that no longer matches its anchors). Run chain-cli report on an audit-logger pod; acknowledge a loss only for an explained restore (runbook-audit-chain-broken).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-audit-chain-broken.md#auditchainbroken'

          - alert: AuditChainVerificationStale
            expr: 'time() - max by (job) (audit_chain_last_verification_timestamp) > 2700'
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: 'Audit trail no longer verified'
              description: 'audit-logger has not completed an audit chain verification for more than 45 minutes (MongoDB unreachable, or the cycle fails): a broken chain would go unnoticed (runbook-audit-chain-broken).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-audit-chain-broken.md#auditchainverificationstale'

          - alert: AuditChainAnchoringStale
            expr: 'max by (job) (audit_chain_anchoring_enabled) == 1 and time() - max by (job) (audit_chain_last_anchor_timestamp) > 2700'
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: 'Audit trail no longer anchored'
              description: 'audit-logger has not anchored the audit chain head for more than 45 minutes: check the anchor bucket credentials (audit-anchor-s3) and its logs (runbook-audit-chain-broken).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-audit-chain-broken.md#auditchainanchoringstale'

          - alert: AuditChainNotAnchored
            expr: 'max by (job) (audit_chain_anchoring_enabled) == 0'
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: 'Audit trail verified but not anchored'
              description: 'AUDIT_ANCHOR_BUCKET is not set: a rewrite of the whole audit chain by someone with database access would go unnoticed (ADR-0027).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-audit-chain-broken.md#auditchainnotanchored'
          # ── Application SLI Alerts ────────────────────────────────────

          - alert: MessageDeliveryLowSuccessRate
            expr: (sum by (job) (rate(mm_messages_published_total[5m])) or sum by (job) (rate(mm_messages_dlq_total[5m])) * 0) / ((sum by (job) (rate(mm_messages_published_total[5m])) or sum by (job) (rate(mm_messages_dlq_total[5m])) * 0) + (sum by (job) (rate(mm_messages_dlq_total[5m])) or sum by (job) (rate(mm_messages_published_total[5m])) * 0)) < 0.995
            for: 5m
            labels:
              severity: critical
              slo: message_delivery
            annotations:
              summary: 'Message delivery success rate below 99.5%'
              description: 'Message-manager delivery rate is {{ $value | humanizePercentage }} over 5m.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-message-bus-outage.md'

          - alert: MessagesDeadLettered
            expr: sum by (topic) (increase(mm_messages_dlq_total[1h])) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'Messages dead-lettered on {{ $labels.topic }}'
              description: 'message-manager gave up delivering {{ $value | humanize }} message(s) on {{ $labels.topic }} in the last hour. They are in dlq-service (GET /dlq) to inspect and replay.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-message-bus-outage.md#4-dead-letters-stuck-refused-or-lost'

          - alert: DeadLettersRejected
            expr: sum(increase(mm_dlq_rejected_total[1h])) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'dlq-service refused dead letters'
              description: 'dlq-service refused {{ $value | humanize }} dead letter(s) in the last hour (invalid or too large): their journal entries stay pending until trimmed after 24 h (a lost message, JournalEntriesTrimmed): fix the cause within 24 h, see the runbook and the message-manager logs.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-message-bus-outage.md#4-dead-letters-stuck-refused-or-lost'

          # A DLQ delete or replay was done but message-manager refused its audit
          # event: the audit trail misses who did it (ADR-0059). The API answered 502.
          - alert: DlqAuditEventLost
            expr: sum by (event) (increase(dlq_audit_publish_failures_total{event=~"dlq.entries.deleted|dlq.replay.completed"}[1h])) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: 'DLQ action missing from the audit trail: {{ $labels.event }}'
              description: 'message-manager refused {{ $value | humanize }} {{ $labels.event }} event(s) in the last hour: the deletion or replay was done but is not in the audit chain. The dlq-service error log "DLQ event not published" holds the actor and the ids.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-dlq-backlog.md#dlqauditeventlost'

          # A topic nobody subscribes to drops its messages. Expected for a few
          # seconds at a cold start (publishers up before subscribers), so only a
          # drop lasting 10 minutes alerts.
          - alert: MessagesUnrouted
            expr: sum by (topic) (rate(mm_messages_unrouted_total[5m])) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: 'Messages dropped on {{ $labels.topic }}: no subscriber'
              description: 'message-manager drops the messages published on {{ $labels.topic }}: no instance subscribes to it. audit-logger subscribes to the audit, training and dlq topics: check that the subscribers are up and renew their subscriptions, and that message-manager reaches Redis.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-message-bus-outage.md#3-no-subscriber-on-a-topic'

          - alert: JournalEntriesTrimmed
            expr: sum by (topic, service) (increase(mm_journal_trimmed_pending_total[15m])) > 0 or sum by (topic, service) (mm_journal_trimmed_pending_total unless mm_journal_trimmed_pending_total offset 15m) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: 'Messages lost on {{ $labels.topic }} for {{ $labels.service }}: journal trimmed before delivery'
              description: '{{ $labels.service }} stayed unreachable for more than 24 h: message-manager trimmed undelivered {{ $labels.topic }} entries from its journal and they are gone. Check the service, then republish what it missed from the source.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-message-bus-outage.md#6-journal-entries-trimmed-before-delivery'

          - alert: JournalBacklogOld
            expr: max by (topic, service) (mm_journal_oldest_pending_age_seconds) > 900
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: 'Journal backlog on {{ $labels.topic }} for {{ $labels.service }}: oldest entry waiting for more than 15 min'
              description: '{{ $labels.service }} has not acknowledged a {{ $labels.topic }} entry for more than 15 min (messages are lost after 24 h, JournalEntriesTrimmed). Check that the service is up and answers its callback, and the message-manager delivery logs.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-message-bus-outage.md#7-journal-backlog-of-a-subscriber'

          - alert: DLQDrainRateLow
            expr: sum by (job) (rate(dlq_entries_replayed_total[15m])) / sum by (job) (rate(dlq_entries_added_total[15m])) < 0.8
            for: 15m
            labels:
              severity: warning
              slo: dlq_drain
            annotations:
              summary: 'DLQ drain rate is critically low'
              description: 'DLQ replay/add ratio is {{ $value | humanizePercentage }} — queue is growing.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-dlq-backlog.md'

          - alert: TrainingCompletionRateLow
            expr: (sum by (job) (rate(tt_training_sessions_total{result="success"}[3h])) or sum by (job) (rate(tt_training_sessions_total[3h])) * 0) / sum by (job) (rate(tt_training_sessions_total[3h])) < 0.95
            for: 1h
            labels:
              severity: warning
              slo: training_completion
            annotations:
              summary: 'Training completion rate below 95%'
              description: 'Trainer completion rate is {{ $value | humanizePercentage }} over 3h.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-trainer.md#trainingcompletionratelow'

          - alert: TrainingCompletionRateCritical
            expr: (sum by (job) (rate(tt_training_sessions_total{result="success"}[3h])) or sum by (job) (rate(tt_training_sessions_total[3h])) * 0) / sum by (job) (rate(tt_training_sessions_total[3h])) < 0.5
            for: 1h
            labels:
              severity: critical
              slo: training_completion
            annotations:
              summary: 'Training completion rate below 50%'
              description: 'Trainer completion rate is {{ $value | humanizePercentage }} over 3h: most or all training sessions fail. Inhibits TrainingCompletionRateLow.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-trainer.md#trainingcompletionratelow'

          - alert: TrainerEventLoopBlocked
            expr: histogram_quantile(0.99, sum by (job, le) (rate(tt_genome_evaluation_seconds_bucket[15m]))) > 5
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: 'trader-trainer event loop blocked for several seconds'
              description: 'p99 genome evaluation is {{ $value | humanizeDuration }} over 15m (threshold 5 s). Heartbeats (15 s) and deliveries (10 s timeout) fail meanwhile.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-trainer.md#trainereventloopblocked'

          - alert: TrainerEventLoopLagHigh
            expr: max by (job) (nodejs_eventloop_lag_max_seconds{job="trader-trainer"}) > 10
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'trader-trainer event loop lag above 10 s'
              description: 'Trainer event loop lag reached {{ $value | humanizeDuration }} (threshold 10 s) outside or inside GA evaluation. Heartbeats (15 s) and deliveries (10 s timeout) fail meanwhile.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-trainer.md#trainereventlooplaghigh'

          # ADR-0058: only the holder of the trainer Lease trains; the other pod of a
          # rollout reports 0, so max() is 0 when no pod holds it.
          - alert: TrainerNoLeader
            expr: max(tt_training_leader) < 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'No trader-trainer pod holds the Lease'
              description: 'No pod has trained for 5 minutes: no trainer pod holds the Lease trader-trainer (API server unreachable, RBAC, NetworkPolicy). The read routes still answer the last stored models; no new model is produced.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-trainer.md#trainernoleader'

          - alert: TrainerNoLeaderProlonged
            expr: max(tt_training_leader) < 1
            for: 30m
            labels:
              severity: critical
            annotations:
              summary: 'No trader-trainer pod has held the Lease for 30 minutes'
              description: 'No pod has trained for 30 minutes, far beyond a rollout handover (end of a generation plus a few seconds, ADR-0058): no trainer pod holds the Lease trader-trainer. No new model is produced.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-trainer.md#trainernoleader'

          - alert: MarketDataStale
            expr: sum(increase(fs_candles_persisted_total[15m])) == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'No market data persisted for 15 minutes'
              description: 'financial-scraper persisted no candle in 15 minutes: collection is stopped (no symbol tracked, scheduler disabled everywhere, Binance or MySQL failing) while the service may still report healthy.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-market-data-stale.md'

          # ADR-0057: only the holder of the collector Lease collects. The HTTP
          # replicas report 0, so max() is 0 when no pod holds it.
          - alert: CollectorNoLeader
            expr: max(fs_collector_leader) < 1
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: 'No financial-scraper collector holds the Lease'
              description: 'No pod has collected market data for 2 minutes: no collector pod holds the Lease financial-scraper-collector (API server unreachable, RBAC, collector down or collection disabled). Trades, tickers and order books of the window are lost.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-market-data-stale.md#collectornoleader'

          - alert: ScrapeCyclesFailing
            expr: sum(rate(fs_scrape_cycles_total{result="error"}[15m])) / sum(rate(fs_scrape_cycles_total[15m])) > 0.5
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: 'Most scrape cycles fail'
              description: 'More than half of the financial-scraper cycles failed over 15 minutes ({{ $value | humanizePercentage }}).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-market-data-stale.md'

          # Issue #598: one symbol without candles while the others have them leaves
          # the cycle "success" and the global sums above non-zero, whatever the
          # cause: symbol rejected, klines endpoint failing or candles refused by the
          # normalizer (#618: only that part is dropped, the symbol counts "scraped").
          # The series are born at 0 for every tracked symbol (WorkerOrchestrator).
          - alert: SymbolMarketDataStale
            expr: sum by (symbol) (increase(fs_candles_persisted_total[15m])) == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'No candle persisted for {{ $labels.symbol }} for 15 minutes'
              description: 'financial-scraper persisted no {{ $labels.symbol }} candle in 15 minutes, while the other symbols may still flow. The error is in the "Symbol scrape failed", "Market data part fetch failed" or "Market data part normalization failed" logs of that symbol.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-market-data-stale.md#symbolmarketdatastale'

          # ADR-0026: Binance stays the source while its public API answers from
          # here. A 451 is the geo-block that reopens the decision. The series is
          # born at the first 451; a cycle sends several requests per symbol, so
          # the counter grows within the cycle and the next ones.
          - alert: BinanceRestrictedLocation
            expr: sum(increase(fs_binance_requests_total{status="451"}[15m])) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: 'Binance refuses the scraper location (HTTP 451)'
              description: 'Binance answered 451 (restricted location) {{ $value | humanize }} times in 15 minutes: market data collection is blocked. Re-examine ADR-0026 and switch BINANCE_BASE_URL to the next fallback (runbook-market-data-stale).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-market-data-stale.md'

          # ADR-0036: the signal sources publish daily (SEC, Wikimedia), on working
          # days (ECB) or hourly (NWS): one day covers every schedule. The failure
          # series are born at 0 when the collector starts (zeroCollectionFailures).
          - alert: SignalCollectionFailing
            expr: sum by (source) (increase(fs_signal_collections_total{result!="success"}[1d])) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'A signal source fails to be collected'
              description: '{{ $labels.source }} failed {{ $value | humanize }} collections in 24 hours: its signals are missing or stale (fetch_error: source down or refusing, 403 from SEC EDGAR without SIGNAL_CONTACT_EMAIL; invalid_payload: its format changed; store_error: MySQL).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-market-data-stale.md#signalcollectionfailing'

          # The scraper persists before publishing and sends the waiting candles
          # from MySQL (publish cursor, migration 005): a backlog means the bus
          # refuses them; 0 in normal operation.
          - alert: MarketDataUnpublished
            expr: max by (symbol) (fs_unpublished_candles) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: 'Persisted candles not reaching the bus'
              description: '{{ $value | humanize }} persisted {{ $labels.symbol }} candles have waited for the bus for 15 minutes: message-manager refuses or holds the scraper publishes. They go out from MySQL, oldest first, once it answers; the trainer lags meanwhile (runbook-message-bus-outage)'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-message-bus-outage.md#5-scraper-publish-backlog'

          - alert: CandleDeliveryLagging
            expr: sum(increase(fs_candles_persisted_total[30m])) > 0 and sum(increase(tt_market_data_received_total[30m])) < 0.5 * sum(increase(fs_candles_persisted_total[30m]))
            for: 15m
            labels:
              severity: warning
              slo: data_freshness
            annotations:
              summary: 'Less than half of the persisted candles reach the trainer'
              description: 'financial-scraper persisted candles over the last 30m but trader-trainer received under 50% of them: the scraper to trainer path is lagging or dropping data.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-market-data-stale.md'

          - alert: TrainerMarketDataStale
            expr: sum(increase(tt_market_data_received_total[15m])) == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'trader-trainer receives no market data'
              description: 'No candle reached the trainer buffer in 15 minutes: the scraper, message-manager or the trainer subscription is broken.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-market-data-stale.md'

          # The useful output of the trainer is a stored model, whatever stops it
          # (training failing, nothing to train, write failing). A session lasts at
          # most TRAINER_TIME_BUDGET_MS (5 min) and the loop starts one every
          # TRAINER_INTERVAL_MS (1 h): 3 h without a stored model is already abnormal; the 2 h of "for"
          # also covers a cold start (series born at 0). Fires only while a trainer
          # holds the Lease (no leader: TrainerNoLeader; trainer down: ServiceDown).
          - alert: TrainerNoModelStored
            expr: sum by (job) (increase(tt_model_artifacts_total{result="stored"}[3h])) == 0 and on (job) max by (job) (tt_training_leader) == 1
            for: 2h
            labels:
              severity: critical
            annotations:
              summary: 'trader-trainer has stored no model for hours'
              description: 'No model artifact stored for at least 5 hours (2 hours after a start) while a trainer holds the Lease: every session fails or produces nothing to store. Check the "Training failed" logs and the deployed version (build_info).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-trainer.md#trainernomodelstored'

          # A trained model could not be stored (ADR-0022): the best agent then
          # only lives in the trainer memory, lost at the next restart. The series
          # exist at 0 from startup, so the first failure is an increase.
          - alert: ModelArtifactWriteFailing
            expr: sum by (job) (increase(tt_model_artifacts_total{result="error"}[30m])) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'Trained models are not stored on {{ $labels.job }}'
              description: '{{ $value | humanize }} model artifact write(s) failed in 30 minutes: the best agents are not kept. Check the trainer logs ("Failed to store model artifact") and TRAINER_MODEL_DIR (volume mounted, writable, not full).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-trainer.md#modelartifactwritefailing'

          - alert: ModelBelowBuyAndHold
            expr: max by (job, symbol) (tt_model_below_buy_and_hold_streak and on (job, instance) tt_training_leader == 1) >= 3
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'The models of {{ $labels.symbol }} do worse than buy and hold'
              description: 'The last {{ $value }} stored models of {{ $labels.symbol }} have a lower out-of-sample Sharpe than buy and hold on the same bars (tt_model_sharpe vs tt_model_buy_and_hold_sharpe): the trainer adds nothing over holding. No capital is at stake.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-trainer.md#modelbelowbuyandhold'

          - alert: TrainerFeatureDrift
            expr: max by (job, symbol) (tt_feature_drift_score and on (job, instance) tt_training_leader == 1) > 3
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: 'The live data of {{ $labels.symbol }} drifts from its model statistics'
              description: 'A normalized field of {{ $labels.symbol }} received since the newest stored model has a mean {{ $value | humanize }} standard deviations away from the statistics stored with that model (tt_feature_drift_score), for 1 hour: the model sees a market it was not trained on.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-trainer.md#trainerfeaturedrift'

          - alert: AlertmanagerNotificationsFailing
            expr: |
              (
                sum by (integration) (increase(alertmanager_notifications_failed_total[15m]))
                or sum by (integration) (increase(alertmanager_notifications_total[15m])) * 0
              ) / sum by (integration) (increase(alertmanager_notifications_total[15m])) >= 0.5
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'Alertmanager cannot deliver {{ $labels.integration }} notifications'
              description: 'Notifications through {{ $labels.integration }} fail: check the alertmanager-credentials Secret (webhook URL, routing key). This alert may not reach you: the dead man''s switch (Watchdog) is the safety net.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/ALERTING.md#alerts-on-the-alerting-path'

          - alert: PrometheusRuleEvaluationFailures
            expr: sum(rate(prometheus_rule_evaluation_failures_total[10m])) > 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: 'Prometheus fails to evaluate alert rules'
              description: 'Some alert rules cannot be evaluated: alerts may be silently missing.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/ALERTING.md#alerts-on-the-alerting-path'

          - alert: LokiPushFailing
            expr: sum(rate(loki_request_duration_seconds_count{job="loki",route="loki_api_v1_push",status_code=~"5.."}[5m])) > 0 or sum(rate(loki_discarded_samples_total{job="loki"}[5m])) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: 'Loki rejects or drops log lines'
              description: 'Loki answers 5xx on push or discards samples: logs are being lost. Check the Loki pod and its PVC (full disk, rate limits).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/ALERTING.md#loki-and-the-trace-pipeline'

          - alert: LokiRetentionStale
            expr: time() - max(loki_compactor_apply_retention_last_successful_run_timestamp_seconds{job="loki"}) > 3 * 3600
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: 'Loki retention has not run for 3 hours'
              description: 'The compactor has not applied retention (744h): the Loki PVC fills up and ingestion will stop. Check the Loki logs for compactor errors and the PVC usage.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/ALERTING.md#loki-and-the-trace-pipeline'
          - alert: OtelSpanExportFailing
            expr: sum by (job) (increase(otelcol_exporter_send_failed_spans_total[10m]) or increase(otelcol_exporter_send_failed_spans[10m])) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'The OTel collector fails to export spans'
              description: 'The collector dropped {{ $value | humanize }} span(s) in 10 minutes: traces are lost between the collector and Jaeger. Check the jaeger Service and the collector logs.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/ALERTING.md#otelspanexportfailing'

          - alert: Watchdog
            expr: vector(1)
            for: 0m
            labels:
              severity: none
            annotations:
              summary: 'Alerting pipeline heartbeat'
              description: 'Always firing. Routed to the dead man''s switch (ALERTMANAGER_DEADMAN_URL): when it stops arriving, Prometheus, Alertmanager or the notification path is down.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/ALERTING.md#dead-mans-switch'

      # ── Error budget (slo.md: 99.9% over 30d) ────────────────────
      - name: trading-model-slo-recording
        interval: 1m
        rules:
          - record: slo:sli_error:ratio_rate5m
            expr: sum by (job) (rate(http_requests_total{status=~"5..",path!~"/ping|/health/ready|/metrics"}[5m])) / sum by (job) (rate(http_requests_total{path!~"/ping|/health/ready|/metrics"}[5m]))
          - record: slo:sli_error:ratio_rate1h
            expr: sum by (job) (rate(http_requests_total{status=~"5..",path!~"/ping|/health/ready|/metrics"}[1h])) / sum by (job) (rate(http_requests_total{path!~"/ping|/health/ready|/metrics"}[1h]))
          - record: slo:sli_error:ratio_rate30m
            expr: sum by (job) (rate(http_requests_total{status=~"5..",path!~"/ping|/health/ready|/metrics"}[30m])) / sum by (job) (rate(http_requests_total{path!~"/ping|/health/ready|/metrics"}[30m]))
          - record: slo:sli_error:ratio_rate6h
            expr: sum by (job) (rate(http_requests_total{status=~"5..",path!~"/ping|/health/ready|/metrics"}[6h])) / sum by (job) (rate(http_requests_total{path!~"/ping|/health/ready|/metrics"}[6h]))
          # Numerator guarded: a job with no 5xx series yet has a ratio of 0, not no data.
          - record: slo:sli_error:ratio_rate30d
            expr: sum by (job) (rate(http_requests_total{status=~"5..",path!~"/ping|/health/ready|/metrics"}[30d])) / sum by (job) (rate(http_requests_total{path!~"/ping|/health/ready|/metrics"}[30d])) or sum by (job) (rate(http_requests_total{path!~"/ping|/health/ready|/metrics"}[30d])) * 0

      - name: trading-model-slo-budget
        interval: 5m
        rules:
          - alert: SLOErrorBudgetLow
            expr: (1 - slo:sli_error:ratio_rate30d / 0.001) * 100 < 20
            for: 1h
            labels:
              severity: warning
              slo: availability
            annotations:
              summary: 'Error budget of {{ $labels.job }} below 20%'
              description: 'Less than 20% of the 30d availability error budget (99.9%) remains: full change freeze except critical fixes and rollbacks (slo.md, Error Budget Policy).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-latency-and-errors.md#slo-error-budget-low'

      # ── Infrastructure (issue #601, ADR-0056): exporters, kubelet ──────────
      # kube_* (kube-state-metrics), kubelet_* and the Redis Sentinel rules only
      # have data in K8s; compose has the database and node exporters.
      - name: trading-model-infrastructure
        interval: 30s
        rules:
          - alert: KubePodCrashLooping
            expr: max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}) == 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: '{{ $labels.pod }} ({{ $labels.container }}) is crash looping'
              description: 'Container {{ $labels.container }} of {{ $labels.pod }} has been in CrashLoopBackOff for 5 minutes: it starts, exits and is restarted with a growing delay.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-infrastructure.md#kubepodcrashlooping'

          # The reason stays on the last termination until the next one: only a
          # restart in the last 15 min fires, not an OOMKill of last week.
          - alert: KubeContainerOOMKilled
            expr: max by (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}) == 1 and on (namespace, pod, container) max by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[15m])) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: '{{ $labels.pod }} ({{ $labels.container }}) was OOMKilled'
              description: 'Container {{ $labels.container }} of {{ $labels.pod }} was killed for exceeding its memory limit and restarted in the last 15 minutes. HighMemoryUsage only sees the V8 heap of the services; this is the container.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-infrastructure.md#kubecontaineroomkilled'

          - alert: KubePersistentVolumeFillingUp
            expr: max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes) / max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes) > 0.8
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: 'PVC {{ $labels.persistentvolumeclaim }} is over 80% full'
              description: 'Volume {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full: a full MySQL, MongoDB, Redis, Prometheus or Loki volume stops writes.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-infrastructure.md#kubepersistentvolumefillingup'

          - alert: NodeFilesystemAlmostFull
            expr: max by (instance, device) (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs"}) / max by (instance, device) (node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs"}) < 0.15
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: 'Disk {{ $labels.device }} of {{ $labels.instance }} is over 85% full'
              description: 'Only {{ $value | humanizePercentage }} of {{ $labels.device }} is free on {{ $labels.instance }} (one alert per device, whatever its mount points). A full node disk evicts pods; a full Docker Desktop host disk froze the whole VM (2026-10-28).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-infrastructure.md#nodefilesystemalmostfull'

          - alert: MySQLDown
            expr: mysql_up == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'MySQL {{ $labels.instance }} does not answer its exporter'
              description: 'mysqld-exporter of {{ $labels.instance }} cannot query MySQL for 5 minutes: MySQL is down or refuses connections, or the exporter user is missing (Access denied in the mysqld-exporter logs).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-infrastructure.md#mysqldown'

          - alert: RedisDown
            expr: redis_up == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: '{{ $labels.job }} {{ $labels.instance }} does not answer its exporter'
              description: 'redis_exporter of {{ $labels.instance }} ({{ $labels.job }}) cannot query Redis for 5 minutes: the node or sentinel is down, or the exporter ACL user is missing (WRONGPASS in the redis-exporter logs).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-infrastructure.md#redisdown'

          # Expected replicas = the StatefulSet size minus the master: single-node
          # environments (compose, staging) never fire.
          - alert: RedisReplicasMissing
            expr: max(redis_connected_slaves{job="redis"}) < max(kube_statefulset_replicas{statefulset="redis"}) - 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Redis master has fewer replicas than the StatefulSet'
              description: 'The Redis master has {{ $value }} connected replica(s), fewer than the redis StatefulSet runs minus one: a failover has fewer (or no) candidates and the journal (ADR-0048) fewer copies.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-infrastructure.md#redisreplicasmissing'

          # CKQUORUM: enough sentinels reachable to agree on a failover. Staging
          # runs one sentinel (quorum never reachable): environments with fewer
          # than 2 sentinels never fire.
          - alert: RedisSentinelQuorumLost
            expr: max by (master_name) (redis_sentinel_master_ckquorum_status) == 0 unless on () max(kube_statefulset_replicas{statefulset="redis-sentinel"}) < 2
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'Redis Sentinel cannot fail over {{ $labels.master_name }}'
              description: 'No sentinel can reach a quorum for {{ $labels.master_name }} (SENTINEL CKQUORUM): if the master fails now, no replica is promoted and discovery, message-manager and dlq-service lose Redis.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-infrastructure.md#redissentinelquorumlost'

          - alert: MongoDBDown
            expr: mongodb_up == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'MongoDB {{ $labels.job }} {{ $labels.instance }} does not answer its exporter'
              description: 'mongodb_exporter of {{ $labels.instance }} ({{ $labels.job }}) cannot reach mongod for 5 minutes.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-infrastructure.md#mongodbdown'

          # Partitioned StatefulSets (staging-local, issue #700) stay on the old pod
          # template after `kubectl rollout status` reports success.
          - alert: StatefulSetStuckOnOldRevision
            expr: kube_statefulset_status_current_revision unless on (namespace, statefulset, revision) kube_statefulset_status_update_revision
            for: 24h
            labels:
              severity: warning
            annotations:
              summary: 'StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} still runs an old revision'
              description: 'StatefulSet {{ $labels.statefulset }} has pods on a revision other than its update revision for 24 hours: a partition holds the rollout back, so new sidecars (exporters) and their alerts are not running.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-infrastructure.md#statefulsetstuckonoldrevision'

          # Each member's exporter reports every member: max by member dedupes.
          # State 1 PRIMARY, 2 SECONDARY; anything else (RECOVERING, DOWN...) does not serve.
          - alert: MongoDBReplicaSetMemberUnhealthy
            expr: max by (job, member_idx) (mongodb_members_health) == 0 or max by (job, member_idx) (mongodb_members_state != 1 and mongodb_members_state != 2)
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'MongoDB {{ $labels.job }} member {{ $labels.member_idx }} is not healthy'
              description: 'Replica set member {{ $labels.member_idx }} of {{ $labels.job }} is unreachable, or neither primary nor secondary, for 5 minutes: one more failure and the replica set loses its majority.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-infrastructure.md#mongodbreplicasetmemberunhealthy'

          # mongodb_myState exists only where replSetGetStatus answers (not the
          # standalone compose mongod).
          - alert: MongoDBReplicaSetNoPrimary
            expr: count by (job) (mongodb_myState) unless on (job) count by (job) (mongodb_members_state == 1)
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: 'MongoDB {{ $labels.job }} has no primary'
              description: 'No member of the {{ $labels.job }} replica set is primary for 2 minutes: writes fail (audit events for mongo-audit, dead letters for mongo-dlq).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-infrastructure.md#mongodbreplicasetnoprimary'
