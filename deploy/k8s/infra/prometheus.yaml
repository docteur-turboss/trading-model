apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app.kubernetes.io/component: prometheus
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/component: prometheus
        app.kubernetes.io/part-of: trading-model
    spec:
      serviceAccountName: prometheus
      terminationGracePeriodSeconds: 120
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=30d"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
            - name: svid
              mountPath: /run/spire/svid
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.6.0
          imagePullPolicy: IfNotPresent
          args:
            - -socketPath=/run/spire/agent-sockets/public/api.sock
            - -certDir=/run/spire/svid
            - -svidFileName=svid.pem
            - -svidKeyFileName=svid_key.pem
            - -svidBundleFileName=bundle.pem
            - -renewSignal=SIGHUP
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/agent-sockets
            - name: svid
              mountPath: /run/spire/svid
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/agent-sockets
            type: DirectoryOrCreate
        - name: svid
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: prometheus-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerting.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    scrape_configs:
      - job_name: 'message-manager'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
        static_configs:
          - targets: ['message-manager:3000']

      - job_name: 'discovery-server'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
        static_configs:
          - targets: ['discovery-server:3000']

      - job_name: 'dlq-service'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
        static_configs:
          - targets: ['dlq-service:3000']

      - job_name: 'api-gateway'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
        static_configs:
          - targets: ['api-gateway:3000']

      - job_name: 'audit-logger'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
        static_configs:
          - targets: ['audit-logger:3000']

      - job_name: 'financial-scraper'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
        static_configs:
          - targets: ['financial-scraper:3000']

      - job_name: 'trader-trainer'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
        static_configs:
          - targets: ['trader-trainer:3000']

      - job_name: 'otel-collector'
        scheme: http
        static_configs:
          - targets: ['otel-collector:8888']

      - job_name: 'blackbox-exporter'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - https://api-gateway:3000/ping
            labels:
              check: 'gateway-health'
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115

  alerting.yml: |
    groups:
      - name: trading-model
        interval: 30s
        rules:
          - alert: SLOAvailabilityFastBurn
            expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.02
            for: 2m
            labels:
              severity: critical
              slo: availability
            annotations:
              summary: "Availability SLO fast burn rate exceeded"
              description: "Error rate > 2% over 5m — check {{ $labels.job }} logs."

          - alert: SLOAvailabilitySlowBurn
            expr: rate(http_requests_total{status=~"5.."}[1h]) / rate(http_requests_total[1h]) > 0.005
            for: 10m
            labels:
              severity: warning
              slo: availability
            annotations:
              summary: "Availability SLO slow burn rate exceeded"
              description: "Error rate > 0.5% over 1h — approaching error budget exhaustion."

          - alert: SLOLatencyFastBurn
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 5
            for: 2m
            labels:
              severity: critical
              slo: latency
            annotations:
              summary: "Latency SLO fast burn rate exceeded"
              description: "P95 latency > 5s over 5m."

          - alert: SLOLatencySlowBurn
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[1h])) > 3
            for: 10m
            labels:
              severity: warning
              slo: latency
            annotations:
              summary: "Latency SLO slow burn rate exceeded"
              description: "P95 latency > 3s over 1h."

          - alert: SLOErrorRateFastBurn
            expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
            for: 2m
            labels:
              severity: critical
              slo: error_rate
            annotations:
              summary: "Error rate SLO fast burn rate exceeded"
              description: "Error rate > 5% over 5m."

          - alert: SLOErrorRateSlowBurn
            expr: rate(http_requests_total{status=~"5.."}[1h]) / rate(http_requests_total[1h]) > 0.02
            for: 10m
            labels:
              severity: warning
              slo: error_rate
            annotations:
              summary: "Error rate SLO slow burn rate exceeded"
              description: "Error rate > 2% over 1h."

          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.job }} is down"
              description: "Service {{ $labels.job }} has been unreachable for over 1 minute."

          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High error rate on {{ $labels.job }}"
              description: "Error rate is {{ $value | humanizePercentage }} for the last 5 minutes."

          - alert: HighLatency
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 5
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High latency on {{ $labels.job }}"
              description: "P95 latency is {{ $value }}s for the last 5 minutes."

          - alert: HighMemoryUsage
            expr: nodejs_heap_size_used_bytes / nodejs_heap_size_total_bytes > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage on {{ $labels.job }}"
              description: "Heap usage is {{ $value | humanizePercentage }}."

          - alert: CircuitBreakerOpen
            expr: address_manager_circuit_breaker_state == 1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Circuit breaker open on {{ $labels.job }}"
              description: "Circuit breaker for subscriber is in OPEN state."

          - alert: BackupFailed
            expr: time() - backup_last_success_timestamp > 90000
            for: 1h
            labels:
              severity: critical
            annotations:
              summary: "Database backup failed or too old"
              description: "Last successful backup was more than 25 hours ago."

          - alert: BackupNotRunning
            expr: backup_last_success_timestamp == 0
            for: 24h
            labels:
              severity: warning
            annotations:
              summary: "Database backup has never succeeded"
              description: "No successful backup has ever been recorded."
