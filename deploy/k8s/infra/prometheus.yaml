apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
---
# Pod discovery of the scrape jobs: read-only, own namespace only (issue #559).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app.kubernetes.io/component: prometheus
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/component: prometheus
        app.kubernetes.io/part-of: trading-model
    spec:
      serviceAccountName: prometheus
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus@sha256:378f4e03703557d1c6419e6caccf922f96e6d88a530f7431d66a4c4f4b1000fe
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # Wait for the SVID files written by the spiffe-helper sidecar: a scrape pool
          # whose tls_config file is missing at startup is never created again, so every
          # mTLS job would silently stay unscraped (issue #425).
          command: ["/bin/sh", "-c"]
          args:
            - |
              for f in bundle.pem svid.pem svid_key.pem; do
                until [ -s "/run/spire/svid/$f" ]; do echo "waiting for /run/spire/svid/$f"; sleep 2; done
              done
              # The ConfigMap is not hash-suffixed and Prometheus does not reread a changed
              # config by itself: reload it, or an upgrade keeps scraping the old targets.
              confsum() { cat /etc/prometheus/* 2>/dev/null | cksum; }
              (last="$(confsum)"; while sleep 20; do
                cur="$(confsum)"
                if [ "$cur" != "$last" ] && wget -q -O /dev/null --post-data= http://localhost:9090/-/reload; then last="$cur"; fi
              done) &
              exec /bin/prometheus \
                --config.file=/etc/prometheus/prometheus.yml \
                --storage.tsdb.path=/prometheus \
                --storage.tsdb.retention.time=30d \
                --web.enable-lifecycle
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
            - name: svid
              mountPath: /run/spire/svid
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.10.1@sha256:2402c34d83794aa24c127baa46e9732d653463f3bfcd39cda1313003ed60f8c9
          imagePullPolicy: IfNotPresent
          args:
            - -config
            - /etc/spiffe-helper/helper.conf
          volumeMounts:
            - name: spiffe-helper-config
              mountPath: /etc/spiffe-helper
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/agent-sockets
            - name: svid
              mountPath: /run/spire/svid
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: spiffe-helper-config
          configMap:
            name: spiffe-helper-config
        - name: config
          configMap:
            name: prometheus-config
        # Workload API socket from the SPIFFE CSI driver (node-agents): the
        # restricted Pod Security profile forbids a hostPath.
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: svid
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: prometheus-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: trading-model
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerting.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    scrape_configs:
      - job_name: 'message-manager'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
          server_name: message-manager
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: message-manager
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '3000'
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'discovery-server'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
          server_name: discovery-server
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: discovery-server
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '3000'
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'dlq-service'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
          server_name: dlq-service
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: dlq-service
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '3000'
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'api-gateway'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
          server_name: api-gateway
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: api-gateway
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '3000'
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'audit-logger'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
          server_name: audit-logger
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: audit-logger
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '3000'
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'financial-scraper'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
          server_name: financial-scraper
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: financial-scraper
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '3000'
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # The scrape cron (fs_events_published_total, fs_scrape_*) runs only here.
      - job_name: 'financial-scraper-collector'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
          # The SVID carries the ServiceAccount DNS name, shared with financial-scraper.
          server_name: financial-scraper
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: financial-scraper-collector
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '3000'
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'trader-trainer'
        scheme: https
        tls_config:
          ca_file: /run/spire/svid/bundle.pem
          cert_file: /run/spire/svid/svid.pem
          key_file: /run/spire/svid/svid_key.pem
          server_name: trader-trainer
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: trader-trainer
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '3000'
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'otel-collector'
        scheme: http
        static_configs:
          - targets: ['otel-collector:8888']

      - job_name: 'blackbox-exporter'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - https://api-gateway:3000/ping
            labels:
              check: 'gateway-health'
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115

      - job_name: 'backup-metrics'
        static_configs:
          - targets: ['backup-metrics-exporter:9118']
        scrape_interval: 60s

      # Self-monitoring of the alerting path (AlertmanagerNotificationsFailing,
      # PrometheusRuleEvaluationFailures).
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'alertmanager'
        static_configs:
          - targets: ['alertmanager:9093']

  alerting.yml: |
    groups:
      - name: trading-model
        interval: 30s
        rules:

          # ── Burn Rate Alerts (SLO-based) ─────────────────────────────
          - alert: SLOAvailabilityFastBurn
            expr: (sum by (job) (rate(http_requests_total{status=~"5..",path!~"/ping|/health/ready|/metrics"}[1h])) / sum by (job) (rate(http_requests_total{path!~"/ping|/health/ready|/metrics"}[1h])) > 0.0144) and (sum by (job) (rate(http_requests_total{status=~"5..",path!~"/ping|/health/ready|/metrics"}[5m])) / sum by (job) (rate(http_requests_total{path!~"/ping|/health/ready|/metrics"}[5m])) > 0.0144)
            for: 2m
            labels:
              severity: critical
              slo: availability
            annotations:
              summary: 'Availability SLO fast burn rate exceeded'
              description: '5xx ratio > 1.44% over both 1h and 5m (14.4x the 0.1% budget of the 99.9% SLO). Probes (/ping, /health/ready, /metrics) are not counted.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-latency-and-errors.md#higherrorrate'

          - alert: SLOAvailabilitySlowBurn
            expr: (sum by (job) (rate(http_requests_total{status=~"5..",path!~"/ping|/health/ready|/metrics"}[6h])) / sum by (job) (rate(http_requests_total{path!~"/ping|/health/ready|/metrics"}[6h])) > 0.006) and (sum by (job) (rate(http_requests_total{status=~"5..",path!~"/ping|/health/ready|/metrics"}[30m])) / sum by (job) (rate(http_requests_total{path!~"/ping|/health/ready|/metrics"}[30m])) > 0.006)
            for: 15m
            labels:
              severity: warning
              slo: availability
            annotations:
              summary: 'Availability SLO slow burn rate exceeded'
              description: '5xx ratio > 0.6% over both 6h and 30m (6x the 0.1% budget of the 99.9% SLO). Probes are not counted.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-latency-and-errors.md#higherrorrate'

          - alert: SLOLatencyFastBurn
            expr: histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[5m]))) > 5
            for: 2m
            labels:
              severity: critical
              slo: latency
            annotations:
              summary: 'Latency SLO fast burn rate exceeded'
              description: 'P95 latency > 5s over 5m — exceeding 2s SLO target.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-latency-and-errors.md#highlatency'

          - alert: SLOLatencySlowBurn
            expr: histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[1h]))) > 3
            for: 10m
            labels:
              severity: warning
              slo: latency
            annotations:
              summary: 'Latency SLO slow burn rate exceeded'
              description: 'P95 latency > 3s over 1h — approaching 2s SLO target breach.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-latency-and-errors.md#highlatency'

          - alert: SLOErrorRateFastBurn
            expr: (sum by (job) (rate(http_requests_total{status=~"5..",path!~"/ping|/health/ready|/metrics"}[1h])) / sum by (job) (rate(http_requests_total{path!~"/ping|/health/ready|/metrics"}[1h])) > 0.144) and (sum by (job) (rate(http_requests_total{status=~"5..",path!~"/ping|/health/ready|/metrics"}[5m])) / sum by (job) (rate(http_requests_total{path!~"/ping|/health/ready|/metrics"}[5m])) > 0.144)
            for: 2m
            labels:
              severity: critical
              slo: error_rate
            annotations:
              summary: 'Error rate SLO fast burn rate exceeded'
              description: '5xx ratio > 14.4% over both 1h and 5m (14.4x the 1% budget of the error rate SLO). Probes are not counted.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-latency-and-errors.md#higherrorrate'

          - alert: SLOErrorRateSlowBurn
            expr: (sum by (job) (rate(http_requests_total{status=~"5..",path!~"/ping|/health/ready|/metrics"}[6h])) / sum by (job) (rate(http_requests_total{path!~"/ping|/health/ready|/metrics"}[6h])) > 0.06) and (sum by (job) (rate(http_requests_total{status=~"5..",path!~"/ping|/health/ready|/metrics"}[30m])) / sum by (job) (rate(http_requests_total{path!~"/ping|/health/ready|/metrics"}[30m])) > 0.06)
            for: 15m
            labels:
              severity: warning
              slo: error_rate
            annotations:
              summary: 'Error rate SLO slow burn rate exceeded'
              description: '5xx ratio > 6% over both 6h and 30m (6x the 1% budget of the error rate SLO). Probes are not counted.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-latency-and-errors.md#higherrorrate'

          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: '{{ $labels.job }} is down'
              description: 'Service {{ $labels.job }} has been unreachable for over 1 minute.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-service-down.md'

          - alert: HighErrorRate
            expr: sum by (job) (rate(http_requests_total{status=~"5.."}[5m])) / sum by (job) (rate(http_requests_total[5m])) > 0.05
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: 'High error rate on {{ $labels.job }}'
              description: 'Error rate is {{ $value | humanizePercentage }} for the last 5 minutes.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-latency-and-errors.md#higherrorrate'

          - alert: HighLatency
            expr: histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[5m]))) > 5
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: 'High latency on {{ $labels.job }}'
              description: 'P95 latency is {{ $value | humanize }}s for the last 5 minutes.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-latency-and-errors.md#highlatency'

          - alert: CertificateExpiry
            expr: probe_ssl_earliest_cert_expiry - time() < 1800
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'SVID close to expiry on {{ $labels.instance }}'
              description: 'The served X.509-SVID expires in less than 30 minutes (TTL 1h, renewed at half-life): SPIRE rotation is stalled.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-certificate-expiry.md'

          - alert: CircuitBreakerOpen
            expr: address_manager_circuit_breaker_state == 1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: 'Circuit breaker open on {{ $labels.job }}'
              description: 'The circuit breaker of {{ $labels.job }} for instance {{ $labels.instanceId }} is in OPEN state: calls to that instance are refused.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-circuit-breaker-open.md'

          - alert: DLQSizeGrowing
            expr: sum by (job) (rate(dlq_entries_added_total[15m])) > sum by (job) (rate(dlq_entries_replayed_total[15m]))
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'DLQ is growing faster than it is drained'
              description: 'Messages are being added to the DLQ faster than they are replayed.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-dlq-backlog.md'

          - alert: InstanceCountLow
            expr: max by (service) (discovery_registered_instances_per_service) < 2 and max_over_time(min_over_time(max by (service) (discovery_registered_instances_per_service)[15m:1m])[1d:5m]) >= 2
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: 'Low instance count for service {{ $labels.service }}'
              description: 'Service {{ $labels.service }} had 2+ instances for 15 min in the last day and now has fewer than 2: redundancy is lost (single-replica environments never fire, nor does the surge pod of a rolling update).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-discovery.md#instancecountlow'

          - alert: HighMemoryUsage
            expr: nodejs_heap_size_used_bytes / nodejs_heap_size_limit_bytes > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'High memory usage on {{ $labels.job }}'
              description: 'Heap usage is {{ $value | humanizePercentage }} of the V8 heap limit: out of memory is close.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-service-down.md#1-oomkilled-out-of-memory'

          - alert: HeartbeatStopped
            expr: sum by (service) (rate(discovery_heartbeats_total[5m])) == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: 'Heartbeats have stopped for {{ $labels.service }}'
              description: 'discovery-server received no heartbeat from {{ $labels.service }} in the last 5 minutes.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-discovery.md#heartbeatstopped'

          - alert: BackupFailed
            expr: time() - backup_last_success_timestamp > 90000
            for: 1h
            labels:
              severity: critical
            annotations:
              summary: 'Database backup failed or too old'
              description: 'Last successful backup was more than 25 hours ago — check backup job.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          - alert: BackupNotRunning
            expr: backup_last_success_timestamp == 0
            for: 24h
            labels:
              severity: warning
            annotations:
              summary: 'Database backup has never succeeded'
              description: 'No successful backup has ever been recorded for {{ $labels.component }}.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          - alert: BackupJobStale
            expr: 'time() - backup_last_run_timestamp > 93600'
            for: 1h
            labels:
              severity: critical
            annotations:
              summary: 'Backup job has not run for more than 26 hours'
              description: 'The db-backup CronJob stopped running (suspended, failing to start or stuck): no new backup is being taken.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          # Point-in-time archives (ADR-0031): hourly, so 2 h = two missed runs.
          - alert: BackupIncrementalStale
            expr: 'time() - backup_last_success_timestamp{run="incremental"} > 7200'
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'Point-in-time archive stale: {{ $labels.component }}'
              description: 'No {{ $labels.component }} archive for more than 2 hours (db-backup-incremental runs hourly): the 1 h RPO is no longer met.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          # Not on compose: scripts/backup.sh reports backup_pitr_supported 0 (no
          # incremental job, standalone mongod).
          - alert: BackupIncrementalMissing
            expr: '(absent(backup_last_success_timestamp{component="mysql-binlog",run="incremental"}) or absent(backup_last_success_timestamp{component="mongodb-oplog",run="incremental"}) or absent(backup_last_success_timestamp{component="mongodb-audit-oplog",run="incremental"})) unless on() (backup_pitr_supported == 0)'
            for: 2h
            labels:
              severity: critical
            annotations:
              summary: 'A binlog or oplog is no longer archived: {{ $labels.component }}'
              description: 'db-backup-incremental reported nothing for {{ $labels.component }} (job never ran, component removed, or backup-metrics-exporter down): no point-in-time recovery.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          # A run of a flux failed (S3, pod, oplog read). The next run retries it,
          # so the alert resolves by itself once the archive is written.
          - alert: BackupIncrementalFailed
            expr: 'backup_last_status{run="incremental",component=~"mysql-binlog|mongodb-oplog|mongodb-audit-oplog"} == 0'
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Point-in-time archive run failed: {{ $labels.component }}'
              description: 'The last db-backup-incremental run could not archive {{ $labels.component }}: see the job logs. A gap (binlog purged, oplog overwritten) also raises BackupPitrGap.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          # The chain lost entries after the newest daily dump: computed from the
          # archive names at every run, it stays at 1 until the next daily dump,
          # even though the runs after the break succeed again.
          - alert: BackupPitrGap
            expr: 'backup_pitr_gap{run="incremental"} == 1'
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'Point-in-time recovery broken: {{ $labels.component }}'
              description: 'The {{ $labels.component }} archives have a gap after the newest daily dump (binlog purged or oplog overwritten before being archived): no restore --until past the gap until the next daily dump succeeds. Take a dump now (BACKUP_DR.md, "Point-in-time chain broken").'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#point-in-time-chain-broken'

          - alert: BackupMetricsAbsent
            expr: 'absent(backup_last_run_timestamp{run=""})'
            for: 26h
            labels:
              severity: critical
            annotations:
              summary: 'No backup has ever reported'
              description: 'Prometheus has no metric of the daily backup job: db-backup never ran or backup-metrics-exporter is down (the series of db-backup-incremental do not count).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          - alert: BackupComponentMissing
            expr: 'absent(backup_last_success_timestamp{component="mongodb"}) or absent(backup_last_success_timestamp{component="mongodb-audit"}) or absent(backup_last_success_timestamp{component="mysql"}) or absent(backup_last_success_timestamp{component="spire"}) or absent(backup_last_success_timestamp{component="checkpoints"})'
            for: 26h
            labels:
              severity: critical
            annotations:
              summary: 'A database is no longer backed up: {{ $labels.component }}'
              description: 'The last backup runs reported nothing for {{ $labels.component }} (component removed from the job, or skipped).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          - alert: BackupUnencrypted
            expr: backup_last_status{component="encryption"} == 0 or backup_encrypted == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'Backups are not encrypted'
              description: 'No age recipient configured (BACKUP_AGE_RECIPIENTS; ConfigMap backup-encryption in K8s), or fewer distinct recipients than BACKUP_MIN_RECIPIENTS (2 in production): backups are refused or written in clear.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          - alert: BackupOffsiteCopyFailed
            expr: backup_last_status{component="offsite"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'Off-site backup copy failed'
              description: 'The encrypted backups were not copied off-site: check the S3 credentials (Secret trading-model-backup-s3 in K8s).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          - alert: BackupVolumeFilling
            expr: 'max by (job) (backup_volume_used_ratio) > 0.8'
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: 'backup-data volume is over 80% full'
              description: 'The backup-data PVC (100Gi) is filling up: dumps grow with the market data. Check the retention (RETENTION_DAYS) or grow the volume before a night of backups fails.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#monitoring'

          # Retention job (ADR-0051): daily at 03:30 UTC, so 36 h = one missed run.
          - alert: RetentionFailed
            expr: 'retention_last_status == 0'
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'MySQL retention job failed'
              description: 'The last db-retention run failed on at least one table: market data and signals older than the retention period are not being purged.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#retention-job'

          - alert: RetentionStale
            expr: 'time() - retention_last_success_timestamp > 129600'
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: 'MySQL retention job has not succeeded for 36 hours'
              description: 'No successful db-retention run for more than 36 hours (it runs daily): suspended, failing to start or failing.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/deployment/BACKUP_DR.md#retention-job'

          # ── Audit trail integrity (ADR-0027) ──────────────────────────

          - alert: AuditChainBroken
            expr: 'max by (job) (audit_chain_broken) == 1'
            labels:
              severity: critical
            annotations:
              summary: 'Audit trail integrity check failed'
              description: 'The audit chain verification found a fault (event missing, changed or removed, or a chain that no longer matches its anchors). Run chain-cli report on an audit-logger pod; acknowledge a loss only for an explained restore (runbook-audit-chain-broken).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-audit-chain-broken.md#auditchainbroken'

          - alert: AuditChainVerificationStale
            expr: 'time() - max by (job) (audit_chain_last_verification_timestamp) > 2700'
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: 'Audit trail no longer verified'
              description: 'audit-logger has not completed an audit chain verification for more than 45 minutes (MongoDB unreachable, or the cycle fails): a broken chain would go unnoticed (runbook-audit-chain-broken).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-audit-chain-broken.md#auditchainverificationstale'

          - alert: AuditChainAnchoringStale
            expr: 'max by (job) (audit_chain_anchoring_enabled) == 1 and time() - max by (job) (audit_chain_last_anchor_timestamp) > 2700'
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: 'Audit trail no longer anchored'
              description: 'audit-logger has not anchored the audit chain head for more than 45 minutes: check the anchor bucket credentials (audit-anchor-s3) and its logs (runbook-audit-chain-broken).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-audit-chain-broken.md#auditchainanchoringstale'

          - alert: AuditChainNotAnchored
            expr: 'max by (job) (audit_chain_anchoring_enabled) == 0'
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: 'Audit trail verified but not anchored'
              description: 'AUDIT_ANCHOR_BUCKET is not set: a rewrite of the whole audit chain by someone with database access would go unnoticed (ADR-0027).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-audit-chain-broken.md#auditchainnotanchored'
          # ── Application SLI Alerts ────────────────────────────────────

          - alert: MessageDeliveryLowSuccessRate
            expr: (sum by (job) (rate(mm_messages_published_total[5m])) or sum by (job) (rate(mm_messages_dlq_total[5m])) * 0) / ((sum by (job) (rate(mm_messages_published_total[5m])) or sum by (job) (rate(mm_messages_dlq_total[5m])) * 0) + (sum by (job) (rate(mm_messages_dlq_total[5m])) or sum by (job) (rate(mm_messages_published_total[5m])) * 0)) < 0.995
            for: 5m
            labels:
              severity: critical
              slo: message_delivery
            annotations:
              summary: 'Message delivery success rate below 99.5%'
              description: 'Message-manager delivery rate is {{ $value | humanizePercentage }} over 5m.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-message-bus-outage.md'

          - alert: MessagesLost
            expr: sum(increase(mm_messages_dlq_error_total{target="file"}[15m])) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: 'Dead-lettered messages could not be written: messages lost'
              description: 'dlq-service could not take dead-lettered messages and message-manager could not keep them in DLQ_LOCAL_FALLBACK_PATH either: they are gone. Check that the path is on a writable volume, then dlq-service.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-message-bus-outage.md#4-dead-letters-stuck-refused-or-lost'

          - alert: MessagesDeadLettered
            expr: sum by (topic) (increase(mm_messages_dlq_total[1h])) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'Messages dead-lettered on {{ $labels.topic }}'
              description: 'message-manager gave up delivering {{ $value | humanize }} message(s) on {{ $labels.topic }} in the last hour. They are in dlq-service (GET /dlq) to inspect and replay.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-message-bus-outage.md#4-dead-letters-stuck-refused-or-lost'

          # dlq-service cannot take dead letters: message-manager keeps them in a
          # file that does not outlive the pod and sends them again every minute.
          - alert: DeadLettersNotForwarded
            expr: max by (instance) (mm_dlq_fallback_pending) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: 'Dead letters kept in a message-manager pod, not in dlq-service'
              description: '{{ $value }} dead letter(s) have waited 15 minutes in the local file of {{ $labels.instance }}: dlq-service cannot take them (down, unreachable, or another DLQ_AUTH_HMAC_SECRET). They are lost if the pod is deleted.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-message-bus-outage.md#4-dead-letters-stuck-refused-or-lost'

          - alert: DeadLettersRejected
            expr: sum(increase(mm_dlq_rejected_total[1h])) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'dlq-service refused dead letters'
              description: 'dlq-service refused {{ $value | humanize }} dead letter(s) in the last hour (invalid or too large): they are in DLQ_LOCAL_FALLBACK_PATH.rejected on the message-manager pod, and in its logs.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-message-bus-outage.md#4-dead-letters-stuck-refused-or-lost'

          # A topic nobody subscribes to drops its messages. Expected for a few
          # seconds at a cold start (publishers up before subscribers), so only a
          # drop lasting 10 minutes alerts.
          - alert: MessagesUnrouted
            expr: sum by (topic) (rate(mm_messages_unrouted_total[5m])) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: 'Messages dropped on {{ $labels.topic }}: no subscriber'
              description: 'message-manager drops the messages published on {{ $labels.topic }}: no instance subscribes to it. audit-logger subscribes to every topic: check that the subscribers are up and renew their subscriptions, and that message-manager reaches Redis.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-message-bus-outage.md#3-no-subscriber-on-a-topic'

          - alert: JournalEntriesTrimmed
            expr: sum by (topic, service) (increase(mm_journal_trimmed_pending_total[15m])) > 0 or sum by (topic, service) (mm_journal_trimmed_pending_total unless mm_journal_trimmed_pending_total offset 15m) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: 'Messages lost on {{ $labels.topic }} for {{ $labels.service }}: journal trimmed before delivery'
              description: '{{ $labels.service }} stayed unreachable for more than 24 h: message-manager trimmed undelivered {{ $labels.topic }} entries from its journal and they are gone. Check the service, then republish what it missed from the source.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-message-bus-outage.md#6-journal-entries-trimmed-before-delivery'

          - alert: DLQDrainRateLow
            expr: sum by (job) (rate(dlq_entries_replayed_total[15m])) / sum by (job) (rate(dlq_entries_added_total[15m])) < 0.8
            for: 15m
            labels:
              severity: warning
              slo: dlq_drain
            annotations:
              summary: 'DLQ drain rate is critically low'
              description: 'DLQ replay/add ratio is {{ $value | humanizePercentage }} — queue is growing.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-dlq-backlog.md'

          - alert: TrainingCompletionRateLow
            expr: (sum by (job) (rate(tt_training_sessions_total{result="success"}[15m])) or sum by (job) (rate(tt_training_sessions_total[15m])) * 0) / sum by (job) (rate(tt_training_sessions_total[15m])) < 0.95
            for: 15m
            labels:
              severity: warning
              slo: training_completion
            annotations:
              summary: 'Training completion rate below 95%'
              description: 'Trainer completion rate is {{ $value | humanizePercentage }} over 15m.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-trainer.md#trainingcompletionratelow'

          - alert: TrainerEventLoopBlocked
            expr: histogram_quantile(0.99, sum by (job, le) (rate(tt_genome_evaluation_seconds_bucket[15m]))) > 5
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: 'trader-trainer event loop blocked for several seconds'
              description: 'p99 genome evaluation is {{ $value | humanizeDuration }} over 15m (threshold 5 s). Heartbeats (15 s) and deliveries (10 s timeout) fail meanwhile.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-trainer.md#trainereventloopblocked'

          - alert: TrainerEventLoopLagHigh
            expr: max by (job) (nodejs_eventloop_lag_max_seconds{job="trader-trainer"}) > 10
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'trader-trainer event loop lag above 10 s'
              description: 'Trainer event loop lag reached {{ $value | humanizeDuration }} (threshold 10 s) outside or inside GA evaluation. Heartbeats (15 s) and deliveries (10 s timeout) fail meanwhile.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-trainer.md#trainereventlooplaghigh'

          - alert: MarketDataStale
            expr: sum(increase(fs_candles_persisted_total[15m])) == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'No market data persisted for 15 minutes'
              description: 'financial-scraper persisted no candle in 15 minutes: collection is stopped (no symbol tracked, scheduler disabled everywhere, Binance or MySQL failing) while the service may still report healthy.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-market-data-stale.md'

          - alert: ScrapeCyclesFailing
            expr: sum(rate(fs_scrape_cycles_total{result="error"}[15m])) / sum(rate(fs_scrape_cycles_total[15m])) > 0.5
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: 'Most scrape cycles fail'
              description: 'More than half of the financial-scraper cycles failed over 15 minutes ({{ $value | humanizePercentage }}).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-market-data-stale.md'

          # ADR-0026: Binance stays the source while its public API answers from
          # here. A 451 is the geo-block that reopens the decision. The series is
          # born at the first 451; a cycle sends several requests per symbol, so
          # the counter grows within the cycle and the next ones.
          - alert: BinanceRestrictedLocation
            expr: sum(increase(fs_binance_requests_total{status="451"}[15m])) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: 'Binance refuses the scraper location (HTTP 451)'
              description: 'Binance answered 451 (restricted location) {{ $value | humanize }} times in 15 minutes: market data collection is blocked. Re-examine ADR-0026 and switch BINANCE_BASE_URL to the next fallback (runbook-market-data-stale).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-market-data-stale.md'

          # ADR-0036: the signal sources publish daily (SEC, Wikimedia), on working
          # days (ECB) or hourly (NWS): one day covers every schedule. The failure
          # series are born at 0 when the collector starts (zeroCollectionFailures).
          - alert: SignalCollectionFailing
            expr: sum by (source) (increase(fs_signal_collections_total{result!="success"}[1d])) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'A signal source fails to be collected'
              description: '{{ $labels.source }} failed {{ $value | humanize }} collections in 24 hours: its signals are missing or stale (fetch_error: source down or refusing, 403 from SEC EDGAR without SIGNAL_CONTACT_EMAIL; invalid_payload: its format changed; store_error: MySQL).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-market-data-stale.md#signalcollectionfailing'

          # The scraper persists before publishing and sends the waiting candles
          # from MySQL (publish cursor, migration 005): a backlog means the bus
          # refuses them; 0 in normal operation.
          - alert: MarketDataUnpublished
            expr: max by (symbol) (fs_unpublished_candles) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: 'Persisted candles not reaching the bus'
              description: '{{ $value | humanize }} persisted {{ $labels.symbol }} candles have waited for the bus for 15 minutes: message-manager refuses or holds the scraper publishes. They go out from MySQL, oldest first, once it answers; the trainer lags meanwhile (runbook-message-bus-outage)'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-message-bus-outage.md#5-scraper-publish-backlog'

          - alert: CandleDeliveryLagging
            expr: sum(increase(fs_candles_persisted_total[30m])) > 0 and sum(increase(tt_market_data_received_total[30m])) < 0.5 * sum(increase(fs_candles_persisted_total[30m]))
            for: 15m
            labels:
              severity: warning
              slo: data_freshness
            annotations:
              summary: 'Less than half of the persisted candles reach the trainer'
              description: 'financial-scraper persisted candles over the last 30m but trader-trainer received under 50% of them: the scraper to trainer path is lagging or dropping data.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-market-data-stale.md'

          - alert: TrainerMarketDataStale
            expr: sum(increase(tt_market_data_received_total[15m])) == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'trader-trainer receives no market data'
              description: 'No candle reached the trainer buffer in 15 minutes: the scraper, message-manager or the trainer subscription is broken.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-market-data-stale.md'

          # A trained model could not be stored (ADR-0022): the best agent then
          # only lives in the trainer memory, lost at the next restart. The series
          # exist at 0 from startup, so the first failure is an increase.
          - alert: ModelArtifactWriteFailing
            expr: sum by (job) (increase(tt_model_artifacts_total{result="error"}[30m])) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'Trained models are not stored on {{ $labels.job }}'
              description: '{{ $value | humanize }} model artifact write(s) failed in 30 minutes: the best agents are not kept. Check the trainer logs ("Failed to store model artifact") and TRAINER_MODEL_DIR (volume mounted, writable, not full).'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/runbooks/runbook-trainer.md#modelartifactwritefailing'

          - alert: AlertmanagerNotificationsFailing
            expr: sum by (integration) (increase(alertmanager_notifications_failed_total[1h])) > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'Alertmanager cannot deliver {{ $labels.integration }} notifications'
              description: 'Notifications through {{ $labels.integration }} fail: check the alertmanager-credentials Secret (webhook URL, routing key). This alert may not reach you: the dead man''s switch (Watchdog) is the safety net.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/ALERTING.md#alerts-on-the-alerting-path'

          - alert: PrometheusRuleEvaluationFailures
            expr: sum(rate(prometheus_rule_evaluation_failures_total[10m])) > 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: 'Prometheus fails to evaluate alert rules'
              description: 'Some alert rules cannot be evaluated: alerts may be silently missing.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/ALERTING.md#alerts-on-the-alerting-path'

          - alert: Watchdog
            expr: vector(1)
            for: 0m
            labels:
              severity: none
            annotations:
              summary: 'Alerting pipeline heartbeat'
              description: 'Always firing. Routed to the dead man''s switch (ALERTMANAGER_DEADMAN_URL): when it stops arriving, Prometheus, Alertmanager or the notification path is down.'
              runbook_url: 'https://github.com/docteur-turboss/trading-model/blob/main/docs/operations/ALERTING.md#dead-mans-switch'
