# Example: alertmanager notification credentials
#
# These values are expanded into alertmanager.yml at config load (envFrom on the
# StatefulSet). In deploy/k8s the Secret is generated by kustomize from
# infra/kustomization.yaml's secretGenerator `alertmanager-credentials` — edit
# the literals there, or patch the generated Secret directly:
#
#   kubectl -n trading-model patch secret alertmanager-credentials \
#     --type merge -p '{"data":{"SLACK_WEBHOOK_URL":"'$(printf %s "https://hooks.slack.com/services/T000/B000/XXXX" | base64 -w0)'"}}'
#
# For a plain (non-kustomize) apply, create the Secret manually:
#
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: alertmanager-credentials
#     namespace: trading-model
#   type: Opaque
#   stringData:
#     SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/T000/B000/XXXX"
#     SLACK_CHANNEL: "#alerts"
#     SLACK_CHANNEL_WARN: "#alerts-warning"
#     PAGERDUTY_URL: "https://events.pagerduty.com/v2/enqueue"
#     PAGERDUTY_ROUTING_KEY: "CHANGE_ME_PAGERDUTY_ROUTING_KEY"