# Example: Alertmanager notification credentials (Secret alertmanager-credentials)
#
# Alertmanager expands no environment variables: the Secret is mounted as files
# (/etc/alertmanager-credentials) and read at send time through
# slack_api_url_file, user_key_file, token_file and url_file (observability/alertmanager.yml).
#
# deploy.yml writes it from the GitHub environment secrets
# ALERTMANAGER_SLACK_WEBHOOK_URL, ALERTMANAGER_PUSHOVER_USER_KEY,
# ALERTMANAGER_PUSHOVER_TOKEN and
# ALERTMANAGER_DEADMAN_URL; production deploys fail without the Slack webhook
# and the dead man's switch. To create it by hand instead:
#
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: alertmanager-credentials
#     namespace: trading-model
#   type: Opaque
#   stringData:
#     SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/T000/B000/XXXX"
#     PUSHOVER_USER_KEY: "<Pushover user key>"
#     PUSHOVER_TOKEN: "<Pushover application API token>"
#     DEADMAN_URL: "https://hc-ping.com/<uuid>"
