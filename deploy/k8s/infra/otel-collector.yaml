apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/component: otel-collector
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 4318
      targetPort: 4318
      name: otlp-http
    - port: 8888
      targetPort: 8888
      name: metrics
  selector:
    app.kubernetes.io/component: otel-collector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/component: otel-collector
    app.kubernetes.io/part-of: trading-model
spec:
  # One replica: tail_sampling decides per collector on the spans it saw, so
  # every span of a trace must land on the same one.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/component: otel-collector
        app.kubernetes.io/part-of: trading-model
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          args:
            - "--config"
            - "/etc/otel-collector.yml"
          ports:
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8888
              name: metrics
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otel-collector.yml
              subPath: otel-collector.yml
              readOnly: true
          # health_check extension.
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app.kubernetes.io/component: otel-collector
    app.kubernetes.io/part-of: trading-model
data:
  otel-collector.yml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # First processor of every pipeline. The limit sits below the container's
      # 512Mi so the collector refuses data before the kernel kills it.
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      # Jaeger's Badger store grows with the span count (#1773): keep every trace
      # with an error span, 20 % of the others. Buffered traces (num_traces x
      # spans) stay well under limit_mib.
      tail_sampling:
        decision_wait: 10s
        num_traces: 10000
        policies:
          - name: errors
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: sample
            type: probabilistic
            probabilistic:
              sampling_percentage: 20
      batch:
        timeout: 1s
        send_batch_size: 1024

    exporters:
      otlp:
        endpoint: jaeger:4317
        tls:
          insecure: true
        # Jaeger is Recreate + Badger start (startupProbe up to 5 min): the
        # default 5 min retry dropped spans on every rollout (#2326).
        retry_on_failure:
          max_elapsed_time: 15m

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      # The collector's own metrics (otelcol_*) on :8888, scraped by the
      # `otel-collector` job. No metrics pipeline: the services only export
      # traces (telemetry.ts has no metric reader). A pull reader, not
      # `address`: the collector no longer accepts that key.
      telemetry:
        metrics:
          level: basic
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, tail_sampling, batch]
          exporters: [otlp]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-network-policy
  labels:
    app.kubernetes.io/component: otel-collector
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: otel-collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Same namespace as the policy, whatever the overlay's namespace.
        - podSelector: {}
      ports:
        - port: 4318
          protocol: TCP
        - port: 8888
          protocol: TCP
