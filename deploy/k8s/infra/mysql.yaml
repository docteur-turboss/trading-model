apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app.kubernetes.io/component: mysql
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app.kubernetes.io/component: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels:
    app.kubernetes.io/component: mysql
    app.kubernetes.io/part-of: trading-model
spec:
  serviceName: mysql-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/component: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mysql
        app.kubernetes.io/part-of: trading-model
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: mysql
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
          # Unique per pod.
          args:
            - "--server-id=10$(POD_INDEX)"
          ports:
            - containerPort: 3306
              name: mysql
            - containerPort: 33060
              name: mysqlx
          env:
            - name: POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: financial_scraper
            - name: MYSQL_USER
              value: scraper
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MYSQL_PASSWORD
            - name: MYSQL_INITDB_SKIP_TZINFO
              value: "1"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # The schema comes from the db-migrate Job (scripts/migrations),
            # as in compose: no second copy in /docker-entrypoint-initdb.d.
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-config
              mountPath: /etc/mysql/conf.d
            - name: mysql-tls
              mountPath: /etc/mysql-tls
              readOnly: true
          # The first start initializes the data directory (minutes on a slow
          # disk). Liveness killing it midway leaves a corrupt datadir that
          # never starts again: liveness only begins once MySQL answers.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysqladmin ping -h localhost -u root
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysqladmin ping -h localhost -u root
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysqladmin ping -h localhost -u root
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
        # Reloads the server certificate when cert-manager renews it (issue
        # #767): mysqld otherwise keeps serving the old one until it expires.
        # Connects through 127.0.0.1 (SAN of mysql-tls) as root with its client
        # certificate (Secret mysql-client-root; also the `mysql` client of
        # tests/k8s/run-kind.sh verify_mysql_tls); a failed
        # reload is logged and retried on the next tick.
        - name: tls-reload
          image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
          command:
            - sh
            - -c
            - |
              last=$(sha256sum /etc/mysql-tls/tls.crt)
              while sleep 60; do
                now=$(sha256sum /etc/mysql-tls/tls.crt) || continue
                [ "$now" = "$last" ] && continue
                if mysql --protocol=tcp -h 127.0.0.1 -uroot --ssl-mode=VERIFY_IDENTITY --ssl-ca=/etc/mysql-tls/ca.crt --ssl-cert=/etc/mysql-client-root/tls.crt --ssl-key=/etc/mysql-client-root/tls.key -e 'ALTER INSTANCE RELOAD TLS'; then
                  echo "server certificate reloaded"
                  last=$now
                else
                  echo "reload failed, retrying" >&2
                fi
              done
          env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MYSQL_ROOT_PASSWORD
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: mysql-tls
              mountPath: /etc/mysql-tls
              readOnly: true
            - name: mysql-client-root
              mountPath: /etc/mysql-client-root
              readOnly: true
        # Exporter of this member (issue #601, ADR-0056), as MySQL user
        # `exporter` (PROCESS, REPLICATION CLIENT, SELECT on performance_schema),
        # created by the db-migrate-user Job. Without its password key the
        # exporter reports mysql_up 0 (MySQLDown), the database is unaffected.
        - name: mysqld-exporter
          image: quay.io/prometheus/mysqld-exporter:v0.21.0@sha256:afad0c59a154fea24ca5ea0e6f95f2b0b168601b111266963dc8a347715b5318
          args:
            - --mysqld.address=127.0.0.1:3306
            - --mysqld.username=exporter
            - --config.my-cnf=/etc/mysql-client/exporter.cnf
          env:
            - name: MYSQLD_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MYSQL_EXPORTER_PASSWORD
                  optional: true
          ports:
            - containerPort: 9104
              name: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: mysql-client-tls
              mountPath: /etc/mysql-client
              readOnly: true
            # Client certificate of MySQL user `exporter` (not the server key).
            - name: mysql-client-exporter
              mountPath: /etc/mysql-tls
              readOnly: true
      volumes:
        - name: mysql-config
          configMap:
            name: mysql-config
        - name: mysql-tls
          secret:
            secretName: mysql-tls
        - name: mysql-client-exporter
          secret:
            secretName: mysql-client-exporter
        - name: mysql-client-root
          secret:
            secretName: mysql-client-root
        - name: mysql-client-tls
          configMap:
            name: mysql-client-tls
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mysql-pdb
  labels:
    app.kubernetes.io/component: mysql
    app.kubernetes.io/part-of: trading-model
spec:
  # ADR-0092: a voluntary drain is refused until the operator forces it.
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: mysql
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-network-policy
  labels:
    app.kubernetes.io/component: mysql
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mysql
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Clients of 3306 (issue #747): the market-data service and its
    # collector, the migration and retention Jobs. spire-server only for a rollback to a release before ADR-0065
    # (its datastore was the `spire` database): removed in a later release
    # (ADR-0040). Backups and restores go through `kubectl exec`, not the
    # network. A new client must be added here.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - financial-scraper
                  - financial-scraper-collector
                  - spire-server
                  - db-migrate
                  - db-migrate-down
                  - db-migrate-user
                  - db-index-build
                  - retention
                  - mysql
      ports:
        - port: 3306
          protocol: TCP
    # The exporter sidecar: Prometheus only.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: prometheus
      ports:
        - port: 9104
          protocol: TCP
  egress:
    - to:
        # Same namespace as the policy, whatever the overlay's namespace.
        - podSelector: {}
      ports:
        - port: 3306
          protocol: TCP
