apiVersion: v1
kind: Service
metadata:
  name: mongo-dlq-headless
  labels:
    app.kubernetes.io/component: mongodb
    app.kubernetes.io/part-of: trading-model
spec:
  clusterIP: None
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
  selector:
    app.kubernetes.io/component: mongodb
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-dlq
  labels:
    app.kubernetes.io/component: mongodb
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
  selector:
    app.kubernetes.io/component: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-dlq
  labels:
    app.kubernetes.io/component: mongodb
    app.kubernetes.io/part-of: trading-model
spec:
  serviceName: mongo-dlq-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mongodb
        app.kubernetes.io/part-of: trading-model
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: mongodb
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          image: mongo@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
          # Encryption at rest (--enableEncryption) is MongoDB Enterprise only:
          # this Community image refuses the flag and never starts with it.
          command:
            - mongod
          args:
            - "--replSet"
            - "rs0"
            - "--port"
            - "27017"
            - "--bind_ip"
            - "0.0.0.0"
          ports:
            - containerPort: 27017
              name: mongodb
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: mongo-dlq-data
              mountPath: /data/db
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "try { rs.status().ok } catch { 0 }"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
        # Exporter of this member (issue #601, ADR-0055): server status and
        # replica set state through localhost. No database user: MongoDB runs
        # without authentication (ADR-0055 defers it to its own issue).
        - name: mongodb-exporter
          image: percona/mongodb_exporter:0.47.1@sha256:8ba5d6e25fe7e30912f10b01a9e16e14c6c3af05f36dcaed0659690d70dc1670
          args:
            - --mongodb.uri=mongodb://127.0.0.1:27017/?directConnection=true
            - --collector.replicasetstatus
            - --web.listen-address=:9216
          ports:
            - containerPort: 9216
              name: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
  volumeClaimTemplates:
    - metadata:
        name: mongo-dlq-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-dlq-init
  labels:
    app.kubernetes.io/component: mongodb
    app.kubernetes.io/part-of: trading-model
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb-init
          image: mongo@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - mongosh
            - --host
            - mongo-dlq-0.mongo-dlq-headless:27017
            - --eval
            # Idempotent; members are the pods that answer, so an overlay that
            # scales the StatefulSet down (staging: 1) still gets a replica set.
            - |
              try { rs.status(); print("replica set already initiated"); quit(0); } catch (e) {}
              const hosts = [0, 1, 2]
                .map((i) => `mongo-dlq-${i}.mongo-dlq-headless:27017`)
                .filter((h) => { try { return new Mongo(h).getDB("admin").runCommand({ ping: 1 }).ok === 1; } catch (e) { return false; } });
              rs.initiate({ _id: "rs0", members: hosts.map((host, _id) => ({ _id, host })) });
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mongo-dlq-pdb
  labels:
    app.kubernetes.io/component: mongodb
    app.kubernetes.io/part-of: trading-model
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: mongodb
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-network-policy
  labels:
    app.kubernetes.io/component: mongodb
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mongodb
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Same namespace as the policy, whatever the overlay's namespace.
        - podSelector: {}
      ports:
        - port: 27017
          protocol: TCP
    # The exporter sidecar: Prometheus only.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: prometheus
      ports:
        - port: 9216
          protocol: TCP
