apiVersion: v1
kind: Service
metadata:
  name: mongo-dlq-headless
  labels:
    app.kubernetes.io/component: mongodb
    app.kubernetes.io/part-of: trading-model
spec:
  clusterIP: None
  # A restarted member must resolve its own name before it is Ready, or it
  # never finds itself in the replica set config ("not a member of it").
  publishNotReadyAddresses: true
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
  selector:
    app.kubernetes.io/component: mongodb
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-dlq
  labels:
    app.kubernetes.io/component: mongodb
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
  selector:
    app.kubernetes.io/component: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-dlq
  labels:
    app.kubernetes.io/component: mongodb
    app.kubernetes.io/part-of: trading-model
spec:
  serviceName: mongo-dlq-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mongodb
        app.kubernetes.io/part-of: trading-model
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: mongodb
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      # Replica set internal authentication (issue #669, ADR-0067). mongod
      # refuses a keyFile readable by its group, and the data volume's fsGroup
      # adds group read to a mounted Secret file: the key is copied to a 0400
      # file of the mongod user instead.
      initContainers:
        - name: keyfile
          image: mongo@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
          command:
            - sh
            - -c
            - umask 077 && printf '%s' "$KEYFILE" > /keyfile/keyfile && chmod 400 /keyfile/keyfile && cat /tls/tls.crt /tls/tls.key > /keyfile/server.pem && cp /tls/ca.crt /keyfile/ca.crt
          env:
            - name: KEYFILE
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MONGO_DLQ_KEYFILE
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: keyfile
              mountPath: /keyfile
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: keyfile
          emptyDir:
            medium: Memory
        - name: tls
          secret:
            secretName: mongo-dlq-tls
      containers:
        - name: mongodb
          image: mongo@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
          # Encryption at rest (--enableEncryption) is MongoDB Enterprise only:
          # this Community image refuses the flag and never starts with it.
          command:
            - mongod
          args:
            - "--replSet"
            - "rs0"
            - "--port"
            - "27017"
            - "--bind_ip"
            - "0.0.0.0"
            - "--keyFile"
            - "/keyfile/keyfile"
            # TLS expand step (issue #769, ADR-0060): TLS and clear text are both
            # accepted for one release, clients verify the certificate; `requireTLS`
            # replaces `preferTLS` in the next one. Clients send no certificate.
            - "--tlsMode"
            - "preferTLS"
            - "--tlsCertificateKeyFile"
            - "/keyfile/server.pem"
            - "--tlsCAFile"
            - "/keyfile/ca.crt"
            - "--tlsAllowConnectionsWithoutCertificates"
          ports:
            - containerPort: 27017
              name: mongodb
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # The scripts of deploy/ and backup run inside the pod with these.
          env:
            - name: MONGO_BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MONGO_BACKUP_PASSWORD
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MONGO_ROOT_PASSWORD
          volumeMounts:
            - name: mongo-dlq-data
              mountPath: /data/db
            - name: keyfile
              mountPath: /keyfile
              readOnly: true
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                # Fails only when the member left its own config ("not a member":
                # its name did not resolve at start, mongod never retries), so the
                # container restarts; a not yet initiated set stays alive.
                - "try { rs.status().ok } catch (e) { if (e.codeName === 'InvalidReplicaSetConfig') quit(1) }"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
        # Bootstrap of this member: replica set and root user through the localhost
        # exception (only a loopback connection of this pod gets it; a Job over the
        # network is refused: "no replset config", run 43340429996). Idempotent.
        - name: mongodb-bootstrap
          image: mongo@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
          env:
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MONGO_ROOT_PASSWORD
          command:
            - sh
            - -c
            - |
              M="mongosh --quiet --host 127.0.0.1 --port 27017"
              until $M --eval 'db.hello().ok' >/dev/null 2>&1; do sleep 2; done
              if [ "$HOSTNAME" = "mongo-dlq-0" ]; then
                $M --eval '
                  if (!db.hello().setName) {
                    const hosts = [0, 1, 2]
                      .map((i) => `mongo-dlq-${i}.mongo-dlq-headless:27017`)
                      .filter((h) => { try { return new Mongo(h).getDB("admin").runCommand({ ping: 1 }).ok === 1; } catch (e) { return false; } });
                    rs.initiate({ _id: "rs0", members: hosts.map((host, _id) => ({ _id, host })) });
                  }'
                until $M --eval 'db.hello().isWritablePrimary' | grep -qx true; do sleep 2; done
                $M --eval '
                  const admin = db.getSiblingDB("admin");
                  if (admin.system.users.countDocuments({}) === 0) {
                    admin.createUser({ user: "root", pwd: process.env.MONGO_ROOT_PASSWORD, roles: [{ role: "root", db: "admin" }] });
                  }'
              fi
              exec sleep infinity
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
        # Exporter of this member (issue #601, ADR-0056): server status and
        # replica set state through localhost, as the `exporter` user
        # (clusterMonitor only, ADR-0067).
        - name: mongodb-exporter
          image: percona/mongodb_exporter:0.47.1@sha256:8ba5d6e25fe7e30912f10b01a9e16e14c6c3af05f36dcaed0659690d70dc1670
          env:
            - name: MONGO_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MONGO_EXPORTER_PASSWORD
            - name: MONGODB_URI
              value: mongodb://exporter:$(MONGO_EXPORTER_PASSWORD)@127.0.0.1:27017/admin?directConnection=true
          args:
            - --collector.replicasetstatus
            - --web.listen-address=:9216
          ports:
            - containerPort: 9216
              name: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
  volumeClaimTemplates:
    - metadata:
        name: mongo-dlq-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
# Users of the replica set (issue #669, ADR-0067): root, exporter, backup and the
# client of this database, from deploy/mongo/users.js. Idempotent, so it runs
# again on every release (ttl: the finished Job is removed, a later apply
# creates it again) and applies a rotated password. Needs a primary, which
# the mongodb-bootstrap sidecar elects; the members that do not answer (staging: 1 pod) are
# only seeds.
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-dlq-users
  labels:
    app.kubernetes.io/component: mongodb
    app.kubernetes.io/part-of: trading-model
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      # Allowed in by the database NetworkPolicy (label of the init Job).
      labels:
        app.kubernetes.io/component: mongodb-init
        app.kubernetes.io/part-of: trading-model
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb-users
          image: mongo@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - mongosh
            - --quiet
            - "mongodb://mongo-dlq-0.mongo-dlq-headless:27017,mongo-dlq-1.mongo-dlq-headless:27017,mongo-dlq-2.mongo-dlq-headless:27017/admin?replicaSet=rs0"
            - --file
            - /scripts/users.js
          env:
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MONGO_ROOT_PASSWORD
            - name: MONGO_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MONGO_EXPORTER_PASSWORD
            - name: MONGO_BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MONGO_BACKUP_PASSWORD
            - name: MONGO_DLQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MONGO_DLQ_PASSWORD
            - name: MONGO_DLQ_DB
              value: dlq
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: mongo-users-script
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mongo-dlq-pdb
  labels:
    app.kubernetes.io/component: mongodb
    app.kubernetes.io/part-of: trading-model
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: mongodb
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-network-policy
  labels:
    app.kubernetes.io/component: mongodb
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mongodb
  policyTypes:
    - Ingress
  ingress:
    # Clients of 27017 (issue #727): the owner service, the replica set peers
    # and the init Job. Backups and restores go through `kubectl exec`, not
    # the network. A new client must be added here.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["dlq-service", "mongodb", "mongodb-init"]
      ports:
        - port: 27017
          protocol: TCP
    # The exporter sidecar: Prometheus only.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: prometheus
      ports:
        - port: 9216
          protocol: TCP
