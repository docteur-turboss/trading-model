# =============================================================================
#  backup-cronjob.yaml — Daily Database Backup CronJob
#  Runs backup-k8s.sh at 2:00 AM daily inside the K8s cluster.
#
#  Required secrets:
#    - trading-model-secrets (for MYSQL_ROOT_PASSWORD etc.)
#
#  Optional (S3 off-site):
#    - trading-model-backup-s3 (with keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: trading-model
  annotations:
    description: "Daily backup of MongoDB, MySQL, Redis, CA keys, and checkpoints"
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: backup-runner
          restartPolicy: Never
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/component: backup
                    topologyKey: kubernetes.io/hostname
          initContainers:
            - name: install-tools
              image: debian:bookworm-slim
              securityContext:
                runAsNonRoot: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              command:
                - sh
                - -c
                - |
                  apt-get update -qq && apt-get install -y --no-install-recommends \
                    default-mysql-client redis-tools awscli && \
                    rm -rf /var/lib/apt/lists/*
                  cp /usr/bin/mysql /tools/
                  cp /usr/bin/redis-cli /tools/
                  cp /usr/bin/aws /tools/
              volumeMounts:
                - name: tools
                  mountPath: /tools
          containers:
            - name: backup
              image: bitnami/kubectl@sha256:b29d8c1665b70817259ceecaea16ab27aab6368b48daf485d19436c809067492
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              command:
                - sh
                - -c
                - |
                  set -euo pipefail
                  cp /tools/* /usr/local/bin/
                  chmod +x /usr/local/bin/aws /usr/local/bin/mysql /usr/local/bin/redis-cli
                  /scripts/backup-k8s.sh \
                    --components mongodb,mysql,redis,checkpoints,spire
              env:
                - name: BACKUP_DIR
                  value: /backups
                - name: METRICS_FILE
                  value: /backups/metrics/backup.prom
                - name: RETENTION_DAYS
                  value: "30"
                - name: K8S_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: BACKUP_S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: trading-model-backup-s3
                      key: BACKUP_S3_BUCKET
                      optional: true
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: trading-model-backup-s3
                      key: AWS_ACCESS_KEY_ID
                      optional: true
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: trading-model-backup-s3
                      key: AWS_SECRET_ACCESS_KEY
                      optional: true
                - name: AWS_REGION
                  valueFrom:
                    secretKeyRef:
                      name: trading-model-backup-s3
                      key: AWS_REGION
                      optional: true
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    secretKeyRef:
                      name: trading-model-backup-s3
                      key: AWS_REGION
                      optional: true
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tools
                  mountPath: /tools
                  readOnly: true
                - name: backup-data
                  mountPath: /backups
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
          volumes:
            - name: scripts
              configMap:
                name: backup-scripts
                defaultMode: 0555
            - name: tools
              emptyDir: {}
            - name: backup-data
              persistentVolumeClaim:
                claimName: backup-data
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-data
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: trading-model
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-runner
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: trading-model
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-runner
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: trading-model
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["trading-model-secrets", "trading-model-backup-s3"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-runner
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: trading-model
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup-runner
subjects:
  - kind: ServiceAccount
    name: backup-runner
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-metrics-exporter
  labels:
    app.kubernetes.io/component: backup-metrics
    app.kubernetes.io/part-of: trading-model
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: backup-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backup-metrics
        app.kubernetes.io/part-of: trading-model
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -c
            - |
              apk add --no-cache busybox-extras
              mkdir -p /tmp/metrics
              echo '# No backup metrics yet' > /tmp/metrics/index.html
              httpd -f -p 9118 -h /tmp/metrics &
              HTTPD_PID=$!
              while true; do
                if [ -f /metrics/backup.prom ]; then
                  cp /metrics/backup.prom /tmp/metrics/index.html
                fi
                sleep 5
              done
          ports:
            - name: metrics
              containerPort: 9118
          volumeMounts:
            - name: backup-data
              mountPath: /metrics
              subPath: metrics
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: backup-data
          persistentVolumeClaim:
            claimName: backup-data
---
apiVersion: v1
kind: Service
metadata:
  name: backup-metrics-exporter
  labels:
    app.kubernetes.io/component: backup-metrics
    app.kubernetes.io/part-of: trading-model
spec:
  selector:
    app.kubernetes.io/component: backup-metrics
  ports:
    - name: metrics
      port: 9118
      targetPort: 9118
