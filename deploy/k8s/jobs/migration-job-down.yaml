# =============================================================================
#  migration-job-down.yaml — Database Rollback Job
#  Rolls back applied SQL migrations against the MySQL database.
#
#  Used in the deployment rollback runbook (audit A10). Normally run through
#  `deploy/k8s/scripts/deploy-k8s.sh migrate-down [N|all]`, which does the
#  steps below. Migrations are rolled back newest first.
#
#  ROLLBACK_COUNT (a positive integer, or "all" for every applied migration)
#  comes from the ConfigMap `migration-rollback`. It is required, so a stale or
#  missing value is never picked up silently: always (re)create it before the
#  job. The pod template of a Job is immutable: delete the previous job first.
#  The migrations are in the db-migrate image: use the digest of the release
#  whose migrations are rolled back (MIGRATE_IMAGE, see deploy-k8s.sh).
#
#    kubectl create configmap migration-rollback -n <ns> \
#      --from-literal=ROLLBACK_COUNT=<N|all> --dry-run=client -o yaml | kubectl apply -f -
#    kubectl delete job db-migrate-down -n <ns> --ignore-not-found
#    kubectl apply -n <ns> -f deploy/k8s/jobs/migration-job-down.yaml
#    kubectl wait --for=condition=complete job/db-migrate-down -n <ns> --timeout=180s
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate-down
  annotations:
    description: "Rolls back MySQL schema migrations (rollback runbook)"
    app.kubernetes.io/part-of: trading-model
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/component: db-migrate-down
        app.kubernetes.io/part-of: trading-model
    spec:
      serviceAccountName: migration-runner
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/trading-model/db-migrate:latest
          # run-migrations.sh pins the digest; IfNotPresent also lets kind use the loaded image.
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          args:
            - down
            - $(ROLLBACK_COUNT)
          env:
            - name: ROLLBACK_COUNT
              valueFrom:
                configMapKeyRef:
                  name: migration-rollback
                  key: ROLLBACK_COUNT
            - name: DB_HOST
              value: mysql-primary
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: migrator
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MYSQL_MIGRATE_PASSWORD
            - name: DB_NAME
              value: financial_scraper
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migration-runner
  annotations:
    app.kubernetes.io/part-of: trading-model
automountServiceAccountToken: false