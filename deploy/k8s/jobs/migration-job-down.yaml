# =============================================================================
#  migration-job-down.yaml — Database Rollback Job
#  Rolls back applied SQL migrations against the MySQL database.
#
#  Used in the deployment rollback runbook (audit A10): create the
#  `migration-files` ConfigMap exactly like the up job, apply this job, wait
#  for completion. Rollback count is configurable via ROLLBACK_COUNT
#  (default: 1; "all" rolls back every applied migration).
#
#    kubectl create configmap migration-files -n <ns> \
#      --from-file=migrate.mjs=scripts/migrate.mjs \
#      --from-file=scripts/migrations --dry-run=client -o yaml | kubectl apply -f -
#    kubectl apply -n <ns> -f deploy/k8s/jobs/migration-job-down.yaml
#    kubectl wait --for=condition=complete job/db-migrate-down -n <ns> --timeout=180s
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate-down
  namespace: trading-model
  annotations:
    description: "Rolls back MySQL schema migrations (rollback runbook)"
    app.kubernetes.io/part-of: trading-model
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    spec:
      serviceAccountName: migration-runner
      restartPolicy: Never
      containers:
        - name: migrate
          image: oven/bun:1-alpine
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              apk add --no-cache curl
              cd /migrations
              bun add mysql2 2>/dev/null
              bun /migrations/migrate.mjs down "${ROLLBACK_COUNT:-1}"
          env:
            - name: ROLLBACK_COUNT
              valueFrom:
                configMapKeyRef:
                  name: migration-files
                  key: ROLLBACK_COUNT
                  optional: true
            - name: DB_HOST
              value: mysql-primary
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: DB_NAME
              value: financial_scraper
          volumeMounts:
            - name: migration-files
              mountPath: /migrations
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: migration-files
          configMap:
            name: migration-files
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migration-runner
  namespace: trading-model
  annotations:
    app.kubernetes.io/part-of: trading-model
automountServiceAccountToken: false