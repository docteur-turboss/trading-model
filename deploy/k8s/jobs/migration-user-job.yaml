# =============================================================================
#  migration-user-job.yaml — MySQL user of the migration Jobs
#  Creates (or updates) the `migrator` user: DDL/DML on financial_scraper only,
#  no other schema, no administrative privilege. db-migrate and
#  db-migrate-down connect as this user, never as root.
#
#  This is the only Job that reads MYSQL_ROOT_PASSWORD. It is idempotent, so it
#  runs on every deploy (deploy/k8s/scripts/run-migrations.sh): it covers a
#  database initialised before the user existed, and applies a rotated
#  MYSQL_MIGRATE_PASSWORD. Delete the previous job first (immutable template).
#
#  Also creates the `retention` user of the db-retention CronJob (ADR-0051):
#  SELECT and DELETE on the four purged tables, nothing else. Its password is
#  MYSQL_RETENTION_PASSWORD (optional key: a cluster whose Secret does not have
#  it yet skips the user, and db-retention then fails visibly).
#
#  And the `exporter` user of the mysqld-exporter sidecars (ADR-0056): PROCESS,
#  REPLICATION CLIENT, SELECT on performance_schema, 3 connections at most, no
#  application data. Password MYSQL_EXPORTER_PASSWORD (optional key, skipped
#  when absent: the exporters then report mysql_up 0).
#
#  Every network user (migrator, retention, exporter, spire, and the image
#  users scraper and root) is bound to its cert-manager client certificate with
#  REQUIRE ISSUER / SUBJECT (issue #767, mysql-tls.yaml): CN = user name.
#
#  And the `spire` database and user of the SPIRE server datastore (issue
#  #807): ALL PRIVILEGES on spire.* only, so the SPIRE pod never holds
#  MYSQL_ROOT_PASSWORD. Password MYSQL_SPIRE_PASSWORD (required key:
#  run-migrations.sh applies the SealedSecret before this Job, and this Job
#  before the overlay that starts the new SPIRE server).
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate-user
  annotations:
    description: "Creates the least-privilege MySQL user of the migration Jobs"
    app.kubernetes.io/part-of: trading-model
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/component: db-migrate-user
        app.kubernetes.io/part-of: trading-model
    spec:
      serviceAccountName: migration-runner
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: mysql@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -c
            - |
              set -eu
              # The password goes into a SQL string literal: refuse characters that
              # would need escaping (init-sealed-secrets.sh generates hex).
              case "$MIGRATE_PASSWORD" in
                ""|*[!A-Za-z0-9_.@%+=-]*) echo "MYSQL_MIGRATE_PASSWORD must be non-empty and match [A-Za-z0-9_.@%+=-]" >&2; exit 1 ;;
              esac
              pw="$MIGRATE_PASSWORD"
              rpw="${RETENTION_PASSWORD:-}"
              case "$rpw" in
                *[!A-Za-z0-9_.@%+=-]*) echo "MYSQL_RETENTION_PASSWORD must match [A-Za-z0-9_.@%+=-]" >&2; exit 1 ;;
              esac
              epw="${EXPORTER_PASSWORD:-}"
              case "$epw" in
                *[!A-Za-z0-9_.@%+=-]*) echo "MYSQL_EXPORTER_PASSWORD must match [A-Za-z0-9_.@%+=-]" >&2; exit 1 ;;
              esac
              case "$SPIRE_PASSWORD" in
                ""|*[!A-Za-z0-9_.@%+=-]*) echo "MYSQL_SPIRE_PASSWORD must be non-empty and match [A-Za-z0-9_.@%+=-]" >&2; exit 1 ;;
              esac
              export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"
              # TLS_BIND=false (first upgrade, mysqld still on its auto-generated certificate, which
              # rejects our client certificate): no REQUIRE yet; run-migrations.sh runs this job again
              # once mysqld serves the cert-manager certificate (docs/deployment/MYSQL_TLS.md).
              rq() { [ "${TLS_BIND:-true}" = false ] || echo "REQUIRE ISSUER '/CN=trading-model-mysql-ca' AND SUBJECT '/CN=$1'"; }
              mysql -h mysql-primary -u root <<EOSQL
              CREATE USER IF NOT EXISTS 'migrator'@'%' IDENTIFIED BY '${pw}';
              ALTER USER 'migrator'@'%' IDENTIFIED BY '${pw}' $(rq migrator);
              GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, INDEX, REFERENCES, EVENT, TRIGGER
                ON financial_scraper.* TO 'migrator'@'%';
              EOSQL
              echo "migrator user ready"
              mysql -h mysql-primary -u root <<EOSQL
              CREATE DATABASE IF NOT EXISTS spire;
              CREATE USER IF NOT EXISTS 'spire'@'%' IDENTIFIED BY '${SPIRE_PASSWORD}';
              ALTER USER 'spire'@'%' IDENTIFIED BY '${SPIRE_PASSWORD}' $(rq spire);
              GRANT ALL PRIVILEGES ON spire.* TO 'spire'@'%';
              EOSQL
              echo "spire user ready"
              # Client certificates (issue #767): the password alone no longer opens a
              # session for these users; this job itself presents the root one.
              if [ "${TLS_BIND:-true}" != false ]; then
                mysql -h mysql-primary -u root <<EOSQL
              ALTER USER IF EXISTS 'scraper'@'%' $(rq scraper);
              ALTER USER IF EXISTS 'root'@'%' $(rq root);
              EOSQL
                # A rollback (relax_mysql in deploy-release.sh) lifts it at runtime on every member
                # without restarting mysqld: put it back on the redeploy of release N.
                # Members that do not exist (kind runs fewer replicas) have no DNS record: skip them.
                for h in mysql-0 mysql-1 mysql-2; do
                  getent hosts "$h.mysql-headless" >/dev/null || continue
                  mysql -h "$h.mysql-headless" -u root -e "SET GLOBAL require_secure_transport=ON"
                done
              fi
              echo "scraper and root require their client certificate"
              if [ -n "$epw" ]; then
                mysql -h mysql-primary -u root <<EOSQL
              CREATE USER IF NOT EXISTS 'exporter'@'%' IDENTIFIED BY '${epw}' WITH MAX_USER_CONNECTIONS 3;
              ALTER USER 'exporter'@'%' IDENTIFIED BY '${epw}' $(rq exporter) WITH MAX_USER_CONNECTIONS 3;
              GRANT PROCESS, REPLICATION CLIENT ON *.* TO 'exporter'@'%';
              GRANT SELECT ON performance_schema.* TO 'exporter'@'%';
              EOSQL
                echo "exporter user ready"
              else
                echo "MYSQL_EXPORTER_PASSWORD not set: exporter user skipped (mysql_up stays 0 until it is)"
              fi
              if [ -z "$rpw" ]; then
                echo "MYSQL_RETENTION_PASSWORD not set: retention user skipped (db-retention will fail until it is)"
                exit 0
              fi
              # The tables exist once the migrations ran: the job runs before them
              # on a new database, so grant only when they are there.
              mysql -h mysql-primary -u root <<EOSQL
              CREATE USER IF NOT EXISTS 'retention'@'%' IDENTIFIED BY '${rpw}';
              ALTER USER 'retention'@'%' IDENTIFIED BY '${rpw}' $(rq retention);
              EOSQL
              for t in market_candles market_trades market_tickers market_order_books signals; do
                if [ "$(mysql -h mysql-primary -u root -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='financial_scraper' AND table_name='$t'")" = 1 ]; then
                  mysql -h mysql-primary -u root -e "GRANT SELECT, DELETE ON financial_scraper.$t TO 'retention'@'%'"
                else
                  echo "table $t not created yet: grant on the next run (run-migrations.sh runs this job again after the migrations)"
                fi
              done
              echo "retention user ready"
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MIGRATE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MYSQL_MIGRATE_PASSWORD
            - name: SPIRE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MYSQL_SPIRE_PASSWORD
            - name: RETENTION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MYSQL_RETENTION_PASSWORD
                  optional: true
            - name: EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MYSQL_EXPORTER_PASSWORD
                  optional: true
            # mysql client: TLS with host name check (my.cnf of ConfigMap mysql-client-tls, ADR-0060).
            - name: MYSQL_HOME
              value: /etc/mysql-client
          volumeMounts:
            - name: mysql-tls
              mountPath: /etc/mysql-tls
              readOnly: true
            - name: mysql-client-tls
              mountPath: /etc/mysql-client
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: mysql-tls
          secret:
            secretName: mysql-client-root
        - name: mysql-client-tls
          configMap:
            name: mysql-client-tls
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migration-runner
  annotations:
    app.kubernetes.io/part-of: trading-model
automountServiceAccountToken: false
