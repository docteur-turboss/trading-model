apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - backup-cronjob.yaml
  - backup-incremental-cronjob.yaml
  - secret-rotation-cronjob.yaml

configMapGenerator:
  - name: backup-scripts
    files:
      - backup-k8s.sh=../../../scripts/backup-k8s.sh
      - backup-incremental-k8s.sh=../../../scripts/backup-incremental-k8s.sh
      - backup-lib.sh=../../../scripts/backup-lib.sh
      # Mounted the same way by a restore Job (docs/deployment/BACKUP_DR.md).
      - restore-k8s.sh=../../../scripts/restore-k8s.sh
      # Fetches a run from the off-site bucket after the loss of backup-data.
      - fetch-offsite.sh=../../../scripts/fetch-offsite.sh
    options:
      disableNameSuffixHash: true