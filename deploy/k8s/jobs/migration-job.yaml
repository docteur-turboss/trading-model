# =============================================================================
#  migration-job.yaml — Database Migration Job
#  Runs pending SQL migrations against the MySQL database before deployment.
#
#  The migrations are in the db-migrate image (deploy/migrate, released by
#  release.yml), connecting as the `migrator` user (migration-user-job.yaml).
#  deploy/k8s/scripts/run-migrations.sh pins the image by digest, applies this
#  job and waits for it.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  annotations:
    description: "Runs pending MySQL schema migrations"
    app.kubernetes.io/part-of: trading-model
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/component: db-migrate
        app.kubernetes.io/part-of: trading-model
    spec:
      serviceAccountName: migration-runner
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/trading-model/db-migrate:latest
          # run-migrations.sh pins the digest; IfNotPresent also lets kind use the loaded image.
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          args:
            - up
          env:
            - name: DB_HOST
              value: mysql-primary
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: migrator
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MYSQL_MIGRATE_PASSWORD
            - name: DB_NAME
              value: financial_scraper
            # Server certificate checked with the internal CA, host name included (ADR-0060).
            - name: DB_SSL_CA
              value: /etc/mysql-tls/ca.crt
          volumeMounts:
            - name: mysql-tls
              mountPath: /etc/mysql-tls
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: mysql-tls
          secret:
            secretName: mysql-tls
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migration-runner
  annotations:
    app.kubernetes.io/part-of: trading-model
automountServiceAccountToken: false
