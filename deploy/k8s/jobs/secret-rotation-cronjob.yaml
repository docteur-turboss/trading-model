apiVersion: batch/v1
kind: CronJob
metadata:
  name: secret-rotation
  labels:
    app.kubernetes.io/component: secret-rotation
    app.kubernetes.io/part-of: trading-model
spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 4
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: secret-rotator
          automountServiceAccountToken: true
          restartPolicy: Never
          containers:
            - name: rotator
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "=== Weekly Secret Rotation ==="
                  # Rotate HMAC secret
                  echo "Rotating HMAC secrets..."
                  kubectl rollout restart deployment/discovery-server -n trading-model
                  kubectl rollout status deployment/discovery-server -n trading-model --timeout=120s
                  # Rotate admin tokens
                  echo "Rotating admin tokens..."
                  kubectl rollout restart deployment/api-gateway -n trading-model
                  kubectl rollout status deployment/api-gateway -n trading-model --timeout=120s
                  echo "=== Secret rotation complete ==="
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-rotator
  labels:
    app.kubernetes.io/component: secret-rotation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-rotator-role
  labels:
    app.kubernetes.io/component: secret-rotation
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, update, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch, update]
  - apiGroups: [bitnami.com]
    resources: [sealedsecrets]
    verbs: [get, list, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-rotator-binding
  labels:
    app.kubernetes.io/component: secret-rotation
subjects:
  - kind: ServiceAccount
    name: secret-rotator
roleRef:
  kind: Role
  name: secret-rotator-role
  apiGroup: rbac.authorization.k8s.io
