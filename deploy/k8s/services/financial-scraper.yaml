apiVersion: v1
kind: Service
metadata:
  name: financial-scraper
  labels:
    app.kubernetes.io/component: financial-scraper
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: https
  selector:
    app.kubernetes.io/component: financial-scraper
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: financial-scraper
  labels:
    app.kubernetes.io/component: financial-scraper
    app.kubernetes.io/part-of: trading-model
spec:
  strategy:
    # Surge first: with one replica (staging), maxUnavailable 1 left no ready
    # pod until the new one was ready (issue #699, as discovery-server #486).
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: financial-scraper
  template:
    metadata:
      labels:
        app.kubernetes.io/component: financial-scraper
        app.kubernetes.io/part-of: trading-model
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/scheme: "https"
    spec:
      serviceAccountName: financial-scraper
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Even spread (ADR-0024): at most one pod more on a node than on the
      # emptiest one; the zone is best effort (nodes without the label qualify).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: financial-scraper
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: financial-scraper
      containers:
        - name: financial-scraper
          image: ghcr.io/trading-model/financial-scraper:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
              name: https
          envFrom:
            - configMapRef:
                name: financial-scraper-config
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MYSQL_PASSWORD
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MYSQL_PASSWORD
            - name: ERROR_URL_WEBHOOK
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: svid
              mountPath: /run/spire/svid
            - name: tmp
              mountPath: /tmp
            - name: mysql-tls
              mountPath: /etc/mysql-tls
              readOnly: true
          livenessProbe:
            exec:
              command:
                - curl
                - -skf
                - --cert
                - /run/spire/svid/svid.pem
                - --key
                - /run/spire/svid/svid_key.pem
                - https://localhost:3000/ping
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - curl
                - -skf
                - --cert
                - /run/spire/svid/svid.pem
                - --key
                - /run/spire/svid/svid_key.pem
                - https://localhost:3000/health/ready
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
          startupProbe:
            exec:
              command:
                - curl
                - -skf
                - --cert
                - /run/spire/svid/svid.pem
                - --key
                - /run/spire/svid/svid_key.pem
                - https://localhost:3000/ping
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.10.1@sha256:2402c34d83794aa24c127baa46e9732d653463f3bfcd39cda1313003ed60f8c9
          imagePullPolicy: IfNotPresent
          args:
            - -config
            - /etc/spiffe-helper/helper.conf
          volumeMounts:
            - name: spiffe-helper-config
              mountPath: /etc/spiffe-helper
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/agent-sockets
            - name: svid
              mountPath: /run/spire/svid
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: spiffe-helper-config
          configMap:
            name: spiffe-helper-config
        # Workload API socket from the SPIFFE CSI driver (node-agents): the
        # restricted Pod Security profile forbids a hostPath.
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: svid
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: mysql-tls
          secret:
            secretName: mysql-client-scraper
---
# Scrape-cron instance (SCRAPE_SCHEDULER_ENABLED=true). It has its own
# ServiceAccount, mapped by SPIRE to the SPIFFE ID of financial-scraper but not its Service: API
# traffic stays on the HPA-scaled replicas. This Service only exposes /metrics.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: financial-scraper-collector
  labels:
    app.kubernetes.io/component: financial-scraper-collector
    app.kubernetes.io/part-of: trading-model
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: financial-scraper-collector
  labels:
    app.kubernetes.io/component: financial-scraper-collector
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: https
  selector:
    app.kubernetes.io/component: financial-scraper-collector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: financial-scraper-collector
  labels:
    app.kubernetes.io/component: financial-scraper-collector
    app.kubernetes.io/part-of: trading-model
spec:
  # One collector, no HPA. During a rollout the new pod starts next to the old
  # one; only the holder of the Lease below runs the crons (ADR-0057). The old
  # pod drains and releases it on SIGTERM, the new one takes it within 2 s.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: financial-scraper-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/component: financial-scraper-collector
        app.kubernetes.io/part-of: trading-model
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/scheme: "https"
    spec:
      serviceAccountName: financial-scraper-collector
      # The token reads and renews the Lease (Role financial-scraper-collector-lease);
      # the HTTP replicas use the financial-scraper ServiceAccount, which has no
      # binding. SPIRE maps this one to the SPIFFE ID of financial-scraper (k8s-entries.sh).
      automountServiceAccountToken: true
      # On stop the collector waits for its publishes in flight, each bounded by
      # PUBLISH_ACCEPT_TIMEOUT_MS (15s + 5s, the grace then cuts what remains: the cursor republishes).
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: financial-scraper-collector
          image: ghcr.io/trading-model/financial-scraper:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
              name: https
          envFrom:
            - configMapRef:
                name: financial-scraper-config
          env:
            - name: SCRAPE_SCHEDULER_ENABLED
              value: "true"
            # Only its holder collects (ADR-0057).
            - name: COLLECTOR_LEASE_NAME
              value: financial-scraper-collector
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MYSQL_PASSWORD
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: MYSQL_PASSWORD
            - name: ERROR_URL_WEBHOOK
              value: ""
            # Contact e-mail of the signal sources (ADR-0036), written by
            # deploy.yml from the GitHub secret SIGNAL_CONTACT_EMAIL: never in
            # the public repository. Absent: no contact (SEC EDGAR 403).
            - name: SIGNAL_CONTACT_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: signal-contact
                  key: SIGNAL_CONTACT_EMAIL
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: svid
              mountPath: /run/spire/svid
            - name: tmp
              mountPath: /tmp
            - name: mysql-tls
              mountPath: /etc/mysql-tls
              readOnly: true
          livenessProbe:
            exec:
              command:
                - curl
                - -skf
                - --cert
                - /run/spire/svid/svid.pem
                - --key
                - /run/spire/svid/svid_key.pem
                - https://localhost:3000/ping
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - curl
                - -skf
                - --cert
                - /run/spire/svid/svid.pem
                - --key
                - /run/spire/svid/svid_key.pem
                - https://localhost:3000/health/ready
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
          startupProbe:
            exec:
              command:
                - curl
                - -skf
                - --cert
                - /run/spire/svid/svid.pem
                - --key
                - /run/spire/svid/svid_key.pem
                - https://localhost:3000/ping
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.10.1@sha256:2402c34d83794aa24c127baa46e9732d653463f3bfcd39cda1313003ed60f8c9
          imagePullPolicy: IfNotPresent
          args:
            - -config
            - /etc/spiffe-helper/helper.conf
          volumeMounts:
            - name: spiffe-helper-config
              mountPath: /etc/spiffe-helper
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/agent-sockets
            - name: svid
              mountPath: /run/spire/svid
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: spiffe-helper-config
          configMap:
            name: spiffe-helper-config
        # Workload API socket from the SPIFFE CSI driver (node-agents): the
        # restricted Pod Security profile forbids a hostPath.
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: svid
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: mysql-tls
          secret:
            secretName: mysql-client-scraper
---
# Leader lease of the collector pods (ADR-0057). Created here, so the Role
# below needs no `create` (which resourceNames cannot restrict). Applied
# without spec: a release never overwrites the current holder.
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: financial-scraper-collector
  labels:
    app.kubernetes.io/component: financial-scraper-collector
    app.kubernetes.io/part-of: trading-model
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: financial-scraper-collector-lease
  labels:
    app.kubernetes.io/component: financial-scraper-collector
    app.kubernetes.io/part-of: trading-model
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [financial-scraper-collector]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: financial-scraper-collector-lease
  labels:
    app.kubernetes.io/component: financial-scraper-collector
    app.kubernetes.io/part-of: trading-model
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: financial-scraper-collector-lease
subjects:
  - kind: ServiceAccount
    name: financial-scraper-collector
