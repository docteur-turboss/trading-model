apiVersion: v1
kind: Service
metadata:
  name: risk-execution
  labels:
    app.kubernetes.io/component: risk-execution
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: https
  selector:
    app.kubernetes.io/component: risk-execution
---
# One replica, no HPA: the state lives on a ReadWriteOnce volume
# (ADR-0064: kill switch, orders, paper ledger): one pod owns it, so a rollout
# stops the old pod first (Recreate), and the service is not ready until its
# first reconciliation passed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-execution
  labels:
    app.kubernetes.io/component: risk-execution
    app.kubernetes.io/part-of: trading-model
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: risk-execution
  template:
    metadata:
      labels:
        app.kubernetes.io/component: risk-execution
        app.kubernetes.io/part-of: trading-model
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/scheme: "https"
    spec:
      serviceAccountName: risk-execution
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.12.4@sha256:8c63bb63f61c00ab79080fd7dea80cecb47558989c2b8d84f6a6d0dc7a1fba32
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          startupProbe:
            httpGet:
              path: /ready
              port: 8081
            periodSeconds: 1
            failureThreshold: 120
          args:
            - -config
            - /etc/spiffe-helper/helper.conf
          volumeMounts:
            - name: spiffe-helper-config
              mountPath: /etc/spiffe-helper
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/agent-sockets
            - name: svid
              mountPath: /run/spire/svid
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: risk-execution
          image: ghcr.io/trading-model/risk-execution:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
              name: https
          envFrom:
            - configMapRef:
                name: risk-execution-config
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=192
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: svid
              mountPath: /run/spire/svid
            - name: tmp
              mountPath: /tmp
            - name: state
              mountPath: /data/risk-execution
            - name: trainer-models
              mountPath: /data/checkpoints
              readOnly: true
          livenessProbe:
            exec:
              command:
                - node
                - /app/probe.js
                - https://localhost:3000/ping
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - node
                - /app/probe.js
                - https://localhost:3000/health/ready
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            successThreshold: 1
          startupProbe:
            exec:
              command:
                - node
                - /app/probe.js
                - https://localhost:3000/ping
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10
      volumes:
        - name: spiffe-helper-config
          configMap:
            name: spiffe-helper-config
        # Workload API socket from the SPIFFE CSI driver (node-agents): the
        # restricted Pod Security profile forbids a hostPath.
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: svid
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: state
          persistentVolumeClaim:
            claimName: risk-execution-pvc
        - name: trainer-models
          persistentVolumeClaim:
            claimName: trainer-checkpoints-pvc
            readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: risk-execution-pvc
  labels:
    app.kubernetes.io/component: risk-execution
    app.kubernetes.io/part-of: trading-model
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: risk-execution-network-policy
  labels:
    app.kubernetes.io/component: risk-execution
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: risk-execution
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # Same namespace as the policy, whatever the overlay's namespace.
        - podSelector: {}
      ports:
        - port: 3000
          protocol: TCP
  egress:
    # discovery-server and trader-trainer (HTTPS on 3000).
    - to:
        - podSelector: {}
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: risk-execution
  labels:
    app.kubernetes.io/component: risk-execution
    app.kubernetes.io/part-of: trading-model
automountServiceAccountToken: false
