apiVersion: v1
kind: Service
metadata:
  name: model-evaluator
  labels:
    app.kubernetes.io/component: model-evaluator
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: https
  selector:
    app.kubernetes.io/component: model-evaluator
---
# One replica, no HPA: the evaluation records live on a ReadWriteOnce volume
# (ADR-0049), so a rollout stops the old pod first (Recreate). A bus delivery
# missed meanwhile is retried by message-manager.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-evaluator
  labels:
    app.kubernetes.io/component: model-evaluator
    app.kubernetes.io/part-of: trading-model
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: model-evaluator
  template:
    metadata:
      labels:
        app.kubernetes.io/component: model-evaluator
        app.kubernetes.io/part-of: trading-model
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/scheme: "https"
    spec:
      serviceAccountName: model-evaluator
      # preStop 10 s + longest bus handler (HANDLER_TIMEOUT_MS, 85 s) + HTTP close.
      # Recreate: a rollout waits at most this long for a running evaluation.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.10.1@sha256:2402c34d83794aa24c127baa46e9732d653463f3bfcd39cda1313003ed60f8c9
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          startupProbe:
            httpGet:
              path: /ready
              port: 8081
            periodSeconds: 1
            failureThreshold: 120
          args:
            - -config
            - /etc/spiffe-helper/helper.conf
          volumeMounts:
            - name: spiffe-helper-config
              mountPath: /etc/spiffe-helper
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/agent-sockets
            - name: svid
              mountPath: /run/spire/svid
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: model-evaluator
          image: ghcr.io/trading-model/model-evaluator:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
              name: https
          envFrom:
            - configMapRef:
                name: model-evaluator-config
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=192
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_MODEL_EVALUATOR_PASSWORD
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_INTERNAL_PASSWORD
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: svid
              mountPath: /run/spire/svid
            - name: tmp
              mountPath: /tmp
            - name: redis-tls
              mountPath: /etc/redis-tls
              readOnly: true
            - name: evaluations
              mountPath: /data/evaluations
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - 'const f=require("fs"),d="/run/spire/svid/";require("https").get(process.argv[1],{cert:f.readFileSync(d+"svid.pem"),key:f.readFileSync(d+"svid_key.pem"),rejectUnauthorized:false},r=>{r.pipe(process.stdout);process.exitCode=r.statusCode<300?0:1}).on("error",()=>process.exit(1))'
                - https://localhost:3000/ping
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - 'const f=require("fs"),d="/run/spire/svid/";require("https").get(process.argv[1],{cert:f.readFileSync(d+"svid.pem"),key:f.readFileSync(d+"svid_key.pem"),rejectUnauthorized:false},r=>{r.pipe(process.stdout);process.exitCode=r.statusCode<300?0:1}).on("error",()=>process.exit(1))'
                - https://localhost:3000/health/ready
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
          startupProbe:
            exec:
              command:
                - node
                - -e
                - 'const f=require("fs"),d="/run/spire/svid/";require("https").get(process.argv[1],{cert:f.readFileSync(d+"svid.pem"),key:f.readFileSync(d+"svid_key.pem"),rejectUnauthorized:false},r=>{r.pipe(process.stdout);process.exitCode=r.statusCode<300?0:1}).on("error",()=>process.exit(1))'
                - https://localhost:3000/ping
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10
      volumes:
        - name: spiffe-helper-config
          configMap:
            name: spiffe-helper-config
        # Workload API socket from the SPIFFE CSI driver (node-agents): the
        # restricted Pod Security profile forbids a hostPath.
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: svid
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: redis-tls
          secret:
            secretName: redis-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: evaluations
          persistentVolumeClaim:
            claimName: model-evaluations-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-evaluations-pvc
  labels:
    app.kubernetes.io/component: model-evaluator
    app.kubernetes.io/part-of: trading-model
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-evaluator-network-policy
  labels:
    app.kubernetes.io/component: model-evaluator
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: model-evaluator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # Same namespace as the policy, whatever the overlay's namespace.
        - podSelector: {}
      ports:
        - port: 3000
          protocol: TCP
  egress:
    # discovery-server, message-manager and trader-trainer (HTTPS on 3000), Redis and its sentinels (bus, ADR-0073).
    - to:
        - podSelector: {}
      ports:
        - port: 3000
          protocol: TCP
        - port: 6379
          protocol: TCP
        - port: 26379
          protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-evaluator
  labels:
    app.kubernetes.io/component: model-evaluator
    app.kubernetes.io/part-of: trading-model
automountServiceAccountToken: false
