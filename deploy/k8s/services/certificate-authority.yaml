apiVersion: v1
kind: Service
metadata:
  name: certificate-authority
  labels:
    app.kubernetes.io/component: certificate-authority
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: https
  selector:
    app.kubernetes.io/component: certificate-authority
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: certificate-authority
  labels:
    app.kubernetes.io/component: certificate-authority
    app.kubernetes.io/part-of: trading-model
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: certificate-authority
  template:
    metadata:
      labels:
        app.kubernetes.io/component: certificate-authority
        app.kubernetes.io/part-of: trading-model
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/scheme: "https"
    spec:
      serviceAccountName: certificate-authority
      terminationGracePeriodSeconds: 60
      containers:
        - name: certificate-authority
          image: ghcr.io/trading-model/certificate-authority:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: https
          envFrom:
            - configMapRef:
                name: certificate-authority-config
          env:
            - name: CA_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: CA_BOOTSTRAP_TOKEN
            - name: CA_BOOTSTRAP_TOKENS
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: CA_BOOTSTRAP_TOKENS
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
              readOnly: true
            - name: ca-keys
              mountPath: /etc/ca-keys
              readOnly: false
          livenessProbe:
            httpGet:
              path: /ping
              port: 3000
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /ping
              port: 3000
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 15
      volumes:
        - name: tls-certs
          secret:
            secretName: trading-model-tls
            optional: false
        - name: ca-keys
          secret:
            secretName: trading-model-ca-keys
            optional: false
