apiVersion: v1
kind: Service
metadata:
  name: dlq-service
  labels:
    app.kubernetes.io/component: dlq-service
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: https
  selector:
    app.kubernetes.io/component: dlq-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dlq-service
  labels:
    app.kubernetes.io/component: dlq-service
    app.kubernetes.io/part-of: trading-model
spec:
  strategy:
    # Surge first: with one replica (staging), maxUnavailable 1 left no ready
    # pod until the new one was ready (issue #699, as discovery-server #486).
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: dlq-service
  template:
    metadata:
      labels:
        app.kubernetes.io/component: dlq-service
        app.kubernetes.io/part-of: trading-model
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/scheme: "https"
    spec:
      serviceAccountName: dlq-service
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Even spread (ADR-0024): at most one pod more on a node than on the
      # emptiest one; the zone is best effort (nodes without the label qualify).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: dlq-service
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: dlq-service
      containers:
        - name: dlq-service
          image: ghcr.io/trading-model/dlq-service:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
              name: https
          envFrom:
            - configMapRef:
                name: dlq-service-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_DLQ_PASSWORD
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_INTERNAL_PASSWORD
            # Discovery keys tokens and addresses by instance: one per pod.
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DLQ_AUTH_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: DLQ_AUTH_HMAC_SECRET
            - name: ERROR_URL_WEBHOOK
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: svid
              mountPath: /run/spire/svid
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              command:
                - curl
                - -skf
                - --cert
                - /run/spire/svid/svid.pem
                - --key
                - /run/spire/svid/svid_key.pem
                - https://localhost:3000/ping
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - curl
                - -skf
                - --cert
                - /run/spire/svid/svid.pem
                - --key
                - /run/spire/svid/svid_key.pem
                - https://localhost:3000/health/ready
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
          startupProbe:
            exec:
              command:
                - curl
                - -skf
                - --cert
                - /run/spire/svid/svid.pem
                - --key
                - /run/spire/svid/svid_key.pem
                - https://localhost:3000/ping
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.10.1@sha256:2402c34d83794aa24c127baa46e9732d653463f3bfcd39cda1313003ed60f8c9
          imagePullPolicy: IfNotPresent
          args:
            - -config
            - /etc/spiffe-helper/helper.conf
          volumeMounts:
            - name: spiffe-helper-config
              mountPath: /etc/spiffe-helper
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/agent-sockets
            - name: svid
              mountPath: /run/spire/svid
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: spiffe-helper-config
          configMap:
            name: spiffe-helper-config
        # Workload API socket from the SPIFFE CSI driver (node-agents): the
        # restricted Pod Security profile forbids a hostPath.
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: svid
          emptyDir: {}
        - name: tmp
          emptyDir: {}
