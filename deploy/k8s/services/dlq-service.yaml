apiVersion: v1
kind: Service
metadata:
  name: dlq-service
  labels:
    app.kubernetes.io/component: dlq-service
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: https
  selector:
    app.kubernetes.io/component: dlq-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dlq-service
  labels:
    app.kubernetes.io/component: dlq-service
    app.kubernetes.io/part-of: trading-model
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: dlq-service
  template:
    metadata:
      labels:
        app.kubernetes.io/component: dlq-service
        app.kubernetes.io/part-of: trading-model
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/scheme: "https"
    spec:
      serviceAccountName: dlq-service
      terminationGracePeriodSeconds: 30
      containers:
        - name: dlq-service
          image: ghcr.io/trading-model/dlq-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: https
          envFrom:
            - configMapRef:
                name: dlq-service-config
          env:
            - name: DLQ_AUTH_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: DLQ_AUTH_HMAC_SECRET
            - name: ERROR_URL_WEBHOOK
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: svid
              mountPath: /run/spire/svid
          livenessProbe:
            exec:
              command:
                - curl
                - -sk
                - --cert
                - /run/spire/svid/svid.pem
                - --key
                - /run/spire/svid/svid_key.pem
                - https://localhost:3000/ping
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - curl
                - -sk
                - --cert
                - /run/spire/svid/svid.pem
                - --key
                - /run/spire/svid/svid_key.pem
                - https://localhost:3000/health/ready
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
          startupProbe:
            exec:
              command:
                - curl
                - -sk
                - --cert
                - /run/spire/svid/svid.pem
                - --key
                - /run/spire/svid/svid_key.pem
                - https://localhost:3000/ping
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.6.0
          imagePullPolicy: IfNotPresent
          args:
            - -socketPath=/run/spire/agent-sockets/public/api.sock
            - -certDir=/run/spire/svid
            - -svidFileName=svid.pem
            - -svidKeyFileName=svid_key.pem
            - -svidBundleFileName=bundle.pem
            - -renewSignal=SIGHUP
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/agent-sockets
            - name: svid
              mountPath: /run/spire/svid
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/agent-sockets
            type: DirectoryOrCreate
        - name: svid
          emptyDir: {}
