apiVersion: v1
kind: Service
metadata:
  name: admin-interface
  labels:
    app.kubernetes.io/component: admin-interface
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app.kubernetes.io/component: admin-interface
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-interface
  labels:
    app.kubernetes.io/component: admin-interface
    app.kubernetes.io/part-of: trading-model
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: admin-interface
  template:
    metadata:
      labels:
        app.kubernetes.io/component: admin-interface
        app.kubernetes.io/part-of: trading-model
    spec:
      serviceAccountName: admin-interface
      terminationGracePeriodSeconds: 10
      containers:
        - name: admin-interface
          image: ghcr.io/trading-model/admin-interface:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          env:
            - name: VITE_API_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: admin-interface-config
                  key: VITE_API_GATEWAY_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /ping
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /ping
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
