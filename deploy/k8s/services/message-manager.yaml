apiVersion: v1
kind: Service
metadata:
  name: message-manager
  labels:
    app.kubernetes.io/component: message-manager
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: https
  selector:
    app.kubernetes.io/component: message-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-manager
  labels:
    app.kubernetes.io/component: message-manager
    app.kubernetes.io/part-of: trading-model
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: message-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/component: message-manager
        app.kubernetes.io/part-of: trading-model
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/scheme: "https"
    spec:
      serviceAccountName: message-manager
      terminationGracePeriodSeconds: 60
      containers:
        - name: message-manager
          image: ghcr.io/trading-model/message-manager:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: https
          envFrom:
            - configMapRef:
                name: message-manager-config
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BROKER_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REDIS_URL
              value: "redis://redis-primary:6379"
            - name: ERROR_URL_WEBHOOK
              value: ""
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: svid
              mountPath: /run/spire/svid
          livenessProbe:
            httpGet:
              path: /ping
              port: 3000
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /ping
              port: 3000
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 15
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.6.0
          imagePullPolicy: IfNotPresent
          args:
            - -socketPath=/run/spire/agent-sockets/public/api.sock
            - -certDir=/run/spire/svid
            - -svidFileName=svid.pem
            - -svidKeyFileName=svid_key.pem
            - -svidBundleFileName=bundle.pem
            - -renewSignal=SIGHUP
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/agent-sockets
            - name: svid
              mountPath: /run/spire/svid
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/agent-sockets
            type: DirectoryOrCreate
        - name: svid
          emptyDir: {}
