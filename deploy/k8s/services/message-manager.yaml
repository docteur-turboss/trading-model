apiVersion: v1
kind: Service
metadata:
  name: message-manager
  labels:
    app.kubernetes.io/component: message-manager
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: https
  selector:
    app.kubernetes.io/component: message-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-manager
  labels:
    app.kubernetes.io/component: message-manager
    app.kubernetes.io/part-of: trading-model
spec:
  strategy:
    # Surge first: with one replica (staging), maxUnavailable 1 left no ready
    # pod until the new one was ready (issue #699, as discovery-server #486).
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: message-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/component: message-manager
        app.kubernetes.io/part-of: trading-model
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/scheme: "https"
    spec:
      serviceAccountName: message-manager
      # preStop 15 s + leaving discovery while callers' caches expire
      # (CACHE_TTL_MS, 30 s) + in-flight publishes (PUBLISH_ACCEPT_TIMEOUT_MS,
      # 15 s) + deliveries in flight (10 s) + forwarding the local dead letters.
      # Messages not delivered yet stay in the Redis journal (ADR-0048).
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Even spread (ADR-0024): at most one pod more on a node than on the
      # emptiest one; the zone is best effort (nodes without the label qualify).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: message-manager
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: message-manager
      containers:
        - name: message-manager
          image: ghcr.io/trading-model/message-manager:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
              name: https
          envFrom:
            - configMapRef:
                name: message-manager-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_MESSAGE_MANAGER_PASSWORD
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_INTERNAL_PASSWORD
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BROKER_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ERROR_URL_WEBHOOK
              value: ""
            - name: DLQ_LOCAL_FALLBACK_PATH
              value: "/var/lib/message-manager/dead-letter-queue.jsonl"
            # Signs the dead letters sent to dlq-service (same key as dlq-service).
            - name: DLQ_AUTH_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: DLQ_AUTH_HMAC_SECRET
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: redis-tls
              mountPath: /etc/redis-tls
              readOnly: true
            - name: svid
              mountPath: /run/spire/svid
            - name: dlq-data
              mountPath: /var/lib/message-manager
          # exec + SVID: the server demands a client certificate, which a
          # kubelet httpGet probe cannot present (tls: certificate required).
          livenessProbe:
            exec:
              command:
                - curl
                - -skf
                - --cert
                - /run/spire/svid/svid.pem
                - --key
                - /run/spire/svid/svid_key.pem
                - https://localhost:3000/ping
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - curl
                - -skf
                - --cert
                - /run/spire/svid/svid.pem
                - --key
                - /run/spire/svid/svid_key.pem
                - https://localhost:3000/health/ready
            initialDelaySeconds: 10
            periodSeconds: 10
            # Two ping attempts of connectTimeout 2 s (issue #725): 4 s < 5 s.
            timeoutSeconds: 5
            successThreshold: 1
          startupProbe:
            exec:
              command:
                - curl
                - -skf
                - --cert
                - /run/spire/svid/svid.pem
                - --key
                - /run/spire/svid/svid_key.pem
                - https://localhost:3000/ping
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 15
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.10.1@sha256:2402c34d83794aa24c127baa46e9732d653463f3bfcd39cda1313003ed60f8c9
          imagePullPolicy: IfNotPresent
          args:
            - -config
            - /etc/spiffe-helper/helper.conf
          volumeMounts:
            - name: spiffe-helper-config
              mountPath: /etc/spiffe-helper
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/agent-sockets
            - name: svid
              mountPath: /run/spire/svid
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: redis-tls
          secret:
            secretName: redis-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: spiffe-helper-config
          configMap:
            name: spiffe-helper-config
        # Workload API socket from the SPIFFE CSI driver (node-agents): the
        # restricted Pod Security profile forbids a hostPath.
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: svid
          emptyDir: {}
        # Dead letters dlq-service could not take yet (DLQ_LOCAL_FALLBACK_PATH),
        # forwarded every minute and at shutdown; lost with the pod otherwise
        # (alert DeadLettersNotForwarded), see ADR-0048.
        - name: dlq-data
          emptyDir: {}
