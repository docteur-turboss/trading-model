apiVersion: v1
kind: Service
metadata:
  name: message-manager
  labels:
    app.kubernetes.io/component: message-manager
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: https
  selector:
    app.kubernetes.io/component: message-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-manager
  labels:
    app.kubernetes.io/component: message-manager
    app.kubernetes.io/part-of: trading-model
spec:
  strategy:
    # Surge first: with one replica (staging), maxUnavailable 1 left no ready
    # pod until the new one was ready (issue #699, as discovery-server #486).
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: message-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/component: message-manager
        app.kubernetes.io/part-of: trading-model
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/scheme: "https"
    spec:
      serviceAccountName: message-manager
      # preStop 15 s + shutdown deadline 100 s (application/index.ts: close
      # bounded by PUBLISH_ACCEPT_TIMEOUT_MS, 15 s, then onStop 45 s) = 115 s.
      # An HTTP delivery may last up to 90 s (DELIVERY_ATTEMPT_TIMEOUT_MS):
      # one still in flight after onStop is cut and redelivered. The HTTP path
      # goes with #1241.
      # Messages not delivered yet stay in the Redis journal (ADR-0048).
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Even spread (ADR-0024): at most one pod more on a node than on the
      # emptiest one; the zone is best effort (nodes without the label qualify).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: message-manager
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: message-manager
      initContainers:
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.12.4@sha256:8c63bb63f61c00ab79080fd7dea80cecb47558989c2b8d84f6a6d0dc7a1fba32
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          startupProbe:
            httpGet:
              path: /ready
              port: 8081
            periodSeconds: 1
            failureThreshold: 120
          args:
            - -config
            - /etc/spiffe-helper/helper.conf
          volumeMounts:
            - name: spiffe-helper-config
              mountPath: /etc/spiffe-helper
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/agent-sockets
            - name: svid
              mountPath: /run/spire/svid
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: message-manager
          image: ghcr.io/trading-model/message-manager:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
              name: https
          envFrom:
            - configMapRef:
                name: message-manager-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_MESSAGE_MANAGER_PASSWORD
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: REDIS_INTERNAL_PASSWORD
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BROKER_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: redis-tls
              mountPath: /etc/redis-tls
              readOnly: true
            - name: svid
              mountPath: /run/spire/svid
          # exec + SVID: the server demands a client certificate, which a
          # kubelet httpGet probe cannot present (tls: certificate required).
          livenessProbe:
            exec:
              command:
                - node
                - /app/probe.js
                - https://localhost:3000/ping
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - node
                - /app/probe.js
                - https://localhost:3000/health/ready
            initialDelaySeconds: 10
            periodSeconds: 10
            # Two ping attempts of connectTimeout 2 s (issue #725): 4 s < 5 s.
            timeoutSeconds: 10
            successThreshold: 1
          startupProbe:
            exec:
              command:
                - node
                - /app/probe.js
                - https://localhost:3000/ping
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 15
      volumes:
        - name: redis-tls
          secret:
            secretName: redis-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: spiffe-helper-config
          configMap:
            name: spiffe-helper-config
        # Workload API socket from the SPIFFE CSI driver (node-agents): the
        # restricted Pod Security profile forbids a hostPath.
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: svid
          emptyDir: {}
