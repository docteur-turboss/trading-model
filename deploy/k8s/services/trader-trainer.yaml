apiVersion: v1
kind: Service
metadata:
  name: trader-trainer
  labels:
    app.kubernetes.io/component: trader-trainer
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: https
  selector:
    app.kubernetes.io/component: trader-trainer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trader-trainer
  labels:
    app.kubernetes.io/component: trader-trainer
    app.kubernetes.io/part-of: trading-model
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: trader-trainer
  template:
    metadata:
      labels:
        app.kubernetes.io/component: trader-trainer
        app.kubernetes.io/part-of: trading-model
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/scheme: "https"
    spec:
      serviceAccountName: trader-trainer
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: trader-trainer
              topologyKey: kubernetes.io/hostname
      containers:
        - name: trader-trainer
          image: ghcr.io/trading-model/trader-trainer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: https
          envFrom:
            - configMapRef:
                name: trader-trainer-config
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CERT_CLIENT_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: trading-model-secrets
                  key: SERVICE_BOOTSTRAP_TOKEN
            - name: ERROR_URL_WEBHOOK
              value: ""
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: tls-certs
              mountPath: /certs
              readOnly: true
            - name: trainer-checkpoints
              mountPath: /data/checkpoints
          livenessProbe:
            exec:
              command:
                - curl
                - -sk
                - --cert
                - /certs/server.crt
                - --key
                - /certs/server-key.pem
                - https://localhost:3000/ping
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - curl
                - -sk
                - --cert
                - /certs/server.crt
                - --key
                - /certs/server-key.pem
                - https://localhost:3000/health/ready
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
          startupProbe:
            exec:
              command:
                - curl
                - -sk
                - --cert
                - /certs/server.crt
                - --key
                - /certs/server-key.pem
                - https://localhost:3000/ping
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10
      volumes:
        - name: tls-certs
          secret:
            secretName: trading-model-tls
            optional: false
        - name: trainer-checkpoints
          persistentVolumeClaim:
            claimName: trainer-checkpoints-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trainer-checkpoints-pvc
  labels:
    app.kubernetes.io/component: trader-trainer
    app.kubernetes.io/part-of: trading-model
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: rwx-csi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trader-trainer-pdb
  labels:
    app.kubernetes.io/component: trader-trainer
    app.kubernetes.io/part-of: trading-model
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: trader-trainer
