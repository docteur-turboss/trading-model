apiVersion: v1
kind: Service
metadata:
  name: trader-trainer
  labels:
    app.kubernetes.io/component: trader-trainer
    app.kubernetes.io/part-of: trading-model
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: https
  selector:
    app.kubernetes.io/component: trader-trainer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trader-trainer
  labels:
    app.kubernetes.io/component: trader-trainer
    app.kubernetes.io/part-of: trading-model
spec:
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: trader-trainer
  template:
    metadata:
      labels:
        app.kubernetes.io/component: trader-trainer
        app.kubernetes.io/part-of: trading-model
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/scheme: "https"
    spec:
      serviceAccountName: trader-trainer
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Even spread (ADR-0024): at most one pod more on a node than on the
      # emptiest one; the zone is best effort (nodes without the label qualify).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: trader-trainer
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: trader-trainer
      containers:
        - name: trader-trainer
          image: ghcr.io/trading-model/trader-trainer:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
              name: https
          envFrom:
            - configMapRef:
                name: trader-trainer-config
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ERROR_URL_WEBHOOK
              value: ""
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: svid
              mountPath: /run/spire/svid
            - name: tmp
              mountPath: /tmp
            - name: trainer-checkpoints
              mountPath: /data/checkpoints
          livenessProbe:
            exec:
              command:
                - curl
                - -skf
                - --cert
                - /run/spire/svid/svid.pem
                - --key
                - /run/spire/svid/svid_key.pem
                - https://localhost:3000/ping
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - curl
                - -skf
                - --cert
                - /run/spire/svid/svid.pem
                - --key
                - /run/spire/svid/svid_key.pem
                - https://localhost:3000/health/ready
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
          startupProbe:
            exec:
              command:
                - curl
                - -skf
                - --cert
                - /run/spire/svid/svid.pem
                - --key
                - /run/spire/svid/svid_key.pem
                - https://localhost:3000/ping
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.10.1
          imagePullPolicy: IfNotPresent
          args:
            - -config
            - /etc/spiffe-helper/helper.conf
          volumeMounts:
            - name: spiffe-helper-config
              mountPath: /etc/spiffe-helper
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/agent-sockets
            - name: svid
              mountPath: /run/spire/svid
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: spiffe-helper-config
          configMap:
            name: spiffe-helper-config
        # Workload API socket from the SPIFFE CSI driver (node-agents): the
        # restricted Pod Security profile forbids a hostPath.
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: svid
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: trainer-checkpoints
          persistentVolumeClaim:
            claimName: trainer-checkpoints-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trainer-checkpoints-pvc
  labels:
    app.kubernetes.io/component: trader-trainer
    app.kubernetes.io/part-of: trading-model
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: rwx-csi
