apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Node-level agents (SPIRE agent, SPIFFE CSI driver, promtail), applied apart
# from the application overlays: their namespace transformer would pull them
# into the restricted namespace. One environment per cluster: the agent trusts
# the SPIRE server, and promtail ships to the Loki, of a single application
# namespace. Deploy through overlays/<env>/node-agents, which points them at it.
namespace: trading-model-node

resources:
  - namespace.yaml
  - spire-agent.yaml
  - spiffe-csi-driver.yaml
  - promtail.yaml
