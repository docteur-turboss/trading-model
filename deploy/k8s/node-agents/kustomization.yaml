apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Node-level agents (SPIRE agent, SPIFFE CSI driver, promtail, node-exporter), applied apart
# from the application overlays: their namespace transformer would pull them
# into the restricted namespace. One environment per cluster: the agent trusts
# the SPIRE server, and promtail ships to the Loki, of a single application
# namespace. Deploy through overlays/<env>/node-agents, which points them at it.
namespace: trading-model-node

resources:
  - namespace.yaml
  - spire-agent.yaml
  - spiffe-csi-driver.yaml
  - promtail.yaml
  - node-exporter.yaml

# Hash suffix: a changed agent.conf changes the DaemonSet pod template, so the
# agents roll (a plain ConfigMap would leave them on the old file). Rendered
# with -expandEnv: ${SPIRE_SERVER_ADDRESS} is set per environment.
configMapGenerator:
  - name: spire-agent-config
    files: [agent.conf]
    options:
      labels: {app.kubernetes.io/component: spire-agent, app.kubernetes.io/part-of: trading-model}
