apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trading-model

resources:
  - ../../base
  - ../../secrets
  - ingress-hosts.yaml
  - prometheus-pdb.yaml

components:
  - ../../ingress/hosts

patches:
  # Redis runs master + 2 replicas in production only: a journal write is
  # accepted once one replica holds it (ADR-0048). Staging has one Redis node,
  # where WAIT 1 can never succeed.
  - target:
      kind: ConfigMap
      name: message-manager-config
    patch: |-
      - op: add
        path: /data/JOURNAL_MIN_REPLICAS
        value: "1"
  # The audit chain must be anchored in production (ADR-0027): audit-logger
  # refuses to start without AUDIT_ANCHOR_BUCKET (Secret audit-anchor-s3).
  - target:
      kind: ConfigMap
      name: audit-logger-config
    patch: |-
      - op: add
        path: /data/AUDIT_ANCHOR_REQUIRED
        value: "true"
  # Backups encrypted for at least two distinct age keys in production
  # (operator key + escrow key, issue #327): init_encryption refuses to write
  # a dump for fewer, and deploy.yml checks BACKUP_AGE_RECIPIENTS against this
  # value before applying (docs/deployment/ENCRYPTION_AT_REST.md, "Key custody").
  - target:
      kind: CronJob
      name: db-backup
    patch: &min-recipients |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
        value:
          name: BACKUP_MIN_RECIPIENTS
          value: "2"
  - target:
      kind: CronJob
      name: db-backup-incremental
    patch: *min-recipients
  # Alerting path in HA (issue #809, ADR-0062): 2 Alertmanagers gossiping on
  # 9094 (the notification is deduplicated by the cluster) and 2 identical
  # Prometheus, each sending to every Alertmanager pod. Spread over two nodes.
  - target:
      kind: StatefulSet
      name: alertmanager
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--cluster.listen-address=0.0.0.0:9094"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--cluster.peer=alertmanager-headless:9094"
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value: {containerPort: 9094, name: cluster}
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: alertmanager
  - target:
      kind: StatefulSet
      name: prometheus
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: prometheus

# Pod CIDR trusted by the edge-proxy for X-Forwarded-For (issue #732).
configMapGenerator:
  - name: edge-proxy-nginx
    behavior: merge
    files:
      - realip.inc=realip.inc
