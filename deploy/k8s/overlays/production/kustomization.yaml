apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trading-model

resources:
  - ../../base
  - ../../secrets
  - ingress-hosts.yaml

components:
  - ../../ingress/hosts

patches:
  # Redis runs master + 2 replicas in production only: a journal write is
  # accepted once one replica holds it (ADR-0043). Staging has one Redis node,
  # where WAIT 1 can never succeed.
  - target:
      kind: ConfigMap
      name: message-manager-config
    patch: |-
      - op: add
        path: /data/JOURNAL_MIN_REPLICAS
        value: "1"
  # The audit chain must be anchored in production (ADR-0027): audit-logger
  # refuses to start without AUDIT_ANCHOR_BUCKET (Secret audit-anchor-s3).
  - target:
      kind: ConfigMap
      name: audit-logger-config
    patch: |-
      - op: add
        path: /data/AUDIT_ANCHOR_REQUIRED
        value: "true"
  # Backups encrypted for at least two distinct age keys in production
  # (operator key + escrow key, issue #327): init_encryption refuses to write
  # a dump for fewer, and deploy.yml checks BACKUP_AGE_RECIPIENTS against this
  # value before applying (docs/deployment/ENCRYPTION_AT_REST.md, "Key custody").
  - target:
      kind: CronJob
      name: db-backup
    patch: &min-recipients |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
        value:
          name: BACKUP_MIN_RECIPIENTS
          value: "2"
  - target:
      kind: CronJob
      name: db-backup-incremental
    patch: *min-recipients
