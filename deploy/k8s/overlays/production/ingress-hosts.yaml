# Real host names of production (issues #415, #1131), copied into the Ingresses
# by the component ../../ingress/hosts. deploy.yml refuses production if the
# rendered overlay contains example.com. The ingress is not exposed to the
# Internet: certificates come through DNS-01 (docs/deployment/KUBERNETES.md).
# Never applied (local-config).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-hosts
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  api: api.trading.horus-turboss.fr
  grafana: grafana.trading.horus-turboss.fr
