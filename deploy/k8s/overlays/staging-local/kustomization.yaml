apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging on the local kind cluster (docs/deployment/STAGING_LOCAL.md): the
# staging overlay, adapted to what a laptop provides. deploy.yml picks it when
# the GitHub environment `staging` sets K8S_OVERLAY=staging-local.
resources:
  - ../staging

patches:
  # No public DNS name for Let's Encrypt: self-signed certificates
  # (ClusterIssuer created by deploy/staging-local/bootstrap.sh prereqs).
  # Only the host reaches the Ingress (kind port mapping 127.0.0.1:9443),
  # through the gateway of the `kind` Docker network.
  - target:
      kind: Ingress
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: selfsigned-local
      - op: replace
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1whitelist-source-range
        value: 172.18.0.0/16

  # Audit anchors go to the local MinIO (deploy/staging-local/docker-compose.yml,
  # fixed address on the `kind` network), plain HTTP on 9000: the base rule
  # only allows public addresses on 443.
  - target:
      kind: NetworkPolicy
      name: audit-logger-network-policy
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to:
            - ipBlock:
                cidr: 172.18.0.200/32
          ports:
            - port: 9000
              protocol: TCP

  # A laptop disk shared with other Docker stacks: MySQL's first initialisation
  # and Grafana's schema migrations outlast the base probes, which then restart
  # them for ever. Startup budget 30 min each (deploy.yml timeouts: the
  # environment variable DEPLOY_TIMEOUT_FACTOR).
  - target:
      kind: StatefulSet
      name: mysql
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/failureThreshold
        value: 180
  - target:
      kind: StatefulSet
      name: grafana
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          httpGet:
            path: /api/health
            port: 3000
          periodSeconds: 10
          failureThreshold: 180

  # One pod per data or observability StatefulSet: a release must not restart it (issue #700).
  # Planned restart for a new template: docs/deployment/STAGING_LOCAL.md.
  - target:
      kind: StatefulSet
      name: ^(mysql|redis|redis-sentinel|mongo-dlq|mongo-audit|alertmanager|grafana|loki|prometheus)$
    patch: |-
      - op: add
        path: /spec/updateStrategy
        value:
          type: RollingUpdate
          rollingUpdate:
            partition: 1

  # Secrets sealed with the key of the kind cluster's controller, not the
  # placeholders of ../staging (OVERLAY=staging-local bash scripts/init-sealed-secrets.sh).
  - path: sealed-secrets.yaml
    target:
      kind: SealedSecret
      name: trading-model-secrets

  # mysqld of the 3.0.0 template (configMapGenerator below) serves its auto-generated
  # certificate: the jobs (mysql-cluster-init, db-retention) encrypt without
  # verifying it, as run-migrations.sh does for such a pod.
  - target:
      kind: ConfigMap
      name: mysql-client-tls
    patch: |-
      - op: replace
        path: /data/my.cnf
        value: |
          [client]
          ssl-mode=REQUIRED
          ssl-ca=/etc/mysql-tls/ca.crt

# Pod CIDR trusted by the edge-proxy for X-Forwarded-For (issue #732).
configMapGenerator:
  - name: edge-proxy-nginx
    behavior: merge
    files:
      - realip.inc=realip.inc
  # The partitioned database pods above still run the 3.0.0 template (partition came
  # with 3.1.0-rc.1): MySQL without mysql-tls, MongoDB without TLS nor keyFile (issue
  # #1066). Clients connect as that template accepts (MySQL in clear, MongoDB without
  # tls=true) until the planned switch of STAGING_LOCAL.md, "TLS and keyFile switch",
  # which removes these three entries and the mysql-client-tls patch above.
  - name: financial-scraper-config
    behavior: merge
    literals:
      - DB_SSL_CA=
      - DB_SSL_CERT=
      - DB_SSL_KEY=
  - name: audit-logger-config
    behavior: merge
    literals:
      - MONGODB_URI=mongodb://mongo-audit-0.mongo-audit-headless:27017,mongo-audit-1.mongo-audit-headless:27017,mongo-audit-2.mongo-audit-headless:27017/audit?replicaSet=rs0-audit&authSource=admin
  - name: dlq-service-config
    behavior: merge
    literals:
      - MONGO_URI=mongodb://mongo-dlq-0.mongo-dlq-headless:27017,mongo-dlq-1.mongo-dlq-headless:27017,mongo-dlq-2.mongo-dlq-headless:27017/dlq?replicaSet=rs0&authSource=admin
