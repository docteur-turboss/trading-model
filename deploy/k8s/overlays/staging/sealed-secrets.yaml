apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: trading-model-secrets
  namespace: trading-model-staging
  labels:
    app.kubernetes.io/part-of: trading-model
spec:
  encryptedData:
    # REQUIRED before production deployment — these placeholders cannot be
    # decrypted. Bootstrap all values in one command:
    #   bash scripts/init-sealed-secrets.sh [--apply]
    # See scripts/init-sealed-secrets.sh and docs/deployment/sealed-secrets.md.
    AUTH_TOKENS: AgCHANGE_ME_RUN_KUBESEAL_Ag==
    SIGNING_SECRET: AgCHANGE_ME_RUN_KUBESEAL_Ag==
    SERVICE_BOOTSTRAP_TOKEN: AgCHANGE_ME_RUN_KUBESEAL_Ag==
    MYSQL_ROOT_PASSWORD: AgCHANGE_ME_RUN_KUBESEAL_Ag==
    MYSQL_PASSWORD: AgCHANGE_ME_RUN_KUBESEAL_Ag==
    MYSQL_MIGRATE_PASSWORD: AgCHANGE_ME_RUN_KUBESEAL_Ag==
    MYSQL_RETENTION_PASSWORD: AgCHANGE_ME_RUN_KUBESEAL_Ag==
    DLQ_AUTH_HMAC_SECRET: AgCHANGE_ME_RUN_KUBESEAL_Ag==
    GRAFANA_PASSWORD: AgCHANGE_ME_RUN_KUBESEAL_Ag==
    HMAC_SECRET: AgCHANGE_ME_RUN_KUBESEAL_Ag==
    REDIS_INTERNAL_PASSWORD: AgCHANGE_ME_RUN_KUBESEAL_Ag==
    REDIS_DISCOVERY_PASSWORD: AgCHANGE_ME_RUN_KUBESEAL_Ag==
    REDIS_MESSAGE_MANAGER_PASSWORD: AgCHANGE_ME_RUN_KUBESEAL_Ag==
    REDIS_DLQ_PASSWORD: AgCHANGE_ME_RUN_KUBESEAL_Ag==
  template:
    type: Opaque
