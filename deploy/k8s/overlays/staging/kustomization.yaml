apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trading-model-staging

resources:
  - ../../base
  - ingress-hosts.yaml
  # SealedSecret of staging (issue #417): placeholders until a human seals them
  # with `OVERLAY=staging bash scripts/init-sealed-secrets.sh`.
  - sealed-secrets.yaml

components:
  - ../../ingress/hosts

# Staging image tags: `latest` is only a default for rendering outside deploy.yml.
# deploy.yml always deploys the digests of the requested release tag (deploy-release.sh render).
images:
  - name: ghcr.io/trading-model/discovery-server
    newTag: latest
  - name: ghcr.io/trading-model/message-manager
    newTag: latest
  - name: ghcr.io/trading-model/financial-scraper
    newTag: latest
  - name: ghcr.io/trading-model/trader-trainer
    newTag: latest
  - name: ghcr.io/trading-model/api-gateway
    newTag: latest
  - name: ghcr.io/trading-model/audit-logger
    newTag: latest
  - name: ghcr.io/trading-model/dlq-service
    newTag: latest
  - name: ghcr.io/trading-model/spire-tools
    newTag: latest
  - name: ghcr.io/trading-model/backup-tools
    newTag: latest

# Staging-specific resource reductions (smaller than production)
patches:
  - target:
      kind: StatefulSet
      name: "^(mysql|redis|redis-sentinel|mongo-dlq|mongo-audit)$"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # Deployments with an HPA carry no spec.replicas (an apply must not reset them):
  # staging pins the HPAs to one pod instead.
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1

  # One replica per StatefulSet: a PDB minAvailable of 2 would block every
  # node drain (issue #417).
  - target:
      kind: PodDisruptionBudget
    patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: unused
      spec:
        minAvailable: null
        maxUnavailable: 1

  # Staging ingress open to an allow-list only (docs/deployment/KUBERNETES.md,
  # "Staging access"). Fails closed: replace this TEST-NET-1 placeholder with the
  # operators' CIDRs (comma separated) before use.
  - target:
      kind: Ingress
    patch: |-
      - op: add
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1whitelist-source-range
        value: 192.0.2.0/24
