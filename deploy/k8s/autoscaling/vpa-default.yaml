# updateMode Off: the HPAs own CPU and memory scaling; an Auto VPA would evict pods and fight them (issue #419).
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: financial-scraper-vpa
  labels:
    app.kubernetes.io/component: financial-scraper
    app.kubernetes.io/part-of: trading-model
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: financial-scraper
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: financial-scraper
        minAllowed:
          cpu: 50m
          memory: 128Mi
        maxAllowed:
          cpu: "1"
          memory: 1Gi
        controlledResources: ["cpu", "memory"]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
