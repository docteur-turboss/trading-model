# Role of the cluster-scope deploy identity in the node-agents namespace
# (trading-model-node): SPIRE agent, SPIFFE CSI driver, promtail
# and node-exporter (deploy/k8s/node-agents). Bound by scripts/deploy-identity.sh.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-node-agents
rules:
  - apiGroups: [""]
    resources: [configmaps, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  # No create/delete: a DaemonSet in this privileged namespace is root on the
  # nodes. An admin creates them (deploy-identity.sh cluster); this identity
  # only updates the four that exist.
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [daemonsets]
    resourceNames: [spire-agent, spiffe-csi-driver, promtail, node-exporter]
    verbs: [get, update, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
