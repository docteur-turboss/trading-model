# Role of the cluster-scope deploy identity in the Sealed Secrets controller
# namespace: deploy.yml only checks that the controller Deployment exists
# (ADR-0035). No Secret: the controller keys stay out of reach.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-check-controller
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get]
