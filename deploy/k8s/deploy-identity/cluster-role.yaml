# ClusterRole of the cluster-scope deploy identity (ADR-0041): used by the
# steps of deploy.yml that touch what no namespace owns (namespaces, the
# ClusterRoles of the overlay, the CSIDriver, the CRD check). Bound by
# scripts/deploy-identity.sh to a ClusterRoleBinding.
#
# It never creates nor changes a ClusterRole: scripts/deploy-identity.sh
# (run by an admin) applies the ClusterRoles of the overlays (spire-server,
# spire-agent, promtail). This identity only binds them, by name (`bind`), so
# it does not hold their rights: no `nodes/proxy` (kubelet API, exec in any
# pod), no `pods` or `tokenreviews`. A release that changes one of these
# ClusterRoles fails the deploy (forbidden) until an admin runs
# deploy-identity.sh cluster again. Anything else in the overlays fails the
# deploy until this file is extended in review.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deploy-cluster
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
  # check-prereqs.sh: StorageClass, IngressClass and cert-manager ClusterIssuer named by the render.
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get]
  - apiGroups: [cert-manager.io]
    resources: [clusterissuers]
    verbs: [get]
  - apiGroups: [storage.k8s.io]
    resources: [csidrivers]
    verbs: [get, list, create, patch, update]
  # get: `kubectl apply` of an unchanged ClusterRole is a no-op.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [spire-server, spire-agent, promtail]
    verbs: [bind]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings]
    verbs: [get, list, create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings]
    resourceNames: [spire-server, spire-agent, promtail]
    verbs: [update, patch]
