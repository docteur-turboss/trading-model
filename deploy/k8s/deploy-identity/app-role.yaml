# Role of the application deploy identity (ADR-0041): everything the overlay
# applies INSIDE the application namespace, plus what the rollout, the smoke
# test, the canary and the rollback read or run there. No cluster-scope
# resource, no other namespace. Bound by scripts/deploy-identity.sh; the
# namespace comes from `kubectl -n`. tests/k8s/check-overlays.mjs fails when a
# namespaced kind of an overlay is missing here.
#
# It holds every right the Roles of the overlay grant (backup-runner), so it
# needs neither `escalate` nor `bind`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-app
rules:
  - apiGroups: [""]
    resources: [configmaps, services, persistentvolumeclaims, serviceaccounts, resourcequotas, limitranges]
    verbs: [get, list, watch, create, update, patch, delete]
  # Secrets (issue #2791): never a general read. The application Secrets come from the
  # SealedSecrets controller; only the ones the scripts read or deploy.yml writes are named.
  # `create` cannot be limited by name (the name is not known at admission time).
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [trading-model-secrets, trading-model-backup-s3, audit-anchor-s3, alertmanager-credentials, mysql-client-root, mysql-client-migrator, mysql-client-retention]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [trading-model-secrets, trading-model-backup-s3, audit-anchor-s3, alertmanager-credentials]
    verbs: [update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list, watch]
  # deploy-release.sh diagnose lists events (why a pod stays in ContainerCreating).
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
  # deploy-release.sh: rollback replaces the stuck pods of a Redis StatefulSet; prepull creates a throwaway pod.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  # StatefulSet revisions: `rollout undo statefulset` and deploy-release.sh record.
  - apiGroups: [apps]
    resources: [controllerrevisions]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, update, patch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling.k8s.io]
    resources: [verticalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  # The collector Lease (ADR-0057); also needed to grant its Role.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  # MySQL server certificate and its internal CA (ADR-0060, mysql-tls.yaml).
  - apiGroups: [cert-manager.io]
    resources: [issuers, certificates]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [bitnami.com]
    resources: [sealedsecrets]
    verbs: [get, list, watch, create, update, patch, delete]
