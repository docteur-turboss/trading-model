NODE_ENV=production
# Address-manager cache shared by the replicas (ADR-0029).
REDIS_SENTINELS=redis-sentinel-0.redis-sentinel-headless:26379,redis-sentinel-1.redis-sentinel-headless:26379,redis-sentinel-2.redis-sentinel-headless:26379
REDIS_SENTINEL_MASTER_NAME=mymaster
OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
PORT=3000
TLS_KEY_PATH=/run/spire/svid/svid_key.pem
TLS_CERT_PATH=/run/spire/svid/svid.pem
TLS_CA_PATH=/run/spire/svid/bundle.pem
ENFORCE_MTLS_STRICT=true
LOG_LEVEL=info
APP_NAME=trader-trainer
APP_VERSION=1.3.0
SERVICE_NAME=trader-trainer
CACHE_TTL_MS=30000
SERVICE_PING_TIMEOUT_MS=2000
TOKEN_REFRESH_INTERVAL_MS=60000
TTL_REFRESH_INTERVAL_MS=15000
ADDRESS_MANAGER_URL=https://discovery-server:3000
MESSAGE_BUS_INIT_TIMEOUT_MS=5000
MESSAGE_BUS_SHUTDOWN_TIMEOUT_MS=5000
MESSAGE_CALLBACK_PATH=message
TRAINER_SYMBOLS=BTCUSDT,ETHUSDT
TRAINER_DATA_WINDOW=500
TRAINER_VALIDATION_SPLIT=0.2
TRAINER_GENERATIONS=50
TRAINER_POPULATION_SIZE=20
TRAINER_TIME_BUDGET_MS=300000
TRAINER_MAX_DATA_AGE_MS=900000
TRAINER_EPISODES_PER_INDIVIDUAL=10
# GA scalar fitness (ADR-0025): total_pnl | sharpe | sortino | calmar | composite
TRAINER_FITNESS_TYPE=total_pnl
# Show the agent its position (ADR-0025)
TRAINER_OBSERVE_POSITION=true
# Model artifacts on the checkpoint PVC (ADR-0022)
TRAINER_MODEL_DIR=/data/checkpoints/models
TRAINER_MODEL_RETENTION=20
# Services allowed to download model weights (comma-separated); empty: nobody
MODEL_DOWNLOAD_CALLERS=
