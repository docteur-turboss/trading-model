NODE_ENV=production
OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
PORT=3000
TLS_KEY_PATH=/run/spire/svid/svid_key.pem
TLS_CERT_PATH=/run/spire/svid/svid.pem
TLS_CA_PATH=/run/spire/svid/bundle.pem
LOG_LEVEL=info
APP_NAME=trader-trainer
APP_VERSION=1.3.0
SERVICE_NAME=trader-trainer
CACHE_TTL_MS=30000
SERVICE_PING_TIMEOUT_MS=2000
TRAINER_SYMBOLS=BTCUSDT,ETHUSDT
TRAINER_SYMBOL_ASSETS=
TRAINER_ASSETS=
TRAINER_ASSET_COSTS={}
TRAINER_SIGNAL_FEATURES=
FEATURE_SIGNAL_INPUTS=false
FEATURE_INPUT_MASK_GENE=false
FEATURE_SHARED_TRUNK=false
TRAINER_SHARED_TRUNK_SYMBOLS_PER_GENERATION=0
TRAINER_INPUT_MASK_PROTECT_CANDLE=false
TRAINER_DATA_WINDOW=500
TRAINER_VALIDATION_SPLIT=0.15
TRAINER_TEST_SPLIT=0.15
TRAINER_GENERATIONS=50
TRAINER_POPULATION_SIZE=20
TRAINER_TIME_BUDGET_MS=300000
TRAINER_INTERVAL_MS=14400000
TRAINER_MAX_DATA_AGE_MS=900000
TRAINER_EPISODES_PER_INDIVIDUAL=10
# GA scalar fitness (ADR-0025): total_pnl | sharpe | sortino | calmar | composite
TRAINER_FITNESS_TYPE=total_pnl
# Feature flag (ADR-0039): false forces total_pnl whatever TRAINER_FITNESS_TYPE says
FEATURE_RISK_ADJUSTED_FITNESS=true
# Feature flag (ADR-0039): true lets the GA choose the action space (partial order sizes)
FEATURE_ACTION_SPACE_GENE=false
# Show the agent its position (ADR-0025)
TRAINER_OBSERVE_POSITION=true
TRAINER_SEED_OFFSET=0
# Model artifacts on the checkpoint PVC (ADR-0022)
TRAINER_MODEL_DIR=/data/checkpoints/models
TRAINER_MODEL_RETENTION=20
# Services allowed to download model weights (comma-separated); empty: nobody
MODEL_DOWNLOAD_CALLERS=model-evaluator,decision-consumer
# Bus in Redis (ADR-0073): ACL user of redis-ha.sh bus_user; TLS step "required" (26380) is release N+1 (ADR-0047).
REDIS_SENTINELS=redis-sentinel-0.redis-sentinel-headless:26379,redis-sentinel-1.redis-sentinel-headless:26379,redis-sentinel-2.redis-sentinel-headless:26379
REDIS_SENTINEL_MASTER_NAME=mymaster
REDIS_USERNAME=trader-trainer
REDIS_TLS_MODE=optional
REDIS_TLS_CA=/etc/redis-tls/ca.crt
