apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: message-manager-hpa
  labels:
    app.kubernetes.io/component: message-manager
    app.kubernetes.io/part-of: trading-model
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: message-manager
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: message_queue_depth
        target:
          type: AverageValue
          averageValue: "1000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: message-manager-pdb
  labels:
    app.kubernetes.io/component: message-manager
    app.kubernetes.io/part-of: trading-model
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: message-manager
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: message-manager-network-policy
  labels:
    app.kubernetes.io/component: message-manager
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: message-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # Same namespace as the policy, whatever the overlay's namespace.
        - podSelector: {}
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - to:
        # Same namespace as the policy, whatever the overlay's namespace.
        - podSelector: {}
      ports:
        - port: 6379
          protocol: TCP
        - port: 26379
          protocol: TCP
        # TLS listeners (REDIS_TLS_MODE, ADR-0047).
        - port: 6380
          protocol: TCP
        - port: 26380
          protocol: TCP
        - port: 3000
          protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: message-manager
  labels:
    app.kubernetes.io/component: message-manager
    app.kubernetes.io/part-of: trading-model
automountServiceAccountToken: false
