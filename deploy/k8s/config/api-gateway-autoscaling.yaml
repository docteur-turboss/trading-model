apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  labels:
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: trading-model
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  labels:
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: trading-model
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api-gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-network-policy
  labels:
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Callers of :3000 (same namespace as the policy, whatever the overlay's):
    # edge-proxy (only caller of the SVID ACL), Prometheus (/metrics scrape),
    # blackbox-exporter (/ping probe), api-gateway itself (smoke-test probes its own
    # Service from the pod it execs into). The canary gate and the deploy probes
    # (deploy-k8s.sh smoke-test, verify-release) exec into the pod itself.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - edge-proxy
                  - prometheus
                  - blackbox-exporter
                  - api-gateway
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - to:
        # Same namespace as the policy, whatever the overlay's namespace.
        - podSelector: {}
      ports:
        - port: 3000
          protocol: TCP
    # The deploy probes run from this pod and call edge-proxy on its plain HTTP port.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: edge-proxy
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: trading-model
automountServiceAccountToken: false
