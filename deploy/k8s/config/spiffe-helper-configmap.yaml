apiVersion: v1
kind: ConfigMap
metadata:
  name: spiffe-helper-config
  labels:
    app.kubernetes.io/part-of: trading-model
data:
  # spiffe-helper only takes a config file (-config); it has no per-setting
  # flags. Writes the pod's SVID into the shared `svid` emptyDir read by the
  # service (TLS_*_PATH). Both containers run as the pod's runAsUser, so the
  # default 0600 key mode is readable by the service. The agent socket comes
  # from the SPIFFE CSI driver volume (deploy/k8s/node-agents).
  helper.conf: |
    agent_address = "/run/spire/agent-sockets/api.sock"
    cert_dir = "/run/spire/svid"
    svid_file_name = "svid.pem"
    svid_key_file_name = "svid_key.pem"
    svid_bundle_file_name = "bundle.pem"
    daemon_mode = true
