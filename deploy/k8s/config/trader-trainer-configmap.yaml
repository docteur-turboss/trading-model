apiVersion: v1
kind: ConfigMap
metadata:
  name: trader-trainer-config
  labels:
    app.kubernetes.io/component: trader-trainer
    app.kubernetes.io/part-of: trading-model
data:
  NODE_ENV: "production"
  PORT: "3000"
  TLS_KEY_PATH: "/etc/tls/key.pem"
  TLS_CERT_PATH: "/etc/tls/cert.pem"
  TLS_CA_PATH: "/etc/tls/ca.pem"
  LOG_LEVEL: "info"
  APP_NAME: "trader-trainer"
  APP_VERSION: "1.3.0"
  SERVICE_NAME: "trader-training-service"
  CACHE_TTL_MS: "30000"
  SERVICE_PING_TIMEOUT_MS: "2000"
  TOKEN_REFRESH_INTERVAL_MS: "60000"
  TTL_REFRESH_INTERVAL_MS: "15000"
  ADDRESS_MANAGER_URL: "https://discovery-server:3000"
  MESSAGE_BUS_INIT_TIMEOUT_MS: "5000"
  MESSAGE_BUS_SHUTDOWN_TIMEOUT_MS: "5000"
  MESSAGE_CALLBACK_PATH: "message"
  TRAINER_SYMBOLS: "BTCUSDT,ETHUSDT"
  TRAINER_DATA_WINDOW: "500"
  TRAINER_VALIDATION_SPLIT: "0.2"
  TRAINER_GENERATIONS: "50"
  TRAINER_POPULATION_SIZE: "20"
  TRAINER_TIME_BUDGET_MS: "300000"
  TRAINER_EPISODES_PER_INDIVIDUAL: "3"
  TRAINER_CHECKPOINT_DIR: "/data/checkpoints"
  CERT_CLIENT_CA_URL: "https://certificate-authority:3000"
  CERT_CLIENT_SERVICE_ID: "trader-trainer"
  CERT_CLIENT_SANS: "trader-trainer,localhost"
  CA_CLIENT_TLS_KEY: "/certs/server-key.pem"
  CA_CLIENT_TLS_CERT: "/certs/server.crt"
  CA_CLIENT_TLS_CA: "/certs/ca.crt"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trader-trainer-hpa
  labels:
    app.kubernetes.io/component: trader-trainer
    app.kubernetes.io/part-of: trading-model
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trader-trainer
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trader-trainer-pdb
  labels:
    app.kubernetes.io/component: trader-trainer
    app.kubernetes.io/part-of: trading-model
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: trader-trainer
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trader-trainer-network-policy
  labels:
    app.kubernetes.io/component: trader-trainer
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: trader-trainer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading-model
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading-model
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trader-trainer
  labels:
    app.kubernetes.io/component: trader-trainer
    app.kubernetes.io/part-of: trading-model
automountServiceAccountToken: false
