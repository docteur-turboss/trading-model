apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trader-trainer-hpa
  labels:
    app.kubernetes.io/component: trader-trainer
    app.kubernetes.io/part-of: trading-model
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trader-trainer
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trader-trainer-pdb
  labels:
    app.kubernetes.io/component: trader-trainer
    app.kubernetes.io/part-of: trading-model
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: trader-trainer
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trader-trainer-network-policy
  labels:
    app.kubernetes.io/component: trader-trainer
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: trader-trainer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # Same namespace as the policy, whatever the overlay's namespace.
        - podSelector: {}
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - to:
        # Same namespace as the policy, whatever the overlay's namespace.
        - podSelector: {}
      ports:
        - port: 3000
          protocol: TCP
        # Redis and its sentinels (REDIS_SENTINELS).
        - port: 6379
          protocol: TCP
        - port: 26379
          protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trader-trainer
  labels:
    app.kubernetes.io/component: trader-trainer
    app.kubernetes.io/part-of: trading-model
automountServiceAccountToken: false
