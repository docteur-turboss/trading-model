NODE_ENV=production
OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
PORT=3000
TLS_KEY_PATH=/run/spire/svid/svid_key.pem
TLS_CERT_PATH=/run/spire/svid/svid.pem
TLS_CA_PATH=/run/spire/svid/bundle.pem
LOG_LEVEL=info
APP_NAME=decision-consumer
APP_VERSION=1.0.0
SERVICE_NAME=decision-consumer
MESSAGE_CALLBACK_PATH=message
# Models promoted by hand, symbol@version (ADR-0087 §2): a change is a reviewed PR and an audit event at load. Empty: nothing decides.
PROMOTED_MODELS=
DECISION_TICK_MS=10000
DECISION_WINDOW_BARS=500
# Bus in Redis (ADR-0073): ACL user of redis-ha.sh bus_user; TLS step "required" (26380) is release N+1 (ADR-0047).
BUS_TRANSPORT=library
REDIS_SENTINELS=redis-sentinel-0.redis-sentinel-headless:26379,redis-sentinel-1.redis-sentinel-headless:26379,redis-sentinel-2.redis-sentinel-headless:26379
REDIS_SENTINEL_MASTER_NAME=mymaster
REDIS_USERNAME=decision-consumer
REDIS_TLS_MODE=optional
REDIS_TLS_CA=/etc/redis-tls/ca.crt
