NODE_ENV=production
OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
PORT=3000
LOG_LEVEL=info
TLS_KEY_PATH=/run/spire/svid/svid_key.pem
TLS_CERT_PATH=/run/spire/svid/svid.pem
TLS_CA_PATH=/run/spire/svid/bundle.pem
ENFORCE_MTLS_STRICT=true
APP_NAME=dlq-service
APP_VERSION=1.0.0
SERVICE_NAME=dlq-service
CACHE_TTL_MS=30000
SERVICE_PING_TIMEOUT_MS=2000
TOKEN_REFRESH_INTERVAL_MS=60000
TTL_REFRESH_INTERVAL_MS=15000
ADDRESS_MANAGER_URL=https://discovery-server:3000
MESSAGE_BUS_INIT_TIMEOUT_MS=5000
MESSAGE_BUS_SHUTDOWN_TIMEOUT_MS=5000
MESSAGE_CALLBACK_PATH=message
DLQ_ALLOWED_SERVICES=message-manager,admin
MONGO_URI=mongodb://mongo-dlq-0.mongo-dlq-headless:27017,mongo-dlq-1.mongo-dlq-headless:27017,mongo-dlq-2.mongo-dlq-headless:27017/dlq?replicaSet=rs0
MONGO_DB=dlq
MONGO_COLLECTION=dlq_entries
MAX_ENTRIES=100000
DLQ_RETRY_MAX_ATTEMPTS=3
# Replays eligible dead letters through message-manager (ADR-0029).
DLQ_AUTO_RETRY_ENABLED=true
MESSAGE_MANAGER_URL=https://message-manager:3000
REDIS_SENTINELS=redis-sentinel-0.redis-sentinel-headless:26379,redis-sentinel-1.redis-sentinel-headless:26379,redis-sentinel-2.redis-sentinel-headless:26379
REDIS_SENTINEL_MASTER_NAME=mymaster
REDIS_USERNAME=dlq-service
# TLS step (ADR-0047): "required" with the sentinels on 26380 is release N+1.
REDIS_TLS_MODE=optional
REDIS_TLS_CA=/etc/redis-tls/ca.crt
