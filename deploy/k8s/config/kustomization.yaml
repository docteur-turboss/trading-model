apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# HPA, PDB, NetworkPolicy and ServiceAccount of each service (autoscaling.yaml).
resources:
  - discovery-server-autoscaling.yaml
  - financial-scraper-autoscaling.yaml
  - trader-trainer-autoscaling.yaml
  - api-gateway-autoscaling.yaml
  - audit-logger-autoscaling.yaml
  - edge-proxy-autoscaling.yaml
  - ../../edge-proxy

# Service configuration, versioned by a content hash in its name (issue #410):
# a config change alone rolls the Deployments that read it, and
# `kubectl rollout undo` brings back the previous ConfigMap with the previous
# image. Old ConfigMaps stay in the namespace (deploy.yml never prunes), so
# every ReplicaSet revision still finds its own. Never set disableNameSuffixHash.
configMapGenerator:
  - name: discovery-server-config
    envs: [discovery-server.properties]
    options:
      labels: {app.kubernetes.io/component: discovery-server, app.kubernetes.io/part-of: trading-model}
  - name: financial-scraper-config
    envs: [financial-scraper.properties]
    options:
      labels: {app.kubernetes.io/component: financial-scraper, app.kubernetes.io/part-of: trading-model}
  # Signal registry (ADR-0036, issue #1308): the repository file, mounted by
  # both financial-scraper Deployments, so a new asset needs no image release.
  - name: financial-scraper-signal-registry
    files:
      - signal-registry.json=../../../services/financial-scraper/src/config/signal-registry.json
    options:
      labels: {app.kubernetes.io/component: financial-scraper, app.kubernetes.io/part-of: trading-model}
  - name: trader-trainer-config
    envs: [trader-trainer.properties]
    options:
      labels: {app.kubernetes.io/component: trader-trainer, app.kubernetes.io/part-of: trading-model}
  - name: api-gateway-config
    envs: [api-gateway.properties]
    options:
      labels: {app.kubernetes.io/component: api-gateway, app.kubernetes.io/part-of: trading-model}
  - name: model-evaluator-config
    envs: [model-evaluator.properties]
    options:
      labels: {app.kubernetes.io/component: model-evaluator, app.kubernetes.io/part-of: trading-model}
  - name: decision-consumer-config
    envs: [decision-consumer.properties]
    options:
      labels: {app.kubernetes.io/component: decision-consumer, app.kubernetes.io/part-of: trading-model}
  - name: risk-execution-config
    envs: [risk-execution.properties]
    options:
      labels: {app.kubernetes.io/component: risk-execution, app.kubernetes.io/part-of: trading-model}
  - name: audit-logger-config
    envs: [audit-logger.properties]
    options:
      labels: {app.kubernetes.io/component: audit-logger, app.kubernetes.io/part-of: trading-model}

  # spiffe-helper only takes a config file (-config): writes the pod's SVID into
  # the shared `svid` emptyDir. Hashed like the rest (partitioned StatefulSets
  # read it too: issue #1460).
  - name: spiffe-helper-config
    files: [helper.conf]
    options:
      labels: {app.kubernetes.io/part-of: trading-model}
