apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dlq-service-hpa
  labels:
    app.kubernetes.io/component: dlq-service
    app.kubernetes.io/part-of: trading-model
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dlq-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dlq-service-pdb
  labels:
    app.kubernetes.io/component: dlq-service
    app.kubernetes.io/part-of: trading-model
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: dlq-service
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dlq-service-network-policy
  labels:
    app.kubernetes.io/component: dlq-service
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: dlq-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # Same namespace as the policy, whatever the overlay's namespace.
        - podSelector: {}
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - to:
        # Same namespace as the policy, whatever the overlay's namespace.
        - podSelector: {}
      ports:
        - port: 27017
          protocol: TCP
        - port: 6379
          protocol: TCP
        # Sentinels (REDIS_SENTINELS).
        - port: 26379
          protocol: TCP
        # TLS listeners (REDIS_TLS_MODE, ADR-0047).
        - port: 6380
          protocol: TCP
        - port: 26380
          protocol: TCP
        - port: 3000
          protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dlq-service
  labels:
    app.kubernetes.io/component: dlq-service
    app.kubernetes.io/part-of: trading-model
automountServiceAccountToken: false
