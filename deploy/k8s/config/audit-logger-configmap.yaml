apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-logger-config
  labels:
    app.kubernetes.io/component: audit-logger
    app.kubernetes.io/part-of: trading-model
data:
  NODE_ENV: "production"
  PORT: "3000"
  TLS_KEY_PATH: "/run/spire/svid/svid_key.pem"
  TLS_CERT_PATH: "/run/spire/svid/svid.pem"
  TLS_CA_PATH: "/run/spire/svid/bundle.pem"
  LOG_LEVEL: "info"
  APP_NAME: "audit-logger"
  APP_VERSION: "1.0.0"
  SERVICE_NAME: "audit-logger-service"
  CACHE_TTL_MS: "30000"
  SERVICE_PING_TIMEOUT_MS: "2000"
  TOKEN_REFRESH_INTERVAL_MS: "60000"
  TTL_REFRESH_INTERVAL_MS: "15000"
  ADDRESS_MANAGER_URL: "https://discovery-server:3000"
  MESSAGE_BUS_INIT_TIMEOUT_MS: "5000"
  MESSAGE_BUS_SHUTDOWN_TIMEOUT_MS: "5000"
  MESSAGE_CALLBACK_PATH: "message"
  MONGODB_URI: "mongodb://mongo-audit-0.mongo-audit-headless:27017,mongo-audit-1.mongo-audit-headless:27017,mongo-audit-2.mongo-audit-headless:27017/audit?replicaSet=rs0-audit"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: audit-logger-hpa
  labels:
    app.kubernetes.io/component: audit-logger
    app.kubernetes.io/part-of: trading-model
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: audit-logger
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: audit-logger-pdb
  labels:
    app.kubernetes.io/component: audit-logger
    app.kubernetes.io/part-of: trading-model
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: audit-logger
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-logger-network-policy
  labels:
    app.kubernetes.io/component: audit-logger
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: audit-logger
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading-model
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading-model
      ports:
        - port: 27017
          protocol: TCP
        - port: 3000
          protocol: TCP
        - port: 6379
          protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-logger
  labels:
    app.kubernetes.io/component: audit-logger
    app.kubernetes.io/part-of: trading-model
automountServiceAccountToken: false
