apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: discovery-server-hpa
  labels:
    app.kubernetes.io/component: discovery-server
    app.kubernetes.io/part-of: trading-model
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: discovery-server
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: discovery-server-pdb
  labels:
    app.kubernetes.io/component: discovery-server
    app.kubernetes.io/part-of: trading-model
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: discovery-server
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: discovery-server-network-policy
  labels:
    app.kubernetes.io/component: discovery-server
    app.kubernetes.io/part-of: trading-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: discovery-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # Same namespace as the policy, whatever the overlay's namespace.
        - podSelector: {}
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - to:
        # Same namespace as the policy, whatever the overlay's namespace.
        - podSelector: {}
      ports:
        - port: 6379
          protocol: TCP
        # Sentinels (REDIS_SENTINELS).
        - port: 26379
          protocol: TCP
        - port: 3000
          protocol: TCP
    # The deploy smoke test (deploy-k8s.sh smoke-test) runs from this pod and
    # checks the edge-proxy readiness on its plain HTTP port.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: edge-proxy
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: discovery-server
  labels:
    app.kubernetes.io/component: discovery-server
    app.kubernetes.io/part-of: trading-model
automountServiceAccountToken: false
