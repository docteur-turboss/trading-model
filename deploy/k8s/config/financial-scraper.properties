NODE_ENV=production
OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
PORT=3000
TLS_KEY_PATH=/run/spire/svid/svid_key.pem
TLS_CERT_PATH=/run/spire/svid/svid.pem
TLS_CA_PATH=/run/spire/svid/bundle.pem
LOG_LEVEL=info
APP_NAME=financial-scraper
APP_VERSION=2.0.0
SERVICE_NAME=financial-scraper
CACHE_TTL_MS=30000
DB_USER=scraper
DB_NAME=financial_scraper
DB_HOST=mysql-primary
DB_PORT=3306
# CA of the MySQL server certificate (Secret mysql-tls, ADR-0060): TLS with host name check.
DB_SSL_CA=/etc/mysql-tls/ca.crt
# Client certificate of MySQL user `scraper` (Secret mysql-client-scraper, ADR-0060).
DB_SSL_CERT=/etc/mysql-tls/tls.crt
DB_SSL_KEY=/etc/mysql-tls/tls.key
# Same symbols as TRAINER_SYMBOLS: the trainer reads the candles through the scraper API.
SYMBOLS_TO_TRACK=BTCUSDT,ETHUSDT
SCRAPE_INTERVAL=*/1 * * * *
BINANCE_BASE_URL=https://api.binance.com
# HPA-scaled HTTP replicas never scrape: the single financial-scraper-collector
# pod overrides this to "true", so each symbol is scraped once.
SCRAPE_SCHEDULER_ENABLED=false
# Signal registry sources (ADR-0036), collected by the collector pod only;
# tests/k8s/ci-render.mjs turns it off in CI. The contact e-mail of the
# User-Agent (SEC EDGAR: 403 without) comes from the signal-contact ConfigMap,
# written by deploy.yml from the SIGNAL_CONTACT_EMAIL secret, never committed.
SIGNAL_COLLECTION_ENABLED=true
# ConfigMap financial-scraper-signal-registry (issue #1308): read instead of the image copy.
SIGNAL_REGISTRY_FILE=/etc/signal-registry/signal-registry.json
# Non-commercial sources accepted (ADR-0075): empty, so production refuses to
# start while SIGNAL_KEY_TWELVEDATA is set; list the ids once the terms fit.
SIGNAL_NON_COMMERCIAL_ACCEPTED=
