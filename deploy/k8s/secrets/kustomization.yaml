apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Sealed Secrets are used for encryption-at-rest in git.
# See sealed-secrets.md for setup instructions.
# The SealedSecret resource replaces the plaintext secretGenerator below.
#
# To encrypt your production values:
#   1. Install sealed-secrets controller: kubectl apply -f https://...
#   2. Run: kubeseal -o yaml < plaintext-secret.yaml > trading-model-sealed-secrets.yaml
#   3. kubectl apply -f trading-model-sealed-secrets.yaml
#
# The secretGenerator below provides development defaults only.
# In production, use the SealedSecret in trading-model-sealed-secrets.yaml.

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: trading-model-secrets
    literals:
      - AUTH_TOKENS=dev-token-change-me
      - SIGNING_SECRET=dev-signing-change-me
      - SERVICE_BOOTSTRAP_TOKEN=dev-bootstrap-change-me
      - MYSQL_ROOT_PASSWORD=dev-mysql-root
      - MYSQL_PASSWORD=dev-mysql
      - DLQ_AUTH_HMAC_SECRET=dev-dlq-hmac
      - ADMIN_TOKEN=dev-admin-token
      - GRAFANA_PASSWORD=dev-grafana
      - HMAC_SECRET=dev-hmac
