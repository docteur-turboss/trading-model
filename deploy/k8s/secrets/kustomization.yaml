apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production-only secrets. Encrypted at rest with Sealed Secrets; the
# controller decrypts these into the `trading-model-secrets` Secret.
# Bootstrap the real encrypted values with:
#   bash scripts/init-sealed-secrets.sh [--apply]
#
# Staging does NOT reference this directory: it uses a development-only
# secretGenerator in its own overlay.
resources:
  - trading-model-sealed-secrets.yaml
  - mongodb-encryption-key-sealed.yaml