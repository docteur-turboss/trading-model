apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mongodb-encryption-key
  namespace: trading-model
  labels:
    app.kubernetes.io/part-of: trading-model
spec:
  encryptedData:
    # REQUIRED before production deployment. This placeholder cannot be
    # decrypted — Mongo will refuse to start without the real key. Bootstrap
    # all sealed secrets (including this 64-char hex AES key) with:
    #   bash scripts/init-sealed-secrets.sh
    key: AgCHANGE_ME_RUN_KUBESEAL_Ag==
  template:
    type: Opaque