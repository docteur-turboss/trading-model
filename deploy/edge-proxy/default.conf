# edge-proxy — external entry point to the api-gateway (ADR-0018).
# The gateway only accepts SPIFFE mTLS clients (ADR-0011): this proxy takes
# plain HTTP from outside the mesh and forwards /v<major> with its own SVID
# (identity `edge-proxy`, the only caller the gateway ACL allows).
# Mounted as /etc/nginx/conf.d/default.conf (compose volume, K8s ConfigMap),
# with conf.d/gateway.inc: how to reach the gateway in that environment
# (gateway.compose.inc or gateway.k8s.inc; K8s also loads
# conf.d/gateway-upstream.conf, the keep-alive pool). conf.d/realip.inc says
# whether X-Forwarded-For is trusted (realip.compose.inc: no,
# realip.k8s.inc: from the ingress controller).

# Access logs hold the caller's IP, the only personal data of the platform
# (data-processing register, activity 6): it is truncated before it is
# written (IPv4 /24, IPv6 /48), and X-Forwarded-For / User-Agent are not
# logged. The error log cannot be truncated (every error line ends with
# "client: <full IP>"), so it is limited to `crit`: upstream failures
# (level `error`) are not logged here, the access log keeps their 502/504
# status and correlation id.
error_log /dev/stderr crit;

map $remote_addr $remote_addr_anon {
    ~^(?P<net>\d+\.\d+\.\d+)\.\d+$          $net.0;
    ~^(?P<net>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*): $net::;
    default                                 0.0.0.0;
}

# Request id sent to the gateway as X-Correlation-Id: a valid incoming one is
# kept, anything else (empty, too long, odd characters) is replaced by nginx's.
map $http_x_correlation_id $edge_correlation_id {
    "~^[A-Za-z0-9._-]{1,64}$"   $http_x_correlation_id;
    default                     $request_id;
}

# One JSON object per line (read by promtail's json stage). $uri, not
# $request_uri: no query string.
log_format anonymized escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr_anon",'
    '"method":"$request_method","uri":"$uri","protocol":"$server_protocol",'
    '"status":$status,"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,"correlation_id":"$edge_correlation_id"}';

# Rate limit per real client address, before mTLS and authentication of the
# gateway. The key ($edge_limit_key, conf.d/edge-limit-key.inc) is
# $binary_remote_addr read after realip, never the truncated $remote_addr_anon
# (clients of one /24 would share a limit). 10m holds ~160 000 addresses.
# 20 r/s sustained, burst 60 served at once: far above the gateway's 100 req/min
# per client (RATE_LIMIT_*) and the smoke/soak scripts (<= 4 r/s), so only
# floods get 429. The k6 scenarios (~50 r/s) and stress test (100 VUs, no
# sleep) exceed it: load runs mount edge-limit-key.off.inc (tests/load/README.md).
# limit_conn 50: one address holds at most 50 simultaneous connections, well
# above a browser or SDK (6 to 10) and below what exhausts the gateway pool.
# The limit is per edge-proxy replica: effective limit = rate x replicas, below
# the Ingress limit-rps (100, deploy/k8s/ingress/gateway-ingress.yaml) for 1 to
# 5 replicas.
include /etc/nginx/conf.d/edge-limit-key.inc;
limit_req_zone $edge_limit_key zone=edge_req:10m rate=20r/s;
limit_conn_zone $edge_limit_key zone=edge_conn:10m;

server {
    listen 8080;
    server_name _;
    include /etc/nginx/conf.d/realip.inc;
    access_log /var/log/nginx/access.log anonymized;
    limit_req_status 429;
    limit_conn_status 429;

    location = /ping {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /health/ready {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location ~ ^/v[0-9]+/ {
        limit_req zone=edge_req burst=60 nodelay;
        limit_conn edge_conn 50;
        # JSON answers to external clients only (not between services).
        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_vary on;

        include /etc/nginx/conf.d/gateway.inc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr_anon;
        proxy_set_header X-Forwarded-For $remote_addr_anon;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $edge_correlation_id;

        # A variable in the path makes nginx read the SVID on each handshake
        # instead of once at startup: spiffe-helper rotates it every hour.
        set $svid_dir /run/spire/svid;
        proxy_ssl_certificate $svid_dir/svid.pem;
        proxy_ssl_certificate_key $svid_dir/svid_key.pem;
        proxy_ssl_trusted_certificate /run/spire/svid/bundle.pem;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_session_reuse on;
    }

    location / {
        default_type application/json;
        return 404 '{"error":"not found"}';
    }
}
