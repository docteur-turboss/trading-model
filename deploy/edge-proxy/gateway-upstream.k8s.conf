# Kubernetes only (loaded at http level from conf.d, see kustomization.yaml):
# pool of keep-alive connections to the api-gateway, so a public request does
# not pay a TCP connect + full mTLS handshake. Not used by compose, whose
# dynamic DNS resolution (variable in proxy_pass) cannot use an upstream block.
upstream gateway {
    server api-gateway:3000;
    keepalive 32;
    # Under Node's default server keepAliveTimeout (5 s): nginx never reuses a
    # connection the gateway is closing.
    keepalive_timeout 4s;
    # Hard age cap: a connection opened with an old SVID is dropped within
    # 5 min, and the next handshake re-reads svid.pem (rotated hourly).
    keepalive_time 5m;
    keepalive_requests 1000;
}
