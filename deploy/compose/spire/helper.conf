# spiffe-helper sidecar configuration (docker-compose, ADR-0011).
# Writes the workload SVID into the svid-<svc> volume read by the service
# (TLS_*_PATH); services reload it through their TLS file watcher.
agent_address = "/run/spire/agent-sockets/public/api.sock"
cert_dir = "/run/spire/svid"
svid_file_name = "svid.pem"
svid_key_file_name = "svid_key.pem"
svid_bundle_file_name = "bundle.pem"
daemon_mode = true
# The helper runs as root and the services as appuser: the key must be readable
# by another uid. The volume is only mounted by the helper and its service.
cert_file_mode = 0644
key_file_mode = 0644
