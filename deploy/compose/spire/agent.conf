# SPIRE Agent dev configuration (docker-compose, ADR-0011).
# Node attestation: join token minted by spire-bootstrap (agent-entrypoint.sh).
# Workload attestation: Docker labels of the calling container (needs pid: host).
agent {
  trust_domain = "trading-model.local"
  data_dir = "/run/spire/agent-data"
  log_level = "INFO"
  server_address = "spire-server"
  server_port = "8081"
  socket_path = "/run/spire/agent-sockets/public/api.sock"
  # Server bundle exported by spire-bootstrap: authenticates the server on first attestation.
  trust_bundle_path = "/run/spire/bootstrap/bundle.pem"
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }
  KeyManager "disk" {
    plugin_data {
      directory = "/run/spire/agent-data"
    }
  }
  WorkloadAttestor "docker" {
    plugin_data {
      docker_socket_path = "unix:///run/docker.sock"
    }
  }
}
