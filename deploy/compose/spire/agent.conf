# SPIRE Agent dev configuration (docker-compose, ADR-0011).
# Docker workload attestor — attests workload containers via the Docker socket.
agent {
  trust_domain = "trading-model.local"
  data_dir = "/run/spire/data"
  log_level = "INFO"
  server_address = "spire-server"
  server_port = "8081"
  socket_path = "/run/spire/agent-sockets/public/api.sock"
  svid_ttl = "1h"
}

plugins {
  NodeAttestor "docker" {
    plugin_data {
      docker_socket_path = "/run/docker.sock"
      container_id = "self"
    }
  }
  KeyManager "disk" {
    plugin_data {
      keys_path = "/run/spire/data/agent-keys.pem"
    }
  }
  WorkloadAttestor "docker" {
    plugin_data {
      docker_socket_path = "/run/docker.sock"
    }
  }
}