# SPIRE Server dev configuration (docker-compose, ADR-0011).
# SQLite datastore — dev only; K8s uses MySQL.
server {
  trust_domain = "trading-model.local"
  data_dir = "/run/spire/data"
  log_level = "INFO"
  ca_key_type = "ec-p256"
  ca_ttl = "168h"
  default_svid_ttl = "1h"
  ca_subject = {
    country = "FR"
    organization = "Trading Model"
    common_name = "trading-model.local"
  }
  socket_path = "/run/spire/sockets/public/api.sock"
}

plugins {
  KeyManager "disk" {
    plugin_data {
      keys_path = "/run/spire/data/keys.json"
    }
  }
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      database = "/run/spire/data/datastore.sqlite3"
    }
  }
}