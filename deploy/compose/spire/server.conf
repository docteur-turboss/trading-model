# SPIRE Server dev configuration (docker-compose, ADR-0011).
# SQLite datastore — dev only; K8s uses MySQL.
server {
  trust_domain = "trading-model.local"
  data_dir = "/run/spire/data"
  log_level = "INFO"
  ca_key_type = "ec-p256"
  ca_ttl = "168h"
  default_x509_svid_ttl = "1h"
  ca_subject = {
    country = ["FR"]
    organization = ["Trading Model"]
    common_name = "trading-model.local"
  }
  # Server API socket: used by spire-bootstrap to register entries and mint the agent join token.
  socket_path = "/run/spire/sockets/api.sock"
}

plugins {
  # The agent attests with a one-shot join token minted by spire-bootstrap.
  NodeAttestor "join_token" {
    plugin_data {}
  }
  KeyManager "disk" {
    plugin_data {
      keys_path = "/run/spire/data/keys.json"
    }
  }
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/run/spire/data/datastore.sqlite3"
    }
  }
}
