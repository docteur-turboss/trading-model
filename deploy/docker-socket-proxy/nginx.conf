# Docker API proxy for the compose stack (issue #2409, ADR-0011 amendment).
# Only holder of /var/run/docker.sock (read-only mount). Callers: spire-agent
# (Docker workload attestor) and promtail (docker_sd + log tailing), on the
# internal network docker-api-net. Rules:
#   - GET (and HEAD) only; any other path or method answers 403;
#   - container list: always filtered on the compose project label;
#   - inspect and logs: 403 unless the container belongs to the compose project;
#   - inspect never returns Config.Env (secrets of the container).
load_module modules/ngx_http_js_module.so;

# Workers stay root: the socket is root-owned and the container has no capability.
user root;
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
env COMPOSE_PROJECT_NAME;

events {
    worker_connections 256;
}

http {
    js_import docker from /etc/nginx/docker-api.js;
    js_set $docker_list_args docker.listArgs;

    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    upstream docker {
        server unix:/var/run/docker.sock;
    }

    server {
        listen 2375;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Logs are streamed (follow=1): no buffering, long reads.
        proxy_buffering off;
        proxy_read_timeout 1h;
        # Inspect bodies read by njs (a few tens of KiB).
        subrequest_output_buffer_size 1m;

        location ~ ^(/v[0-9.]+)?/(_ping|version|networks)$ {
            limit_except GET { deny all; }
            proxy_pass http://docker;
        }

        location ~ ^(/v[0-9.]+)?/containers/json$ {
            limit_except GET { deny all; }
            proxy_pass http://docker$uri?$docker_list_args;
        }

        location ~ ^(?<api>/v[0-9.]+)?/containers/(?<cid>[A-Za-z0-9][A-Za-z0-9_.-]*)/json$ {
            limit_except GET { deny all; }
            js_content docker.inspect;
        }

        location ~ ^(?<api>/v[0-9.]+)?/containers/(?<cid>[A-Za-z0-9][A-Za-z0-9_.-]*)/logs$ {
            limit_except GET { deny all; }
            auth_request /_authorize;
            # Forward the checked id, not the raw request URI.
            proxy_pass http://docker$api/containers/$cid/logs$is_args$args;
        }

        location = /_authorize {
            internal;
            js_content docker.authorize;
        }

        location /_docker/ {
            internal;
            proxy_buffering on;
            proxy_pass http://docker/;
        }

        location / {
            # Refused paths are logged: a caller needing a new endpoint shows up here.
            access_log /dev/stdout;
            return 403;
        }
    }
}
