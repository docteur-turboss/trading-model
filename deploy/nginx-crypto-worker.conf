# nginx Crypto Worker Load Balancer — round-robin TLS passthrough
# Each crypto-worker instance runs its own HTTPS server; nginx proxies to them.

upstream crypto_worker_backend {
    server crypto-worker-1:3000;
    server crypto-worker-2:3000;
}

server {
    listen 3000;

    location / {
        proxy_pass https://crypto_worker_backend;

        proxy_ssl_verify        off;
        proxy_ssl_session_reuse on;

        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout   5s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;
    }
}
