# Binance stub for the kind smoke test (tests/k8s/run-kind.sh): CI runners
# cannot reach api.binance.com (HTTP 451 from US regions). Same server as the
# compose E2E stub, served on 3000: the scraper's NetworkPolicy allows
# in-namespace egress to that port. The ConfigMap `binance-stub` (server.mjs)
# is created by run-kind.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: binance-stub
  labels:
    app.kubernetes.io/component: binance-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: binance-stub
  template:
    metadata:
      labels:
        app.kubernetes.io/component: binance-stub
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stub
          image: oven/bun:1.4.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d
          command: ["bun", "/stub/server.mjs"]
          env:
            - name: PORT
              value: "3000"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/v3/ping
              port: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: stub
              mountPath: /stub
              readOnly: true
      volumes:
        - name: stub
          configMap:
            name: binance-stub
---
apiVersion: v1
kind: Service
metadata:
  name: binance-stub
  labels:
    app.kubernetes.io/component: binance-stub
spec:
  selector:
    app.kubernetes.io/component: binance-stub
  ports:
    - port: 3000
      targetPort: 3000
