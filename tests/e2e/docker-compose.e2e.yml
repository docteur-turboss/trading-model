# E2E overlay: points the financial-scraper at a Binance stub and scrapes every
# 10s so the data-flow test (market-data-flow.e2e.spec.ts) sees data quickly.
# Usage: docker compose -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml up -d --wait
services:
  binance-stub:
    image: oven/bun:1.4.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d
    container_name: trading-binance-stub
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    command: ["bun", "/stub/server.mjs"]
    volumes:
      # Relative to the project directory (the base compose file), not this overlay.
      - ./tests/e2e/binance-stub:/stub:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/api/v3/ping').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  financial-scraper:
    environment:
      BINANCE_BASE_URL: http://binance-stub:8080
      SYMBOLS_TO_TRACK: BTCUSDT,ETHUSDT
      SCRAPE_INTERVAL: '*/10 * * * * *'
      # The signal registry sources are real public APIs: CI never calls them.
      SIGNAL_COLLECTION_ENABLED: 'false'
    depends_on:
      binance-stub:
        condition: service_healthy

  discovery-server:
    environment:
      SIGNING_SECRET: e2e-signing-secret

  # External E2E traffic authenticates with this key (tests/e2e/helpers.ts).
  api-gateway:
    environment:
      AUTH_TOKENS: e2e-api-key
      AUTH_STRICT: 'true'
      # The k6 smoke sends ~240 req/min from one IP; the default 100/min would answer 429.
      # Scenarios and stress need more: tests/load/README.md, "Rate limit".
      RATE_LIMIT_MAX: '2000'

  # Same key on both sides of the dead-letter path (dead-letter-flow suite).
  message-manager:
    environment:
      DLQ_AUTH_HMAC_SECRET: test-hmac-secret

  # The DLQ suites sign their requests as e2e-test-runner.
  dlq-service:
    environment:
      DLQ_AUTH_HMAC_SECRET: test-hmac-secret
      DLQ_ALLOWED_SERVICES: message-manager,admin,e2e-test-runner
      # The suites replay dead letters by hand (dead-letter-flow, dlq): an
      # automatic replay could claim the entry first and race their assertions.
      DLQ_AUTO_RETRY_ENABLED: "false"

  # Short training run so model-training-flow.e2e.spec.ts sees a published model.
  # The loop checks every 60 s once a symbol has data; the run itself must stay
  # well under that so the first model lands within ~2 min of startup.
  trader-trainer:
    environment:
      # One symbol: one run is enough, and the loop trains one symbol per cycle.
      TRAINER_SYMBOLS: BTCUSDT
      # 2 generations x 6 individuals: smallest GA that still selects and breeds.
      TRAINER_GENERATIONS: '2'
      TRAINER_POPULATION_SIZE: '6'
      # Left at the default 10: the risk ratios and drawdown need several episodes.
      TRAINER_EPISODES_PER_INDIVIDUAL: '10'
      # Hard stop in case a run is slower than expected on a CI runner.
      TRAINER_TIME_BUDGET_MS: '60000'
      # The stub serves 1-min candles for the current minute: allow a few of them.
      TRAINER_MAX_DATA_AGE_MS: '300000'
      # Only the scraper may download weights; message-manager (also in the
      # trainer ACL) is deliberately not listed, to prove the 403.
      MODEL_DOWNLOAD_CALLERS: financial-scraper
