# E2E overlay: points the financial-scraper at a Binance stub and scrapes every
# 10s so the data-flow test (market-data-flow.e2e.spec.ts) sees data quickly.
# Usage: docker compose -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml up -d --wait
services:
  binance-stub:
    image: oven/bun:1.4.5@sha256:3aa040e5445efa09d75bb428a64ba50db13e2b3ac9b6b0c7f145615f62b2ee18
    container_name: trading-binance-stub
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    command: ["bun", "/stub/server.mjs"]
    volumes:
      # Relative to the project directory (the base compose file), not this overlay.
      - ./tests/e2e/binance-stub:/stub:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/api/v3/ping').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  financial-scraper:
    environment:
      BINANCE_BASE_URL: http://binance-stub:8080
      SYMBOLS_TO_TRACK: BTCUSDT,ETHUSDT
      SCRAPE_INTERVAL: '*/10 * * * * *'
      # The signal registry sources are real public APIs: CI never calls them.
      SIGNAL_COLLECTION_ENABLED: 'false'
    depends_on:
      binance-stub:
        condition: service_healthy

  # External E2E traffic authenticates with this key (tests/e2e/helpers.ts).
  api-gateway:
    environment:
      AUTH_TOKENS: e2e:read+audit:read+risk:admin:e2e-api-key-0123456789abcdef0123456789abcdef
      # The k6 smoke sends ~240 req/min from one IP; the default 100/min would answer 429.
      # Scenarios and stress need more: tests/load/README.md, "Rate limit".
      RATE_LIMIT_MAX: '2000'

  # Short training run so model-training-flow.e2e.spec.ts sees a published model.
  # The loop checks every 60 s once a symbol has data; the run itself must stay
  # well under that so the first model lands within ~2 min of startup.
  trader-trainer:
    depends_on:
      e2e-models:
        condition: service_completed_successfully
    environment:
      # One symbol: one run is enough, and the loop trains one symbol per cycle.
      TRAINER_SYMBOLS: BTCUSDT
      # 2 generations x 6 individuals: smallest GA that still selects and breeds.
      TRAINER_GENERATIONS: '2'
      TRAINER_POPULATION_SIZE: '6'
      # Left at the default 10: the risk ratios and drawdown need several episodes.
      TRAINER_EPISODES_PER_INDIVIDUAL: '10'
      # Hard stop in case a run is slower than expected on a CI runner.
      TRAINER_TIME_BUDGET_MS: '60000'
      # A session per minute so the E2E sees a model in its delay.
      TRAINER_INTERVAL_MS: '60000'
      # The stub serves 1-min candles for the current minute: allow a few of them.
      TRAINER_MAX_DATA_AGE_MS: '300000'
      # Only the gateway may download weights; risk-execution (also in the
      # trainer ACL) is deliberately not listed, to prove the 403.
      MODEL_DOWNLOAD_CALLERS: api-gateway,model-evaluator,decision-consumer

  # Fixed model to promote (tests/e2e/fixtures/models, written by the trainer's own store: see
  # services/trader-trainer/tests/unit/e2e-model-fixture.spec.ts). It sits under ETHUSDT, a symbol the
  # trainer does not train here, so model-training-flow keeps its own BTCUSDT versions. Copied into the
  # volume by the trainer image so the files belong to the user the trainer writes as.
  e2e-models:
    image: ${IMAGE_REGISTRY:-ghcr.io/trading-model}/trader-trainer:${IMAGE_TAG:-latest}
    restart: 'no'
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    entrypoint: ["sh", "-c", "mkdir -p /data/checkpoints/models && cp -r /fixtures/. /data/checkpoints/models/"]
    volumes:
      - trainer-checkpoints:/data/checkpoints
      - ./tests/e2e/fixtures/models:/fixtures:ro
    networks:
      - backend-net

  decision-consumer:
    environment:
      PROMOTED_MODELS: ETHUSDT@20261127T000000Z-d3a6453ea857
      DECISION_TICK_MS: '5000'

  risk-execution:
    environment:
      RISK_INSTRUMENTS: '{"BTCUSDT":{"maxQuantity":0.01},"ETHUSDT":{"maxQuantity":1}}'
