# Build the first-party images from the sources (local dev, CI E2E):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# The base file only references the released images (deploy-compose.yml).
services:
  migrate:
    build:
      context: .
      dockerfile: deploy/migrate/Dockerfile
  spire-bootstrap:
    build:
      context: deploy/spire
      target: bootstrap
  spire-agent:
    build:
      context: deploy/spire
      target: agent
  message-manager:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: message-manager
  financial-scraper:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: financial-scraper
  trader-trainer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: trader-trainer
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
  audit-logger:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: audit-logger
  model-evaluator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: model-evaluator
  risk-execution:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: risk-execution
  decision-consumer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: decision-consumer
  dlq-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: dlq-service
