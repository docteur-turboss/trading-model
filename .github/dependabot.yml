version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7 (native compiler) has no JS compiler API yet: ts-jest
      # (peer typescript <7) and typedoc (peer <=6.0.x) cannot run on it.
      # Lift once both support it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/discovery-server"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/financial-scraper"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/message-manager"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/trader-trainer"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/api-gateway"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/audit-logger"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/dlq-service"
    schedule:
      interval: "weekly"