# Version updates scan development and open their PRs there, where the k8s
# N-1 check runs (#1561). GitHub reads this file from main only, and security
# updates always target main: the orchestrator retargets those to development.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7 (native compiler) has no JS compiler API yet: ts-jest
      # (peer typescript <7) and typedoc (peer <=6.0.x) cannot run on it.
      # Lift once both support it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/discovery-server"
    target-branch: "development"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/financial-scraper"
    target-branch: "development"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/message-manager"
    target-branch: "development"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/trader-trainer"
    target-branch: "development"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/api-gateway"
    target-branch: "development"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/audit-logger"
    target-branch: "development"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/dlq-service"
    target-branch: "development"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/deploy/backup"
    target-branch: "development"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/deploy/spire"
    target-branch: "development"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/deploy/migrate"
    target-branch: "development"
    schedule:
      interval: "weekly"

  - package-ecosystem: "bun"
    directory: "/deploy/migrate"
    target-branch: "development"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    ignore:
      # A datastore major upgrade rewrites its data files, so the N-1 rollback
      # cannot pass (mongo 7.0 to 9.0: exit 62, issue #1751): done by hand.
      - dependency-name: "mongo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mysql"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/deploy/k8s/infra"
    target-branch: "development"
    schedule:
      interval: "weekly"
    ignore:
      # Same reason as docker-compose above.
      - dependency-name: "mongo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mysql"
        update-types: ["version-update:semver-major"]
