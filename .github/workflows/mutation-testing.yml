name: Mutation Testing

# Weekly Stryker run (issue #656). Not part of the PR gates or pre-push.
# Scope: trader-trainer `src/domain/**`, model-runtime `src/env/**` (portfolio simulator, ADR-0066) and
# risk-execution `src/domain/**` (issue #2103).
# `break` 60 per shard, 50 for the two GA shards (MUTATION_BREAK, read by
# services/trader-trainer/stryker.config.mjs; model-runtime sets 60 and
# risk-execution 80 in their config). A single run over all of `src/domain` stalled at 38 %
# after 1 h (genetic-algorithm / neural-network mutants are slow), so the
# domain is sharded: one job, and one time budget, per shard.
# Incremental (issue #1813): each shard caches its Stryker incremental file and
# only re-mutates changed code or tests. Full run: dispatch with `full` checked
# (or delete the `stryker-incremental-*` caches).
on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly: Sunday 3 AM UTC
  workflow_dispatch:
    inputs:
      full:
        description: Ignore the incremental cache and re-run every mutant
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  stryker:
    name: stryker (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: trader-trainer-domain
            dir: services/trader-trainer
            break: 60
            mutate: 'src/domain/**/*.ts,!src/domain/genetic-algorithm/**,!src/domain/neural-network/**'
          - name: trader-trainer-neural-network-a
            dir: services/trader-trainer
            break: 60
            mutate: 'src/domain/neural-network/activation.ts,src/domain/neural-network/experience-pool.ts,src/domain/neural-network/normalizers.ts'
          - name: trader-trainer-neural-network-b
            dir: services/trader-trainer
            break: 60
            mutate: 'src/domain/neural-network/**/*.ts,!src/domain/neural-network/activation.ts,!src/domain/neural-network/experience-pool.ts,!src/domain/neural-network/normalizers.ts'
          - name: trader-trainer-ga-core
            dir: services/trader-trainer
            break: 50
            mutate: 'src/domain/genetic-algorithm/*.ts'
          - name: trader-trainer-ga-operators
            dir: services/trader-trainer
            break: 50
            mutate: 'src/domain/genetic-algorithm/*/**/*.ts'
          - name: model-runtime-env
            dir: packages/model-runtime
            break: 60
            mutate: 'src/env/**/*.ts'
          - name: risk-execution-domain
            dir: services/risk-execution
            break: 80
            mutate: 'src/domain/**/*.ts'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The TypeScript checker resolves @trading-model/* through the built packages
      - run: bun run build
      - name: Restore incremental file
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.dir }}/.stryker-incremental
          key: stryker-incremental-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: stryker-incremental-${{ matrix.name }}-
      - name: Stryker
        working-directory: ${{ matrix.dir }}
        env:
          MUTATE: ${{ matrix.mutate }}
          MUTATION_BREAK: ${{ matrix.break }}
          FORCE: ${{ inputs.full && '--force' || '' }}
        run: |
          # shellcheck disable=SC2086 # FORCE is empty or a flag
          bun run stryker --incremental --incrementalFile ".stryker-incremental/${{ matrix.name }}.json" $FORCE --mutate "$MUTATE,!src/**/*.spec.ts,!src/**/*.d.ts"
      - name: Save incremental file
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.dir }}/.stryker-incremental
          key: stryker-incremental-${{ matrix.name }}-${{ github.run_id }}
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.name }}
          path: ${{ matrix.dir }}/reports/mutation/
          if-no-files-found: warn
          retention-days: 30
