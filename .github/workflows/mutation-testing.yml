name: Mutation Testing

# Weekly Stryker run (issue #656). Not part of the PR gates or pre-push.
# Scope: trader-trainer `src/domain/**` and dlq-service `src/application/**`,
# `break: 50` per shard. A single run over all of `src/domain` stalled at 38 %
# after 1 h (genetic-algorithm / neural-network mutants are slow), so the
# domain is sharded: one job, and one time budget, per shard.
on:
  # TEMPORARY (issue #656): proves the shards finish on a GitHub runner (round 3: dryRunTimeoutMinutes 30). Remove before merge.
  push:
    branches: [chore/issue-656-make-the-stryker-mutation-testing-config]
    paths: ['.github/workflows/mutation-testing.yml']
  schedule:
    - cron: '0 3 * * 0'  # Weekly: Sunday 3 AM UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  stryker:
    name: stryker (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: trader-service-domain
            dir: services/trader-trainer
            mutate: 'src/domain/**/*.ts,!src/domain/genetic-algorithm/**,!src/domain/neural-network/**'
          - name: trader-service-neural-network
            dir: services/trader-trainer
            mutate: 'src/domain/neural-network/**/*.ts'
          - name: trader-service-ga-core
            dir: services/trader-trainer
            mutate: 'src/domain/genetic-algorithm/*.ts'
          - name: trader-service-ga-operators
            dir: services/trader-trainer
            mutate: 'src/domain/genetic-algorithm/*/**/*.ts'
          - name: dlq-service
            dir: services/dlq-service
            mutate: 'src/application/**/*.ts'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The TypeScript checker resolves @trading-model/* through the built packages
      - run: bun run build
      - name: Stryker
        working-directory: ${{ matrix.dir }}
        env:
          MUTATE: ${{ matrix.mutate }}
        run: bun run stryker --mutate "$MUTATE,!src/**/*.spec.ts,!src/**/*.d.ts"
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.name }}
          path: ${{ matrix.dir }}/reports/mutation/
          if-no-files-found: warn
          retention-days: 30
