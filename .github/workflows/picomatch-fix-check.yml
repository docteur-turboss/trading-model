name: Picomatch Fix Check

# Weekly: fails once npm publishes a picomatch above 4.0.7, the last version
# hit by GHSA-fc5q-39xc-vjpf. Then drop `--ignore=GHSA-fc5q-39xc-vjpf` from the
# `security` job of ci.yml, bump picomatch, and delete this workflow (#1596).
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Newest picomatch is still 4.0.7
        run: |
          latest=$(npm view picomatch version)
          echo "picomatch latest: $latest"
          [ "$latest" = "4.0.7" ] || { echo "::error::picomatch $latest is out: remove the audit ignore (#1596)"; exit 1; }
