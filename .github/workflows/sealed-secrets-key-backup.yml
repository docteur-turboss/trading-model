name: SealedSecrets Key Backup

# Daily off-site backup of the SealedSecrets controller keys of the
# production cluster (ADR-0035, issue #328). The controller creates a new key
# every 30 days and keeps the old ones; a key never backed up is lost with
# the cluster, together with every SealedSecret sealed with it. The daily run
# backs up a renewed key within 24 h, whether or not a deploy follows.
#
# Everything comes from the dedicated GitHub environment
# `sealed-secrets-key-backup` (deployment branches: the default branch only,
# no required reviewer, which would block the schedule):
#   secret   SEALED_SECRETS_BACKUP_KUBECONFIG  kubeconfig of the
#            `sealed-secrets-key-backup` ServiceAccount (list Secrets of the
#            controller namespace only), from
#            scripts/sealed-secrets-backup-identity.sh; never an admin one
#   secrets  BACKUP_S3_ACCESS_KEY_ID / BACKUP_S3_SECRET_ACCESS_KEY  put
#            credentials of the off-site bucket, no delete right (ADR-0033)
#   vars     BACKUP_AGE_RECIPIENTS (operator + escrow keys, ADR-0034),
#            BACKUP_S3_BUCKET, BACKUP_S3_REGION, BACKUP_S3_ENDPOINT,
#            BACKUP_S3_PROVIDER, SEALED_SECRETS_NAMESPACE (default kube-system)
# A missing value, an unreachable cluster or bucket, no key found: the run
# fails and GitHub notifies on it (no swallowed error, ADR-0017).
on:
  schedule:
    - cron: '30 3 * * *'  # Daily: 03:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  backup-sealed-secrets-key:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: sealed-secrets-key-backup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # kubectl, age and the rclone of the backup CronJob (deploy/backup).
      - name: Build the backup tools image
        run: docker build -q -t backup-tools deploy/backup

      # The kubeconfig goes to a tmpfs (/dev/shm), mode 600, never to an
      # argument or the log, and is deleted by the next step even on failure.
      # Values reach the container by name only (-e VAR), never in argv.
      - name: Back up the controller keys off-site
        env:
          SEALED_SECRETS_BACKUP_KUBECONFIG: ${{ secrets.SEALED_SECRETS_BACKUP_KUBECONFIG }}
          SEALED_SECRETS_NAMESPACE: ${{ vars.SEALED_SECRETS_NAMESPACE }}
          BACKUP_AGE_RECIPIENTS: ${{ vars.BACKUP_AGE_RECIPIENTS }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          AWS_REGION: ${{ vars.BACKUP_S3_REGION }}
          RCLONE_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          RCLONE_S3_PROVIDER: ${{ vars.BACKUP_S3_PROVIDER }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        run: |
          missing=()
          [ -n "$SEALED_SECRETS_BACKUP_KUBECONFIG" ] || missing+=(secret SEALED_SECRETS_BACKUP_KUBECONFIG)
          [ -n "$BACKUP_AGE_RECIPIENTS" ] || missing+=(variable BACKUP_AGE_RECIPIENTS)
          [ -n "$BACKUP_S3_BUCKET" ] || missing+=(variable BACKUP_S3_BUCKET)
          [ -n "$AWS_ACCESS_KEY_ID" ] || missing+=(secret BACKUP_S3_ACCESS_KEY_ID)
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || missing+=(secret BACKUP_S3_SECRET_ACCESS_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Environment sealed-secrets-key-backup is incomplete (${missing[*]}): the SealedSecrets keys are not backed up (ADR-0035)"
            exit 1
          fi
          export AWS_REGION="${AWS_REGION:-us-east-1}"
          export RCLONE_S3_PROVIDER="${RCLONE_S3_PROVIDER:-AWS}"
          export SEALED_SECRETS_NAMESPACE="${SEALED_SECRETS_NAMESPACE:-kube-system}"
          # Production: operator + escrow keys (ADR-0034).
          export BACKUP_MIN_RECIPIENTS=2
          kube_dir=/dev/shm/sealed-secrets-key-backup
          ( umask 077 && mkdir -p "$kube_dir" && printf '%s\n' "$SEALED_SECRETS_BACKUP_KUBECONFIG" > "$kube_dir/kubeconfig" )
          unset SEALED_SECRETS_BACKUP_KUBECONFIG
          endpoint=()
          [ -z "$RCLONE_S3_ENDPOINT" ] || endpoint=(-e RCLONE_S3_ENDPOINT)
          set -o pipefail
          # Runner user: it owns the mode-600 kubeconfig.
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo:ro" -v "$kube_dir:/kube:ro" -w /repo \
            -e KUBECONFIG=/kube/kubeconfig -e SEALED_SECRETS_NAMESPACE \
            -e BACKUP_AGE_RECIPIENTS -e BACKUP_MIN_RECIPIENTS \
            -e BACKUP_S3_BUCKET -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY \
            -e AWS_REGION -e RCLONE_S3_PROVIDER "${endpoint[@]}" \
            backup-tools bash scripts/backup-sealed-secrets-key.sh \
            | tee "$RUNNER_TEMP/sealed-secrets-key-backup.txt"

      - name: Remove the kubeconfig
        if: always()
        run: rm -rf /dev/shm/sealed-secrets-key-backup

      # Trace of the run: keys found and file written, kept with the run.
      - name: Publish the report
        if: always()
        run: |
          report="$RUNNER_TEMP/sealed-secrets-key-backup.txt"
          {
            echo '## SealedSecrets key backup'
            echo
            if [ -s "$report" ]; then
              echo '```'
              grep -E 'key\(s\)|✓|✗|⚠' "$report" || cat "$report"
              echo '```'
            else
              echo 'No report: the backup did not run (see the step log).'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
