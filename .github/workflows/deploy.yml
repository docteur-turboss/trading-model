name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string
      image_tag:
        description: 'Image tag to deploy (e.g. latest, v1.2.3)'
        required: true
        type: string
      version_number:
        description: 'Version number for audit annotations (defaults to image_tag)'
        required: false
        type: string
        default: ''
      canary:
        description: 'Enable canary deployment'
        required: false
        type: boolean
        default: false
      staging_namespace:
        description: 'Kubernetes namespace for staging'
        required: false
        type: string
        default: 'trading-model-staging'
      production_namespace:
        description: 'Kubernetes namespace for production'
        required: false
        type: string
        default: 'trading-model'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Image tag to deploy (e.g. latest, v1.2.3)'
        required: true
        type: string
      version_number:
        description: 'Version number for audit annotations (defaults to image_tag)'
        required: false
        type: string
        default: ''
      canary:
        description: 'Enable canary deployment (K8s canary + smoke test + auto rollback)'
        required: false
        type: boolean
        default: false
      staging_namespace:
        description: 'Kubernetes namespace for staging'
        required: false
        type: string
        default: 'trading-model-staging'
      production_namespace:
        description: 'Kubernetes namespace for production'
        required: false
        type: string
        default: 'trading-model'

permissions:
  contents: read
  # Resolving the release tag to image digests reads the registry.
  packages: read

# First-party images, published by release.yml. The manifests name them
# ghcr.io/trading-model/<image>: the overlay is rewritten to IMAGE_REGISTRY.
# tests/k8s/check-overlays.mjs fails when an overlay uses an image missing here.
env:
  IMAGES: >-
    discovery-server message-manager financial-scraper trader-trainer
    api-gateway audit-logger dlq-service spire-tools backup-tools db-migrate

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      # Manifests, node agents and migrations come from the released tag, not
      # from the branch picked at dispatch: production only deploys a vX.Y.Z
      # release (refused here, before the cluster is reached). A tag older
      # than a script this workflow calls fails the deploy, on purpose.
      - name: Resolve release ref
        id: ref
        shell: bash
        env:
          ENV: ${{ inputs.environment }}
          TAG: ${{ inputs.image_tag }}
        run: |
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ref=refs/tags/v${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "Checking out refs/tags/v${TAG#v}"
            exit 0
          fi
          if [ "$ENV" = "production" ]; then
            echo "::error::production deploys a release only: image_tag must be vX.Y.Z or X.Y.Z, got '$TAG'"
            exit 1
          fi
          echo "::warning::image_tag '$TAG' is not a release: manifests and migrations come from the dispatch ref $GITHUB_REF, not from the image's release"

      # Empty ref (non-release staging deploy): the dispatch ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Show deployed commit
        id: src
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Manifests and migrations from $sha"

      - name: Resolve namespace
        id: ns
        shell: bash
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            NS="${{ inputs.staging_namespace }}"
          else
            NS="${{ inputs.production_namespace }}"
          fi
          echo "namespace=$NS" >> "$GITHUB_OUTPUT"
          echo "Target namespace: $NS"

      # An alert nobody receives is no alert: production needs a real Slack
      # webhook and a dead man's switch before anything is deployed.
      - name: Check alert notification secrets
        shell: bash
        env:
          SLACK: ${{ secrets.ALERTMANAGER_SLACK_WEBHOOK_URL }}
          DEADMAN: ${{ secrets.ALERTMANAGER_DEADMAN_URL }}
          PAGERDUTY: ${{ secrets.ALERTMANAGER_PAGERDUTY_ROUTING_KEY }}
        run: |
          missing=""
          [ -n "$SLACK" ] || missing="$missing ALERTMANAGER_SLACK_WEBHOOK_URL"
          [ -n "$DEADMAN" ] || missing="$missing ALERTMANAGER_DEADMAN_URL"
          [ -n "$PAGERDUTY" ] || echo "::warning::ALERTMANAGER_PAGERDUTY_ROUTING_KEY is not set: critical alerts go to Slack only"
          if [ -n "$missing" ]; then
            if [ "${{ inputs.environment }}" = "production" ]; then
              echo "::error::Missing GitHub environment secrets:${missing}. Alerts would reach nobody (observability/alertmanager.yml)."
              exit 1
            fi
            echo "::warning::Missing GitHub environment secrets:${missing}: alerts of ${{ inputs.environment }} reach nobody"
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: 'stable'

      - name: Configure kubeconfig (staging)
        if: inputs.environment == 'staging'
        shell: bash
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_STAGING }}
        run: |
          if [ -z "$KUBECONFIG_CONTENT" ]; then
            echo "::error::Missing secret KUBECONFIG_STAGING"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_CONTENT" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: Configure kubeconfig (production)
        if: inputs.environment == 'production'
        shell: bash
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_PRODUCTION }}
        run: |
          if [ -z "$KUBECONFIG_CONTENT" ]; then
            echo "::error::Missing secret KUBECONFIG_PRODUCTION"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_CONTENT" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      # release.yml pushes v1.2.3 as :1.2.3; the git tag form is accepted too.
      - name: Resolve image tag
        id: tag
        shell: bash
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          ENV="${{ inputs.environment }}"
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::image_tag is required. Provide a tag (e.g. latest, v1.2.3)."
            exit 1
          fi
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            TAG="${TAG#v}"
          fi
          VERSION="${{ inputs.version_number }}"
          if [ -z "$VERSION" ]; then
            VERSION="$TAG"
          fi
          REGISTRY="${IMAGE_REGISTRY:-ghcr.io/$OWNER}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "registry=${REGISTRY,,}"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $TAG (version: $VERSION) from ${REGISTRY,,} to $ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The overlay is deployed by digest, never by tag: a missing image stops
      # the deploy before anything changes, and `rollout undo` goes back to the
      # previous image even when both deploys were :latest.
      - name: Resolve image digests
        id: digests
        shell: bash
        run: |
          REGISTRY="${{ steps.tag.outputs.registry }}"
          TAG="${{ steps.tag.outputs.tag }}"
          missing=""
          : > "$RUNNER_TEMP/image-digests"
          for img in $IMAGES; do
            if ! digest=$(docker buildx imagetools inspect "$REGISTRY/$img:$TAG" --format '{{.Manifest.Digest}}'); then
              missing="$missing $img"
              continue
            fi
            echo "$img $digest" >> "$RUNNER_TEMP/image-digests"
            echo "$img:$TAG -> $digest"
          done
          if [ -n "$missing" ]; then
            echo "::error::No $REGISTRY image tagged $TAG for:$missing (was the release published?)"
            exit 1
          fi

      # Production reads its secrets from SealedSecrets: without the controller
      # the apply stops half way (unknown kind), and a placeholder never
      # decrypts, so every pod waits on a missing Secret. Checked before
      # anything is applied.
      - name: Check sealed secrets
        shell: bash
        run: |
          ENV="${{ inputs.environment }}"
          rendered=$(kubectl kustomize --load-restrictor LoadRestrictionsNone "deploy/k8s/overlays/$ENV")
          if ! grep -q '^kind: SealedSecret$' <<<"$rendered"; then
            echo "$ENV uses no SealedSecret"
            exit 0
          fi
          if ! kubectl get crd sealedsecrets.bitnami.com >/dev/null 2>&1; then
            echo "::error::The cluster has no SealedSecret CRD: install the Sealed Secrets controller (docs/deployment/sealed-secrets.md)"
            exit 1
          fi
          # ADR-0035: the controller runs in its own namespace, so that the
          # identity of the daily key backup reads its keys only, not every
          # Secret of kube-system.
          if ! kubectl -n sealed-secrets get deployment sealed-secrets-controller >/dev/null 2>&1; then
            echo "::error::No Sealed Secrets controller in the namespace sealed-secrets: install it with bash scripts/install-sealed-secrets.sh, or move it out of kube-system (docs/deployment/sealed-secrets.md, ADR-0035)"
            exit 1
          fi
          if grep -q 'AgCHANGE_ME' <<<"$rendered"; then
            echo "::error::$ENV still has placeholder SealedSecrets: run bash scripts/init-sealed-secrets.sh and commit deploy/k8s/secrets"
            exit 1
          fi

      # The Ingress hosts ship as example.com placeholders (issue #415): in
      # production they would leave the API unreachable from outside while
      # cert-manager keeps failing Let's Encrypt orders (rate limits). Checked
      # before anything is applied; staging only warns.
      - name: Check ingress hosts
        shell: bash
        run: |
          ENV="${{ inputs.environment }}"
          rendered=$(kubectl kustomize --load-restrictor LoadRestrictionsNone "deploy/k8s/overlays/$ENV")
          hosts=$(grep -oE '[A-Za-z0-9.-]*example\.com' <<<"$rendered" | sort -u | tr '\n' ' ' || true)
          if [ -z "$hosts" ]; then
            echo "$ENV Ingress hosts are set"
          elif [ "$ENV" = "production" ]; then
            echo "::error::production Ingress hosts are still placeholders ($hosts): set the real names in deploy/k8s/overlays/production/ingress-hosts.yaml (docs/deployment/KUBERNETES.md, \"Set the Ingress hosts\")"
            exit 1
          else
            echo "::warning::$ENV Ingress hosts are still placeholders ($hosts): set the real names in deploy/k8s/overlays/$ENV/ingress-hosts.yaml"
          fi

      # Anchor store of the audit chain (ADR-0027): an S3 bucket with Object
      # Lock (compliance mode), its own write-only credentials, not the backup
      # ones. Bucket, region and endpoint are variables of the GitHub
      # environment, the credentials secrets. Production refuses to start
      # audit-logger without it (AUDIT_ANCHOR_REQUIRED): checked here, before
      # anything is applied. Unset elsewhere: the chain is verified only.
      - name: Configure audit chain anchor store
        shell: bash
        env:
          AUDIT_ANCHOR_BUCKET: ${{ vars.AUDIT_ANCHOR_BUCKET }}
          AUDIT_ANCHOR_REGION: ${{ vars.AUDIT_ANCHOR_REGION }}
          AUDIT_ANCHOR_ENDPOINT: ${{ vars.AUDIT_ANCHOR_ENDPOINT }}
          AUDIT_ANCHOR_ACCESS_KEY_ID: ${{ secrets.AUDIT_ANCHOR_ACCESS_KEY_ID }}
          AUDIT_ANCHOR_SECRET_ACCESS_KEY: ${{ secrets.AUDIT_ANCHOR_SECRET_ACCESS_KEY }}
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          if [ -z "$AUDIT_ANCHOR_BUCKET" ]; then
            if kubectl -n "$NS" get secret audit-anchor-s3 >/dev/null 2>&1; then
              exit 0
            fi
            if [ "${{ inputs.environment }}" = "production" ]; then
              echo "::error::AUDIT_ANCHOR_BUCKET is not set for production: audit-logger refuses to start without an anchor store (ADR-0027)"
              exit 1
            fi
            echo "::warning::AUDIT_ANCHOR_BUCKET is not set for ${{ inputs.environment }}: the audit chain is verified but not anchored"
            exit 0
          fi
          if [ -z "$AUDIT_ANCHOR_ACCESS_KEY_ID" ] || [ -z "$AUDIT_ANCHOR_SECRET_ACCESS_KEY" ]; then
            echo "::error::AUDIT_ANCHOR_BUCKET is set but AUDIT_ANCHOR_ACCESS_KEY_ID / AUDIT_ANCHOR_SECRET_ACCESS_KEY are not"
            exit 1
          fi
          kubectl get namespace "$NS" >/dev/null 2>&1 || kubectl create namespace "$NS"
          # An empty endpoint would override the SDK default (AWS): left out.
          endpoint=()
          [ -z "$AUDIT_ANCHOR_ENDPOINT" ] || endpoint=(--from-literal=AUDIT_ANCHOR_ENDPOINT="$AUDIT_ANCHOR_ENDPOINT")
          kubectl -n "$NS" create secret generic audit-anchor-s3             --from-literal=AUDIT_ANCHOR_BUCKET="$AUDIT_ANCHOR_BUCKET"             --from-literal=AUDIT_ANCHOR_REGION="${AUDIT_ANCHOR_REGION:-us-east-1}"             --from-literal=AWS_ACCESS_KEY_ID="$AUDIT_ANCHOR_ACCESS_KEY_ID"             --from-literal=AWS_SECRET_ACCESS_KEY="$AUDIT_ANCHOR_SECRET_ACCESS_KEY"             "${endpoint[@]}"             --dry-run=client -o yaml | kubectl apply -f -

      # The off-site backup copy must survive a compromised cluster, which holds
      # the bucket's credentials: Object Lock in compliance mode, default
      # retention from RETENTION_DAYS of the db-backup CronJob to the 31 days
      # of the daily/ lifecycle rule (ADR-0033). Checked before anything is
      # applied, with the credentials the job will use: the GitHub environment
      # (BACKUP_S3_*), or else the trading-model-backup-s3 Secret already in
      # the namespace (e.g. a SealedSecret). Production fails, other
      # environments warn; BACKUP_S3_IMMUTABILITY_CHECK=warn downgrades
      # production while the bucket is set up (docs/deployment/BACKUP_DR.md).
      - name: Check off-site backup bucket immutability
        shell: bash
        env:
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_IMMUTABILITY_CHECK: ${{ vars.BACKUP_S3_IMMUTABILITY_CHECK }}
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          bucket="$BACKUP_S3_BUCKET" endpoint="$BACKUP_S3_ENDPOINT" region="$BACKUP_S3_REGION"
          key_id="$BACKUP_S3_ACCESS_KEY_ID" secret="$BACKUP_S3_SECRET_ACCESS_KEY"
          if [ -z "$bucket" ] && kubectl -n "$NS" get secret trading-model-backup-s3 >/dev/null 2>&1; then
            echo "BACKUP_S3_BUCKET is not set: checking the bucket of the existing trading-model-backup-s3 Secret"
            secret_key() {
              kubectl -n "$NS" get secret trading-model-backup-s3 -o "jsonpath={.data.$1}" | base64 -d
            }
            bucket="$(secret_key BACKUP_S3_BUCKET)"
            endpoint="$(secret_key S3_ENDPOINT)"
            region="$(secret_key AWS_REGION)"
            key_id="$(secret_key AWS_ACCESS_KEY_ID)"
            secret="$(secret_key AWS_SECRET_ACCESS_KEY)"
            [ -z "$key_id" ] || echo "::add-mask::$key_id"
            [ -z "$secret" ] || echo "::add-mask::$secret"
          fi
          if [ -n "$bucket" ] && { [ -z "$key_id" ] || [ -z "$secret" ]; }; then
            echo "::error::Off-site backup bucket $bucket has no credentials: set BACKUP_S3_ACCESS_KEY_ID / BACKUP_S3_SECRET_ACCESS_KEY"
            exit 1
          fi
          # Minimum lock: what the CronJob keeps on the volume (RETENTION_DAYS).
          retention=$(awk '/name: RETENTION_DAYS/ { getline; gsub(/[^0-9]/, ""); print; exit }' deploy/k8s/jobs/backup-cronjob.yaml)
          if [ -z "$retention" ]; then
            echo "::error::RETENTION_DAYS not found in deploy/k8s/jobs/backup-cronjob.yaml"
            exit 1
          fi
          AWS_ACCESS_KEY_ID="$key_id" AWS_SECRET_ACCESS_KEY="$secret" AWS_REGION="${region:-us-east-1}" \
            bash scripts/backup-bucket-check.sh --environment "${{ inputs.environment }}" \
              --bucket "$bucket" --endpoint "$endpoint" --min-days "$retention"

      # At least two distinct age recipients in production (operator key +
      # escrow key, issue #327): with one, losing its private key makes every
      # backup unreadable. Minimum = BACKUP_MIN_RECIPIENTS of the overlay's
      # backup CronJobs, never below 2 in production. Checked before any
      # change; unset variable: the existing backup-encryption ConfigMap is
      # checked instead (it is left as it is by "Configure backup encryption").
      - name: Check backup encryption recipients
        shell: bash
        env:
          BACKUP_AGE_RECIPIENTS: ${{ vars.BACKUP_AGE_RECIPIENTS }}
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          ENV="${{ inputs.environment }}"
          if [ -z "$BACKUP_AGE_RECIPIENTS" ] && kubectl -n "$NS" get configmap backup-encryption >/dev/null 2>&1; then
            echo "BACKUP_AGE_RECIPIENTS is not set: checking the existing backup-encryption ConfigMap"
            BACKUP_AGE_RECIPIENTS="$(kubectl -n "$NS" get configmap backup-encryption -o 'jsonpath={.data.BACKUP_AGE_RECIPIENTS}')"
            export BACKUP_AGE_RECIPIENTS
          fi
          min=$(kubectl kustomize --load-restrictor LoadRestrictionsNone "deploy/k8s/overlays/$ENV" |
            awk '/name: BACKUP_MIN_RECIPIENTS/ { getline; gsub(/[^0-9]/, ""); if ($0 + 0 > max + 0) max = $0 + 0 } END { print max + 0 }')
          [ "$min" -ge 1 ] || min=1
          bash scripts/backup-recipients-check.sh --environment "$ENV" --min "$min"

      # Production refuses to deploy without a backup encryption key and an
      # off-site copy (issue #331): each comes from the GitHub environment or
      # from the resource already in the namespace (ConfigMap
      # backup-encryption, Secret trading-model-backup-s3, e.g. a
      # SealedSecret). Other environments warn. Checked before any change.
      - name: Check backup configuration is present
        shell: bash
        env:
          BACKUP_AGE_RECIPIENTS: ${{ vars.BACKUP_AGE_RECIPIENTS }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
        run: |
          bash scripts/backup-config-check.sh --environment "${{ inputs.environment }}"             --namespace "${{ steps.ns.outputs.namespace }}"

      # Notification credentials, mounted as files by Alertmanager and read at
      # send time (no restart needed). Keys left unset are left out.
      - name: Configure alert notifications
        shell: bash
        env:
          SLACK: ${{ secrets.ALERTMANAGER_SLACK_WEBHOOK_URL }}
          DEADMAN: ${{ secrets.ALERTMANAGER_DEADMAN_URL }}
          PAGERDUTY: ${{ secrets.ALERTMANAGER_PAGERDUTY_ROUTING_KEY }}
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          keys=()
          [ -z "$SLACK" ] || keys+=(--from-literal=SLACK_WEBHOOK_URL="$SLACK")
          [ -z "$DEADMAN" ] || keys+=(--from-literal=DEADMAN_URL="$DEADMAN")
          [ -z "$PAGERDUTY" ] || keys+=(--from-literal=PAGERDUTY_ROUTING_KEY="$PAGERDUTY")
          if [ "${#keys[@]}" -eq 0 ]; then
            echo "::warning::No alert notification secret set: alertmanager-credentials left as it is"
            exit 0
          fi
          # Before the overlay: an Alertmanager started without them counts
          # failed notifications, and AlertmanagerNotificationsFailing fires.
          kubectl get namespace "$NS" >/dev/null 2>&1 || kubectl create namespace "$NS"
          kubectl -n "$NS" create secret generic alertmanager-credentials "${keys[@]}"             --dry-run=client -o yaml | kubectl apply -f -

      # Contact e-mail sent in the User-Agent of the signal sources (ADR-0036;
      # SEC EDGAR answers 403 without one). A secret of the GitHub environment:
      # the repository and its run logs are public. Before the overlay, so the
      # collector starts with it. Unset: the ConfigMap is left as it is.
      - name: Configure signal sources contact
        shell: bash
        env:
          SIGNAL_CONTACT_EMAIL: ${{ secrets.SIGNAL_CONTACT_EMAIL }}
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          if [ -z "$SIGNAL_CONTACT_EMAIL" ]; then
            echo "::warning::SIGNAL_CONTACT_EMAIL is not set for ${{ inputs.environment }}: SEC EDGAR refuses the signal collector"
            exit 0
          fi
          kubectl get namespace "$NS" >/dev/null 2>&1 || kubectl create namespace "$NS"
          kubectl -n "$NS" create configmap signal-contact \
            --from-literal=SIGNAL_CONTACT_EMAIL="$SIGNAL_CONTACT_EMAIL" \
            --dry-run=client -o yaml | kubectl apply -f -

      # CRDs of non-native kinds (VPA, SealedSecret...), StorageClasses,
      # IngressClasses and the cert-manager ClusterIssuer come from the render
      # itself. Missing ones stop the deploy here, not half way through the
      # apply (issue #419).
      - name: Check cluster prerequisites
        shell: bash
        run: |
          ENV="${{ inputs.environment }}"
          {
            kubectl kustomize --load-restrictor LoadRestrictionsNone "deploy/k8s/overlays/$ENV"
            echo ---
            kubectl kustomize "deploy/k8s/overlays/$ENV/node-agents"
          } | bash deploy/k8s/scripts/check-prereqs.sh

      # SPIRE agent + SPIFFE CSI driver, in the privileged trading-model-node
      # namespace: the application namespace (restricted) cannot host them.
      - name: Apply SPIFFE node components
        shell: bash
        run: |
          kubectl kustomize "deploy/k8s/overlays/${{ inputs.environment }}/node-agents" | kubectl apply -f -

      # Migrations must run before the new image rolls out. On a first deploy
      # MySQL does not exist yet: they run right after the overlay instead.
      - name: Run database migrations
        id: migrate
        shell: bash
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          if ! kubectl get statefulset mysql -n "$NS" >/dev/null 2>&1; then
            echo "First deploy: MySQL not there yet, migrations run after the overlay"
            echo "deferred=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The migrations job runs the released db-migrate image, by digest.
          digest=$(awk '$1 == "db-migrate" { print $2 }' "$RUNNER_TEMP/image-digests")
          # Staging seeds MYSQL_MIGRATE_PASSWORD when missing (its Secret generator
          # is applied after this step); production needs it in the SealedSecret.
          if [ "${{ inputs.environment }}" = staging ]; then export SEED_MIGRATE_PASSWORD=true
          else export SEALED_SECRETS_FILE=deploy/k8s/secrets/trading-model-sealed-secrets.yaml; fi
\
          MIGRATE_IMAGE="${{ steps.tag.outputs.registry }}/db-migrate@$digest" \
            bash deploy/k8s/scripts/run-migrations.sh "$NS"

      # Canary gate: test the new image on a share of live traffic BEFORE full rollout.
      # If the canary fails, the overlay is never applied and the primary stays on the old image.
      # Gate tuning per environment through GitHub variables; seeing too little
      # traffic fails the gate (no signal is not a pass).
      - name: Canary deployments (if enabled)
        if: ${{ inputs.canary }}
        shell: bash
        env:
          CANARY_GATE_SECONDS: ${{ vars.CANARY_GATE_SECONDS || '120' }}
          CANARY_MIN_REQUESTS: ${{ vars.CANARY_MIN_REQUESTS || '20' }}
          CANARY_ERROR_THRESHOLD_PCT: ${{ vars.CANARY_ERROR_THRESHOLD_PCT || '5' }}
          # Services whose gate is readiness only (no steady traffic): dlq-service
          # only gets requests on a dead letter or an admin call.
          CANARY_READINESS_ONLY: ${{ vars.CANARY_READINESS_ONLY || 'dlq-service' }}
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          export K8S_NAMESPACE="$NS"
          export CANARY_IMAGE_REPO="${{ steps.tag.outputs.registry }}"
          chmod +x deploy/k8s/scripts/deploy-k8s.sh
          TAG="${{ steps.tag.outputs.tag }}"
          # Created in parallel, observed over one CANARY_GATE_SECONDS window.
          ./deploy/k8s/scripts/deploy-k8s.sh canary-all "$TAG" 10 \
            discovery-server message-manager financial-scraper trader-trainer \
            api-gateway audit-logger dlq-service

      # Revision each Deployment runs before the overlay: the rollback returns to
      # exactly it (image and hashed ConfigMap), not to "the one before the
      # current", which is older than N for a Deployment the overlay left as is.
      - name: Record current revisions
        shell: bash
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          for dep in discovery-server message-manager financial-scraper financial-scraper-collector trader-trainer \
                     api-gateway audit-logger dlq-service edge-proxy; do
            rev=$(kubectl get deployment "$dep" -n "$NS" --ignore-not-found \
              -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')
            echo "$dep ${rev:-none}"
          done | tee "$RUNNER_TEMP/deploy-revisions"

      # Deployments driven by an HPA carry no spec.replicas in the overlay. A
      # client-side apply of a manifest that drops a field it applied before
      # resets it to the default (1), so the field leaves
      # last-applied-configuration first (Kubernetes docs, "Migrating
      # Deployments and StatefulSets to horizontal autoscaling"). No-op once done
      # and on a first deploy (no HPA yet).
      - name: Release replicas of autoscaled Deployments
        shell: bash
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          ANN='kubectl.kubernetes.io/last-applied-configuration'
          for dep in $(kubectl get hpa -n "$NS" \
              -o jsonpath='{range .items[?(@.spec.scaleTargetRef.kind=="Deployment")]}{.spec.scaleTargetRef.name}{"\n"}{end}'); do
            last=$(kubectl get deployment "$dep" -n "$NS" -o json | jq -r --arg a "$ANN" '.metadata.annotations[$a] // empty')
            [ -n "$last" ] || continue
            echo "$last" | jq -e '.spec | has("replicas")' > /dev/null || continue
            kubectl annotate deployment "$dep" -n "$NS" --overwrite "$ANN=$(echo "$last" | jq -c 'del(.spec.replicas)')"
            echo "$dep: spec.replicas removed from last-applied-configuration"
          done

      - name: Apply overlay
        id: apply
        shell: bash
        run: |
          ENV="${{ inputs.environment }}"
          REGISTRY="${{ steps.tag.outputs.registry }}"
          WRAPPER="deploy/k8s/overlays/.deploy-$ENV"
          mkdir -p "$WRAPPER"
          {
            echo "apiVersion: kustomize.config.k8s.io/v1beta1"
            echo "kind: Kustomization"
            echo "resources:"
            echo "  - ../$ENV"
            echo "images:"
            while read -r img digest; do
              echo "  - name: ghcr.io/trading-model/$img"
              echo "    newName: $REGISTRY/$img"
              echo "    digest: $digest"
            done < "$RUNNER_TEMP/image-digests"
          } > "$WRAPPER/kustomization.yaml"
          # jobs/ packages scripts/backup-k8s.sh from outside its directory: the default
          # load restrictor rejects it and kubectl apply -k cannot relax it.
          kubectl kustomize --load-restrictor LoadRestrictionsNone "$WRAPPER" | kubectl apply -f -

      # Public age key(s) the db-backup CronJob encrypts every dump for (the
      # private keys never enter the cluster). Environment variable of the
      # GitHub environment; without it the backup job refuses to run (production
      # refuses to deploy: "Check backup configuration is present"). Its
      # recipients were checked before the overlay ("Check backup encryption
      # recipients": at least 2 distinct keys in production).
      - name: Configure backup encryption
        shell: bash
        env:
          BACKUP_AGE_RECIPIENTS: ${{ vars.BACKUP_AGE_RECIPIENTS }}
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          if [ -z "$BACKUP_AGE_RECIPIENTS" ]; then
            echo "::warning::BACKUP_AGE_RECIPIENTS is not set for ${{ inputs.environment }}: backups are disabled until it is"
            exit 0
          fi
          kubectl -n "$NS" create configmap backup-encryption \
            --from-literal=BACKUP_AGE_RECIPIENTS="$BACKUP_AGE_RECIPIENTS" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Off-site copy of the encrypted dumps (any S3-compatible store): the
      # db-backup job fails without it (BACKUP_REQUIRE_OFFSITE). Bucket,
      # region, endpoint and provider are variables of the GitHub environment,
      # the credentials are secrets. Unset: an existing trading-model-backup-s3
      # Secret (e.g. a SealedSecret) is left as it is. Its Object Lock was
      # checked before the overlay ("Check off-site backup bucket immutability").
      - name: Configure off-site backup copy
        shell: bash
        env:
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_PROVIDER: ${{ vars.BACKUP_S3_PROVIDER }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          if [ -z "$BACKUP_S3_BUCKET" ]; then
            if ! kubectl -n "$NS" get secret trading-model-backup-s3 >/dev/null 2>&1; then
              echo "::warning::BACKUP_S3_BUCKET is not set for ${{ inputs.environment }}: the backup job fails until an off-site copy is configured"
            fi
            exit 0
          fi
          # An empty endpoint would override rclone's default (AWS): left out.
          endpoint=()
          [ -z "$BACKUP_S3_ENDPOINT" ] || endpoint=(--from-literal=S3_ENDPOINT="$BACKUP_S3_ENDPOINT")
          kubectl -n "$NS" create secret generic trading-model-backup-s3 \
            --from-literal=BACKUP_S3_BUCKET="$BACKUP_S3_BUCKET" \
            --from-literal=AWS_REGION="${BACKUP_S3_REGION:-us-east-1}" \
            --from-literal=S3_PROVIDER="${BACKUP_S3_PROVIDER:-AWS}" \
            --from-literal=AWS_ACCESS_KEY_ID="$BACKUP_S3_ACCESS_KEY_ID" \
            --from-literal=AWS_SECRET_ACCESS_KEY="$BACKUP_S3_SECRET_ACCESS_KEY" \
            "${endpoint[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run first-deploy database migrations
        if: ${{ steps.migrate.outputs.deferred == 'true' }}
        shell: bash
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          kubectl rollout status statefulset/mysql -n "$NS" --timeout=300s
          # The migrations job runs the released db-migrate image, by digest.
          digest=$(awk '$1 == "db-migrate" { print $2 }' "$RUNNER_TEMP/image-digests")
          MIGRATE_IMAGE="${{ steps.tag.outputs.registry }}/db-migrate@$digest" \
            bash deploy/k8s/scripts/run-migrations.sh "$NS"

      - name: Wait for rollout
        shell: bash
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          for dep in discovery-server message-manager financial-scraper financial-scraper-collector trader-trainer \
                     api-gateway audit-logger dlq-service edge-proxy; do
            echo "Waiting for rollout of $dep..."
            if ! kubectl rollout status "deployment/$dep" -n "$NS" --timeout=180s; then
              echo "::error::Rollout of $dep failed or timed out"
              exit 1
            fi
          done

      # Runs on the new version, after the rollout; a failure triggers the rollback below.
      - name: Smoke test
        shell: bash
        run: |
          export K8S_NAMESPACE="${{ steps.ns.outputs.namespace }}"
          bash deploy/k8s/scripts/deploy-k8s.sh smoke-test

      - name: Annotate deployments with release metadata
        shell: bash
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          VERSION="${{ steps.tag.outputs.version }}"
          for dep in discovery-server message-manager financial-scraper financial-scraper-collector trader-trainer \
                     api-gateway audit-logger dlq-service edge-proxy; do
            kubectl annotate deployment "$dep" -n "$NS" --overwrite \
              trading-model.dev/git-sha="${{ steps.src.outputs.sha }}" \
              trading-model.dev/release-version="$VERSION"
          done

      # always() ensures orphans are cleaned up even when canary or rollout fails.
      - name: Clean up canary deployments (if enabled)
        if: ${{ always() && inputs.canary }}
        shell: bash
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          export K8S_NAMESPACE="$NS"
          for dep in discovery-server message-manager financial-scraper trader-trainer \
                     api-gateway audit-logger dlq-service; do
            ./deploy/k8s/scripts/deploy-k8s.sh canary-cleanup "$dep"
          done

      # Only once the overlay was (even partially) applied: after a failed canary or
      # migration the primaries still run the current release, and undo would
      # roll them back to the one before it.
      - name: Rollback on failure
        if: ${{ failure() && steps.apply.outcome != 'skipped' }}
        shell: bash
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          # Back to the revision recorded before the overlay: its pod template
          # names the image digest and the hashed ConfigMaps of release N, which
          # are still in the namespace (never pruned), so configuration comes
          # back with the image (issue #410). Only Deployments are rolled back:
          # docs/deployment/DEPLOY.md lists what is not.
          # Every deployment is tried: one without a previous revision (first
          # deploy) must not leave the others on the failed release.
          failed=0
          while read -r dep rev; do
            if [ "$rev" = none ]; then
              echo "::error::Could not roll back $dep: it did not exist before this deploy"
              failed=1
            elif ! kubectl rollout undo "deployment/$dep" -n "$NS" --to-revision="$rev"; then
              echo "::error::Could not roll back $dep to revision $rev"
              failed=1
            fi
          done < "$RUNNER_TEMP/deploy-revisions"
          exit "$failed"
