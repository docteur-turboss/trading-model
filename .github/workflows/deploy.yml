name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string
      image_tag:
        description: 'Image tag to deploy (e.g. latest, v1.2.3)'
        required: true
        type: string
      version_number:
        description: 'Version number for audit annotations (defaults to image_tag)'
        required: false
        type: string
        default: ''
      canary:
        description: 'Enable canary deployment'
        required: false
        type: boolean
        default: false
      staging_namespace:
        description: 'Kubernetes namespace for staging'
        required: false
        type: string
        default: 'trading-model-staging'
      production_namespace:
        description: 'Kubernetes namespace for production'
        required: false
        type: string
        default: 'trading-model'
    secrets: inherit
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Image tag to deploy (e.g. latest, v1.2.3)'
        required: true
        type: string
      version_number:
        description: 'Version number for audit annotations (defaults to image_tag)'
        required: false
        type: string
        default: ''
      canary:
        description: 'Enable canary deployment (K8s canary + smoke test + auto rollback)'
        required: false
        type: boolean
        default: false
      staging_namespace:
        description: 'Kubernetes namespace for staging'
        required: false
        type: string
        default: 'trading-model-staging'
      production_namespace:
        description: 'Kubernetes namespace for production'
        required: false
        type: string
        default: 'trading-model'

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve namespace
        id: ns
        shell: bash
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            NS="${{ inputs.staging_namespace }}"
          else
            NS="${{ inputs.production_namespace }}"
          fi
          echo "namespace=$NS" >> "$GITHUB_OUTPUT"
          echo "Target namespace: $NS"

      - name: Set up kubectl
        uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with:
          version: 'stable'

      - name: Configure kubeconfig
        shell: bash
        run: |
          KUBECONFIG_CONTENT="${{ secrets[format('KUBECONFIG_{0}', inputs.environment)] }}"
          if [ -z "$KUBECONFIG_CONTENT" ]; then
            echo "::error::Missing secret KUBECONFIG_$(echo ${{ inputs.environment }} | tr '[:lower:]' '[:upper:]')"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_CONTENT" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: Resolve image tag
        id: tag
        shell: bash
        run: |
          ENV="${{ inputs.environment }}"
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::image_tag is required. Provide a tag (e.g. latest, v1.2.3)."
            exit 1
          fi
          VERSION="${{ inputs.version_number }}"
          if [ -z "$VERSION" ]; then
            VERSION="$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $TAG (version: $VERSION) to $ENV"

      # Migrations must run before the new image rolls out.
      - name: Run database migrations
        shell: bash
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          kubectl create configmap migration-files -n "$NS" \
            --from-file=migrate.mjs=scripts/migrate.mjs \
            --from-file=scripts/migrations \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n "$NS" -f deploy/k8s/jobs/migration-job.yaml
          if ! kubectl wait --for=condition=complete job/db-migrate -n "$NS" --timeout=180s; then
            echo "::error::Database migration job failed or timed out"
            kubectl logs -n "$NS" job/db-migrate --tail=50
            exit 1
          fi

      # Canary gate: test the new image on a small % of traffic BEFORE full rollout.
      # If the canary fails, the overlay is never applied and the primary stays on the old image.
      - name: Canary deployments + smoke test (if enabled)
        if: ${{ inputs.canary == 'true' }}
        shell: bash
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          export K8S_NAMESPACE="$NS"
          chmod +x deploy/k8s/scripts/deploy-k8s.sh
          TAG="${{ steps.tag.outputs.tag }}"
          for dep in discovery-server message-manager financial-scraper trader-trainer \
                     api-gateway audit-logger dlq-service admin-interface; do
            ./deploy/k8s/scripts/deploy-k8s.sh canary "$dep" "$TAG" 10
          done
          ./deploy/k8s/scripts/deploy-k8s.sh smoke-test

      - name: Apply overlay
        id: apply
        shell: bash
        run: |
          ENV="${{ inputs.environment }}"
          NS="${{ steps.ns.outputs.namespace }}"
          TAG="${{ steps.tag.outputs.tag }}"
          WRAPPER="deploy/k8s/overlays/.deploy-$ENV"
          mkdir -p "$WRAPPER"
          cat > "$WRAPPER/kustomization.yaml" <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../$ENV
          images:
            - name: ghcr.io/trading-model/discovery-server
              newTag: "$TAG"
            - name: ghcr.io/trading-model/message-manager
              newTag: "$TAG"
            - name: ghcr.io/trading-model/financial-scraper
              newTag: "$TAG"
            - name: ghcr.io/trading-model/trader-trainer
              newTag: "$TAG"
            - name: ghcr.io/trading-model/api-gateway
              newTag: "$TAG"
            - name: ghcr.io/trading-model/audit-logger
              newTag: "$TAG"
            - name: ghcr.io/trading-model/dlq-service
              newTag: "$TAG"
            - name: ghcr.io/trading-model/admin-interface
              newTag: "$TAG"
          EOF
          kubectl apply -k "$WRAPPER"

      - name: Wait for rollout
        shell: bash
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          for dep in discovery-server message-manager financial-scraper trader-trainer \
                     api-gateway audit-logger dlq-service admin-interface; do
            echo "Waiting for rollout of $dep..."
            if ! kubectl rollout status "deployment/$dep" -n "$NS" --timeout=180s; then
              echo "::error::Rollout of $dep failed or timed out"
              exit 1
            fi
          done

      - name: Annotate deployments with release metadata
        shell: bash
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          VERSION="${{ steps.tag.outputs.version }}"
          for dep in discovery-server message-manager financial-scraper trader-trainer \
                     api-gateway audit-logger dlq-service admin-interface; do
            kubectl annotate deployment "$dep" -n "$NS" --overwrite \
              trading-model.dev/git-sha="$GITHUB_SHA" \
              trading-model.dev/release-version="$VERSION"
          done

      # always() ensures orphans are cleaned up even when canary or rollout fails.
      - name: Clean up canary deployments (if enabled)
        if: ${{ always() && inputs.canary == 'true' }}
        shell: bash
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          export K8S_NAMESPACE="$NS"
          for dep in discovery-server message-manager financial-scraper trader-trainer \
                     api-gateway audit-logger dlq-service admin-interface; do
            ./deploy/k8s/scripts/deploy-k8s.sh canary-cleanup "$dep"
          done

      - name: Rollback on failure
        if: failure()
        shell: bash
        run: |
          NS="${{ steps.ns.outputs.namespace }}"
          for dep in discovery-server message-manager financial-scraper trader-trainer \
                     api-gateway audit-logger dlq-service admin-interface; do
            kubectl rollout undo "deployment/$dep" -n "$NS"
          done