# =============================================================================
#  release-candidate.yml — Build and scan the release images before the tag
#  Runs on a pull request release/* -> main opened from this repository (never
#  from a fork), or by hand. Each image is built once, with no GHA cache, pushed
#  as <registry>/<image>:candidate-<short head sha> and scanned by Trivy by
#  digest (ADR-0038). Nothing is signed here: release.yml finds the green run
#  whose commit has the same tree as the tag, then promotes and signs those digests.
# =============================================================================

name: Release candidate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    if: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.list.outputs.sha }}
      tag: ${{ steps.list.outputs.tag }}
      version: ${{ steps.list.outputs.version }}
      registry: ${{ steps.list.outputs.registry }}
      services: ${{ steps.list.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The head, not the pull request merge commit: release.yml matches the tree of this commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: List the release images
        id: list
        shell: bash
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          registry="${IMAGE_REGISTRY:-ghcr.io/$OWNER}"
          # Single source of the image list: deploy.yml IMAGES. Services have a services/<name> directory; tools do not.
          list=$(yq '.env.IMAGES' .github/workflows/deploy.yml)
          services=$(for i in $list; do if [ -d "services/$i" ]; then echo "$i"; fi; done | jq -R . | jq -sc .)
          {
            echo "sha=$SHA"
            echo "tag=candidate-${SHA::7}"
            echo "version=$(jq -r .version package.json)"
            echo "registry=${registry,,}"
            echo "services=$services"
          } >> "$GITHUB_OUTPUT"

  scan-services:
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.images.outputs.services) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.images.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.images.outputs.registry }}/${{ matrix.service }}
          tags: type=raw,value=${{ needs.images.outputs.tag }}

      - name: Build and push under the candidate tag
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            BUILD_VERSION=${{ needs.images.outputs.version }}
            GIT_SHA=${{ needs.images.outputs.sha }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No GHA cache: a push to main could have planted layers in its scope (ADR-0038).

      # A fixable CRITICAL or HIGH vulnerability fails the pull request. Exceptions: .trivyignore.yaml (ADR-0038).
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ needs.images.outputs.registry }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          # Unfixed CVEs cannot be remedied by a rebuild: block only on those with a fix.
          ignore-unfixed: true
          exit-code: "1"

  # Tooling images:
  # spire-tools (deploy/spire): spire-server binary + registration scripts (the
  # official SPIRE images have no shell), used by the spire-entries sidecar.
  # backup-tools (deploy/backup): kubectl + age + rclone + mysqlbinlog for the db-backup
  # and db-backup-incremental CronJobs and restore-k8s.sh.
  # db-migrate (deploy/migrate): migrate.mjs + migrations + locked mysql2 for the db-migrate Jobs.
  scan-tools:
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: spire-tools
            context: deploy/spire
            target: bootstrap
          - image: backup-tools
            context: deploy/backup
            target: ""
          - image: db-migrate
            context: .
            file: deploy/migrate/Dockerfile
            target: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.images.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.images.outputs.registry }}/${{ matrix.image }}
          tags: type=raw,value=${{ needs.images.outputs.tag }}

      - name: Build and push under the candidate tag
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No GHA cache: a cached `microdnf upgrade` layer would hide distro fixes published since.

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ needs.images.outputs.registry }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # The check the orchestrator waits for before merging the release pull request.
  release-candidate:
    needs: [images, scan-services, scan-tools]
    if: ${{ always() && needs.images.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - env:
          RESULTS: ${{ needs.images.result }} ${{ needs.scan-services.result }} ${{ needs.scan-tools.result }}
        run: |
          echo "images scan-services scan-tools: $RESULTS"
          [ "$RESULTS" = "success success success" ]
