name: Release

# Single release pipeline. Triggered manually (Actions → Release → Run workflow).
# `scripts/release.mjs` is used as the versioning engine (bump + CHANGELOG) but is
# driven from CI: no local release command is needed anymore.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (auto = derived from commits since the last tag)'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── Quality gate ───────────────────────────────────────────────────────────
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Build packages (dependency order)
        run: bun run build
      - name: Type-check services
        run: |
          bun run --filter message-manager build
          bun run --filter discovery-server build
          bun run --filter financial-scraper build
          bun run --filter trader-service build
          bun run --filter api-gateway build
          bun run --filter admin-interface build
          bun run --filter audit-logger build
          bun run --filter dlq-service build
      - run: bun run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # ── Version bump + CHANGELOG (release.mjs engine, run in CI) ──────────────
  version:
    needs: [quality]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.status.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute version and CHANGELOG
        run: |
          BUMP="${{ github.event.inputs.bump_type }}"
          if [ "$BUMP" = "auto" ]; then
            bun scripts/release.mjs
          else
            bun scripts/release.mjs --bump "$BUMP"
          fi

      - name: Read new version
        id: version
        run: echo "version=$(bun -e "console.log(require('./package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Check whether files changed
        id: status
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new commits since the last tag - nothing to release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit version bump and CHANGELOG
        if: steps.status.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git add -A
          git commit -m ":rocket:(release): v${VERSION}"

      - name: Tag and push
        if: steps.status.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag -a "v${VERSION}" -m ":rocket:(release): v${VERSION}"
          git push origin main
          git push origin "v${VERSION}"

  # ── Docker images ─────────────────────────────────────────────────────────
  docker:
    needs: [version]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: discovery-server
            context: .
            dockerfile: services/discovery-server/Dockerfile
          - name: message-manager
            context: .
            dockerfile: services/message-manager/Dockerfile
          - name: financial-scraper
            context: .
            dockerfile: services/financial-scraper/Dockerfile
          - name: trader-trainer
            context: .
            dockerfile: services/trader-trainer/Dockerfile
          - name: api-gateway
            context: .
            dockerfile: services/api-gateway/Dockerfile
          - name: audit-logger
            context: .
            dockerfile: services/audit-logger/Dockerfile
          - name: admin-interface
            context: .
            dockerfile: services/admin-interface/Dockerfile
          - name: dlq-service
            context: .
            dockerfile: services/dlq-service/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.version.outputs.version }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── GitHub Release ────────────────────────────────────────────────────────
  release:
    needs: [version, docker]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Generate release notes
        id: notes
        run: |
          {
            echo 'notes<<EOF'
            echo "## Docker Images"
            echo ""
            echo "| Service | Pull command |"
            echo "|---------|--------------|"
            echo "| Discovery Server | \`docker pull ghcr.io/${{ github.repository }}/discovery-server:${{ needs.version.outputs.version }}\` |"
            echo "| Message Manager | \`docker pull ghcr.io/${{ github.repository }}/message-manager:${{ needs.version.outputs.version }}\` |"
            echo "| Financial Scraper | \`docker pull ghcr.io/${{ github.repository }}/financial-scraper:${{ needs.version.outputs.version }}\` |"
            echo "| Trader Trainer | \`docker pull ghcr.io/${{ github.repository }}/trader-trainer:${{ needs.version.outputs.version }}\` |"
            echo "| API Gateway | \`docker pull ghcr.io/${{ github.repository }}/api-gateway:${{ needs.version.outputs.version }}\` |"
            echo "| Audit Logger | \`docker pull ghcr.io/${{ github.repository }}/audit-logger:${{ needs.version.outputs.version }}\` |"
            echo "| Admin Interface | \`docker pull ghcr.io/${{ github.repository }}/admin-interface:${{ needs.version.outputs.version }}\` |"
            echo "| DLQ Service | \`docker pull ghcr.io/${{ github.repository }}/dlq-service:${{ needs.version.outputs.version }}\` |"
            echo ""
            echo "## Quick Start"
            echo ""
            echo '```bash'
            echo "git clone https://github.com/${{ github.repository }}.git"
            echo "cd trading-model"
            echo "cp .env.example .env"
            echo "# edit .env, then:"
            echo "docker compose up -d"
            echo '```'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Release ${{ needs.version.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: true

  # ── Documentation (GitHub Pages) ──────────────────────────────────────────
  docs:
    needs: [version]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run docs:generate

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/architecture/code

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
