# =============================================================================
#  release.yml — Promote and sign the release images on version tag
#  Triggers on push of tags vX.Y.Z (e.g. v2.0.3, or v2.1.0-rc.1).
#  Builds nothing: the images were built and scanned by release-candidate.yml
#  on the release pull request. `candidate` finds the newest run of that
#  workflow whose commit has the same tree as the tag; it must be green, else
#  nothing is published. After approval, `sign` promotes each candidate digest
#  to :X.Y.Z (no leading v) and signs it (ADR-0038).
#  :latest moves to the release only when it is the highest stable version:
#  a backport patch (v1.4.2 after v2.0.0) or a prerelease never takes it.
#  Registry: repository variable IMAGE_REGISTRY, default ghcr.io/<owner> (the
#  only GHCR namespace GITHUB_TOKEN can push to). Manifests keep the logical
#  name ghcr.io/trading-model/*: deploy.yml rewrites it to the registry.
#  verify-images then resolves every deploy.yml IMAGES entry at :X.Y.Z and
#  fails the run if one is missing (the release would not be deployable).
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      latest: ${{ steps.version.outputs.latest }}
      registry: ${{ steps.version.outputs.registry }}
      images: ${{ steps.version.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version and latest
        id: version
        shell: bash
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          semver='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$GITHUB_REF_NAME" =~ $semver ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z[-prerelease]"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          latest=false
          if [[ "$version" != *-* ]]; then
            highest=$(git ls-remote --tags --refs origin 'v*' \
              | sed 's#.*refs/tags/v##' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n 1)
            [ "$version" = "$highest" ] && latest=true
          fi
          registry="${IMAGE_REGISTRY:-ghcr.io/$OWNER}"
          # Single source of the image list: deploy.yml IMAGES.
          list=$(yq '.env.IMAGES' .github/workflows/deploy.yml)
          images=$(for i in $list; do echo "$i"; done | jq -R . | jq -sc .)
          {
            echo "tag=$version"
            echo "latest=$latest"
            echo "registry=${registry,,}"
            echo "images=$images"
          } >> "$GITHUB_OUTPUT"
          echo "Release $version to ${registry,,} (latest: $latest)"

  # The candidate images of this tag: built from a commit with the same tree, all scanned.
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - name: Find the green release-candidate run of this tree
        id: find
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree() { gh api "repos/$GITHUB_REPOSITORY/commits/$1" --jq .commit.tree.sha; }
          want=$(tree "$GITHUB_REF_NAME")
          # Newest first: the newest run of the tree decides, so a later failed rebuild that overwrote
          # candidate-<sha> is never promoted. Fork runs are ignored (they build nothing).
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-candidate.yml/runs?per_page=50" \
            --jq ".workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\") | \"\(.head_sha) \(.status) \(.conclusion) \(.html_url)\"")
          while read -r sha status conclusion url; do
            [ "$(tree "$sha")" = "$want" ] || continue
            if [ "$status" != completed ] || [ "$conclusion" != success ]; then
              echo "::error::Newest release-candidate run of tree $want is $status/$conclusion ($url): nothing is published"
              exit 1
            fi
            echo "Candidate: $sha ($url)"
            echo "tag=candidate-${sha::7}" >> "$GITHUB_OUTPUT"
            exit 0
          done <<< "$runs"
          echo "::error::No release-candidate run built tree $want of $GITHUB_REF_NAME (release pull request release/* -> main, or a manual run): nothing is published"
          exit 1

  # No `environment:` here, on purpose: it would create the environment
  # unprotected. Reading the settings needs ENVIRONMENT_READ_TOKEN
  # (fine-grained PAT, "Administration: read"); without it the check fails.
  check-environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the environment protection
        env:
          GH_TOKEN: ${{ secrets.ENVIRONMENT_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret ENVIRONMENT_READ_TOKEN is not set: the protection of environment release cannot be checked, no image is published. See docs/deployment/DEPLOY.md (Protect the production environment)."
            exit 1
          fi
          node scripts/check-environment-protection.mjs release "$GITHUB_REPOSITORY"

  # The only approval point of a release: publication and signature depend on it (ADR-0038).
  approve:
    needs: [version, candidate, check-environment]
    runs-on: ubuntu-24.04
    timeout-minutes: 1440
    environment: release
    steps:
      - run: echo "Release ${{ needs.version.outputs.tag }} approved"

  # Promotes each scanned candidate digest to X.Y.Z (and latest), then
  # signs that same digest (ADR-0038). id-token lives here
  # only; deploy.yml verifies the identity of this workflow.
  sign:
    needs: [version, candidate, approve]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.version.outputs.images) }}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the scanned digest and sign it
        shell: bash
        env:
          REF: ${{ needs.version.outputs.registry }}/${{ matrix.image }}
          TAG: ${{ needs.version.outputs.tag }}
          CANDIDATE: ${{ needs.candidate.outputs.tag }}
          LATEST: ${{ needs.version.outputs.latest }}
        run: |
          digest=$(docker buildx imagetools inspect "$REF:$CANDIDATE" --format '{{.Manifest.Digest}}')
          tags=(-t "$REF:$TAG")
          [ "$LATEST" = true ] && tags+=(-t "$REF:latest")
          docker buildx imagetools create "${tags[@]}" "$REF@$digest"
          cosign sign --yes "$REF@$digest"

  # Proves the release is deployable: every image deploy.yml resolves (its env
  # IMAGES, read here so the two lists cannot drift) must exist under the path
  # deploy.yml reads, <registry>/<image>:X.Y.Z. Read-only: publishes nothing.
  verify-images:
    needs: [version, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same loop as deploy.yml "Resolve image digests".
      - name: Resolve image digests
        shell: bash
        env:
          REGISTRY: ${{ needs.version.outputs.registry }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          IMAGES=$(yq '.env.IMAGES' .github/workflows/deploy.yml)
          if [ -z "$IMAGES" ] || [ "$IMAGES" = "null" ]; then
            echo "::error::env IMAGES not found in .github/workflows/deploy.yml"
            exit 1
          fi
          missing=""
          for img in $IMAGES; do
            if ! digest=$(docker buildx imagetools inspect "$REGISTRY/$img:$TAG" --format '{{.Manifest.Digest}}'); then
              missing="$missing $img"
              continue
            fi
            echo "$img:$TAG -> $digest"
          done
          if [ -n "$missing" ]; then
            echo "::error::No $REGISTRY image tagged $TAG for:$missing: deploy.yml cannot deploy this release"
            exit 1
          fi
