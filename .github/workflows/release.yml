# =============================================================================
#  release.yml — Build & push Docker images on version tag
#  Triggers on push of tags vX.Y.Z (e.g. v2.0.3, or v2.1.0-rc.1).
#  Runs the whole CI first (ci.yml) on the tagged commit: no image is pushed
#  unless every gate passes. Then builds the 7 service images + the tooling
#  images (spire-tools, the K8s SPIRE entry reconciler; backup-tools, the
#  db-backup CronJob) and pushes each as :X.Y.Z (no leading v).
#  :latest moves to the release only when it is the highest stable version:
#  a backport patch (v1.4.2 after v2.0.0) or a prerelease never takes it.
#  Registry: repository variable IMAGE_REGISTRY, default ghcr.io/<owner> (the
#  only GHCR namespace GITHUB_TOKEN can push to). Manifests keep the logical
#  name ghcr.io/trading-model/*: deploy.yml rewrites it to the registry.
#  verify-images then resolves every deploy.yml IMAGES entry at :X.Y.Z and
#  fails the run if one is missing (the release would not be deployable).
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      latest: ${{ steps.version.outputs.latest }}
      registry: ${{ steps.version.outputs.registry }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version and latest
        id: version
        shell: bash
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          semver='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$GITHUB_REF_NAME" =~ $semver ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z[-prerelease]"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          latest=false
          if [[ "$version" != *-* ]]; then
            highest=$(git ls-remote --tags --refs origin 'v*' \
              | sed 's#.*refs/tags/v##' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n 1)
            [ "$version" = "$highest" ] && latest=true
          fi
          registry="${IMAGE_REGISTRY:-ghcr.io/$OWNER}"
          {
            echo "tag=$version"
            echo "latest=$latest"
            echo "registry=${registry,,}"
          } >> "$GITHUB_OUTPUT"
          echo "Release $version to ${registry,,} (latest: $latest)"

  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-and-push:
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - message-manager
          - financial-scraper
          - trader-trainer
          - api-gateway
          - audit-logger
          - dlq-service
          - model-evaluator

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (version + latest)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.version.outputs.registry }}/${{ matrix.service }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.version.outputs.latest }}

      # Gate before publication: a fixable CRITICAL or HIGH vulnerability stops the job
      # before the image is pushed. Exceptions: .trivyignore (ADR-0038).
      - name: Build for scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          build-args: |
            BUILD_VERSION=${{ needs.version.outputs.tag }}
            GIT_SHA=${{ github.sha }}
          load: true
          tags: ${{ needs.version.outputs.registry }}/${{ matrix.service }}:${{ needs.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.version.outputs.registry }}/${{ matrix.service }}:${{ needs.version.outputs.tag }}
          severity: CRITICAL,HIGH
          # Unfixed CVEs cannot be remedied by a rebuild: block only on those with a fix.
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          build-args: |
            BUILD_VERSION=${{ needs.version.outputs.tag }}
            GIT_SHA=${{ github.sha }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # spire-tools (deploy/spire): spire-server binary + registration scripts (the
  # official SPIRE images have no shell), used by the spire-entries sidecar.
  # backup-tools (deploy/backup): kubectl + age + rclone + mysqlbinlog for the db-backup
  # and db-backup-incremental CronJobs and restore-k8s.sh.
  # db-migrate (deploy/migrate): migrate.mjs + migrations + locked mysql2 for the db-migrate Jobs.
  build-tools:
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: spire-tools
            context: deploy/spire
            target: bootstrap
          - image: backup-tools
            context: deploy/backup
            target: ""
          - image: db-migrate
            context: .
            file: deploy/migrate/Dockerfile
            target: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (version + latest)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.version.outputs.registry }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.version.outputs.latest }}

      # Gate before publication: a fixable CRITICAL or HIGH vulnerability stops the job
      # before the image is pushed. Exceptions: .trivyignore (ADR-0038).
      - name: Build for scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          tags: ${{ needs.version.outputs.registry }}/${{ matrix.image }}:${{ needs.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.version.outputs.registry }}/${{ matrix.image }}:${{ needs.version.outputs.tag }}
          severity: CRITICAL,HIGH
          # Unfixed CVEs cannot be remedied by a rebuild: block only on those with a fix.
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Keyless signature of every pushed digest (ADR-0038). id-token lives here
  # only; deploy.yml verifies the identity of this workflow.
  sign:
    needs: [version, build-and-push, build-tools]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        image:
          - discovery-server
          - message-manager
          - financial-scraper
          - trader-trainer
          - api-gateway
          - audit-logger
          - dlq-service
          - model-evaluator
          - spire-tools
          - backup-tools
          - db-migrate
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign digest
        shell: bash
        env:
          REF: ${{ needs.version.outputs.registry }}/${{ matrix.image }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          digest=$(docker buildx imagetools inspect "$REF:$TAG" --format '{{.Manifest.Digest}}')
          cosign sign --yes "$REF@$digest"

  # Proves the release is deployable: every image deploy.yml resolves (its env
  # IMAGES, read here so the two lists cannot drift) must exist under the path
  # deploy.yml reads, <registry>/<image>:X.Y.Z. Read-only: publishes nothing.
  verify-images:
    needs: [version, build-and-push, build-tools]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same loop as deploy.yml "Resolve image digests".
      - name: Resolve image digests
        shell: bash
        env:
          REGISTRY: ${{ needs.version.outputs.registry }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          IMAGES=$(yq '.env.IMAGES' .github/workflows/deploy.yml)
          if [ -z "$IMAGES" ] || [ "$IMAGES" = "null" ]; then
            echo "::error::env IMAGES not found in .github/workflows/deploy.yml"
            exit 1
          fi
          missing=""
          for img in $IMAGES; do
            if ! digest=$(docker buildx imagetools inspect "$REGISTRY/$img:$TAG" --format '{{.Manifest.Digest}}'); then
              missing="$missing $img"
              continue
            fi
            echo "$img:$TAG -> $digest"
          done
          if [ -n "$missing" ]; then
            echo "::error::No $REGISTRY image tagged $TAG for:$missing: deploy.yml cannot deploy this release"
            exit 1
          fi
