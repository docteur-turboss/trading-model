# =============================================================================
#  release.yml — Build & push Docker images on version tag
#  Triggers on push of tags vX.Y.Z (e.g. v2.0.3, or v2.1.0-rc.1).
#  Runs the whole CI first (ci.yml) on the tagged commit: no image is pushed
#  unless every gate passes. Then builds the service images + the tooling
#  images (spire-tools, the K8s SPIRE entry reconciler; backup-tools, the
#  db-backup CronJob) and pushes each as :X.Y.Z (no leading v).
#  :latest moves to the release only when it is the highest stable version:
#  a backport patch (v1.4.2 after v2.0.0) or a prerelease never takes it.
#  Registry: repository variable IMAGE_REGISTRY, default ghcr.io/<owner> (the
#  only GHCR namespace GITHUB_TOKEN can push to). Manifests keep the logical
#  name ghcr.io/trading-model/*: deploy.yml rewrites it to the registry.
#  verify-images then resolves every deploy.yml IMAGES entry at :X.Y.Z and
#  fails the run if one is missing (the release would not be deployable).
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      latest: ${{ steps.version.outputs.latest }}
      registry: ${{ steps.version.outputs.registry }}
      services: ${{ steps.version.outputs.services }}
      images: ${{ steps.version.outputs.images }}
      scan_tag: ${{ steps.version.outputs.scan_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version and latest
        id: version
        shell: bash
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          semver='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$GITHUB_REF_NAME" =~ $semver ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z[-prerelease]"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          latest=false
          if [[ "$version" != *-* ]]; then
            highest=$(git ls-remote --tags --refs origin 'v*' \
              | sed 's#.*refs/tags/v##' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n 1)
            [ "$version" = "$highest" ] && latest=true
          fi
          registry="${IMAGE_REGISTRY:-ghcr.io/$OWNER}"
          # Single source of the image list: deploy.yml IMAGES. Services have a services/<name> directory; tools do not.
          list=$(yq '.env.IMAGES' .github/workflows/deploy.yml)
          services=$(for i in $list; do [ -d "services/$i" ] && echo "$i"; done | jq -R . | jq -sc .)
          images=$(for i in $list; do echo "$i"; done | jq -R . | jq -sc .)
          {
            echo "tag=$version"
            echo "latest=$latest"
            echo "scan_tag=scan-$GITHUB_RUN_ID"
            echo "registry=${registry,,}"
            echo "images=$images"
            echo "services=$services"
          } >> "$GITHUB_OUTPUT"
          echo "Release $version to ${registry,,} (latest: $latest)"

  ci:
    uses: ./.github/workflows/ci.yml
    # The kind jobs pull the images of the previous release (release N-1).
    permissions:
      contents: read
      packages: read
      pull-requests: read # asked by the ci.yml lint job (PR title step, skipped on a tag push)

  # No `environment:` here, on purpose: it would create the environment
  # unprotected. Reading the settings needs ENVIRONMENT_READ_TOKEN
  # (fine-grained PAT, "Administration: read"); without it the check fails.
  check-environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the environment protection
        env:
          GH_TOKEN: ${{ secrets.ENVIRONMENT_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret ENVIRONMENT_READ_TOKEN is not set: the protection of environment release cannot be checked, no image is published. See docs/deployment/DEPLOY.md (Protect the production environment)."
            exit 1
          fi
          node scripts/check-environment-protection.mjs release "$GITHUB_REPOSITORY"

  # The only approval point of a release: publication and signature depend on it (ADR-0038).
  approve:
    needs: [version, ci, check-environment]
    runs-on: ubuntu-24.04
    timeout-minutes: 1440
    environment: release
    steps:
      - run: echo "Release ${{ needs.version.outputs.tag }} approved"

  scan-services:
    needs: [version, approve]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.version.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.version.outputs.registry }}/${{ matrix.service }}
          tags: type=raw,value=${{ needs.version.outputs.scan_tag }}

      # Gate before publication: a fixable CRITICAL or HIGH vulnerability stops the job
      # before the image is promoted to its release tag. Exceptions: .trivyignore.yaml (ADR-0038).
      - name: Build and push under the scan tag
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            BUILD_VERSION=${{ needs.version.outputs.tag }}
            GIT_SHA=${{ github.sha }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No GHA cache: a push to main could have planted layers in its scope (ADR-0038).

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ needs.version.outputs.registry }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          # Unfixed CVEs cannot be remedied by a rebuild: block only on those with a fix.
          ignore-unfixed: true
          exit-code: "1"

  # Tooling images, built once, pushed under a scan tag and scanned by digest:
  # spire-tools (deploy/spire): spire-server binary + registration scripts (the
  # official SPIRE images have no shell), used by the spire-entries sidecar.
  # backup-tools (deploy/backup): kubectl + age + rclone + mysqlbinlog for the db-backup
  # and db-backup-incremental CronJobs and restore-k8s.sh.
  # db-migrate (deploy/migrate): migrate.mjs + migrations + locked mysql2 for the db-migrate Jobs.
  scan-tools:
    needs: [version, approve]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: spire-tools
            context: deploy/spire
            target: bootstrap
          - image: backup-tools
            context: deploy/backup
            target: ""
          - image: db-migrate
            context: .
            file: deploy/migrate/Dockerfile
            target: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.version.outputs.registry }}/${{ matrix.image }}
          tags: type=raw,value=${{ needs.version.outputs.scan_tag }}

      # Gate before publication: a fixable CRITICAL or HIGH vulnerability stops the job
      # before the image is promoted to its release tag. Exceptions: .trivyignore.yaml (ADR-0038).
      - name: Build and push under the scan tag
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No GHA cache: a cached `microdnf upgrade` layer would hide distro fixes published since.

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ needs.version.outputs.registry }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          # Unfixed CVEs cannot be remedied by a rebuild: block only on those with a fix.
          ignore-unfixed: true
          exit-code: "1"

  # Promotes the scanned digest to X.Y.Z (and latest) only once every scan passed, then
  # signs that same digest (ADR-0038). id-token lives here
  # only; deploy.yml verifies the identity of this workflow.
  sign:
    needs: [version, approve, scan-services, scan-tools]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.version.outputs.images) }}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the scanned digest and sign it
        shell: bash
        env:
          REF: ${{ needs.version.outputs.registry }}/${{ matrix.image }}
          TAG: ${{ needs.version.outputs.tag }}
          SCAN_TAG: ${{ needs.version.outputs.scan_tag }}
          LATEST: ${{ needs.version.outputs.latest }}
        run: |
          digest=$(docker buildx imagetools inspect "$REF:$SCAN_TAG" --format '{{.Manifest.Digest}}')
          tags=(-t "$REF:$TAG")
          [ "$LATEST" = true ] && tags+=(-t "$REF:latest")
          docker buildx imagetools create "${tags[@]}" "$REF@$digest"
          cosign sign --yes "$REF@$digest"

  # Proves the release is deployable: every image deploy.yml resolves (its env
  # IMAGES, read here so the two lists cannot drift) must exist under the path
  # deploy.yml reads, <registry>/<image>:X.Y.Z. Read-only: publishes nothing.
  verify-images:
    needs: [version, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same loop as deploy.yml "Resolve image digests".
      - name: Resolve image digests
        shell: bash
        env:
          REGISTRY: ${{ needs.version.outputs.registry }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          IMAGES=$(yq '.env.IMAGES' .github/workflows/deploy.yml)
          if [ -z "$IMAGES" ] || [ "$IMAGES" = "null" ]; then
            echo "::error::env IMAGES not found in .github/workflows/deploy.yml"
            exit 1
          fi
          missing=""
          for img in $IMAGES; do
            if ! digest=$(docker buildx imagetools inspect "$REGISTRY/$img:$TAG" --format '{{.Manifest.Digest}}'); then
              missing="$missing $img"
              continue
            fi
            echo "$img:$TAG -> $digest"
          done
          if [ -n "$missing" ]; then
            echo "::error::No $REGISTRY image tagged $TAG for:$missing: deploy.yml cannot deploy this release"
            exit 1
          fi
