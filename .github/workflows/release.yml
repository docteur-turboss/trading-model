# =============================================================================
#  release.yml — Build & push Docker images on version tag
#  Triggers on push of tags vX.Y.Z (e.g. v2.0.3, or v2.1.0-rc.1).
#  Builds nothing: the images (services + spire-tools, backup-tools, db-migrate)
#  were built and scanned by release-candidate.yml on the release PR. This
#  workflow takes the digests recorded by the newest run of the tagged tree,
#  waits for the approval, retags each of them as :X.Y.Z (no leading v) and
#  signs it (ADR-0038).
#  :latest moves to the release only when it is the highest stable version:
#  a backport patch (v1.4.2 after v2.0.0) or a prerelease never takes it.
#  Registry: repository variable IMAGE_REGISTRY, default ghcr.io/<owner> (the
#  only GHCR namespace GITHUB_TOKEN can push to). Manifests keep the logical
#  name ghcr.io/trading-model/*: deploy.yml rewrites it to the registry.
#  verify-images then resolves every deploy.yml IMAGES entry at :X.Y.Z and
#  fails the run if one is missing (the release would not be deployable).
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      latest: ${{ steps.version.outputs.latest }}
      registry: ${{ steps.version.outputs.registry }}
      services: ${{ steps.version.outputs.services }}
      images: ${{ steps.version.outputs.images }}
      digests: ${{ steps.candidate.outputs.digests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version and latest
        id: version
        shell: bash
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          semver='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$GITHUB_REF_NAME" =~ $semver ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z[-prerelease]"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          latest=false
          if [[ "$version" != *-* ]]; then
            highest=$(git ls-remote --tags --refs origin 'v*' \
              | sed 's#.*refs/tags/v##' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n 1)
            [ "$version" = "$highest" ] && latest=true
          fi
          registry="${IMAGE_REGISTRY:-ghcr.io/$OWNER}"
          # Single source of the image list: deploy.yml IMAGES. Services have a services/<name> directory; tools do not.
          list=$(yq '.env.IMAGES' .github/workflows/deploy.yml)
          services=$(for i in $list; do if [ -d "services/$i" ]; then echo "$i"; fi; done | jq -R . | jq -sc .)
          images=$(for i in $list; do echo "$i"; done | jq -R . | jq -sc .)
          {
            echo "tag=$version"
            echo "latest=$latest"
            echo "registry=${registry,,}"
            echo "images=$images"
            echo "services=$services"
          } >> "$GITHUB_OUTPUT"
          echo "Release $version to ${registry,,} (latest: $latest)"

      # The digests the scan jobs recorded after a green Trivy, never a tag read later: a rewritten tag
      # cannot be signed. Only the newest run of the tree counts, so a later failed run blocks the release.
      # Same tree = same release-candidate.yml: a run of an edited copy cannot match the tag.
      - name: Find the scanned digests of this tree
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          want=$(git rev-parse "$GITHUB_SHA^{tree}")
          runs=$(gh api "repos/$GH_REPO/actions/workflows/release-candidate.yml/runs?per_page=50" \
            --jq ".workflow_runs[] | select(.head_repository.full_name == \"$GH_REPO\") | \"\(.id) \(.head_sha) \(.status) \(.conclusion)\"")
          while read -r id sha status conclusion; do
            [ "$(gh api "repos/$GH_REPO/commits/$sha" --jq .commit.tree.sha)" = "$want" ] || continue
            if [ "$status" != completed ] || [ "$conclusion" != success ]; then
              echo "::error::Newest release-candidate run $id of tree $want is $status/$conclusion: nothing is published"
              exit 1
            fi
            gh run download "$id" --pattern 'digest-*' --dir digests
            digests='{}'
            for i in $(yq '.env.IMAGES' .github/workflows/deploy.yml); do
              d=$(cat "digests/digest-$i/digest") || { echo "::error::Run $id recorded no scanned digest for $i"; exit 1; }
              digests=$(jq -c --arg i "$i" --arg d "$d" '.[$i] = $d' <<<"$digests")
            done
            echo "Candidate run $id ($sha): $digests"
            echo "digests=$digests" >> "$GITHUB_OUTPUT"
            exit 0
          done <<<"$runs"
          echo "::error::No release-candidate run built tree $want of $GITHUB_REF_NAME: nothing is published"
          exit 1

  # No `environment:` here, on purpose: it would create the environment
  # unprotected. Reading the settings needs ENVIRONMENT_READ_TOKEN
  # (fine-grained PAT, "Administration: read"); without it the check fails.
  check-environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the environment protection
        env:
          GH_TOKEN: ${{ secrets.ENVIRONMENT_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret ENVIRONMENT_READ_TOKEN is not set: the protection of environment release cannot be checked, no image is published. See docs/deployment/DEPLOY.md (Protect the production environment)."
            exit 1
          fi
          node scripts/check-environment-protection.mjs release "$GITHUB_REPOSITORY"

  # The only approval point of a release: publication and signature depend on it (ADR-0038).
  approve:
    needs: [version, check-environment]
    runs-on: ubuntu-24.04
    timeout-minutes: 1440
    environment: release
    steps:
      - run: echo "Release ${{ needs.version.outputs.tag }} approved"

  # Promotes the scanned digest to X.Y.Z (and latest) only once every scan passed, then
  # signs that same digest (ADR-0038). id-token lives here
  # only; deploy.yml verifies the identity of this workflow.
  sign:
    needs: [version, approve]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.version.outputs.images) }}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the scanned digest and sign it
        shell: bash
        env:
          REF: ${{ needs.version.outputs.registry }}/${{ matrix.image }}
          TAG: ${{ needs.version.outputs.tag }}
          DIGEST: ${{ fromJSON(needs.version.outputs.digests)[matrix.image] }}
          LATEST: ${{ needs.version.outputs.latest }}
        run: |
          tags=(-t "$REF:$TAG")
          [ "$LATEST" = true ] && tags+=(-t "$REF:latest")
          docker buildx imagetools create "${tags[@]}" "$REF@$DIGEST"
          cosign sign --yes "$REF@$DIGEST"

  # Proves the release is deployable: every image deploy.yml resolves (its env
  # IMAGES, read here so the two lists cannot drift) must exist under the path
  # deploy.yml reads, <registry>/<image>:X.Y.Z. Read-only: publishes nothing.
  verify-images:
    needs: [version, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same loop as deploy.yml "Resolve image digests".
      - name: Resolve image digests
        shell: bash
        env:
          REGISTRY: ${{ needs.version.outputs.registry }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          IMAGES=$(yq '.env.IMAGES' .github/workflows/deploy.yml)
          if [ -z "$IMAGES" ] || [ "$IMAGES" = "null" ]; then
            echo "::error::env IMAGES not found in .github/workflows/deploy.yml"
            exit 1
          fi
          missing=""
          for img in $IMAGES; do
            if ! digest=$(docker buildx imagetools inspect "$REGISTRY/$img:$TAG" --format '{{.Manifest.Digest}}'); then
              missing="$missing $img"
              continue
            fi
            echo "$img:$TAG -> $digest"
          done
          if [ -n "$missing" ]; then
            echo "::error::No $REGISTRY image tagged $TAG for:$missing: deploy.yml cannot deploy this release"
            exit 1
          fi
