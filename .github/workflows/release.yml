name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Quality gate ───────────────────────────────────────────────────────────
  quality:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - name: Build packages (dependency order)
        run: npm run build
      - name: Type-check services
        run: |
          npm run -w services/message-manager build
          npm run -w services/discovery-server build
          npm run -w services/financial-scraper build
          npm run -w services/trader-trainer build
          npm run -w services/certificate-authority build
          npm run -w services/api-gateway build
      - run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # ── Docker images ─────────────────────────────────────────────────────────
  docker:
    needs: [quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: discovery-server
            context: .
            dockerfile: services/discovery-server/Dockerfile
          - name: message-manager
            context: .
            dockerfile: services/message-manager/Dockerfile
          - name: financial-scraper
            context: .
            dockerfile: services/financial-scraper/Dockerfile
          - name: trader-trainer
            context: .
            dockerfile: services/trader-trainer/Dockerfile
          - name: certificate-authority
            context: .
            dockerfile: services/certificate-authority/Dockerfile
          - name: api-gateway
            context: .
            dockerfile: services/api-gateway/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.quality.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.quality.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.quality.outputs.version }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── GitHub Release ────────────────────────────────────────────────────────
  release:
    needs: [quality, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Generate release notes
        id: notes
        run: |
          {
            echo 'notes<<EOF'
            echo "## Docker Images"
            echo ""
            echo "| Service | Pull command |"
            echo "|---------|--------------|"
            echo "| Discovery Server | \`docker pull ghcr.io/${{ github.repository }}/discovery-server:${{ needs.quality.outputs.version }}\` |"
            echo "| Message Manager | \`docker pull ghcr.io/${{ github.repository }}/message-manager:${{ needs.quality.outputs.version }}\` |"
            echo "| Financial Scraper | \`docker pull ghcr.io/${{ github.repository }}/financial-scraper:${{ needs.quality.outputs.version }}\` |"
            echo "| Trader Trainer | \`docker pull ghcr.io/${{ github.repository }}/trader-trainer:${{ needs.quality.outputs.version }}\` |"
            echo ""
            echo "## Quick Start"
            echo ""
            echo '```bash'
            echo "git clone https://github.com/${{ github.repository }}.git"
            echo "cd trading-model"
            echo "cp .env.example .env"
            echo "# edit .env, generate TLS certs, then:"
            echo "docker compose up -d"
            echo '```'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ needs.quality.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: true

  # ── Documentation (GitHub Pages) ──────────────────────────────────────────
  docs:
    needs: [quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - run: npm ci
      - run: npm run docs:generate

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/architecture/code

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
