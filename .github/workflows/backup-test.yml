name: Backup Restore Test

# A backup counts only once it has been restored: this workflow backs up real
# databases, destroys them (containers and volumes) and restores them with
# the Docker scripts. The Kubernetes scripts get the same drill in the `k8s`
# job of ci.yml (tests/k8s/run-kind.sh, verify_backup).
on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly: Sunday 6 AM
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/backup*.sh'
      - 'scripts/restore*.sh'
      - 'scripts/fetch-offsite.sh'
      - 'scripts/verify-backup-key.sh'
      - 'scripts/sealed-secrets-backup-identity.sh'
      - 'deploy/backup/**'
      - 'tests/backup/**'
      - 'tests/k8s/sealed-secrets-key-drill.sh'
      - 'services/audit-logger/src/adapters/outbound/persistence/**'
      - 'docker-compose.yml'
      - 'deploy/compose/spire/**'
      - '.github/workflows/backup-test.yml'
      - '.github/workflows/backup-key-check.yml'
      - '.github/workflows/sealed-secrets-key-backup.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate backup scripts syntax
        run: |
          for script in backup.sh restore.sh backup-k8s.sh backup-incremental-k8s.sh restore-k8s.sh backup-lib.sh fetch-offsite.sh backup-bucket-check.sh backup-recipients-check.sh backup-config-check.sh verify-backup-key.sh backup-sealed-secrets-key.sh restore-sealed-secrets-key.sh sealed-secrets-backup-identity.sh; do
            bash -n "scripts/$script" && echo "  ✓ $script syntax OK"
          done

      - name: Install age
        run: sudo apt-get update -q && sudo apt-get install -y -q age

      # age round trip, refusals (clear backups, missing off-site copy),
      # GTID filtering, restore of *.age files (scripts/backup-lib.sh).
      - name: Test the backup library
        run: bash tests/backup/backup-encryption.test.sh

      # Helper-pod image of restore-k8s.sh: CronJob, fallback, override (issue #323).
      - name: Test the restore helper image
        run: bash tests/backup/restore-helper-image.test.sh

      # Step timings and budget of the restore drills (issue #329).
      - name: Test the restore drill timings
        run: bash tests/backup/drill-timings.test.sh

      # Two age recipients in production and proof that a key decrypts the
      # backups (issue #327): BACKUP_MIN_RECIPIENTS refusals, the deploy.yml
      # recipients check, verify-backup-key.sh with each of two keys (pass),
      # a third key, a component sealed for another key, a missing one (fail).
      - name: Test the backup key checks
        run: bash tests/backup/backup-key-verify.test.sh

      # Production refuses a deploy without age recipients or off-site store (issue #331).
      - name: Test the backup configuration check
        run: bash tests/backup/backup-config-check.test.sh

      # Point-in-time recovery chains (ADR-0031): which binlog / oplog
      # archives restore-k8s.sh --until replays, gaps refused, no partial file.
      - name: Test the point-in-time recovery chains
        run: bash tests/backup/pitr-chain.test.sh

      # A failed dump leaves no file, run manifests, `latest` = last complete
      # run, checksum and `-- Dump completed` refusals (issue #288); one run for
      # all components, MySQL failed on day J => J-1 for MySQL and SPIRE, and
      # --allow-mixed-runs (issue #330).
      - name: Test failed dumps and run manifests
        run: bash tests/backup/backup-partial.test.sh

      # Error output of the dump commands reaches the job log (issue #332).
      - name: Test dump stderr is kept
        run: bash tests/backup/backup-stderr.test.sh

      # GFS retention on 400 days of fake runs: exactly the files prune_old
      # keeps, failed runs never promoted, newest complete run guarded,
      # off-site tiers daily/ weekly/ monthly/ (ADR-0032, issue #292).
      - name: Test the backup retention
        run: bash tests/backup/backup-retention.test.sh

      # Object Lock check of the off-site bucket run by deploy.yml (ADR-0033,
      # issue #326), with a stub aws CLI: compliance passes; absent,
      # governance, too short or too long fails in production, warns in
      # staging; BACKUP_S3_IMMUTABILITY_CHECK fallback.
      - name: Test the off-site bucket immutability check
        run: bash tests/backup/backup-bucket-check.test.sh

      # Off-site fetch (scripts/fetch-offsite.sh) against `rclone serve s3`
      # filled by upload_offsite: run selection, layout, refusals, and
      # verify-backup-key.sh --offsite on the fetched run. Runs in the
      # backup-tools image: it ships the rclone the CronJob uses (serve s3
      # needs >= 1.65, newer than Ubuntu's).
      - name: Test the off-site fetch
        run: |
          docker build -q -t backup-tools deploy/backup
          docker run --rm -v "$PWD:/repo:ro" -w /repo backup-tools bash tests/backup/fetch-offsite.test.sh

      # MongoDB (3 databases + an audit trail written by the audit-logger
      # image), MySQL, Redis and the SPIRE server (CA keys + datastore):
      # backup → containers and volumes deleted → restore → checks.
      # Per-step timings: table in the job summary, JSON as artifact. Budget
      # RESTORE_DRILL_BUDGET_SECONDS (default 300 s, about 5 times the 20 s of the
      # first CI run; disaster to checks),
      # RESTORE_DRILL_BUDGET_MODE=fail|warn (default fail).
      - name: Restore drill (Docker scripts)
        env:
          DRILL_TIMINGS_FILE: ${{ github.workspace }}/restore-drill-timings.json
        run: bash tests/backup/compose-restore-drill.sh
      - name: Upload the restore drill timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restore-drill-timings-docker
          path: restore-drill-timings.json
          if-no-files-found: ignore

      - name: Validate the K8s CronJob manifest
        run: kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/k8s/jobs > /dev/null && echo "  ✓ deploy/k8s/jobs renders"

  # The SealedSecrets controller keys (issue #328): without them no
  # SealedSecret of deploy/k8s/secrets/ decrypts in a new cluster. Script
  # tests with stubs, then the real loop on kind: seal in cluster A, back up
  # the keys to S3, delete A, restore them in a new cluster B, decrypt there.
  sealed-secrets-key:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KIND_VERSION: v0.27.0
      KIND_SHA256: a6875aaea358acf0ac07786b1a6755d08fd640f4c79b7a2e46681cc13f49a04b
      KIND: ./kind
      # Release installed by docs/deployment/sealed-secrets.md.
      KUBESEAL_VERSION: 0.27.1
      KUBESEAL_SHA256: 01069a5e79ed7702ba10bed42cd8132d94746ca288add06836d082b4202c2789
      KUBESEAL: ./kubeseal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install age, kind and kubeseal
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q age
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          chmod +x kind
          curl -fsSLo kubeseal.tar.gz "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz"
          echo "${KUBESEAL_SHA256}  kubeseal.tar.gz" | sha256sum -c -
          tar -xzf kubeseal.tar.gz kubeseal

      - name: Test the key backup and restore scripts
        run: bash tests/backup/sealed-secrets-key.test.sh

      - name: Build backup-tools
        run: docker build -q -t backup-tools deploy/backup

      - name: SealedSecrets key drill (kind)
        run: bash tests/k8s/sealed-secrets-key-drill.sh
