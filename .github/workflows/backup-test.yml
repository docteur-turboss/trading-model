name: Backup Restore Test

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly: Sunday 6 AM
  workflow_dispatch:
    inputs:
      restore_timestamp:
        description: 'Specific backup timestamp to test (default: latest)'
        required: false
        default: 'latest'
      dry_run:
        description: 'Dry-run mode (validate scripts only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKUP_DIR: /tmp/backup-test
  RESTORE_TIMESTAMP: ${{ github.event.inputs.restore_timestamp || 'latest' }}

jobs:
  test-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate dev certificates
        run: |
          mkdir -p certs
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout certs/server-key.pem -out certs/server.crt \
            -subj "/CN=localhost" 2>/dev/null
          cp certs/server.crt certs/ca.crt

      - name: Create backup fixtures
        run: |
          mkdir -p "${BACKUP_DIR}/mongodb/test-fixture"
          mkdir -p "${BACKUP_DIR}/mysql"
          mkdir -p "${BACKUP_DIR}/redis"
          mkdir -p "${BACKUP_DIR}/ca-keys"
          mkdir -p "${BACKUP_DIR}/checkpoints"

          echo '{"test": "mongodb fixture"}' > "${BACKUP_DIR}/mongodb/test-fixture/test.bson"
          echo "CREATE TABLE test (id INT);" | gzip > "${BACKUP_DIR}/mysql/financial_scraper_test-fixture.sql.gz"
          echo "REDIS001" > "${BACKUP_DIR}/redis/redis-primary_test-fixture.rdb"
          echo "ca-key-pem-content" | gzip > "${BACKUP_DIR}/ca-keys/ca-keys_test-fixture.tar.gz"
          echo "checkpoint-data" | gzip > "${BACKUP_DIR}/checkpoints/checkpoints_test-fixture.tar.gz"

      - name: Validate backup scripts syntax
        run: |
          bash -n scripts/backup.sh && echo "  ✓ backup.sh syntax OK"
          bash -n scripts/restore.sh && echo "  ✓ restore.sh syntax OK"
          bash -n scripts/backup-k8s.sh && echo "  ✓ backup-k8s.sh syntax OK"
          bash -n scripts/restore-k8s.sh && echo "  ✓ restore-k8s.sh syntax OK"

      - name: Test restore.sh dry-run
        run: |
          bash scripts/restore.sh --dry-run --components mongodb,mysql,redis,ca-keys,checkpoints --timestamp test-fixture
          echo "  ✓ restore.sh dry-run passed"

      - name: Test backup.sh dry-run
        run: |
          bash scripts/backup.sh --dry-run --components mongodb,mysql,redis,ca-keys,checkpoints
          echo "  ✓ backup.sh dry-run passed"

      - name: Validate backup directory structure
        run: |
          echo "Expected structure:"
          echo "  ${BACKUP_DIR}/"
          echo "    mongodb/test-fixture/test.bson"
          echo "    mysql/financial_scraper_test-fixture.sql.gz"
          echo "    redis/redis-primary_test-fixture.rdb"
          echo "    ca-keys/ca-keys_test-fixture.tar.gz"
          echo "    checkpoints/checkpoints_test-fixture.tar.gz"
          echo ""
          find "${BACKUP_DIR}" -type f | sort
          echo ""
          FILES=$(find "${BACKUP_DIR}" -type f | wc -l)
          if [ "$FILES" -lt 5 ]; then
            echo "ERROR: Expected at least 5 backup files, found $FILES"
            exit 1
          fi
          echo "  ✓ Backup directory structure validated"

      - name: Validate restore.sh component selection
        run: |
          bash scripts/restore.sh --dry-run --components mongodb --timestamp test-fixture | grep -q "MongoDB"
          bash scripts/restore.sh --dry-run --components mysql --timestamp test-fixture | grep -q "MySQL"
          bash scripts/restore.sh --dry-run --components redis --timestamp test-fixture | grep -q "Redis"
          bash scripts/restore.sh --dry-run --components ca-keys --timestamp test-fixture | grep -q "CA keys"
          bash scripts/restore.sh --dry-run --components checkpoints --timestamp test-fixture | grep -q "Checkpoints"
          echo "  ✓ Component selection validated"

      - name: Validate restore-k8s.sh syntax
        run: |
          bash -n scripts/restore-k8s.sh && echo "  ✓ restore-k8s.sh syntax OK"

      - name: Validate backup-k8s.sh syntax
        run: |
          bash -n scripts/backup-k8s.sh && echo "  ✓ backup-k8s.sh syntax OK"

      - name: Validate K8s CronJob manifest
        run: |
          if command -v kubectl &>/dev/null; then
            kubectl apply --dry-run=client -f deploy/k8s/jobs/backup-cronjob.yaml 2>&1 | grep -v "dry-run" || true
            echo "  ✓ backup-cronjob.yaml validated"
          else
            echo "  ⚠ kubectl not available — skipping manifest validation"
          fi

      - name: Summary
        run: |
          echo "══════════════════════════════════════════════════"
          echo "  Backup Restore Test — Complete"
          echo "  Timestamp: ${RESTORE_TIMESTAMP}"
          echo "  Status: All validations passed"
          echo "══════════════════════════════════════════════════"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Backup restore test FAILED"
