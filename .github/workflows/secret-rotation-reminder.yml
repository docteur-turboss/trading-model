name: Secret Rotation Reminder

# Quarterly reminder: rotation is manual (scripts/rotate-secrets.sh), nothing
# else triggers it. Known limit (ADR-0035): GitHub disables `schedule` on a
# public repository after 60 days without activity, with no failed run.
on:
  schedule:
    - cron: '0 8 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open the reminder issue unless one is already open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Quarterly secret rotation"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json title --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$open" != "0" ]; then
            echo "Reminder already open, nothing to do."
            exit 0
          fi
          gh issue create --title "$title" --label manuel --body "Rotation is manual and the project owner does it.

          - [ ] Application secrets: \`bash scripts/rotate-secrets.sh --component signing|tokens|dlq|all\` (see [Rotating secrets](docs/deployment/sealed-secrets.md#rotating-secrets))
          - [ ] Database passwords: [Rotate a database password](docs/deployment/sealed-secrets.md#rotate-a-database-password)
          - [ ] API key review: quarterly row of [access-control-policy.md](docs/compliance/access-control-policy.md)

          Close this issue when done."
