name: CI

on:
  pull_request:
  # Merge commits to main get verified too, not only at release time.
  # development is not listed: every change reaches it through a PR already run by pull_request.
  push:
    branches: [main]
  # release.yml runs the whole CI on the tagged commit before pushing images.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # In a called workflow github.ref is the caller's: never cancel a release (tag) run.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    # release.yml runs the CI on the tag; skip the push-to-main run of the same release commit.
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name != 'push' || !startsWith(github.event.head_commit.message, ':rocket:(release)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run deps:check
      - run: bun run api:check
      - run: bun run adr:check
      - run: bun run reach:check
      - run: bun run arch:check
      - run: bun run release:test
      - run: bun run config:check
      - run: bun run compliance:check
      - run: bun run env-protection:test
      - name: Workflows parse as YAML
        run: python3 scripts/check-workflows.py

  typecheck:
    # release.yml runs the CI on the tag; skip the push-to-main run of the same release commit.
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name != 'push' || !startsWith(github.event.head_commit.message, ':rocket:(release)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build packages (dependency order)
        run: bun run build
      - name: Type-check services
        run: |
          bun run --filter message-manager build
          bun run --filter discovery-server build
          bun run --filter financial-scraper build
          bun run --filter trader-service build
          bun run --filter api-gateway build
          bun run --filter audit-logger build
          bun run --filter dlq-service build
      - name: Type-check the test files of every workspace
        run: bun run typecheck:tests

  test:
    # release.yml runs the CI on the tag; skip the push-to-main run of the same release commit.
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name != 'push' || !startsWith(github.event.head_commit.message, ':rocket:(release)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:coverage

      - name: Import Codecov GPG key
        run: |
          gpg --import .github/keys/codecov.asc
          gpg --fingerprint 27034E7FDB850E0BBC2C62FF806BB28AED779869

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Blocking on PRs only: a Codecov outage must not block a release (workflow_call).
          fail_ci_if_error: ${{ github.event_name == 'pull_request' }}

  db-integration:
    # release.yml runs the CI on the tag; skip the push-to-main run of the same release commit.
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name != 'push' || !startsWith(github.event.head_commit.message, ':rocket:(release)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run specs against real databases (Testcontainers)
        run: bun run test:db

  observability:
    # release.yml runs the CI on the tag; skip the push-to-main run of the same release commit.
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name != 'push' || !startsWith(github.event.head_commit.message, ':rocket:(release)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Observability gate
        run: bun scripts/observability-gate.mjs
      # promtool: both rule files parse, and each alert fires (or stays
      # silent) on the scenarios of tests/alerts/alerting.test.yml.
      - name: Alert rule tests
        run: bash tests/alerts/run.sh

  # The k8s job only deploys staging: production is checked by rendering.
  k8s-overlays:
    # release.yml runs the CI on the tag; skip the push-to-main run of the same release commit.
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name != 'push' || !startsWith(github.event.head_commit.message, ':rocket:(release)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render and check the overlays
        run: node tests/k8s/check-overlays.mjs
      - name: kubectl commands covered by the app deploy Role
        run: node tests/k8s/check-deploy-commands.mjs
      - name: Deploy identities (stub kubectl)
        run: bash tests/k8s/deploy-identity.test.sh
      - name: Test the canary gate
        run: bash tests/k8s/canary-gate.test.sh
      - name: Test the release verification
        run: bash tests/k8s/verify-release.test.sh
      - name: Test the cluster prerequisites check
        run: bash tests/k8s/check-prereqs.test.sh
      - name: Edge-proxy real client IP (X-Forwarded-For trust, per overlay)
        run: bash tests/k8s/realip.test.sh
      - name: Test the overlay ClusterRoles check
        run: bash tests/k8s/check-cluster-rbac.test.sh
      - name: Test the Job wait helper
        run: bash tests/k8s/wait-job.test.sh
      - name: Test the availability probe (stub kubectl)
        run: bash tests/k8s/probe-availability.test.sh
      - name: Test the deploy Slack notification (stub curl)
        run: bash tests/k8s/notify-slack.test.sh
      - name: Test the migrations script (MYSQL_MIGRATE_PASSWORD guard)
        run: bash tests/k8s/run-migrations.test.sh
      - name: Test the release steps (deploy-release.sh)
        run: bash tests/k8s/deploy-release.test.sh

  contract:
    # release.yml runs the CI on the tag; skip the push-to-main run of the same release commit.
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name != 'push' || !startsWith(github.event.head_commit.message, ':rocket:(release)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:contract

  e2e:
    # release.yml runs the CI on the tag; skip the push-to-main run of the same release commit.
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name != 'push' || !startsWith(github.event.head_commit.message, ':rocket:(release)') }}
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: ci-password
      GRAFANA_PASSWORD: ci-grafana-password
      MYSQL_EXPORTER_PASSWORD: ci-mysql-exporter-password
      DLQ_AUTH_HMAC_SECRET: test-hmac-secret
      DLQ_ALLOWED_SERVICES: message-manager,admin,e2e-test-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Services only accept SPIFFE mTLS clients: readiness is read from the
      # container healthchecks (they present the SVID), not curled from the host.
      # The overlay points the scraper at a Binance stub. The observability
      # stack is not needed here.
      - name: Boot the application stack
        run: >-
          docker compose -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml
          up -d --build --wait --wait-timeout 600
          discovery-server message-manager financial-scraper trader-trainer
          api-gateway audit-logger dlq-service edge-proxy
      - name: Market data flow (Binance stub → scraper → MySQL / trainer)
        run: bun run test:e2e -- market-data-flow
      - name: Other E2E suites
        run: bun run test:e2e -- --testPathIgnorePatterns market-data-flow resilience
      # 30 s k6 smoke through the edge-proxy against the three public routes
      # (SLO thresholds, key of the E2E overlay); runs before the resilience restarts.
      - name: k6 smoke (public API via edge-proxy)
        run: >-
          mkdir -p k6-out && docker run --rm --network host --user "$(id -u):$(id -g)"
          -v "$PWD/tests/load:/load:ro" -v "$PWD/k6-out:/out"
          -e API_KEY=e2e-api-key
          grafana/k6:1.4.0@sha256:6a3ee54ac0e9ff5527923f6295257453dd88012f32f40dadf0eb1b638cbb21c7
          run --summary-export /out/k6-summary.json /load/k6/smoke-test.js
      - name: Archive the k6 summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-summary
          path: k6-out/k6-summary.json
          if-no-files-found: warn
      # Last: restarts message-manager and discovery to check the mesh heals.
      - name: Resilience (service restarts)
        run: bun run test:e2e -- resilience
      - name: Dump service logs
        if: failure()
        run: docker compose -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml logs --no-color --tail 200
      - name: Tear down the Docker stack
        if: always()
        run: docker compose -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml down -v

  # The Kubernetes manifests had never run before 2026-10: deploy the staging
  # overlay on kind (node agents, overlay, migrations, as deploy.yml does), run
  # deploy.yml's smoke test and canary gate, and check SPIRE identities, the
  # data flow, the external path and observability.
  k8s:
    # release.yml runs the CI on the tag; skip the push-to-main run of the same release commit.
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name != 'push' || !startsWith(github.event.head_commit.message, ':rocket:(release)') }}
    runs-on: ubuntu-latest
    # 48 min on PR #460: the upgrade scenario drains the collector (360 s grace) 3 times.
    timeout-minutes: 75
    env:
      KIND_VERSION: v0.27.0
      KIND_SHA256: a6875aaea358acf0ac07786b1a6755d08fd640f4c79b7a2e46681cc13f49a04b
      KIND: ./kind
      # Restore drill timings (tests/backup/drill-timings.sh): JSON uploaded
      # below, table in the job summary. RESTORE_DRILL_BUDGET_SECONDS (default
      # 1200 s, about 5 times the 252 s of the first CI run; disaster to checks) and RESTORE_DRILL_BUDGET_MODE (fail or
      # warn, default fail) can be set here; kind on a shared runner is slow
      # and not representative of production, the RTO is judged in
      # docs/compliance/dr-exercise-log.md.
      DRILL_TIMINGS_FILE: ${{ github.workspace }}/restore-drill-timings.json
    steps:
      # Depth 2: release N-1 is HEAD^1 (the base branch of the PR merge
      # commit, the previous commit on a push), built and deployed first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Install kind
        run: |
          # GitHub Releases answers 504 now and then (issue #660): retry, checksum still checked.
          curl -fsSLo kind --retry 5 --retry-all-errors --retry-delay 5 "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          chmod +x kind
      # The runner ships MySQL with the AppArmor profile usr.sbin.mysqld, which
      # attaches by path: in the privileged kind node it confines the pod's
      # /usr/sbin/mysqld too, which then gets EACCES on /etc/my.cnf and its
      # errmsg.sys (no config: wrong socket, startup probe never passes).
      - name: Unload the runner's mysqld AppArmor profile
        run: |
          if [ -f /etc/apparmor.d/usr.sbin.mysqld ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld || true
          fi
      - name: Create the cluster
        run: bash tests/k8s/run-kind.sh cluster
      - name: Build and load the images (release N-1 and N)
        run: bash tests/k8s/run-kind.sh images
      - name: Deploy release N-1 (staging overlay)
        run: bash tests/k8s/run-kind.sh deploy
      # deploy.yml's steps with the restricted deploy identities (ADR-0041): a failed
      # upgrade rolled back to N-1, migrate-down 1 then up, the upgrade to N.
      - name: Upgrade N-1 to N, forced failure and rollback
        run: bash tests/k8s/run-kind.sh upgrade
      - name: Smoke test (deploy.yml gate)
        run: bash tests/k8s/run-kind.sh smoke
      - name: Verify the stack
        run: bash tests/k8s/run-kind.sh verify
      - name: Canary gate (deploy.yml canary)
        run: bash tests/k8s/run-kind.sh verify_canary
      - name: Upload the restore drill timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restore-drill-timings-kind
          path: restore-drill-timings.json
          if-no-files-found: ignore
      - name: Dump cluster state
        if: failure()
        run: bash tests/k8s/run-kind.sh dump
